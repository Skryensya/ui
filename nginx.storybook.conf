# The two Storybooks (Dockerfile.storybook, Dockerfile.storybook-vanilla). See those files.
#
# ONE FILE FOR BOTH, unlike docs and playground: those two are sites with different route
# vocabularies, and these are the same static shape twice. A Storybook build is `index.html` (the
# manager), `iframe.html` (the stories) and hashed assets, with every route in the query string, so
# there is nothing to rewrite.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Relative redirects: behind Dokploy's proxy an absolute one would carry this connection's
  # scheme and internal port back to the reader. Same reason as nginx.playground.conf.
  absolute_redirect off;

  location / {
    try_files $uri $uri/ =404;
  }

  # Content-hashed by Vite, so a name never changes meaning.
  location /assets/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # What the manager and the preview read on every load; they change with every deploy.
  location ~ ^/(index\.json|project\.json|index\.html|iframe\.html)$ {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 256;
}
