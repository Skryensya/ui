server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

# THE URLs THIS SITE USED TO HAVE. Until English took the bare paths, Spanish owned them:
  # /componentes/button served Spanish, /en/components/button served English. Every link anyone has
  # ever shared points at one of those shapes, so each one forwards to where that exact content
  # lives now instead of 404ing. A reader who bookmarked the Spanish page still lands on Spanish.
  #
  # 301 and not a meta refresh: it is the server's answer, it is cached, and search engines move the
  # ranking across instead of treating the new URL as an unrelated page.
  rewrite ^/en/(.*)$ /$1 permanent;
  rewrite ^/componentes/(.*)$ /es/componentes/$1 permanent;
  rewrite ^/referencia/(.*)$ /es/referencia/$1 permanent;
  rewrite ^/(almacenamiento|anclaje|arquitectura|densidad|dimensiones|efectos|elevacion|fundamentos|gradientes|hotkey|iconos|instalacion|montaje-automatico|motion|nav-list|prerrequisitos|presets|primer-componente|recetas|referencia|scroll-lock|scrollbar|splitter|state-layer|styling-hooks|teclado|templates|tiers|transparencias|vaul|zoom)/?$ /es/$1 permanent;

  # Astro static MPA: clean URLs land as /path/index.html
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  location /_astro/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 256;

  error_page 404 /404.html;
}
