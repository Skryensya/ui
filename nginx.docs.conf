# THE LANGUAGE REDIRECT, answered here instead of in the page (see `apps/docs/src/pages/lang-twins.nginx.conf.ts`).
# `$sk_twin_es` / `$sk_twin_en`: each page's twin in the other language, generated at build.
include /etc/nginx/sk-lang-twins.conf;

# No stored choice: only a browser whose FIRST language is Spanish is moved, and only off an
# unprefixed page (an explicit /es/ URL is left where it points), the same rule the inline script had.
map $http_accept_language $sk_browser_wants {
  default "";
  "~*^es" es;
}

# `sk_lang` is the reader's explicit choice from the language menu: it wins, in both directions.
map $cookie_sk_lang $sk_wants {
  es es;
  en en;
  default $sk_browser_wants;
}

map "$sk_wants:$sk_twin_es:$sk_twin_en" $sk_lang_redirect {
  default "";
  "~^es:(?<to>/[^:]*):$" $to;
  "~^en::(?<to>/[^:]*)$" $to;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

# THE URLs THIS SITE USED TO HAVE. Until English took the bare paths, Spanish owned them:
  # /componentes/button served Spanish, /en/components/button served English. Every link anyone has
  # ever shared points at one of those shapes, so each one forwards to where that exact content
  # lives now instead of 404ing. A reader who bookmarked the Spanish page still lands on Spanish.
  #
  # 301 and not a meta refresh: it is the server's answer, it is cached, and search engines move the
  # ranking across instead of treating the new URL as an unrelated page.
  rewrite ^/en/(.*)$ /$1 permanent;
  rewrite ^/componentes/(.*)$ /es/componentes/$1 permanent;
  rewrite ^/referencia/(.*)$ /es/referencia/$1 permanent;
  rewrite ^/(almacenamiento|anclaje|arquitectura|densidad|dimensiones|efectos|elevacion|fundamentos|gradientes|hotkey|iconos|instalacion|montaje-automatico|motion|nav-list|prerrequisitos|presets|primer-componente|referencia|scroll-lock|scrollbar|splitter|state-layer|styling-hooks|teclado|templates|tiers|transparencias|vaul|zoom)/?$ /es/$1 permanent;

  if ($sk_lang_redirect) {
    return 302 $sk_lang_redirect$is_args$args;
  }

  # Behind Cloudflare nginx only ever sees http, so an absolute redirect it writes points at http://
  # and costs the reader a second hop back to https. Relative keeps the scheme the browser used.
  absolute_redirect off;

  # Astro static MPA: clean URLs land as /path/index.html. `$uri/index.html` before `$uri/`, so
  # /components/listbox is served as is instead of 301ing to /components/listbox/ first.
  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  location /_astro/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown;
  gzip_min_length 256;

  # THE 404, IN THE LANGUAGE OF THE URL THAT FAILED.
  #
  # error_page is resolved per location, so the site-wide one below answers in English and this one
  # answers under /es/ - a reader who mistyped a Spanish URL was being told, in English, that the
  # page is not in the documentation. The Spanish page exists (/es/404.html); nothing pointed at it.
  location /es/ {
    try_files $uri $uri/index.html $uri.html =404;
    error_page 404 /es/404.html;
  }

  error_page 404 /404.html;
}
