packages:
  - "packages/*"
  - "apps/*"
  # The recipes are a package so the compiler, the gates and the site all import the SAME module
  # instead of three relative paths into a directory that is not one.
  - "contracts/recipes"
  # Same reason, one scope down: component/molecule-level examples, not whole screens.
  - "contracts/snippets"
  # Same reason: the evals runner imports the corpus as a module, not a directory of loose files.
  - "evals"

# One Node types package for the whole workspace. Major matches the runtime (Node 24 LTS), not
# @types/node 26, which describes APIs this repo does not run.
catalog:
  "@types/node": "^24.13.3"

# ─────────────────────────────────────────────────────────────────────────────────────────────────
# QUARANTINE FOR NEW VERSIONS. 30 days, in minutes.
#
# Against what: the shape npm supply-chain attacks take (Shai-Hulud and the ones that came after) is
# publishing a malicious version of a legitimate package, usually by stealing the maintainer's token,
# and living off someone installing it in the following hours. They are detected and taken down fast
# (almost always the same day), but by then they have already entered every `pnpm install` that ran
# in that window.
#
# Waiting makes the window not exist: pnpm does not install a version until it is 7 days old, so the
# peak of the attack passes entirely before this repo can even see it. It detects nothing and judges
# nothing; it simply is not there when it happens.
#
# WHAT IT COSTS, said plainly: legitimate security patches also take 30 days to arrive, and at 30
# days that stops being theoretical. Measured in this tree while writing this: 5 of the 8 security
# overrides in package.json pointed at versions less than 30 days old, and fell back to an earlier
# one. In 4 of those 5 the earlier one was patched too and nothing changed; in the fifth (qs) the only
# patched version WAS the new one, and there no fix is possible until it ages.
#
# When one is needed NOW, skip it per package rather than lowering the global number:
#
#     minimumReleaseAgeExclude:
#       - "the-package-in-question"
#
# ...or `pnpm add pkg@version --allow-newer` for a one-off. The exception stays written down and gets
# reviewed; the default is still to wait.
minimumReleaseAge: 43200

# THE TWO EXCEPTIONS, both by date and not by judgment. Each one says when it expires.
#
# Both are the same case: a range whose FLOOR is a new version, so there is no earlier one to fall
# back to and the resolution is left with no eligible version. The package is excluded instead of
# lowering the global number, because lowering it would loosen the rule for the tree's 773
# dependencies in order to unblock one.
#
# WHEN THEY MATTER: only when something is RESOLVED again (lockfile deleted, or a config change that
# forces re-resolution, which is exactly what happened when the security overrides were added). On an
# already-settled lockfile they do nothing: an already-pinned version is reused without going through
# the cooldown again. Verified by removing them and reinstalling: nothing changes today. They are
# insurance for the next `pnpm install` that does have to resolve, not a patch for something broken now.
minimumReleaseAgeExclude:
  # DELETE WHEN astro 7.2.x IS 30 DAYS OLD.
  # `astro < 7.2.8` carries a CRITICAL advisory (remote code execution through AVIF image
  # optimization), which is the one case this quarantine must not be allowed to sit on. Getting onto
  # 7.2.x also pulls `@bruits/satteri-*`, the per-platform native binaries of astro's markdown
  # engine, published inside the window. pnpm omits an OPTIONAL dependency in SILENCE when the
  # cooldown blocks it, so the install looks clean and `astro check` then dies with "Cannot find
  # native binding": that is what made the first attempt, on 2026-09-09, look like it had failed for
  # an unrelated reason. Every platform binary is listed, not only this machine's, so a Linux or
  # Windows clone resolves the same tree.
  - "astro"
  - "@astrojs/compiler-rs"
  - "@astrojs/compiler-binding"
  - "@astrojs/internal-helpers"
  - "@astrojs/markdown-satteri"
  - "@bruits/satteri-darwin-arm64"
  - "@bruits/satteri-darwin-x64"
  - "@bruits/satteri-linux-arm64-gnu"
  - "@bruits/satteri-linux-arm64-musl"
  - "@bruits/satteri-linux-x64-gnu"
  - "@bruits/satteri-linux-x64-musl"
  - "@bruits/satteri-win32-arm64-msvc"
  - "@bruits/satteri-win32-x64-msvc"
  - "unifont"
  # Both reached by that same bump, and both the floor of their own patched range.
  - "smol-toml"
  - "svgo"
  # DELETE AFTER 2026-09-20, when @zag-js 1.43.3 (published 08-20) ages out.
  # ALL SIX ARE ALREADY IN THE LOCKFILE at exactly these versions, and already installed. Same
  # reasoning as `prosemirror-transform` below: blocking them avoids no risk, it only stops a
  # re-resolution from describing what this machine already runs.
  #
  # Surfaced on 2026-09-13 by adding `apps/playground`. A new workspace package forces a
  # re-resolution, and a re-resolution puts every version back through the cooldown, settled ones
  # included. The first two are transitives of astro 7.2.10; the four @zag-js are the 1.43.3 line
  # that `packages/core` and `packages/react` already pin.
  #
  # @zag-js/react IS THE ONE THAT EARNS ITS PLACE. Without it the playground falls back to 1.43.0 and
  # the tree carries TWO copies of @zag-js/utils, types and dom-query, one per line. Pinned to
  # ^1.43.3 like `packages/react`, it is one tree: which for a Sandpack host that hands the browser a
  # single prebuilt React bundle is the difference between one dispatcher and two.
  - "find-proc"
  - "@jridgewell/sourcemap-codec"
  - "@zag-js/dom-query"
  - "@zag-js/react"
  - "@zag-js/types"
  - "@zag-js/utils"
  # DELETE AFTER 2026-10-02.
  # `packages/editor` asks for `prosemirror-transform: ^1.12.1`, and 1.12.1 (2026-09-02) is the only
  # version that range admits: the previous one is 1.12.0, from March, which `^1.12.1` leaves out.
  # Here the cooldown is not protecting anything anyway: that version is ALREADY in the lockfile and
  # ALREADY installed, from before this rule existed. Blocking it does not avoid the risk, it only
  # prevents describing what the machine already runs.
  - "prosemirror-transform"
  # DELETE AFTER 2026-09-28.
  # qs 6.16.0 (2026-08-29) is the first version that fixes two moderate advisories (an array-limit
  # bypass, and a DoS through a controllable `isBuffer`). There is no older 6.16.x, so at 30 days the
  # alternative is not "an earlier patched version" but "stay on the vulnerable one".
  # It comes in through `evals > @tanstack/ai-mcp > @modelcontextprotocol/sdk > express > qs`: the
  # evals harness, which is not published in any of the 9 npm packages, so the patch weighs more than
  # the wait. On 2026-09-28 it turns 30 days old and this line stops doing anything.
  - "qs"

# NOTHING RUNS CODE ON INSTALL, and the list is empty on purpose, not by oversight.
#
# An `install`/`postinstall` script runs with your permissions, on your machine, as soon as you
# resolve a dependency: it is the shortest path a compromised package has to your keys. pnpm 10
# already blocks them all by default, and this repo has been benefiting from that without knowing it.
# Writing the list anyway turns that into a decision of this repo instead of an inherited default: if
# pnpm changes its mind tomorrow, or someone runs `pnpm approve-builds`, the list still says nothing
# runs here.
#
# Verified before writing it: `pnpm ignored-builds` only reports `es5-ext`, whose postinstall builds
# ES5 polyfills that none of this needs. No package in this tree requires compiling to work (sharp
# included: it downloads precompiled binaries).
onlyBuiltDependencies: []
