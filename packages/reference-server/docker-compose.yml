services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reference
      POSTGRES_PASSWORD: reference
      POSTGRES_DB: reference
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - reference-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reference"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  reference-postgres:
