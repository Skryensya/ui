<!doctype html>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  body { font: 12px/1.45 system-ui, sans-serif; margin: 0; padding: 12px; color: var(--figma-color-text); background: var(--figma-color-bg); }
  .row { display: flex; gap: 8px; align-items: center; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--figma-color-border); background: var(--figma-color-bg-secondary); color: inherit; cursor: pointer; }
  button.primary { background: var(--figma-color-bg-brand); color: var(--figma-color-text-onbrand); border-color: transparent; }
  button:disabled { opacity: 0.5; cursor: default; }
  .muted { color: var(--figma-color-text-secondary); }
  .spacer { flex: 1; }

  #status { margin-block: 14px 6px; font-weight: 600; }
  .bar { height: 6px; border-radius: 3px; background: var(--figma-color-bg-tertiary, rgba(127,127,127,.2)); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--figma-color-bg-brand); transition: width .15s linear; }
  #timing { margin-block: 6px 12px; }

  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { display: grid; grid-template-columns: 16px 1fr auto; gap: 2px 8px; align-items: center; }
  li .mark { text-align: center; }
  li .count { font-variant-numeric: tabular-nums; }
  li .bar, li .summary { grid-column: 2 / 4; }
  li[data-state="pending"] { opacity: .5; }
  li[data-state="pending"] .bar, li[data-state="done"] .bar { display: none; }
  li[data-state="running"] .summary { display: none; }

  #components { border: 1px solid var(--figma-color-border); border-radius: 6px; padding: 8px 10px; margin-block-end: 12px; display: grid; gap: 6px; }
  #components legend { padding: 0 4px; }
  #components label { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center; }
  #components label[data-forced] { opacity: .75; }

  details { margin-block-start: 14px; }
  summary { cursor: pointer; }
  pre { white-space: pre-wrap; margin: 8px 0 0; font: 11px/1.45 ui-monospace, monospace; }
  .error { color: var(--figma-color-text-danger); }
</style>

<fieldset id="components">
  <legend class="muted">Components to import</legend>
</fieldset>

<div class="row">
  <button class="primary" id="sync">Sync</button>
  <button id="dry">Dry run</button>
  <button id="stop" hidden>Stop</button>
  <button id="copy" hidden>Copy report</button>
  <span class="spacer"></span>
  <span class="muted" id="source">…</span>
</div>

<div id="status" class="muted">Dry run shows what would change. Sync applies it.</div>
<div class="bar" id="overall" hidden><i></i></div>
<div class="muted" id="timing"></div>
<ol id="phases"></ol>
<details id="details" hidden><summary>Everything it did</summary><pre id="log"></pre></details>

<script>
  const $ = (id) => document.getElementById(id);
  const buttons = [$("sync"), $("dry")];
  let stopping = false;
  const busy = (on) => {
    stopping = false;
    buttons.forEach((b) => (b.disabled = on));
    $("sync").dataset.running = on ? "true" : "";
    // The pick is locked while a run works from it.
    document.querySelectorAll("#components input").forEach((box) => (box.dataset.locked = on ? "true" : ""));
    $("components").disabled = on;
    if (!on) refreshPick();
    // Stop exists only while something runs: idle, there is nothing for it to act on.
    $("stop").hidden = !on;
    $("stop").disabled = false;
    $("stop").textContent = "Stop";
  };
  const fmt = (ms) => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  const MARK = { pending: "○", running: "◐", done: "✓" };

  /*
   * THE PICK. Every component starts checked; the Icon set is checked and locked whenever something
   * checked draws icons (a Button's slots show them), and says which ones need it.
   */
  let components = [];
  const checked = () => components.filter((c) => $(`pick-${c.id}`)?.checked).map((c) => c.id);
  function refreshPick() {
    const chosen = new Set(checked());
    const icons = components.find((c) => c.icons);
    if (icons) {
      const users = components.filter((c) => c.needsIcons && chosen.has(c.id)).map((c) => c.name);
      const box = $(`pick-${icons.id}`);
      const label = box.closest("label");
      box.disabled = users.length > 0;
      if (users.length) box.checked = true;
      label.toggleAttribute("data-forced", users.length > 0);
      label.querySelector(".why").textContent = users.length ? `used by ${users.join(", ")}` : `${icons.variants} icons`;
    }
    // Nothing picked, nothing to run.
    if (!$("sync").dataset.running) buttons.forEach((b) => (b.disabled = checked().length === 0));
  }
  function renderPick(list) {
    components = list;
    for (const c of list) {
      const label = document.createElement("label");
      label.innerHTML = `<input type="checkbox" id="pick-${c.id}" checked><span>${c.name}</span><span class="why muted">${c.icons ? `${c.variants} icons` : `${c.variants} variants`}</span>`;
      $("components").append(label);
    }
    $("components").addEventListener("change", refreshPick);
    refreshPick();
  }

  let mode = "";
  const start = (type) => {
    mode = type;
    busy(true);
    $("details").hidden = true;
    $("copy").hidden = true;
    $("status").className = "";
    $("status").textContent = type === "sync" ? "Syncing…" : "Dry run…";
    parent.postMessage({ pluginMessage: { type, only: checked() } }, "*");
  };
  // Figma's plugin frame blocks the async clipboard API; a selected textarea and execCommand is what works there.
  let reportText = "";
  $("copy").onclick = () => {
    const area = document.createElement("textarea");
    area.value = reportText;
    document.body.append(area);
    area.select();
    const ok = document.execCommand("copy");
    area.remove();
    $("copy").textContent = ok ? "Copied" : "Copy failed: select the log below";
    setTimeout(() => ($("copy").textContent = "Copy report"), 1500);
  };
  $("sync").onclick = () => start("sync");
  $("dry").onclick = () => start("dry-run");
  // The run finishes the unit it is on (a variable, an icon, a variant) and stops at the next one.
  $("stop").onclick = () => {
    stopping = true;
    $("stop").disabled = true;
    $("stop").textContent = "Stopping…";
    $("status").textContent = "Stopping after the current item…";
    parent.postMessage({ pluginMessage: { type: "stop" } }, "*");
  };

  function renderPhases(phases) {
    $("phases").innerHTML = "";
    for (const p of phases) {
      const li = document.createElement("li");
      li.dataset.state = p.state;
      const pct = p.total ? (100 * p.done) / p.total : 100;
      li.innerHTML = `
        <span class="mark">${MARK[p.state]}</span>
        <span>${p.label}</span>
        <span class="count muted">${p.state === "done" ? "" : `${p.done.toLocaleString()} / ${p.total.toLocaleString()}`}</span>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <span class="summary muted">${p.summary ?? ""}</span>`;
      $("phases").append(li);
    }
  }

  function renderProgress(m) {
    const total = m.phases.reduce((n, p) => n + p.total, 0);
    const done = m.phases.reduce((n, p) => n + p.done, 0);
    const running = m.phases.find((p) => p.state === "running");
    $("overall").hidden = false;
    $("overall").firstElementChild.style.width = `${total ? (100 * done) / total : 0}%`;
    // A tick that lands after Stop was pressed does not take the status back to "Syncing".
    if (!stopping) $("status").textContent = `${m.apply ? "Syncing" : "Dry run"}${running ? `: ${running.label}` : "…"}`;
    // The estimate only once there is a rate worth trusting.
    const rate = done / Math.max(1, m.elapsed);
    const left = done > 20 && m.elapsed > 2000 ? ` · about ${fmt((total - done) / rate)} left` : "";
    $("timing").textContent = `${done.toLocaleString()} of ${total.toLocaleString()} · ${fmt(m.elapsed)} elapsed${left}`;
    renderPhases(m.phases);
  }

  onmessage = ({ data }) => {
    const m = data.pluginMessage;
    if (!m) return;
    if (m.type === "ready") {
      $("source").textContent = `manifest ${m.sourceHash}`;
      renderPick(m.components ?? []);
    }
    if (m.type === "progress") renderProgress(m);
    if (m.type === "error") {
      busy(false);
      reportText = `ERROR\n${m.text}`;
      $("copy").hidden = false;
      $("status").className = "error";
      $("status").textContent = "Stopped with an error";
      $("details").hidden = false;
      $("details").open = true;
      $("log").textContent = m.text;
    }
    if (m.type === "report") {
      busy(false);
      renderPhases(m.phases);
      $("overall").firstElementChild.style.width = "100%";
      const verdict = {
        NOOP: "Already current: nothing written",
        APPLIED: "Synced",
        "WOULD CHANGE": "Would change",
        STOPPED: "Stopped: what was written stays, sync again to finish",
      }[m.outcome];
      $("status").textContent = `${m.apply ? "" : "Dry run: "}${verdict}`;
      const warnings = m.entries.filter((e) => e.action === "WARN").length;
      $("timing").textContent = `${m.writes.toLocaleString()} writes · ${m.seconds}s${warnings ? ` · ${warnings} warning${warnings > 1 ? "s" : ""}` : ""}`;
      $("details").hidden = false;
      $("details").open = warnings > 0;
      $("log").textContent = [
        `${m.apply ? "SYNC" : "DRY RUN"}: ${m.outcome} · ${m.writes} writes · ${m.seconds}s · manifest ${m.sourceHash}`,
        Object.entries(m.counts).map(([k, v]) => `${k} ${v}`).join(" · "),
        "",
        ...m.entries.map((e) => `${e.action.padEnd(8)} ${e.subject}${e.detail ? `  (${e.detail})` : ""}`),
      ].join("\n");
      // The report as pasted: the phases with their summaries, then the full log.
      reportText = [
        ...m.phases.map((p) => `${p.label}: ${p.summary ?? ""}`),
        "",
        $("log").textContent,
      ].join("\n");
      $("copy").hidden = false;
    }
  };
</script>
