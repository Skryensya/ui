      <text x="543" y="459" class="card-title">Width</text>
      <text x="543" y="479" class="hook">--ds-button-width</text>
    </g>
  

    <g class="hook-card-group" data-hook-card="Content inset">
      <rect x="74" y="472" width="169" height="72" rx="10" class="hook-card" />
      <text x="88" y="493" class="card-title">Content inset</text>
      <text x="88" y="513" class="hook">--ds-button-padding-x</text>
<text x="88" y="530" class="hook">--ds-button-gap</text>
    </g>
  

    <g class="hook-card-group" data-hook-card="Label">
