<path d="M237 292C271 292 453.74147727272725 302 477.74147727272725 310" class="arrow" marker-end="url(#arrowhead)" />
<path d="M995 273.5C960 273.5 770.2585227272727 296 750.2585227272727 310" class="arrow" marker-end="url(#arrowhead)" />
<path d="M600 438C600 414 600 397 600 382" class="arrow" marker-end="url(#arrowhead)" />
<path d="M243 508C289 500 472 374 526.8323863636363 328.6363636363636" class="arrow" marker-end="url(#arrowhead)" />
<path d="M961 496.5C905 478.5 706 372 621.8181818181818 328.4727272727273" class="arrow" marker-end="url(#arrowhead)" />
<path d="M780 540C780 512 704 510 704 480V410C704 388 660 374 600 362" class="arrow" marker-end="url(#arrowhead)" />
  
    <g class="hook-card-group" data-hook-card="Focus ring">
      <rect x="56" y="60" width="156" height="89" rx="10" class="hook-card" />
      <text x="70" y="81" class="card-title">Focus ring</text>
      <text x="70" y="101" class="hook">--focus-ring-color</text>
<text x="70" y="118" class="hook">--focus-ring-width</text>
<text x="70" y="135" class="hook">--focus-ring-offset</text>
    </g>
  

    <g class="hook-card-group" data-hook-card="Border radius">
