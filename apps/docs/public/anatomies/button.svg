  <path d="M477.74147727272725 382H722.2585227272727" class="measure" marker-start="url(#measure-arrowhead)" marker-end="url(#measure-arrowhead)" />
  <path d="M477.74147727272725 350V390M722.2585227272727 350V390" class="measure" />
  <path d="M750.2585227272727 270V350" class="measure" marker-start="url(#measure-arrowhead)" marker-end="url(#measure-arrowhead)" />
