      <text x="975" y="473" class="card-title">Label</text>
      <text x="975" y="493" class="hook">--ds-button-fg</text>
<text x="975" y="510" class="hook">--ds-button-font-size</text>
<text x="975" y="527" class="hook">--ds-button-font-weight</text>
