  <path d="M0 578C272 504 396 586 622 530C830 478 1028 554 1200 504V640H0Z" fill="#eef4ff" opacity="0.8" />
  <rect x="24" y="24" width="1152" height="592" rx="22" fill="#ffffff" fill-opacity="0.78" stroke="#dce3ed" stroke-width="1" />
  <rect x="472.2869318181818" y="264.54545454545456" width="255.42613636363635" height="90.9090909090909" rx="20" class="focus-ring" stroke-width="3.6363636363636362" />
  <rect x="477.74147727272725" y="270" width="244.51704545454544" height="80" rx="14.545454545454545" class="button-surface" filter="url(#button-shadow)" />
