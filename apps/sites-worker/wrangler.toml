# The sites Worker (ADR-0033). Deployed with `pnpm --filter @skryensya/sites-worker deploy`; see README.md for the
# one-time setup (bucket, DNS wildcard, token). Nothing here is secret: the token is a Worker secret.
name = "skryensya-sites"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
workers_dev = false

# Every subdomain comes here, the apex does not. Subdomains that are not sites (ui, www, …) are passed
# through to their own origin by the Worker itself: a route cannot exclude them.
routes = [{ pattern = "*.skryensya.dev/*", zone_name = "skryensya.dev" }]

[[r2_buckets]]
binding = "SITES"
bucket_name = "skryensya-sites"

[vars]
ROOT_DOMAIN = "skryensya.dev"
PUBLISH_HOST = "publish.skryensya.dev"
# Existing subdomains not in the reserved list go here, comma-separated.
PASSTHROUGH = ""
