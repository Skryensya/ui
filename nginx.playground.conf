# Playground app only (@skryensya/playground). See Dockerfile.playground.
#
# ITS OWN FILE, and the reason is what the docs' config contains: two dozen `rewrite` rules for URLs
# the DOCUMENTATION used to have (`/componentes/...`, `/en/...`), which mean nothing at this origin
# and one of which is actively wrong here - `rewrite ^/en/(.*)$ /$1` sends `/en/playground` away from
# a route this app really serves. A shared file was the cheaper thing to write and the wrong thing to
# keep: these are two sites now, with two route vocabularies.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # REDIRECCIONES RELATIVAS. Por defecto nginx contesta un `Location` absoluto que arma con `$host` y
  # el esquema de ESTA conexión: detrás del proxy de Dokploy eso es http y el puerto interno, así que
  # el `/` y el trailing slash que agrega `try_files` devolvían al lector a un origen que no es el que
  # pidió. Relativo, el proxy y el navegador resuelven contra la URL real.
  absolute_redirect off;

  # THE OLD ADDRESS, KEPT WORKING. The tool served `/playground` while it lived inside the docs site
  # and for a while after the split; it is at `/` now (`src/pages/index.astro`), so anything already
  # pointing at the old path lands on the tool instead of on the 404. 301, unlike the redirect that
  # used to sit at `/`: this path is not coming back, so a cached answer is the correct one.
  location = /playground {
    return 301 /;
  }

  location ~ ^/(en|es)/playground$ {
    return 301 /$1/;
  }

  # Astro static MPA: clean URLs land as /path/index.html
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  location /_astro/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The compiled kit the sandbox is handed (`scripts/build-sandbox-bundles.mjs`): content-hashed by
  # nothing, so it is NOT immutable - but it is large, static and read on every visit, so a day of
  # caching saves the megabyte without pinning a stale kit for a week.
  location /sandbox/ {
    access_log off;
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 256;

  error_page 404 /404.html;
}
