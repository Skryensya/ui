# Builds the tarball assets for a version tag.
#
# Release Please normally creates the tag and GitHub Release after its PR merges to main.
# A manually pushed version tag still works as before; this workflow creates the release if needed.
#
# What it publishes is one npm-compatible tarball per shipped package plus `SHA256SUMS`, as release
# assets. Nothing goes to a registry: consumers install by URL (README, "Consuming"). The steps are the
# ones `scripts/release.ts` runs on a laptop, so a release can be rehearsed locally with the same commands.
#
# Run by hand (Actions → release → Run workflow) it is a DRY RUN by default: it builds, packs and verifies,
# and uploads the tarballs as a workflow artifact without creating a release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only; do not publish release assets"
        type: boolean
        default: true

# One release at a time, and never cancel one halfway: a release with half its assets is worse than a late one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: build, pack and publish the release
    runs-on: ubuntu-latest
    env:
      # `pack` refuses a tag that is not the packages' version, including manual reruns on tags.
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same gate as every pull request, on the exact commit being released: a red commit
      # must not acquire installable release assets.
      - run: pnpm audit:gate
      - run: pnpm check

      - name: Build the shipped packages
        run: node scripts/release.ts build

      - name: Pack one tarball per package
        run: node scripts/release.ts pack release

      # Opens every tarball: versions, and that every file an `exports` entry names is inside it.
      - name: Verify the tarballs
        run: node scripts/release.ts verify release

      - uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: release/
          if-no-files-found: error

      - name: Publish the release assets
        if: github.ref_type == 'tag' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Written notes still win; otherwise keep Release Please's generated notes.
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "docs/releases/$TAG.md" ]; then
              gh release edit "$TAG" --notes-file "docs/releases/$TAG.md"
            fi
            # Rerunning a failed upload must not require deleting the release or its tag.
            gh release upload "$TAG" release/*.tgz release/SHA256SUMS --clobber
          else
            # Preserve manual-tag releases, including their written notes and prerelease flag.
            if [ -f "docs/releases/$TAG.md" ]; then
              notes=(--notes-file "docs/releases/$TAG.md")
            else
              notes=(--generate-notes)
            fi
            case "$TAG" in *-*) flags=(--prerelease) ;; *) flags=() ;; esac
            gh release create "$TAG" release/*.tgz release/SHA256SUMS \
              --title "$TAG" "${notes[@]}" "${flags[@]}" --verify-tag
          fi
