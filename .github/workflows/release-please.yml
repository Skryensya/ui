name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

# The fine-grained PAT below does the API writes. This job needs no GITHUB_TOKEN permissions.
permissions: {}

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # A GITHUB_TOKEN fallback would silently suppress the tag-triggered tarball workflow.
      - name: Require the release automation token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::Set RELEASE_PLEASE_TOKEN as described in CONTRIBUTING.md#release-automation-setup."
            exit 1
          fi

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
