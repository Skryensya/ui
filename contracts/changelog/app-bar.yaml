entries:
  - date: 2026-10-17
    kind: feature
    es:
      title: "AppBarMenu y AppBarStatus aceptan un nodo, y el estado anuncia sus cambios"
      body: "children pasa de texto a nodo en ambos: un icono junto a la palabra, o un tono propio, ya componen. El texto de AppBarStatus (sin items) ahora lleva role=\"status\", así que un lector de pantalla anuncia el cambio solo. (Esta entrada cubre también una limpieza interna no relacionada: --sk-anchored-* vive ahora en la configuración de posicionamiento compartida, no en los hooks propios de este contrato.)"
    en:
      title: "AppBarMenu and AppBarStatus accept a node, and the status announces its own changes"
      body: "children moves from text to node on both: an icon beside the word, or a tone of your own, compose fine now. AppBarStatus's plain text (no items) now carries role=\"status\", so a screen reader announces the change on its own. (This entry also covers an unrelated internal cleanup: --sk-anchored-* now lives in the shared positioning config, not in this contract's own hooks.)"
