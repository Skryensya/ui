# What changed in navbar, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "e3d3dea34a2a092a"
entries:
  - date: 2026-10-25
    kind: breaking
    target: appearance
    es:
      title: "Cada apariencia tiene su propia hoja"
      body: "Las reglas de `brutalist`, `frosted` pasan de navbar.css a navbar.brutalist.css, navbar.frosted.css. Importa la hoja del valor que uses; sin ella, ese valor no recibe su pintura. Los hooks siguen declarados en navbar.css."
    en:
      title: "Each appearance has its own stylesheet"
      body: "The rules for `brutalist`, `frosted` move from navbar.css to navbar.brutalist.css, navbar.frosted.css. Import the sheet for the value you use; without it, that value does not get its paint. The hooks are still declared in navbar.css."
  - date: 2026-10-06
    kind: feature
    target: Navbar
    es:
      title: Navbar acepta un Inline como hijo
      body: 'Un <code>Inline</code> agrupa ítems de la barra que comparten destino, casi siempre <code>show</code>: los links del sitio en uno con <code>show="expanded"</code> y el <code>Vaul.Trigger</code> del drawer en otro con <code>show="compact"</code>.'
    en:
      title: Navbar takes an Inline as a child
      body: "An <code>Inline</code> groups bar items that share a fate, almost always <code>show</code>: the site's links in one with <code>show=\"expanded\"</code> and the drawer's <code>Vaul.Trigger</code> in another with <code>show=\"compact\"</code>."
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y una hoja de estilos para marcado simple."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a stylesheet for plain markup."
