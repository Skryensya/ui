# What changed in navbar, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "bf4a35ce5fb86104"
entries:
  - date: 2026-08-20
    kind: feature
    es:
      title: Navbar acepta Megamenu como invitado, junto a NavList
      body: >-
        El slot <code>children</code> de <code>Navbar</code> ahora también acepta
        <code>Megamenu</code>: otro invitado con sus propios destinos de navegación, la misma
        relación que ya tiene con <code>NavList</code>. Nada del rol de Navbar como SHELL cambia:
        sigue sin máquina propia y sin ajustar el markup de su invitado, sólo redeclara sus estilos.
    en:
      title: Navbar accepts Megamenu as a guest, alongside NavList
      body: >-
        <code>Navbar</code>'s own <code>children</code> slot now also accepts <code>Megamenu</code>:
        another guest with its own navigation destinations, the same relationship it already has
        with <code>NavList</code>. Nothing about Navbar's own role as a SHELL changes: still no
        machine of its own, still never reaching into its guest's markup, only re-declaring its own
        styling hooks.
  - date: 2026-08-11
    kind: feature
    es:
      title: Navbar se publica como contrato, con 3 signatures
      body: >-
        Entra al catálogo con <code>Navbar</code>, <code>NavbarBrand</code>, <code>NavbarActions</code>:
        los dos bindings lo realizan, y la referencia de esta página sale del contrato compilado en vez
        de prosa escrita al lado. No tiene enhancer: el markup está completo por sí solo, así que las
        dos bindings son el mismo markup dos veces. No tiene opciones: el elemento ES el significado. La
        hoja es <code>components/navbar.css</code>.
    en:
      title: Navbar is published as a contract, with 3 signatures
      body: >-
        It joins the catalogue with <code>Navbar</code>, <code>NavbarBrand</code>,
        <code>NavbarActions</code>: both bindings realize it, and this page's reference is rendered from
        the compiled contract rather than from prose written beside it. There is no enhancer: the markup
        is complete on its own, so both bindings are the same markup twice. It has no options: the
        element IS the meaning. Its stylesheet is <code>components/navbar.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de navbar quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>13</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: navbar's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>13</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
