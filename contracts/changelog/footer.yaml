# What changed in footer, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "669fd03da743e380"
entries:
  - date: 2026-11-20
    kind: bugfix
    es:
      title: "No se estira dentro de una columna flex"
      body: "En un contenedor flex en columna, el Footer tomaba toda la altura del contenedor. Ahora mide lo que su contenido; en una fila flex sigue ocupando la línea completa."
    en:
      title: "No longer stretches inside a flex column"
      body: "Inside a flex column the Footer grew as tall as its container. It is now as tall as its content; in a flex row it still takes the whole line."
  - date: 2026-10-06
    kind: bugfix
    es:
      title: Footer aplica su superficie por defecto sin atributo
      body: La regla de <code>surface="sunken"</code> sólo valía con el atributo escrito. Ahora también cuando falta.
    en:
      title: Footer applies its default surface without the attribute
      body: The <code>surface="sunken"</code> rule only held with the attribute written. It now also holds when it is absent.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato y una hoja de estilos para marcado simple."
    en:
      title: First release
      body: "Published for the first time, with its contract and a stylesheet for plain markup."
