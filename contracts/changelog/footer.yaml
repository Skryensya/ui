# What changed in footer, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "940e23ff6194c771"
entries:
  - date: 2026-09-17
    kind: bugfix
    es:
      title: Footer escribe data-divider="false" al apagar el borde
      body: >-
        <code>divider</code> ahora declara <code>falseValue: "false"</code>, igual que React ya
        escribía. Sin eso, el emit omitía el atributo al optar por no, y la hoja seguía pintando
        la raya superior.
    en:
      title: Footer writes data-divider="false" when the hairline is off
      body: >-
        <code>divider</code> now declares <code>falseValue: "false"</code>, matching what React
        already wrote. Without it, emit omitted the attribute on opt-out and the stylesheet kept
        painting the top rule.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de footer quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>7</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: footer's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>7</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-17
    kind: feature
    es:
      title: Footer elige su elemento desde el árbol
      body: >-
        <code>footerElement</code> acepta <code>footer</code> o <code>div</code>, lo mismo que React ya permitía con <code>as</code>.
    en:
      title: Footer chooses its element from the tree
      body: >-
        <code>footerElement</code> takes <code>footer</code> or <code>div</code>, what React already allowed through <code>as</code>.
