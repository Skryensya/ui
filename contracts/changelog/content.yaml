# What changed in content, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "96d828666dbbc43e"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: Toast se publica como contrato, con 3 signatures
      body: >-
        Entra al catálogo con <code>ToastRegion</code>, <code>ToastTemplate</code>, <code>Toast</code>:
        los dos bindings lo realizan, y la referencia de esta página sale del contrato compilado en vez
        de prosa escrita al lado. El binding Vanilla monta sobre <code>data-sk-toast</code>: el markup
        se autora y el enhancer lo hidrata, así que lo que no necesita JavaScript funciona antes de que
        corra ninguno. Opciones: <code>tone</code>, <code>dismissible</code>, <code>dismissLabel</code>,
        <code>timeout</code>. La hoja es <code>components/toast.css</code>.
    en:
      title: Toast is published as a contract, with 3 signatures
      body: >-
        It joins the catalogue with <code>ToastRegion</code>, <code>ToastTemplate</code>,
        <code>Toast</code>: both bindings realize it, and this page's reference is rendered from the
        compiled contract rather than from prose written beside it. The Vanilla binding mounts on
        <code>data-sk-toast</code>: the markup is authored and the enhancer hydrates it, so whatever
        needs no JavaScript works before any runs. Options: <code>tone</code>, <code>dismissible</code>,
        <code>dismissLabel</code>, <code>timeout</code>. Its stylesheet is
        <code>components/toast.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de content quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>10</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: content's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>10</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-12
    kind: feature
    es:
      title: El contrato declara las otras hojas donde vive su estilo
      body: >-
        Este componente se pinta desde mas de una hoja, asi que el contrato ahora las nombra con
        <code>hookSheets</code> y su lista de <code>hooks</code> cubre todas. Antes solo se podia
        reconciliar contra la hoja de <code>css</code>, asi que los hooks de las otras eran
        superficie publica que nadie documentaba ni verificaba. No cambia ningun estilo: cambia que
        ahora estan declarados y el compilador los chequea.
    en:
      title: The contract declares the other stylesheets its styling lives in
      body: >-
        This component paints from more than one stylesheet, so the contract now names them with
        <code>hookSheets</code> and its <code>hooks</code> list covers all of them. Before, only the
        sheet <code>css</code> names could be reconciled, so the hooks in the others were public
        surface nobody documented and nothing checked. No styling changes: what changes is that they
        are declared now, and the compiler checks them.
