# What changed in component-preview, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "c59625b95eb27f1b"
entries:
  - date: 2026-09-19
    kind: rework
    es:
      title: El preset de pantalla pasa a ser de cada preview, y Shift lo difunde
      body: >-
        Antes un click cambiaba el preset de todos los previews de la página a la vez. Cambiar el
        preset suele ser una pregunta sobre UNA demo, y responderla moviendo el resto tira donde el
        lector los había dejado, así que ahora un click normal mueve sólo ese stage y no toca la
        preferencia guardada. <code>Shift</code> + click es la difusión: cambian todos, se guarda, y
        alcanza también a los previews que ya se habían movido a mano, que es la forma de volver a
        poner la página en fila. La preferencia compartida sigue existiendo y es la que siembra a
        todos al cargar. El preview que declara su preset por cuenta propia no cambia: no lee la
        preferencia compartida ni sigue una difusión.
    en:
      title: The screen preset becomes each preview's, and Shift broadcasts it
      body: >-
        A click used to change the preset for every preview on the page at once. Changing the preset
        is usually a question asked of ONE demo, and answering it by moving the rest throws away
        wherever the reader had left them, so a plain click now moves that stage alone and never
        touches the saved preference. <code>Shift</code> + click is the broadcast: everything follows,
        the choice is saved, and it reaches previews that had already been nudged by hand, which is
        how the page is put back in step. The shared preference still exists and is what seeds every
        preview on load. A preview that owns its preset outright is unchanged: it neither reads the
        shared preference nor follows a broadcast.
  - date: 2026-09-17
    kind: feature
    es:
      title: eventDetails nombra source y trigger
      body: >-
        <code>eventDetails</code> declara <code>source</code> (parte que despacha el CustomEvent) y, cuando es claro, <code>trigger</code> (parte que el usuario activa). Un agente sabe dónde escuchar y qué control provoca el evento.
    en:
      title: eventDetails names source and trigger
      body: >-
        <code>eventDetails</code> declares <code>source</code> (part that dispatches the CustomEvent) and, when clear, <code>trigger</code> (part the user activates). An agent knows where to listen and which control causes the event.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-09-17
    kind: feature
    es:
      title: El contrato declara los eventos de preferencia del documento
      body: >-
        <code>events.bindingChange</code> y <code>events.screenChange</code> documentan los
        CustomEvent que el enhancer completo publica en <code>document</code> cuando cambia Vanilla|
        React o el preset de pantalla. <code>ComponentPreview.bare</code> no los dispara; siguen
        siendo el canal DOM de la familia. React tipa <code>title</code>/<code>note</code> como
        string, alineado con los slots de texto.
    en:
      title: The contract declares the document preference events
      body: >-
        <code>events.bindingChange</code> and <code>events.screenChange</code> document the
        CustomEvents the full enhancer publishes on <code>document</code> when Vanilla|React or the
        screen preset changes. <code>ComponentPreview.bare</code> does not fire them; they remain
        the family's DOM channel. React types <code>title</code>/<code>note</code> as string, matching
        the text slots.
  - date: 2026-08-11
    kind: feature
    es:
      title: ComponentPreview se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>ComponentPreview.bare</code>: los dos bindings lo realizan, y la
        referencia de esta página sale del contrato compilado en vez de prosa escrita al lado. El
        binding Vanilla monta sobre <code>data-sk-component-preview</code>: el markup se autora y el
        enhancer lo hidrata, así que lo que no necesita JavaScript funciona antes de que corra ninguno.
        No tiene opciones: el elemento ES el significado. La hoja es
        <code>components/component-preview.css</code>.
    en:
      title: ComponentPreview is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>ComponentPreview.bare</code>: both bindings realize it, and
        this page's reference is rendered from the compiled contract rather than from prose written
        beside it. The Vanilla binding mounts on <code>data-sk-component-preview</code>: the markup is
        authored and the enhancer hydrates it, so whatever needs no JavaScript works before any runs. It
        has no options: the element IS the meaning. Its stylesheet is
        <code>components/component-preview.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de component-preview quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>30</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: component-preview's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>30</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
