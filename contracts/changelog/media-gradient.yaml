# What changed in media-gradient, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "6bf3352bc4099ae9"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: MediaGradient se publica como contrato, con 2 signatures
      body: >-
        Entra al catálogo con <code>MediaCaption</code>, <code>MediaGradient</code>: los dos bindings lo
        realizan, y la referencia de esta página sale del contrato compilado en vez de prosa escrita al
        lado. No tiene enhancer: el markup está completo por sí solo, así que las dos bindings son el
        mismo markup dos veces. Opciones: <code>edge</code>, <code>strength</code>. La hoja es
        <code>patterns/media-gradient.css</code>.
    en:
      title: MediaGradient is published as a contract, with 2 signatures
      body: >-
        It joins the catalogue with <code>MediaCaption</code>, <code>MediaGradient</code>: both bindings
        realize it, and this page's reference is rendered from the compiled contract rather than from
        prose written beside it. There is no enhancer: the markup is complete on its own, so both
        bindings are the same markup twice. Options: <code>edge</code>, <code>strength</code>. Its
        stylesheet is <code>patterns/media-gradient.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de media-gradient quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>12</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: media-gradient's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>12</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-12
    kind: bugfix
    es:
      title: La lista de styling hooks deja de reclamar los de otros componentes
      body: >-
        La entrada anterior publico esta lista de mas. Se genero contando todo <code>--sk-*</code>
        que la hoja <em>declara</em>, y afinar el hook de otro componente dentro del propio scope
        contaba como publicarlo: diecisiete contratos terminaron reclamando
        <code>--sk-icon-size</code>. Ahora un hook pertenece a quien lo declara sin nombrar otra
        familia. Ningun estilo cambia; cambia de quien se dice que es cada hook.
    en:
      title: The styling hook list stops claiming other components' hooks
      body: >-
        The previous entry over-published this list. It was generated by counting every
        <code>--sk-*</code> the stylesheet <em>declares</em>, and tuning another component's hook
        inside your own scope counted as publishing it: seventeen contracts ended up claiming
        <code>--sk-icon-size</code>. A hook now belongs to whichever sheet declares it without
        naming another family. No styling changes; what changes is whose each hook is said to be.
