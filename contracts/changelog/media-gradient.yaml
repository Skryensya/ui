# What changed in media-gradient, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "08840b8578a6d86a"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: MediaGradient se publica como contrato, con 2 signatures
      body: >-
        Entra al catálogo con <code>MediaCaption</code>, <code>MediaGradient</code>: los dos bindings lo
        realizan, y la referencia de esta página sale del contrato compilado en vez de prosa escrita al
        lado. No tiene enhancer: el markup está completo por sí solo, así que las dos bindings son el
        mismo markup dos veces. Opciones: <code>edge</code>, <code>strength</code>. La hoja es
        <code>patterns/media-gradient.css</code>.
    en:
      title: MediaGradient is published as a contract, with 2 signatures
      body: >-
        It joins the catalogue with <code>MediaCaption</code>, <code>MediaGradient</code>: both bindings
        realize it, and this page's reference is rendered from the compiled contract rather than from
        prose written beside it. There is no enhancer: the markup is complete on its own, so both
        bindings are the same markup twice. Options: <code>edge</code>, <code>strength</code>. Its
        stylesheet is <code>patterns/media-gradient.css</code>.