# What changed in select, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "61153803ebe43898"
entries:
  - date: 2026-09-17
    kind: feature
    target: Select
    es:
      title: Select declara forward para id y aria-*
      body: >-
        La firma enhanced publica <code>forward</code> con <code>id</code>/<code>aria-*</code> (además de Select.native). Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: Select declares forward for id and aria-*
      body: >-
        The enhanced signature publishes <code>forward</code> with <code>id</code>/<code>aria-*</code> (alongside Select.native). An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: feature
    es:
      title: portals declara container de React
      body: >-
        <code>portals: { container: true }</code> documenta el ref React-only que acota el portal (por defecto <code>document.body</code>). El markup sigue anclado en el subárbol.
    en:
      title: portals declares the React container
      body: >-
        <code>portals: { container: true }</code> documents the React-only ref that scopes the portal (default <code>document.body</code>). Markup stays in the subtree.
  - date: 2026-09-17
    kind: feature
    es:
      title: eventDetails nombra source y trigger
      body: >-
        <code>eventDetails</code> declara <code>source</code> (parte que despacha el CustomEvent) y, cuando es claro, <code>trigger</code> (parte que el usuario activa). Un agente sabe dónde escuchar y qué control provoca el evento.
    en:
      title: eventDetails names source and trigger
      body: >-
        <code>eventDetails</code> declares <code>source</code> (part that dispatches the CustomEvent) and, when clear, <code>trigger</code> (part the user activates). An agent knows where to listen and which control causes the event.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-09-17
    kind: feature
    target: Select.native
    es:
      title: Select.native declara forward para attrs nativos restantes
      body: >-
        <code>name</code>/<code>value</code>/<code>disabled</code>/<code>required</code> siguen
        siendo opciones. <code>forward</code> lista <code>id</code>/<code>form</code>/
        <code>autocomplete</code> y <code>aria-*</code>.
    en:
      title: Select.native declares forward for remaining native attrs
      body: >-
        <code>name</code>/<code>value</code>/<code>disabled</code>/<code>required</code> stay
        options. <code>forward</code> lists <code>id</code>/<code>form</code>/
        <code>autocomplete</code> and <code>aria-*</code>.
  - date: 2026-09-17
    kind: feature
    es:
      title: Select declara anchored y Select.native acepta valor inicial
      body: >-
        El contrato publica <code>hookSheets</code> de <code>anchored.css</code> (el listbox
        compone <code>sk-anchor</code>/<code>sk-anchored</code>) y los hooks
        <code>--sk-anchored-*</code>. <code>Select.native</code> acepta <code>value</code> con
        <code>selected</code> en la opción, y emite <code>disabled</code>/<code>required</code>
        reales en vez de <code>data-*</code>. React despacha <code>sk:selectvaluechange</code> y
        sella los mounts.
    en:
      title: Select declares anchored sheets and Select.native takes an initial value
      body: >-
        The contract publishes <code>anchored.css</code> via <code>hookSheets</code> (the listbox
        composes <code>sk-anchor</code>/<code>sk-anchored</code>) and the
        <code>--sk-anchored-*</code> hooks. <code>Select.native</code> accepts <code>value</code>
        with <code>selected</code> on the matching option, and emits real
        <code>disabled</code>/<code>required</code> instead of <code>data-*</code>. React dispatches
        <code>sk:selectvaluechange</code> and stamps the mounts.
  - date: 2026-09-13
    kind: bugfix
    target: placeholder
    es:
      title: El placeholder por defecto es vacío en ambos bindings
      body: >-
        React inventaba <code>"Select option"</code> y Vanilla usaba <code>""</code> cuando el autor
        no pasaba <code>placeholder</code>. El contrato ahora fija el default en <code>""</code>, y
        los dos bindings lo leen igual: sin texto inventado en inglés.
    en:
      title: The default placeholder is empty in both bindings
      body: >-
        React invented <code>"Select option"</code> and Vanilla used <code>""</code> when the author
        passed no <code>placeholder</code>. The contract now owns the default as <code>""</code>, and
        both bindings read the same one: no invented English copy.
  - date: 2026-08-24
    kind: bugfix
    target: item
    es:
      title: Navegar el listbox con el teclado ahora muestra dónde estás
      body: >-
        Antes no mostraba nada: <code>@zag-js/select</code> marca la fila que las flechas resaltan
        con <code>data-highlighted</code>, pero ninguna regla de <code>select.css</code> lo leía -
        ni tinte ni anillo. Porque el foco real nunca llega ahí (foco virtual,
        <code>aria-activedescendant</code>, igual que <code>Menu</code>). Ahora el resaltado se
        conecta a la capa de estado compartida (mismo mecanismo que <code>Menu</code>/
        <code>TreeView</code>) y, cuando lo puso el teclado y no el puntero
        (<code>[data-highlighted]:not(:hover)</code>), pinta además el mismo anillo de foco.
    en:
      title: Navigating the listbox by keyboard now shows where you are
      body: >-
        It used to show nothing: <code>@zag-js/select</code> marks the row the arrow keys highlight
        with <code>data-highlighted</code>, but no rule in <code>select.css</code> read it: no
        tint, no ring, because real focus never reaches it (virtual focus,
        <code>aria-activedescendant</code>, same as <code>Menu</code>). The highlight now feeds the
        shared state layer (the same mechanism <code>Menu</code>/<code>TreeView</code> already use)
        and, when the keyboard put it there rather than the pointer
        (<code>[data-highlighted]:not(:hover)</code>), also paints the same focus ring.
  - date: 2026-08-11
    kind: feature
    es:
      title: Select se publica como contrato, con 2 signatures
      body: >-
        Entra al catálogo con <code>Select.native</code>, <code>Select</code>: los dos bindings lo
        realizan, y la referencia de esta página sale del contrato compilado en vez de prosa escrita al
        lado. El binding Vanilla monta sobre <code>data-sk-select</code>: el markup se autora y el
        enhancer lo hidrata, así que lo que no necesita JavaScript funciona antes de que corra ninguno.
        Opciones: <code>name</code>, <code>value</code>, <code>placeholder</code>,
        <code>disabled</code>, <code>required</code>. La hoja es <code>components/select.css</code>.
    en:
      title: Select is published as a contract, with 2 signatures
      body: >-
        It joins the catalogue with <code>Select.native</code>, <code>Select</code>: both bindings
        realize it, and this page's reference is rendered from the compiled contract rather than from
        prose written beside it. The Vanilla binding mounts on <code>data-sk-select</code>: the markup
        is authored and the enhancer hydrates it, so whatever needs no JavaScript works before any runs.
        Options: <code>name</code>, <code>value</code>, <code>placeholder</code>, <code>disabled</code>,
        <code>required</code>. Its stylesheet is <code>components/select.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de select quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>31</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: select's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>31</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-16
    kind: bugfix
    es:
      title: El validador comprueba que el valor inicial nombre una entrada que existe
      body: >-
        <code>value</code> ahora declara que nombra entradas de <code>items</code> por su
        <code>value</code>. Un árbol que apunta a una entrada inexistente deja de validar
        (<code>unknown-key</code>) en vez de renderizar sin nada seleccionado ni decir por qué. El
        markup y los bindings no cambian.
    en:
      title: The validator checks that the initial value names an entry that exist
      body: >-
        <code>value</code> now declares that it names entries of <code>items</code> by their
        <code>value</code>. A tree pointing at an entry that does not exist stops validating
        (<code>unknown-key</code>) instead of rendering with nothing selected and no reason given.
        Markup and bindings are unchanged.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Cada evento lleva el nombre de su familia
      body: >-
        <code>sk-value-change</code> → <code>sk:selectvaluechange</code>. Un mismo nombre ya no lo despachan varias familias: un listener sobre una raíz deja
        de recibir los eventos de un componente distinto anidado adentro. El contrato ahora los declara en <code>events</code>, así que el compilador los publica.
    en:
      title: Every event carries its family in its name
      body: >-
        <code>sk-value-change</code> → <code>sk:selectvaluechange</code>. No two families dispatch the same name any more: a listener on a root stops receiving
        the events of a different component nested inside it. The contract now declares them in <code>events</code>, so the compiler publishes them.
  - date: 2026-09-20
    kind: bugfix
    target: control
    es:
      title: La etiqueta vuelve a separarse del trigger
      body: >-
        <code>.sk-select</code> declaraba <code>gap: --space-stack-xs</code>, pero sus únicos dos
        hijos son <code>control</code> y el positioner, y el positioner está fuera de flujo: el
        gap no tenía sobre qué actuar. La etiqueta y el trigger viven dentro de
        <code>control</code>, donde ese gap nunca llegaba, y quedaban a 3px de puro interlineado.
        <code>control</code> ahora es la pila, así que la separación es la que el contrato ya
        declaraba. Markup y bindings no cambian.
    en:
      title: The label is spaced from the trigger again
      body: >-
        <code>.sk-select</code> declared <code>gap: --space-stack-xs</code>, but its only two
        children are <code>control</code> and the positioner, and the positioner is out of flow, so
        the gap had nothing to act on. The label and the trigger live inside <code>control</code>,
        where that gap never reached them, and sat 3px apart on line leading alone.
        <code>control</code> is now the stack, so the spacing is the one the contract already
        declared. Markup and bindings are unchanged.
