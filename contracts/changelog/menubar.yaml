# What changed in menubar, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "2baeb926e4fcd024"
entries:
  - date: 2026-10-02
    kind: breaking
    es:
      title: Se elimina la opción nav de MenubarItem
      body: "<code>MenubarItem</code> ya no acepta <code>nav</code>: el trigger es siempre un <code>Button</code> <code>ghost</code>."
    en:
      title: MenubarItem's nav option is removed
      body: "<code>MenubarItem</code> no longer accepts <code>nav</code>: the trigger is always a <code>ghost</code> <code>Button</code>."
  - date: 2026-10-02
    kind: bugfix
    es:
      title: El submenú de un desplegable de Menubar se coloca junto a su ítem
      body: Un desplegable con submenús (<code>Exportar</code> → PDF, CSV) abría el submenú lejos de su ítem, en la esquina de la página.
    en:
      title: A Menubar dropdown's submenu is placed beside its item
      body: A dropdown with submenus (<code>Export</code> → PDF, CSV) opened the submenu far from its item, in the corner of the page.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
