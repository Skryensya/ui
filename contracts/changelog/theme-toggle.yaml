# Qué cambió en theme-toggle, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribí la entrada y pegá el
# hash nuevo.
surface: "026056d1a30cefaa"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: ThemeToggle se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>ThemeToggle</code>: los dos bindings lo realizan, y la referencia de
        esta página sale del contrato compilado en vez de prosa escrita al lado. El binding Vanilla
        monta sobre <code>data-sk-theme-toggle</code>: el markup se autora y el enhancer lo hidrata, así
        que lo que no necesita JavaScript funciona antes de que corra ninguno. Opciones:
        <code>defaultValue</code>, <code>size</code>, <code>labelSystem</code>, <code>labelLight</code>,
        <code>labelDark</code>. La hoja es <code>components/theme-toggle.css</code>.
    en:
      title: ThemeToggle is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>ThemeToggle</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. The
        Vanilla binding mounts on <code>data-sk-theme-toggle</code>: the markup is authored and the
        enhancer hydrates it, so whatever needs no JavaScript works before any runs. Options:
        <code>defaultValue</code>, <code>size</code>, <code>labelSystem</code>, <code>labelLight</code>,
        <code>labelDark</code>. Its stylesheet is <code>components/theme-toggle.css</code>.