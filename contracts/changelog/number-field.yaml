# What changed in number-field, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "418c9231d8dfe7e7"
entries:
  - date: 2026-10-25
    kind: breaking
    target: appearance
    es:
      title: "Cada apariencia tiene su propia hoja"
      body: "Las reglas de `brutalist`, `frosted` pasan de number-field.css a number-field.brutalist.css, number-field.frosted.css. Importa la hoja del valor que uses; sin ella, ese valor no recibe su pintura. Los hooks siguen declarados en number-field.css."
    en:
      title: "Each appearance has its own stylesheet"
      body: "The rules for `brutalist`, `frosted` move from number-field.css to number-field.brutalist.css, number-field.frosted.css. Import the sheet for the value you use; without it, that value does not get its paint. The hooks are still declared in number-field.css."
  - date: 2026-10-02
    kind: bugfix
    es:
      title: El campo agrupa los miles y usa las marcas de su idioma
      body: Sin <code>formatOptions</code>, el campo escribía los dígitos desnudos (<code>1234567.89</code>) en cualquier idioma, así que <code>locale</code> no cambiaba nada visible aunque la documentación decía que formateaba miles y decimales.
    en:
      title: The field groups thousands and uses its language's marks
      body: With no <code>formatOptions</code> the field wrote bare digits (<code>1234567.89</code>) in every language, so <code>locale</code> changed nothing a person could see even though the docs said it formatted thousands and decimals.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
