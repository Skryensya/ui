# What changed in number-field, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "62765e948f8ffa10"
entries:
  - date: 2026-10-02
    kind: bugfix
    es:
      title: El campo agrupa los miles y usa las marcas de su idioma
      body: Sin <code>formatOptions</code>, el campo escribía los dígitos desnudos (<code>1234567.89</code>) en cualquier idioma, así que <code>locale</code> no cambiaba nada visible aunque la documentación decía que formateaba miles y decimales.
    en:
      title: The field groups thousands and uses its language's marks
      body: With no <code>formatOptions</code> the field wrote bare digits (<code>1234567.89</code>) in every language, so <code>locale</code> changed nothing a person could see even though the docs said it formatted thousands and decimals.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: Captura cantidades con límites y controles incrementales.
    en:
      title: First release
      body: Captures quantities with limits and step controls.
