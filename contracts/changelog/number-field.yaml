# What changed in number-field, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "02f9b268bbaad74e"
entries:
  - date: 2026-09-17
    kind: feature
    target: NumberField
    es:
      title: NumberField declara forward para id y aria-*
      body: >-
        Publica <code>forward</code> con <code>id</code>/<code>aria-*</code> en el host. Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: NumberField declares forward for id and aria-*
      body: >-
        Publishes <code>forward</code> with <code>id</code>/<code>aria-*</code> on the host. An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: feature
    es:
      title: eventDetails nombra source y trigger
      body: >-
        <code>eventDetails</code> declara <code>source</code> (parte que despacha el CustomEvent) y, cuando es claro, <code>trigger</code> (parte que el usuario activa). Un agente sabe dónde escuchar y qué control provoca el evento.
    en:
      title: eventDetails names source and trigger
      body: >-
        <code>eventDetails</code> declares <code>source</code> (part that dispatches the CustomEvent) and, when clear, <code>trigger</code> (part the user activates). An agent knows where to listen and which control causes the event.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-09-17
    kind: feature
    es:
      title: NumberField declara compose de Button
      body: >-
        <code>compose</code> documenta increment/decrement vía <code>also: sk-button</code> (<code>systemOwned</code>).
    en:
      title: NumberField declares compose of Button
      body: >-
        <code>compose</code> documents increment/decrement via <code>also: sk-button</code> (<code>systemOwned</code>).
  - date: 2026-09-17
    kind: bugfix
    target: min
    es:
      title: min y max se acotan entre sí
      body: >-
        <code>min</code> lleva <code>between.max: max</code> y <code>max</code> lleva
        <code>between.min: min</code>. Un piso por encima del techo deja de validar.
    en:
      title: min and max bound each other
      body: >-
        <code>min</code> carries <code>between.max: max</code> and <code>max</code> carries
        <code>between.min: min</code>. A floor above the ceiling stops validating.
  - date: 2026-08-11
    kind: feature
    es:
      title: NumberField se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>NumberField</code>: los dos bindings lo realizan, y la referencia de
        esta página sale del contrato compilado en vez de prosa escrita al lado. El binding Vanilla
        monta sobre <code>data-sk-number-field</code>: el markup se autora y el enhancer lo hidrata, así
        que lo que no necesita JavaScript funciona antes de que corra ninguno. Opciones:
        <code>name</code>, <code>defaultValue</code>, <code>locale</code>, <code>min</code>,
        <code>max</code>, <code>step</code>, <code>disabled</code>, <code>readOnly</code>,
        <code>required</code>, <code>decrementLabel</code>, <code>incrementLabel</code>. La hoja es
        <code>components/number-field.css</code>.
    en:
      title: NumberField is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>NumberField</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. The
        Vanilla binding mounts on <code>data-sk-number-field</code>: the markup is authored and the
        enhancer hydrates it, so whatever needs no JavaScript works before any runs. Options:
        <code>name</code>, <code>defaultValue</code>, <code>locale</code>, <code>min</code>,
        <code>max</code>, <code>step</code>, <code>disabled</code>, <code>readOnly</code>,
        <code>required</code>, <code>decrementLabel</code>, <code>incrementLabel</code>. Its stylesheet
        is <code>components/number-field.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de number-field quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>20</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: number-field's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>20</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Cada evento lleva el nombre de su familia
      body: >-
        <code>sk-value-change</code> → <code>sk:numberfieldvaluechange</code>. Un mismo nombre ya no lo despachan varias familias: un listener sobre una raíz deja
        de recibir los eventos de un componente distinto anidado adentro. El contrato ahora los declara en <code>events</code>, así que el compilador los publica.
    en:
      title: Every event carries its family in its name
      body: >-
        <code>sk-value-change</code> → <code>sk:numberfieldvaluechange</code>. No two families dispatch the same name any more: a listener on a root stops receiving
        the events of a different component nested inside it. The contract now declares them in <code>events</code>, so the compiler publishes them.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Invalid, hint y locale quedan en el contrato; se elimina scrubber
      body: >-
        <code>invalid</code> pinta <code>data-invalid</code> y alimenta el machine; <code>hint</code> es un slot de texto opcional;
        <code>locale</code> default <code>es</code>. Se quita la part <code>scrubber</code>, que el template nunca usó. React despacha
        <code>sk:numberfieldvaluechange</code> igual que Vanilla.
    en:
      title: Invalid, hint, and locale land on the contract; scrubber drops
      body: >-
        <code>invalid</code> paints <code>data-invalid</code> and feeds the machine; <code>hint</code> is an optional text slot;
        <code>locale</code> defaults to <code>es</code>. The unused <code>scrubber</code> part is removed. React dispatches
        <code>sk:numberfieldvaluechange</code> the same way Vanilla does.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Los textos por defecto pasan a inglés
      body: >-
        El kit es una librería en inglés y sus defaults estaban en español: <code>locale</code> en, <code>decrementLabel</code> Decrease, <code>incrementLabel</code> Increase. Una interfaz en
        otro idioma pasa sus propios textos, y el <code>locale</code> que corresponda.
    en:
      title: Default texts move to English
      body: >-
        The kit is an English library and its defaults were Spanish: <code>locale</code> en, <code>decrementLabel</code> Decrease, <code>incrementLabel</code> Increase. An interface in another
        language passes its own texts, and the <code>locale</code> it needs.
