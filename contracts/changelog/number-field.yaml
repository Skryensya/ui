# What changed in number-field, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "f8457de298ad2e5b"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: NumberField se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>NumberField</code>: los dos bindings lo realizan, y la referencia de
        esta página sale del contrato compilado en vez de prosa escrita al lado. El binding Vanilla
        monta sobre <code>data-sk-number-field</code>: el markup se autora y el enhancer lo hidrata, así
        que lo que no necesita JavaScript funciona antes de que corra ninguno. Opciones:
        <code>name</code>, <code>defaultValue</code>, <code>locale</code>, <code>min</code>,
        <code>max</code>, <code>step</code>, <code>disabled</code>, <code>readOnly</code>,
        <code>required</code>, <code>decrementLabel</code>, <code>incrementLabel</code>. La hoja es
        <code>components/number-field.css</code>.
    en:
      title: NumberField is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>NumberField</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. The
        Vanilla binding mounts on <code>data-sk-number-field</code>: the markup is authored and the
        enhancer hydrates it, so whatever needs no JavaScript works before any runs. Options:
        <code>name</code>, <code>defaultValue</code>, <code>locale</code>, <code>min</code>,
        <code>max</code>, <code>step</code>, <code>disabled</code>, <code>readOnly</code>,
        <code>required</code>, <code>decrementLabel</code>, <code>incrementLabel</code>. Its stylesheet
        is <code>components/number-field.css</code>.