# Entries that are ONE change across several contracts.
#
# The Surface hash is per contract, so a change identical across many of them used to force one
# near-identical entry per contract. The hashes still move one by one, because each contract's
# surface really did change; what stops repeating is the prose a reader has to wade through.
#
# An entry here is an ordinary entry plus `contracts:`, and it is appended to each of those
# contracts' own changelogs and validated against every one of them.
entries:
  - date: 2026-09-12
    kind: bugfix
    contracts:
      - accordion
      - annotation
      - breadcrumb
      - button
      - calendar
      - checkbox
      - color-picker
      - combobox
      - command-palette
      - comment-thread
      - component-preview
      - content
      - date-picker
      - editor
      - state-button
      - media-gradient
      - megamenu
      - menu
      - menubar
      - number-field
      - pagination
      - popover
      - qr-code
      - radio-group
      - select
      - sidebar
      - split-button
      - stat
      - switch
      - table-pager
      - table
      - tag
      - tile
      - time-field
      - tooltip
      - tree-view
    es:
      title: La lista de styling hooks deja de reclamar los de otros componentes
      body: >-
        El lote anterior publico estas listas de mas. Se generaron contando todo <code>--sk-*</code> que
        la hoja <em>declara</em>, y afinar el hook de otro componente dentro del propio scope contaba
        como publicarlo: diecisiete contratos terminaron reclamando <code>--sk-icon-size</code>. Ahora
        un hook pertenece a la hoja que lo declara sin nombrar otra familia, y el gate usa esa misma
        regla. Ningun estilo cambia; cambia de quien se dice que es cada hook.
    en:
      title: The styling hook list stops claiming other components' hooks
      body: >-
        The previous batch over-published these lists. They were generated by counting every
        <code>--sk-*</code> a stylesheet <em>declares</em>, and tuning another component's hook inside
        your own scope counted as publishing it: seventeen contracts ended up claiming
        <code>--sk-icon-size</code>. A hook now belongs to the sheet that declares it without naming
        another family, and the gate uses that same rule. No styling changes; what changes is whose
        each hook is said to be.
