entries:
  - date: 2026-10-02
    kind: rework
    es:
      title: El brillo cruza todas las formas como una sola banda, más lento
      body: Antes cada barra barría su propio ancho, así que una columna de anchos distintos nunca brillaba a la vez. Ahora el brillo es una banda anclada al viewport y todas las formas muestran el mismo trozo de ella.
    en:
      title: The shimmer crosses every shape as one band, and slower
      body: Each bar used to sweep its own width, so a column of different widths never lit up together. The shimmer is now a band anchored to the viewport and every shape shows the same slice of it.
  - date: 2026-10-01
