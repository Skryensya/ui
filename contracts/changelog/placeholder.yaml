    es:
      title: Placeholder se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Placeholder</code>: los dos bindings lo realizan, y la referencia de
        esta página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el
        markup está completo por sí solo, así que las dos bindings son el mismo markup dos veces.
        Opciones: <code>shape</code>. La hoja es <code>components/placeholder.css</code>.
    en:
      title: Placeholder is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Placeholder</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        Options: <code>shape</code>. Its stylesheet is <code>components/placeholder.css</code>.