# Qué cambió en back-to-top, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribí la entrada y pegá el
# hash nuevo.
surface: "ba22a36f4cc90547"
entries:
  - date: 2026-09-02
    kind: feature
    es:
      title: BackToTop se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>BackToTop</code>: un <code>&lt;button&gt;</code> que se fija a una
        esquina y devuelve un scroller a su inicio. Aparece sólo después de pasar <code>threshold</code>
        píxeles de scroll (400 por defecto) y se va sola al volver arriba; el markup viene con
        <code>hidden</code>, así que sin JavaScript no ocupa lugar. La marca visible es un
        <code>chevron-up</code> del set de iconos enlazado (el markup autorado emite el placeholder
        <code>[data-sk-icon]</code> que el enhancer reemplaza por el <code>&lt;svg&gt;</code> del set;
        React usa <code>&lt;Icon&gt;</code>), dentro de la parte <code>sk-back-to-top__icon</code>. El
        scroll lo hace la plataforma (<code>scrollTo</code>), suave salvo que se pida menos
        movimiento. Opciones: <code>threshold</code>, <code>scroller</code> (un selector para un panel
        con overflow propio, en vez de la ventana) y <code>target</code> (un selector de algo
        enfocable arriba al que mover el foco después del scroll, para que el siguiente Tab siga desde
        el principio). La parte pura (si pasó el umbral, si la animación se atenúa) vive en
        <code>@skryensya/core/back-to-top</code> y la comparten las dos bindings. La hoja es
        <code>components/back-to-top.css</code>.
    en:
      title: BackToTop is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>BackToTop</code>: a <code>&lt;button&gt;</code> pinned to a
        corner that returns a scroller to its start. It appears only after the reader is
        <code>threshold</code> pixels past the top (400 by default) and hides again on the way back;
        the markup ships <code>hidden</code>, so with no JavaScript it takes no corner. The visible
        mark is a <code>chevron-up</code> from the bound icon set (authored markup emits the
        <code>[data-sk-icon]</code> placeholder the enhancer swaps for the set's <code>&lt;svg&gt;</code>;
        React renders <code>&lt;Icon&gt;</code>), inside the <code>sk-back-to-top__icon</code> part.
        The scroll is the platform's (<code>scrollTo</code>), smooth unless the reader asked for less
        motion. Options: <code>threshold</code>, <code>scroller</code> (a selector for an inner
        <code>overflow</code> pane instead of the window) and <code>target</code> (a selector for a
        focusable element up top to move focus to after the scroll, so the next Tab continues from
        the start). The pure half - past the threshold?, does the scroll animate? - lives in
        <code>@skryensya/core/back-to-top</code> and both bindings share it. Its stylesheet is
        <code>components/back-to-top.css</code>.
