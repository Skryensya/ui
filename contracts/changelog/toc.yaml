surface: "7f08ba9e45e99483"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: Toc se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Toc</code>: los dos bindings lo realizan, y la referencia de esta
        página sale del contrato compilado en vez de prosa escrita al lado. El binding Vanilla monta
        sobre <code>data-sk-toc</code>: el markup se autora y el enhancer lo hidrata, así que lo que no
        necesita JavaScript funciona antes de que corra ninguno. Opciones: <code>title</code>. La hoja
        es <code>components/toc.css</code>.
    en:
      title: Toc is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Toc</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. The
        Vanilla binding mounts on <code>data-sk-toc</code>: the markup is authored and the enhancer
        hydrates it, so whatever needs no JavaScript works before any runs. Options: <code>title</code>.
        Its stylesheet is <code>components/toc.css</code>.