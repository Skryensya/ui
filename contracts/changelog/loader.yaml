# Qué cambió en loader, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribí la entrada y pegá el
# hash nuevo.
surface: "4b29f6d84735a1cc"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: Loader se publica como contrato, con 2 signatures
      body: >-
        Entra al catálogo con <code>Loader</code>, <code>Loader.status</code>: los dos bindings lo
        realizan, y la referencia de esta página sale del contrato compilado en vez de prosa escrita al
        lado. No tiene enhancer: el markup está completo por sí solo, así que las dos bindings son el
        mismo markup dos veces. Opciones: <code>size</code>, <code>variant</code>, <code>speed</code>,
        <code>label</code>. La hoja es <code>components/loader.css</code>.
    en:
      title: Loader is published as a contract, with 2 signatures
      body: >-
        It joins the catalogue with <code>Loader</code>, <code>Loader.status</code>: both bindings
        realize it, and this page's reference is rendered from the compiled contract rather than from
        prose written beside it. There is no enhancer: the markup is complete on its own, so both
        bindings are the same markup twice. Options: <code>size</code>, <code>variant</code>,
        <code>speed</code>, <code>label</code>. Its stylesheet is <code>components/loader.css</code>.