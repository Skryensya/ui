# What changed in time-field, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "d95840262122355f"
entries:
  - date: 2026-09-17
    kind: feature
    es:
      title: Firmas interactivas declaran forward
      body: >-
        Las firmas host interactivas o de formulario publican <code>forward</code>
        (<code>id</code>/<code>aria-*</code> y attrs de enlace o formulario cuando aplica).
        Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: Interactive signatures declare forward
      body: >-
        Interactive or form host signatures publish <code>forward</code>
        (<code>id</code>/<code>aria-*</code> and link or form attrs where relevant).
        An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: feature
    es:
      title: portals declara container de React
      body: >-
        <code>portals: { container: true }</code> documenta el ref React-only que acota el portal (por defecto <code>document.body</code>). El markup sigue anclado en el subárbol.
    en:
      title: portals declares the React container
      body: >-
        <code>portals: { container: true }</code> documents the React-only ref that scopes the portal (default <code>document.body</code>). Markup stays in the subtree.
  - date: 2026-09-17
    kind: feature
    es:
      title: eventDetails nombra source y trigger
      body: >-
        <code>eventDetails</code> declara <code>source</code> (parte que despacha el CustomEvent) y, cuando es claro, <code>trigger</code> (parte que el usuario activa). Un agente sabe dónde escuchar y qué control provoca el evento.
    en:
      title: eventDetails names source and trigger
      body: >-
        <code>eventDetails</code> declares <code>source</code> (part that dispatches the CustomEvent) and, when clear, <code>trigger</code> (part the user activates). An agent knows where to listen and which control causes the event.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: El listbox de presets carga select.css y anchored.css
      body: >-
        <code>hookSheets</code> nombra <code>components/select.css</code> y
        <code>patterns/anchored.css</code>, y el contrato publica los hooks de ambas. Un árbol de
        TimeField ya no depende de que la página importe esas hojas a mano. React tipa
        <code>label</code> y <code>hint</code> como texto, igual que el slot del contrato.
    en:
      title: The preset listbox loads select.css and anchored.css
      body: >-
        <code>hookSheets</code> names <code>components/select.css</code> and
        <code>patterns/anchored.css</code>, and the contract publishes both sheets' hooks. A
        TimeField tree no longer depends on the page importing those sheets by hand. React types
        <code>label</code> and <code>hint</code> as text, matching the contract slots.
  - date: 2026-08-18
    kind: feature
    es:
      title: TimeField siempre incluye un desplegable de horarios preestablecidos
      body: >-
        Ya no hay una variante "sólo segmentos": todo <code>TimeField</code> pinta, además de los
        segmentos, un botón de reloj DENTRO de <code>.sk-time-field__control</code> (una sola caja
        con borde, la misma anatomía que ya tiene el control de Combobox para sus propios botones
        finales) que abre una lista simple de horarios, sin buscador, navegable con flechas -
        <code>@zag-js/select</code> maneja esa máquina directamente (la misma que usa
        <code>Select</code>), sin montar el componente <code>Select</code> completo, que trae su
        propio trigger visible y hubiera significado dos clics para llegar a la lista. Dos
        opciones nuevas en el contrato: <code>optionsStep</code> (número de minutos entre cada
        fila, <code>30</code> por defecto: 48 filas) y <code>optionsLabel</code> (el nombre
        accesible del botón, distinto del label del campo: <code>"Elegir de la lista"</code> por
        defecto). <code>Alt+Flecha-abajo</code> desde cualquier segmento abre la lista sin pasar
        por Tab, la misma tecla que ya abre un <code>&lt;select&gt;</code> nativo; Flecha-abajo
        sola sigue sin tocarla, decrementa el segmento enfocado como siempre. El binding Vanilla ya
        no necesita una segunda pieza (<code>@skryensya/vanilla/time-field-options</code>, ahora
        eliminada): <code>data-sk-time-field</code> por sí solo genera el desplegable, igual que ya
        genera los segmentos a partir del locale. La lista del desplegable se porta afuera del
        campo (React la manda a <code>document.body</code> por defecto, con la nueva prop
        <code>container</code> para acotarla a otro elemento; Vanilla la deja donde está, ubicada
        por anclaje CSS). El mismo split que ya tienen Select y Combobox.
    en:
      title: TimeField always includes a preset-times dropdown
      body: >-
        There is no more "segments-only" variant: every <code>TimeField</code> now paints, besides
        the segments, a clock button INSIDE <code>.sk-time-field__control</code> (one bordered
        box, the same anatomy Combobox's own control already has for its own trailing buttons)
        that opens a plain, search-free list of times, navigable with arrow keys -
        <code>@zag-js/select</code> drives that machine directly (the same one <code>Select</code>
        uses), without mounting the full <code>Select</code> component, which carries its own
        visible trigger and would have meant two clicks to reach the list. Two new contract
        options: <code>optionsStep</code> (minutes between each row, <code>30</code> by default -
        48 rows) and <code>optionsLabel</code> (the button's own accessible name, distinct from
        the field's label: <code>"Elegir de la lista"</code> by default).
        <code>Alt+ArrowDown</code> from any segment opens the list without tabbing there first, the
        same key that already opens a native <code>&lt;select&gt;</code>; plain ArrowDown alone
        still leaves it untouched, decrementing the focused segment as always. The Vanilla binding
        no longer needs a second piece (<code>@skryensya/vanilla/time-field-options</code>, now
        removed): <code>data-sk-time-field</code> on its own generates the dropdown too, the same
        way it already generates the segments from the locale. The dropdown's own list portals out
        of the field (React sends it to <code>document.body</code> by default, with a new
        <code>container</code> prop to scope it elsewhere; Vanilla leaves it in place, positioned
        by CSS anchoring). The same split Select and Combobox already have.
  - date: 2026-08-18
    kind: feature
    es:
      title: TimeField gana la opción hourCycle, para forzar 12 o 24 horas
      body: >-
        Nueva opción <code>hourCycle</code> (<code>"h12"</code> | <code>"h24"</code>), que pisa la
        detección automática por locale cuando se da. La detección (<code>getHourCycle</code>) lee
        <code>Intl.DateTimeFormat(locale, {hour:"numeric"}).resolvedOptions().hourCycle</code>, y ese
        dato resultó ser inconsistente entre motores: el mismo string de locale
        (<code>es</code>/<code>es-AR</code>) resuelve a ciclos opuestos en Node y en Chromium. Como el
        máximo del segmento de hora sale directo de ese ciclo, una detección equivocada no solo
        mostraba mal la hora: adelantaba el foco antes de tiempo al tipear un primer dígito ambiguo
        (un "2", que todavía podía volverse "22"). Omitida, el comportamiento no cambia.
    en:
      title: TimeField gains the hourCycle option, to force 12- or 24-hour form
      body: >-
        New <code>hourCycle</code> option (<code>"h12"</code> | <code>"h24"</code>), which overrides
        the locale-based auto-detection when given. That detection
        (<code>getHourCycle</code>) reads
        <code>Intl.DateTimeFormat(locale, {hour:"numeric"}).resolvedOptions().hourCycle</code>, and
        that value turned out to be inconsistent across engines: the same locale string
        (<code>es</code>/<code>es-AR</code>) resolves to opposite cycles in Node and in Chromium.
        Since the hour segment's own max comes straight from that cycle, a wrong guess did not just
        mislabel the hour: it advanced focus too early on an ambiguous first digit (a "2", which
        could still become "22"). Omitted, behavior is unchanged.
  - date: 2026-08-11
    kind: feature
    es:
      title: TimeField se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>TimeField</code>: los dos bindings lo realizan, y la referencia de
        esta página sale del contrato compilado en vez de prosa escrita al lado. El binding Vanilla
        monta sobre <code>data-sk-time-field</code>: el markup se autora y el enhancer lo hidrata, así
        que lo que no necesita JavaScript funciona antes de que corra ninguno. Opciones:
        <code>name</code>, <code>locale</code>, <code>value</code>, <code>minuteStep</code>,
        <code>disabled</code>, <code>readOnly</code>, <code>required</code>, <code>hourLabel</code>,
        <code>minuteLabel</code>, <code>periodLabel</code>, <code>clearLabel</code>. La hoja es
        <code>components/time-field.css</code>.
    en:
      title: TimeField is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>TimeField</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. The
        Vanilla binding mounts on <code>data-sk-time-field</code>: the markup is authored and the
        enhancer hydrates it, so whatever needs no JavaScript works before any runs. Options:
        <code>name</code>, <code>locale</code>, <code>value</code>, <code>minuteStep</code>,
        <code>disabled</code>, <code>readOnly</code>, <code>required</code>, <code>hourLabel</code>,
        <code>minuteLabel</code>, <code>periodLabel</code>, <code>clearLabel</code>. Its stylesheet is
        <code>components/time-field.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de time-field quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>22</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: time-field's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>22</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Cada evento lleva el nombre de su familia
      body: >-
        <code>sk-value-change</code> → <code>sk:timefieldvaluechange</code>. Un mismo nombre ya no lo despachan varias familias: un listener sobre una raíz deja
        de recibir los eventos de un componente distinto anidado adentro. El contrato ahora los declara en <code>events</code>, así que el compilador los publica.
    en:
      title: Every event carries its family in its name
      body: >-
        <code>sk-value-change</code> → <code>sk:timefieldvaluechange</code>. No two families dispatch the same name any more: a listener on a root stops receiving
        the events of a different component nested inside it. The contract now declares them in <code>events</code>, so the compiler publishes them.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: El contrato declara el rango de sus números
      body: >-
        <code>minuteStep</code> va de 1 a 59 y <code>optionsStep</code> de 1 a 720, ambos enteros. Un valor fuera de rango deja de validar en vez de llegar al binding.
    en:
      title: The contract declares the range of its numbers
      body: >-
        <code>minuteStep</code> goes from 1 to 59 and <code>optionsStep</code> from 1 to 720, both whole numbers. A value out of range stops validating instead of reaching the binding.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: El error se anuncia y el valor inicial se valida
      body: >-
        <code>invalid</code> entra al contrato (<code>data-invalid</code>). React ya lo pintaba, pero
        ningún binding lo anunciaba: ahora cada segmento lleva <code>aria-invalid</code>, y también
        <code>aria-readonly</code> cuando corresponde. <code>value</code> declara su formato
        <code>HH:mm</code> con la misma expresión del parser, así que un <code>"9.30"</code> deja de
        validar en vez de arrancar en blanco.
    en:
      title: The error is announced and the starting value is validated
      body: >-
        <code>invalid</code> joins the contract (<code>data-invalid</code>). React already painted it,
        but neither binding announced it: every segment now carries <code>aria-invalid</code>, and
        <code>aria-readonly</code> when it applies. <code>value</code> declares its <code>HH:mm</code>
        format with the parser's own expression, so a <code>"9.30"</code> stops validating instead of
        starting blank.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Los textos por defecto pasan a inglés
      body: >-
        El kit es una librería en inglés y sus defaults estaban en español: <code>locale</code> en, <code>hourLabel</code> Hour, <code>minuteLabel</code> Minute, <code>periodLabel</code> Period, <code>clearLabel</code> Clear time, <code>optionsLabel</code> Choose from list. Una interfaz en
        otro idioma pasa sus propios textos, y el <code>locale</code> que corresponda.
    en:
      title: Default texts move to English
      body: >-
        The kit is an English library and its defaults were Spanish: <code>locale</code> en, <code>hourLabel</code> Hour, <code>minuteLabel</code> Minute, <code>periodLabel</code> Period, <code>clearLabel</code> Clear time, <code>optionsLabel</code> Choose from list. An interface in another
        language passes its own texts, and the <code>locale</code> it needs.
