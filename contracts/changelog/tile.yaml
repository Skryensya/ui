# What changed in tile, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "00533a54468128d6"
entries:
  - date: 2026-09-26
    kind: bugfix
    target: TileRadioGroup
    es:
      title: Las partes renombradas del grupo de radios quedan en el scope tile
      body: >-
        <code>content</code> e <code>indicator</code> ya estaban renombradas al vocabulario de Tile pero seguían con
        <code>data-scope="radio-group"</code>, nombrando partes que esa máquina no tiene. Ahora llevan <code>data-scope="tile"</code>, como la
        raíz y el item, en el template y en los dos bindings. Ningún selector las leía.
    en:
      title: The radio group's renamed parts move to the tile scope
      body: >-
        <code>content</code> and <code>indicator</code> were already renamed into Tile's vocabulary but kept
        <code>data-scope="radio-group"</code>, naming parts that machine does not have. They now carry <code>data-scope="tile"</code>, like
        the root and the item, in the template and in both bindings. No selector read them.
  - date: 2026-09-18
    kind: feature
    es:
      title: El peso del título del tile se puede retunear
      body: >-
        <code>--sk-tile-title-weight</code> se publica junto a <code>--sk-font-heading-sm</code>, que ya
        dejaba cambiar el tamaño. Quien encoge un tile a tamaño de fila (las opciones de
        <code>Questionnaire</code>) recibía 14px en peso <code>heading</code> y una respuesta que
        gritaba más fuerte que la pregunta. El valor por defecto no cambia.
    en:
      title: The tile title's weight can be retuned
      body: >-
        <code>--sk-tile-title-weight</code> is published beside <code>--sk-font-heading-sm</code>, which
        already let the size move. A caller shrinking a tile to row size (<code>Questionnaire</code>'s
        choices) got 14px at <code>heading</code> weight and an answer that shouted over the question
        asking it. The default is unchanged.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: Un grupo de radios sin elegir ya no se pinta como elegido
      body: >-
        El borde de seleccionado se pedía con <code>:has(&gt; input:indeterminate)</code>, y un radio
        es <code>:indeterminate</code> mientras ningún radio de su grupo está marcado: cada opción de
        un <code>TileRadioGroup</code> intacto nacía con el borde de elegida y sólo pasaba a gris
        cuando el lector elegía una. La regla ahora dice
        <code>input[type="checkbox"]:indeterminate</code>, que es el tercer estado que quería nombrar.
    en:
      title: An untouched radio group no longer paints as chosen
      body: >-
        The selected border was asked for with <code>:has(&gt; input:indeterminate)</code>, and a radio
        is <code>:indeterminate</code> while no radio in its group is checked: every option of an
        untouched <code>TileRadioGroup</code> started with the chosen border and only turned grey once
        the reader picked one. The rule now says <code>input[type="checkbox"]:indeterminate</code>,
        the third state it meant to name.
  - date: 2026-09-17
    kind: feature
    es:
      title: Los tiles aceptan que les fijen su valor
      body: >-
        <code>TileRadioGroup</code> y <code>TileCheckbox</code> escuchan
        <code>sk:tilesetvalue</code> y <code>sk:tilesetchecked</code>: una composición que es dueña del
        valor (Questionnaire) lo fija sin tocar la máquina, y el cambio vuelve por
        <code>sk:tilevaluechange</code>/<code>sk:tilecheckedchange</code> como cualquier otro. Un
        comando que no cambia nada no despacha nada.
    en:
      title: Tiles accept being told their value
      body: >-
        <code>TileRadioGroup</code> and <code>TileCheckbox</code> listen for
        <code>sk:tilesetvalue</code> and <code>sk:tilesetchecked</code>: a composition that owns the
        value (Questionnaire) sets it without reaching into the machine, and the change comes back
        through <code>sk:tilevaluechange</code>/<code>sk:tilecheckedchange</code> like any other. A
        command that changes nothing dispatches nothing.
  - date: 2026-09-17
    kind: feature
    es:
      title: Firmas interactivas declaran forward
      body: >-
        Las firmas host interactivas o de formulario publican <code>forward</code>
        (<code>id</code>/<code>aria-*</code> y attrs de enlace o formulario cuando aplica).
        Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: Interactive signatures declare forward
      body: >-
        Interactive or form host signatures publish <code>forward</code>
        (<code>id</code>/<code>aria-*</code> and link or form attrs where relevant).
        An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: feature
    es:
      title: eventDetails nombra source y trigger
      body: >-
        <code>eventDetails</code> declara <code>source</code> (parte que despacha el CustomEvent) y, cuando es claro, <code>trigger</code> (parte que el usuario activa). Un agente sabe dónde escuchar y qué control provoca el evento.
    en:
      title: eventDetails names source and trigger
      body: >-
        <code>eventDetails</code> declares <code>source</code> (part that dispatches the CustomEvent) and, when clear, <code>trigger</code> (part the user activates). An agent knows where to listen and which control causes the event.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-09-17
    kind: feature
    es:
      title: TileCheckbox/TileSwitch declaran compose
      body: >-
        <code>compose</code> documenta checkbox/switch vía <code>also</code>/<code>hookSheets</code> (<code>systemOwned</code>).
    en:
      title: TileCheckbox/TileSwitch declare compose
      body: >-
        <code>compose</code> documents checkbox/switch via <code>also</code>/<code>hookSheets</code> (<code>systemOwned</code>).
  - date: 2026-09-16
    kind: feature
    target: openChange
    es:
      title: Tile publica eventos, hojas de selection y host section fijo
      body: >-
        El contrato declara <code>events</code> (<code>sk:checkedchange</code>,
        <code>sk:valuechange</code>, <code>sk:openchange</code>) que vanilla ya despachaba.
        React ahora emite los mismos en el root. <code>hookSheets</code> nombra
        <code>checkbox.css</code> y <code>switch.css</code> para que las stages carguen la pintura
        de TileCheckbox/TileSwitch. <code>ExpandableTile</code> fija el host en
        <code>section</code> (sin <code>as</code>).
    en:
      title: Tile publishes events, selection sheets, and a fixed section host
      body: >-
        The contract declares <code>events</code> (<code>sk:checkedchange</code>,
        <code>sk:valuechange</code>, <code>sk:openchange</code>) that vanilla already dispatched.
        React now emits the same on the root. <code>hookSheets</code> names
        <code>checkbox.css</code> and <code>switch.css</code> so stages load TileCheckbox/TileSwitch
        paint. <code>ExpandableTile</code> fixes the host to <code>section</code> (no
        <code>as</code>).
  - date: 2026-09-11
    kind: bugfix
    es:
      title: El trigger de un tile expandible redondea sus esquinas de arriba
      body: >-
        El trigger ocupa el borde superior de la tarjeta, así que ahora declara ese radio en sus dos
        esquinas de arriba. Pintado se veía igual, porque el tile recorta con
        <code>overflow: hidden</code>; lo que cambia es que el elemento dice la forma que tiene, así
        cualquier cosa que lea el elemento en vez del resultado pintado (un diagrama de anatomía,
        una capa de estado propia) deja de dibujar una esquina cuadrada sobre una redonda. Con eso
        aparece <code>--sk-tile-radius</code>, un hook nuevo: es el radio del tile y el de esas dos
        esquinas a la vez, para que cambiar uno no deje al otro atrás.
    en:
      title: An expandable tile's trigger rounds its top corners
      body: >-
        The trigger occupies the top edge of the card, so it now declares that radius on its two top
        corners. Painted it looked the same already, because the tile clips with
        <code>overflow: hidden</code>; what changes is that the element states the shape it has, so
        anything reading the element rather than the painted result (an anatomy diagram, a state
        layer of your own) stops drawing a square corner over a round one. That brings a new hook,
        <code>--sk-tile-radius</code>: the tile's corner and those two corners are one number now, so
        retuning one cannot leave the other behind.
  - date: 2026-08-11
    kind: feature
    es:
      title: Tile se publica como contrato, con 10 signatures
      body: >-
        Entra al catálogo con <code>TileLink</code>, <code>TileButton</code>, <code>TileContent</code>,
        <code>TileChevron</code>, <code>TileCheckbox</code>, <code>TileSwitch</code>,
        <code>TileRadioGroup</code>, <code>ExpandableTile</code>, <code>ExpandableTileTrigger</code>,
        <code>ExpandableTileContent</code>: los dos bindings lo realizan, y la referencia de esta página
        sale del contrato compilado en vez de prosa escrita al lado. El binding Vanilla monta sobre
        <code>data-sk-tile-checkbox</code>, <code>data-sk-tile-switch</code>,
        <code>data-sk-tile-radio-group</code>, <code>data-sk-expandable-tile</code>: el markup se autora
        y el enhancer lo hidrata, así que lo que no necesita JavaScript funciona antes de que corra
        ninguno. Opciones: <code>padding</code>, <code>href</code>, <code>name</code>,
        <code>value</code>, <code>defaultChecked</code>, <code>required</code>,
        <code>defaultValue</code>, <code>orientation</code>, <code>disabled</code>,
        <code>defaultOpen</code>. La hoja es <code>components/tile.css</code>.
    en:
      title: Tile is published as a contract, with 10 signatures
      body: >-
        It joins the catalogue with <code>TileLink</code>, <code>TileButton</code>,
        <code>TileContent</code>, <code>TileChevron</code>, <code>TileCheckbox</code>,
        <code>TileSwitch</code>, <code>TileRadioGroup</code>, <code>ExpandableTile</code>,
        <code>ExpandableTileTrigger</code>, <code>ExpandableTileContent</code>: both bindings realize
        it, and this page's reference is rendered from the compiled contract rather than from prose
        written beside it. The Vanilla binding mounts on <code>data-sk-tile-checkbox</code>,
        <code>data-sk-tile-switch</code>, <code>data-sk-tile-radio-group</code>,
        <code>data-sk-expandable-tile</code>: the markup is authored and the enhancer hydrates it, so
        whatever needs no JavaScript works before any runs. Options: <code>padding</code>,
        <code>href</code>, <code>name</code>, <code>value</code>, <code>defaultChecked</code>,
        <code>required</code>, <code>defaultValue</code>, <code>orientation</code>,
        <code>disabled</code>, <code>defaultOpen</code>. Its stylesheet is
        <code>components/tile.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de tile quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>18</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: tile's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>18</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-16
    kind: bugfix
    es:
      title: El validador comprueba que el valor inicial nombre una entrada que existe
      body: >-
        <code>defaultValue</code> ahora declara que nombra entradas de <code>items</code> por su
        <code>value</code>. Un árbol que apunta a una entrada inexistente deja de validar
        (<code>unknown-key</code>) en vez de renderizar sin nada seleccionado ni decir por qué. El
        markup y los bindings no cambian.
    en:
      title: The validator checks that the initial value names an entry that exist
      body: >-
        <code>defaultValue</code> now declares that it names entries of <code>items</code> by their
        <code>value</code>. A tree pointing at an entry that does not exist stops validating
        (<code>unknown-key</code>) instead of rendering with nothing selected and no reason given.
        Markup and bindings are unchanged.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Cada evento lleva el nombre de su familia
      body: >-
        <code>sk:checkedchange</code> → <code>sk:tilecheckedchange</code>, <code>sk:valuechange</code> → <code>sk:tilevaluechange</code>, <code>sk:openchange</code> → <code>sk:tileopenchange</code>. Un mismo nombre ya no lo despachan varias familias: un listener sobre una raíz deja
        de recibir los eventos de un componente distinto anidado adentro.
    en:
      title: Every event carries its family in its name
      body: >-
        <code>sk:checkedchange</code> → <code>sk:tilecheckedchange</code>, <code>sk:valuechange</code> → <code>sk:tilevaluechange</code>, <code>sk:openchange</code> → <code>sk:tileopenchange</code>. No two families dispatch the same name any more: a listener on a root stops receiving
        the events of a different component nested inside it.
