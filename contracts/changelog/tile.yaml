# What changed in tile, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "dd883df1cb0edf73"
entries:
  - date: 2026-10-25
    kind: breaking
    target: appearance
    es:
      title: "Cada apariencia tiene su propia hoja"
      body: "Las reglas de `tactile`, `brutalist`, `frosted` pasan de tile.css a tile.tactile.css, checkbox.tactile.css, switch.tactile.css, tile.brutalist.css, checkbox.brutalist.css, switch.brutalist.css, tile.frosted.css, checkbox.frosted.css, switch.frosted.css. Importa la hoja del valor que uses; sin ella, ese valor no recibe su pintura. Los hooks siguen declarados en tile.css."
    en:
      title: "Each appearance has its own stylesheet"
      body: "The rules for `tactile`, `brutalist`, `frosted` move from tile.css to tile.tactile.css, checkbox.tactile.css, switch.tactile.css, tile.brutalist.css, checkbox.brutalist.css, switch.brutalist.css, tile.frosted.css, checkbox.frosted.css, switch.frosted.css. Import the sheet for the value you use; without it, that value does not get its paint. The hooks are still declared in tile.css."
  - date: 2026-10-06
    kind: bugfix
    es:
      title: Tile usa los tokens de interlineado reales y parte las palabras sólo si no caben
      body: El título y la descripción pedían <code>--line-height-heading</code> y <code>--line-height-body</code>, que nada declaraba, y caían al interlineado heredado. Ahora usan <code>--font-line-height-*</code>.
    en:
      title: Tile uses the real line-height tokens and breaks a word only when it cannot fit
      body: Title and description asked for <code>--line-height-heading</code> and <code>--line-height-body</code>, which nothing declared, and fell back to the inherited line height. They now use <code>--font-line-height-*</code>.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y una hoja de estilos para marcado simple."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a stylesheet for plain markup."
