# What changed in tile, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "7087b4e1f89e3813"
entries:
  - date: 2026-10-06
    kind: bugfix
    es:
      title: Tile usa los tokens de interlineado reales y parte las palabras sólo si no caben
      body: El título y la descripción pedían <code>--line-height-heading</code> y <code>--line-height-body</code>, que nada declaraba, y caían al interlineado heredado. Ahora usan <code>--font-line-height-*</code>.
    en:
      title: Tile uses the real line-height tokens and breaks a word only when it cannot fit
      body: Title and description asked for <code>--line-height-heading</code> and <code>--line-height-body</code>, which nothing declared, and fell back to the inherited line height. They now use <code>--font-line-height-*</code>.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Superficie con una sola intención interactiva: navegar, actuar, elegir o divulgar."
    en:
      title: First release
      body: "A surface with one interactive intent: navigate, act, choose, or disclose."
