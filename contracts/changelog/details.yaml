# What changed in details, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "79b3f75a2a6a67d7"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: Details se publica como contrato, con 4 signatures
      body: >-
        Entra al catálogo con <code>DetailsGroup</code>, <code>Details</code>,
        <code>Details.Summary</code>, <code>Details.Content</code>: los dos bindings lo realizan, y la
        referencia de esta página sale del contrato compilado en vez de prosa escrita al lado. No tiene
        enhancer: el markup está completo por sí solo, así que las dos bindings son el mismo markup dos
        veces. Opciones: <code>name</code>, <code>open</code>. La hoja es
        <code>components/details.css</code>.
    en:
      title: Details is published as a contract, with 4 signatures
      body: >-
        It joins the catalogue with <code>DetailsGroup</code>, <code>Details</code>,
        <code>Details.Summary</code>, <code>Details.Content</code>: both bindings realize it, and this
        page's reference is rendered from the compiled contract rather than from prose written beside
        it. There is no enhancer: the markup is complete on its own, so both bindings are the same
        markup twice. Options: <code>name</code>, <code>open</code>. Its stylesheet is
        <code>components/details.css</code>.