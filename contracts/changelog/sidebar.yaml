# What changed in sidebar, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "581be0b34f5d9e91"
entries:
  - date: 2026-10-25
    kind: breaking
    target: appearance
    es:
      title: "Cada apariencia tiene su propia hoja"
      body: "Las reglas de `brutalist`, `frosted` pasan de sidebar.css a sidebar.brutalist.css, sidebar.frosted.css. Importa la hoja del valor que uses; sin ella, ese valor no recibe su pintura. Los hooks siguen declarados en sidebar.css."
    en:
      title: "Each appearance has its own stylesheet"
      body: "The rules for `brutalist`, `frosted` move from sidebar.css to sidebar.brutalist.css, sidebar.frosted.css. Import the sheet for the value you use; without it, that value does not get its paint. The hooks are still declared in sidebar.css."
  - date: 2026-10-06
    kind: feature
    target: side
    es:
      title: Sidebar puede pararse al final con side
      body: '<code>side="end"</code> refleja el riel: el borde, la manija de resize, el trigger flotante y la flecha miran al otro lado, y arrastrar hacia el contenido sigue ensanchándolo.'
    en:
      title: Sidebar can stand at the end with side
      body: '<code>side="end"</code> mirrors the rail: the border, the resize handle, the floating trigger and the chevron face the other way, and a drag toward the content still widens it.'
  - date: 2026-10-08
    kind: feature
    es:
      title: Un thumb con seis puntos en el borde de la barra de redimensionar
      body: El borde redimensionable lleva ahora un pequeño contenedor con seis puntos, dibujado con CSS, pegado por dentro al borde. Aparece con el puntero, el foco y el arrastre, igual que la línea.
    en:
      title: A six-dot thumb on the resize edge
      body: The resizable edge now carries a small container with six dots, drawn in CSS, flush inside the edge. It appears with the pointer, the focus and the drag, the same moments the line itself escalates.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
