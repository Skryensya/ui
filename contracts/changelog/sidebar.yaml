# What changed in sidebar, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "0defd0f7cb23158f"
entries:
  - date: 2026-09-17
    kind: feature
    es:
      title: Firmas interactivas declaran forward
      body: >-
        Las firmas host interactivas o de formulario publican <code>forward</code>
        (<code>id</code>/<code>aria-*</code> y attrs de enlace o formulario cuando aplica).
        Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: Interactive signatures declare forward
      body: >-
        Interactive or form host signatures publish <code>forward</code>
        (<code>id</code>/<code>aria-*</code> and link or form attrs where relevant).
        An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: feature
    es:
      title: eventDetails nombra source y trigger
      body: >-
        <code>eventDetails</code> declara <code>source</code> (parte que despacha el CustomEvent) y, cuando es claro, <code>trigger</code> (parte que el usuario activa). Un agente sabe dónde escuchar y qué control provoca el evento.
    en:
      title: eventDetails names source and trigger
      body: >-
        <code>eventDetails</code> declares <code>source</code> (part that dispatches the CustomEvent) and, when clear, <code>trigger</code> (part the user activates). An agent knows where to listen and which control causes the event.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-09-17
    kind: feature
    es:
      title: Sidebar declara splitter y React emite los eventos DOM
      body: >-
        El contrato publica <code>hookSheets</code> de <code>splitter.css</code> (el handle
        compone <code>sk-splitter</code>) y los hooks <code>--sk-splitter-*</code>. React
        despacha <code>sk:sidebarcollapsedchange</code> y <code>sk:sidebarresizechange</code>, y
        sella los mounts que el enhancer Vanilla ya escanea.
    en:
      title: Sidebar declares splitter and React emits the DOM events
      body: >-
        The contract publishes <code>splitter.css</code> via <code>hookSheets</code> (the handle
        composes <code>sk-splitter</code>) and the <code>--sk-splitter-*</code> hooks. React
        dispatches <code>sk:sidebarcollapsedchange</code> and <code>sk:sidebarresizechange</code>,
        and stamps the mounts the Vanilla enhancer already scans for.
  - date: 2026-09-09
    kind: rework
    es:
      title: La página actual se marca más fuerte en modo claro
      body: >-
        El fondo de la fila con <code>aria-current="page"</code> deja de ser el
        <code>--color-bg-accent-subtle</code> del patrón, que en claro está a un paso del blanco
        sobre una superficie que ya es blanca: en un riel de doscientas filas eso se leía como un
        artefacto de render y no como "estás aquí". Ahora se mezcla contra el fondo propio de la
        barra, así que una barra repintada mantiene la relación. Modo oscuro sin cambios: ahí el
        mismo token ya es un escalón por encima de su fondo.
    en:
      title: The current page is marked more strongly in light mode
      body: >-
        The background of the <code>aria-current="page"</code> row is no longer the pattern's
        <code>--color-bg-accent-subtle</code>, which in light is one step off white on a surface that
        is already white: down a rail of two hundred rows it read as a rendering artifact rather than
        as "you are here". It is now mixed against the sidebar's own background, so a repainted rail
        keeps the relationship. Dark mode is unchanged: there the same token is already a step above
        its ground.
  - date: 2026-09-08
    kind: bugfix
    target: SidebarResizeHandle
    es:
      title: Un ancho recordado ya no ensancha la barra después del primer pintado
      body: >-
        El <code>clamp()</code> del ancho vivía en
        <code>.sk-sidebar:has(.sk-sidebar__resize-handle)</code>, y <code>:has()</code> no puede ver
        un handle que el parser todavía no leyó: el handle es el último hijo del panel, así que una
        página que restauraba el ancho guardado antes del primer pintado maquetaba la barra dos
        veces, primero en su ancho expandido y después en el recordado, y como
        <code>inline-size</code> tiene transición, el salto se ANIMABA y arrastraba la columna del
        contenido con él. Ahora el clamp está en la regla base y lee siempre
        <code>--sk-sidebar-resize-inline-size</code>, una propiedad que sólo escribe un arrastre o
        una restauración: el ancho ya no depende de cuándo se parsea el handle. Efecto lateral: los
        extremos ahora también acotan a una barra que nunca se arrastró, así que un
        <code>--sk-sidebar-expanded-inline-size</code> fuera de
        <code>--sk-sidebar-min-inline-size</code> y <code>--sk-sidebar-max-inline-size</code> se
        recorta en vez de ganar.
    en:
      title: A remembered width no longer widens the bar after first paint
      body: >-
        The width <code>clamp()</code> lived on
        <code>.sk-sidebar:has(.sk-sidebar__resize-handle)</code>, and <code>:has()</code> cannot
        match a handle the parser has not reached yet: the handle is the panel's last child, so a
        page that restored a stored width before first paint laid the bar out twice, once at its
        expanded width and again at the remembered one, and since <code>inline-size</code> is in the
        transition list, that jump ANIMATED and dragged the content column along with it. The clamp
        now lives in the base rule and always reads
        <code>--sk-sidebar-resize-inline-size</code>, a property only a drag or a restore writes:
        the width no longer depends on when the handle parses. Side effect: the bounds now hold for
        a bar that was never dragged, so a <code>--sk-sidebar-expanded-inline-size</code> outside
        <code>--sk-sidebar-min-inline-size</code> and <code>--sk-sidebar-max-inline-size</code> is
        clamped instead of winning.
  - date: 2026-08-19
    kind: feature
    target: floating
    es:
      title: Nueva opción floating para SidebarTrigger
      body: >-
        Un app shell real casi nunca quiere una fila de header sólo para el hamburger: el trigger
        ahora puede llevar <code>floating</code>, que lo saca del flujo y lo fija a la esquina
        superior del lado final del panel, apenas afuera de su borde. Es una decisión de pintado,
        no un padre legal nuevo: sigue siendo hijo de <code>Sidebar</code>,
        <code>SidebarHeader</code> o <code>SidebarFooter</code>, y <code>aria-controls</code> lo
        sigue encontrando igual. Como consecuencia, el propio <code>.sk-sidebar</code> dejó de
        recortar con <code>overflow: hidden</code> en la raíz: el recorte ahora es de cada región
        (<code>__header</code>, <code>__content</code>, <code>__footer</code>), que es donde
        depende del contenido real, y es lo que deja que el trigger flotante se vea fuera del
        panel en lugar de cortado por él.
    en:
      title: New floating option for SidebarTrigger
      body: >-
        A real app shell rarely wants a whole header row just for the hamburger: the trigger can
        now take <code>floating</code>, which lifts it out of flow and pins it to the panel's own
        top inline-end corner, just past its edge. It is a paint decision, not a new legal parent -
        it is still a child of <code>Sidebar</code>, <code>SidebarHeader</code>, or
        <code>SidebarFooter</code>, and <code>aria-controls</code> still finds it the same way. As
        a consequence, `.sk-sidebar` itself no longer clips with a root-level
        <code>overflow: hidden</code>: the clip now belongs to each region
        (<code>__header</code>, <code>__content</code>, <code>__footer</code>), which is where it
        actually depends on that region's content, and is what lets the floating trigger sit
        visibly past the panel instead of being cut off by it.
  - date: 2026-08-17
    kind: feature
    target: landmarkLabel
    es:
      title: Nueva opción landmarkLabel para nombrar el aside cuando hay más de uno
      body: >-
        El contrato no tenía forma de nombrar el propio <code>&lt;aside&gt;</code>: <code>label</code>
        ya estaba tomado por el nombre accesible del trigger, un target distinto. WAI-ARIA exige un
        nombre en cuanto una página tiene más de una región <code>complementary</code>; ahora
        <code>landmarkLabel</code> lo cubre, opcional porque un único Sidebar en la página no lo
        necesita para ser inequívoco.
    en:
      title: New landmarkLabel option to name the aside once there is more than one
      body: >-
        The contract had no way to name the `<aside>` itself: `label` was already taken by the
        trigger's own accessible name, a different target. WAI-ARIA requires a name the moment a
        page has more than one `complementary` region; `landmarkLabel` now covers that, optional
        because a single Sidebar on the page needs none to be unambiguous.
  - date: 2026-08-06
    kind: feature
    target: SidebarResizeHandle
    es:
      title: El Sidebar se puede arrastrar para cambiarle el ancho, y lo recuerda
      body: >-
        <code>SidebarResizeHandle</code> agrega el borde que se arrastra. Autorarlo es lo que
        vuelve redimensionable a la barra: no hay una opción <code>resizable</code> aparte, y la
        hoja de estilos lee el mismo hecho con <code>:has()</code>. El recorrido lo acotan
        <code>--sk-sidebar-min-inline-size</code> y <code>--sk-sidebar-max-inline-size</code>, así
        que el clamp vive en el CSS y ninguna de las dos bindings hace la cuenta. Con
        <code>storageKey</code> el ancho sobrevive a la recarga; sin él dura la sesión. Es un
        splitter completo: se mueve con las flechas, <code>Home</code> y <code>End</code> van a los
        extremos, y doble clic o <code>Enter</code> vuelven al ancho por defecto. Redimensiona con el
        clic mantenido: un clic suelto en el borde no mueve nada ni escribe nada.
        <code>minInlineSize</code> y <code>maxInlineSize</code> escriben esos dos hooks desde el
        markup o desde las props, para una barra que necesita un recorrido propio sin abrir una hoja
        de estilos; aceptan cualquier largo de CSS. Quien tenga muchas barras iguales sigue
        poniendo el hook una vez y no la prop cincuenta veces.
    en:
      title: The Sidebar can be dragged to a new width, and remembers it
      body: >-
        <code>SidebarResizeHandle</code> adds the drag edge. Authoring it is what makes the sidebar
        resizable: there is no separate <code>resizable</code> option, and the stylesheet reads the
        same fact with <code>:has()</code>. The travel is bounded by
        <code>--sk-sidebar-min-inline-size</code> and <code>--sk-sidebar-max-inline-size</code>, so
        the clamp lives in CSS and neither binding does the arithmetic. With
        <code>storageKey</code> the width outlives a reload; without it, the session. It is a full
        splitter: arrow keys move it, <code>Home</code> and <code>End</code> go to the ends, and
        double-click or <code>Enter</code> restores the default. It resizes on a held click: a plain
        click on the edge moves nothing and writes nothing. <code>minInlineSize</code> and
        <code>maxInlineSize</code> write those two hooks from the markup or from props, for a
        sidebar that needs its own travel without opening a stylesheet; both take any CSS length.
        Anyone with many identical sidebars still sets the hook once instead of passing the prop
        fifty times.
  - date: 2026-08-06
    kind: rework
    es:
      title: El Sidebar arranca en 13rem y el scroll se queda adentro
      body: >-
        El ancho por defecto baja de 15rem a 13rem. Estaba dimensionado para que la etiqueta más
        larga del riel de docs nunca se cortara, que es medir el panel contra el contenido de un
        consumidor; ahora la etiqueta que no entra se corta con puntos suspensivos y el ancho vuelve
        a ser una decisión de diseño. Además <code>sk-sidebar__content</code> lleva
        <code>overscroll-behavior: contain</code>, así llegar al final del índice ya no le pasa el
        scroll a la página, y nunca scrollea en horizontal.
    en:
      title: The Sidebar starts at 13rem, and its scroll stays inside it
      body: >-
        The default width drops from 15rem to 13rem. It had been sized so the longest label in the
        docs rail never truncated, which is measuring the panel against one consumer's content; a
        label that does not fit now ellipses, and the width is a design choice again. On top of
        that <code>sk-sidebar__content</code> takes <code>overscroll-behavior: contain</code>, so
        reaching the end of a long index no longer hands the scroll to the page, and it never
        scrolls horizontally.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de sidebar quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>41</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: sidebar's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>41</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Cada evento lleva el nombre de su familia
      body: >-
        <code>sk-collapsed-change</code> → <code>sk:sidebarcollapsedchange</code>, <code>sk-resize-change</code> → <code>sk:sidebarresizechange</code>. Un mismo nombre ya no lo despachan varias familias: un listener sobre una raíz deja
        de recibir los eventos de un componente distinto anidado adentro. El contrato ahora los declara en <code>events</code>, así que el compilador los publica.
    en:
      title: Every event carries its family in its name
      body: >-
        <code>sk-collapsed-change</code> → <code>sk:sidebarcollapsedchange</code>, <code>sk-resize-change</code> → <code>sk:sidebarresizechange</code>. No two families dispatch the same name any more: a listener on a root stops receiving
        the events of a different component nested inside it. The contract now declares them in <code>events</code>, so the compiler publishes them.
