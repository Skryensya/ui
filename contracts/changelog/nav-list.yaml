# Qué cambió en nav-list, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribí la entrada y pegá el
# hash nuevo.
surface: "fb2e7307660ea9d7"
entries:
  - date: 2026-09-01
    kind: bugfix
    target: collapsible
    es:
      title: Un NavListGroup colapsable ahora se oculta de verdad al cerrarse
      body: >-
        La lista de un grupo <code>collapsible</code> alterna <code>hidden</code> (el enhancer, y el
        primer render de un grupo con <code>defaultOpen: false</code>), pero
        <code>patterns/nav-list.css</code> le pone <code>display: flex</code> a
        <code>.sk-nav-list__list</code>: una regla de autor que le gana por origen al
        <code>[hidden] { display: none }</code> del navegador, así que la lista seguía visible
        cerrada. Se agrega <code>.sk-nav-list__list[hidden] { display: none }</code>, el mismo arreglo
        que <code>combobox.css</code>, <code>tree-view.css</code> y <code>date-picker.css</code> ya
        traían. Sin cambios de superficie: la opción <code>collapsible</code> simplemente ahora
        colapsa.
    en:
      title: A collapsible NavListGroup now actually hides when closed
      body: >-
        A <code>collapsible</code> group's list toggles <code>hidden</code> (the enhancer, and the
        first paint of a <code>defaultOpen: false</code> group), but
        <code>patterns/nav-list.css</code> sets <code>display: flex</code> on
        <code>.sk-nav-list__list</code>: an author rule that beats the browser's
        <code>[hidden] { display: none }</code> on origin, so the list stayed visible while closed.
        Adds <code>.sk-nav-list__list[hidden] { display: none }</code>, the same fix
        <code>combobox.css</code>, <code>tree-view.css</code> and <code>date-picker.css</code>
        already carried. No surface change: the <code>collapsible</code> option simply collapses now.
  - date: 2026-08-24
    kind: feature
    target: NavListGroup
    es:
      title: NavListGroup ahora también vive dentro de un MegamenuTrigger
      body: >-
        <code>MegamenuTrigger</code> ya declaraba, en su propio contrato, que su slot
        <code>columns</code> acepta <code>NavListGroup</code>: un panel de mega-menú es columnas de
        enlaces, y esas columnas son el mismo grupo que ya arma un rail o un navbar. Lo que faltaba
        era que <code>NavListGroup</code> lo supiera de vuelta: sus dos hogares legales declarados
        eran <code>NavList</code> y <code>NavListLink</code>, así que una composición real que
        anidaba un grupo dentro de un trigger de mega-menú. Exactamente la que
        <code>megamenu.ts</code> ya documentaba como válida: quedaba rechazada por el validador. El
        template no cambia: este signature nunca supo qué padre lo colocó.
    en:
      title: NavListGroup now also lives inside a MegamenuTrigger
      body: >-
        <code>MegamenuTrigger</code> already declared, in its own contract, that its <code>columns</code>
        slot accepts <code>NavListGroup</code>: a mega-menu panel is columns of links, and those
        columns are the same group that already builds a rail or a navbar. What was missing was
        <code>NavListGroup</code> knowing it back: its two declared legal homes were
        <code>NavList</code> and <code>NavListLink</code>, so a real composition nesting a group
        inside a mega-menu trigger: exactly the one <code>megamenu.ts</code> already documented as
        valid. Was rejected by the validator. The template does not change: this signature never
        knew which parent placed it.
  - date: 2026-08-20
    kind: feature
    target: heading
    es:
      title: NavListGroup puede rotular su sección con un encabezado real
      body: >-
        Nueva opción <code>heading</code>: una etiqueta ESTÁTICA (sin <code>collapsible</code>) se
        renderiza como <code>&lt;h3&gt;</code> en vez de un <code>&lt;div&gt;</code>: para un grupo
        que vive adentro de un panel grande (<code>Megamenu</code>'s propias columnas siendo el caso
        que lo motivó) donde la navegación por encabezados de un lector de pantalla es cómo alguien
        se orienta entre varios grupos a la vez. Sin efecto sobre una etiqueta colapsable, que ya es
        un <code>&lt;button&gt;</code> real, un landmark más fuerte que un encabezado; ni sin
        <code>label</code>, con quien debe ir de la mano.
    en:
      title: NavListGroup can label its section with a real heading
      body: >-
        New <code>heading</code> option: a STATIC label (no <code>collapsible</code>) renders as an
        <code>&lt;h3&gt;</code> instead of a <code>&lt;div&gt;</code>: for a group living inside a
        large panel (<code>Megamenu</code>'s own columns being the motivating case) where a screen
        reader's own heading-navigation is how a reader orients among several groups at once. No
        effect on a collapsible label, already a real <code>&lt;button&gt;</code>, a stronger
        landmark than a heading would add; nor without a <code>label</code>, which it must be paired
        with.
  - date: 2026-08-19
    kind: feature
    target: NavListLink
    es:
      title: NavListLink puede llevar sus propios sub-destinos
      body: >-
        Nuevo slot <code>nested</code> en <code>NavListLink</code>, que acepta un
        <code>NavListGroup</code>. Se renderiza adentro del mismo <code>&lt;li&gt;</code>, como
        hermano del <code>&lt;a&gt;</code>, no adentro de la lista del grupo padre: un
        <code>NavListGroup</code> metido directo en el <code>children</code> de otro grupo no es
        HTML válido, porque un <code>&lt;div&gt;</code> no es hijo legal de <code>&lt;ul&gt;</code>,
        sólo <code>&lt;li&gt;</code> lo es. <code>NavListGroup</code> ahora acepta
        <code>NavListLink</code> como segundo padre legal (antes sólo <code>NavList</code>), pero su
        plantilla no cambia en nada: sigue siendo el mismo <code>&lt;div&gt;</code> con rótulo
        opcional y <code>&lt;ul&gt;</code>, colapsable o no, con exactamente el mismo enhancer. La
        profundidad es arbitraria: un <code>NavListLink</code> anidado puede volver a llevar su
        propio <code>nested</code>.
    en:
      title: NavListLink can carry its own sub-destinations
      body: >-
        New <code>nested</code> slot on <code>NavListLink</code>, accepting a
        <code>NavListGroup</code>. It renders inside the SAME <code>&lt;li&gt;</code>, as a sibling
        of the <code>&lt;a&gt;</code>, not inside the parent group's own list: a
        <code>NavListGroup</code> nested straight inside another group's <code>children</code> is
        not valid HTML, since a <code>&lt;div&gt;</code> is not a legal <code>&lt;ul&gt;</code>
        child, only <code>&lt;li&gt;</code> is. <code>NavListGroup</code> now accepts
        <code>NavListLink</code> as a second legal parent (previously only <code>NavList</code>),
        but its template is unchanged: same <code>&lt;div&gt;</code>, optional label,
        <code>&lt;ul&gt;</code>, collapsible or not, the identical enhancer either way. Depth is
        unbounded: a nested <code>NavListLink</code> can carry its own <code>nested</code> again.
  - date: 2026-08-15
    kind: feature
    target: collapsible
    es:
      title: NavListGroup puede ser una sección colapsable
      body: >-
        Cubre el patrón WAI-ARIA APG "Disclosure (Navigation)". Nuevas opciones
        <code>collapsible</code> y <code>defaultOpen</code> (por defecto abierta, a diferencia de
        <code>Accordion</code>): con <code>collapsible</code>, la etiqueta estática del grupo se
        convierte en un <code>&lt;button&gt;</code> con <code>aria-expanded</code>/
        <code>aria-controls</code> que alterna la lista de enlaces. Deliberadamente NO
        <code>role="menu"</code>: misma razón que ya documenta <code>NavList</code> para sí mismo.
        Ahora sí tiene un enhancer Vanilla (<code>data-sk-nav-list-group-trigger</code>), solo para
        el caso colapsable. El grupo estático sigue sin necesitar JavaScript.
    en:
      title: NavListGroup can be a collapsible section
      body: >-
        Covers the WAI-ARIA APG "Disclosure (Navigation)" pattern. New <code>collapsible</code> and
        <code>defaultOpen</code> options (open by default, unlike <code>Accordion</code>): with
        <code>collapsible</code>, the group's static label becomes a <code>&lt;button&gt;</code>
        with <code>aria-expanded</code>/<code>aria-controls</code> toggling its list of links.
        Deliberately NOT <code>role="menu"</code>: the same reason <code>NavList</code> already
        documents for itself. It now has a Vanilla enhancer
        (<code>data-sk-nav-list-group-trigger</code>), only for the collapsible case: the static
        group still needs no JavaScript at all.
  - date: 2026-08-11
    kind: feature
    es:
      title: NavList se publica como contrato, con 3 signatures
      body: >-
        Entra al catálogo con <code>NavList</code>, <code>NavListGroup</code>, <code>NavListLink</code>:
        los dos bindings lo realizan, y la referencia de esta página sale del contrato compilado en vez
        de prosa escrita al lado. No tiene enhancer: el markup está completo por sí solo, así que las
        dos bindings son el mismo markup dos veces. Opciones: <code>orientation</code>,
        <code>href</code>, <code>current</code>. La hoja es <code>patterns/nav-list.css</code>.
    en:
      title: NavList is published as a contract, with 3 signatures
      body: >-
        It joins the catalogue with <code>NavList</code>, <code>NavListGroup</code>,
        <code>NavListLink</code>: both bindings realize it, and this page's reference is rendered from
        the compiled contract rather than from prose written beside it. There is no enhancer: the markup
        is complete on its own, so both bindings are the same markup twice. Options:
        <code>orientation</code>, <code>href</code>, <code>current</code>. Its stylesheet is
        <code>patterns/nav-list.css</code>.