# Qué cambió en nav-list, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribí la entrada y pegá el
# hash nuevo.
surface: "af34bac9c05b089a"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: NavList se publica como contrato, con 3 signatures
      body: >-
        Entra al catálogo con <code>NavList</code>, <code>NavListGroup</code>, <code>NavListLink</code>:
        los dos bindings lo realizan, y la referencia de esta página sale del contrato compilado en vez
        de prosa escrita al lado. No tiene enhancer: el markup está completo por sí solo, así que las
        dos bindings son el mismo markup dos veces. Opciones: <code>orientation</code>,
        <code>href</code>, <code>current</code>. La hoja es <code>patterns/nav-list.css</code>.
    en:
      title: NavList is published as a contract, with 3 signatures
      body: >-
        It joins the catalogue with <code>NavList</code>, <code>NavListGroup</code>,
        <code>NavListLink</code>: both bindings realize it, and this page's reference is rendered from
        the compiled contract rather than from prose written beside it. There is no enhancer: the markup
        is complete on its own, so both bindings are the same markup twice. Options:
        <code>orientation</code>, <code>href</code>, <code>current</code>. Its stylesheet is
        <code>patterns/nav-list.css</code>.