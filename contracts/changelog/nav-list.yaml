# What changed in nav-list, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "afc041d65efbc456"
entries:
  - date: 2026-11-23
    kind: bugfix
    es:
      title: El anillo de foco de un enlace se ve entero
      body: 'Con el teclado, el anillo de foco de un enlace, en barras laterales y cajones se veía cortado por un contenedor que recorta. Ahora se ve entero. Se dibuja hacia adentro.'
    en:
      title: A link’s focus ring is drawn whole
      body: 'With the keyboard, the focus ring of a link, in sidebars and drawers was cut by a clipping container. It is now drawn whole. It is drawn inside.'
  - date: 2026-11-23
    kind: feature
    target: setAll
    es:
      title: Abrir o cerrar todos los grupos a la vez
      body: 'El evento <code>sk:navlistsetall</code> con <code>{ open }</code>, enviado al <code>nav</code> con <code>setNavListGroups(nav, open)</code>, abre o cierra cada grupo plegable. Pasa por el mismo camino que un clic: en Vanilla queda recordado y la otra lista con la misma clave lo sigue. Es lo que manda un botón "Expandir todo".'
    en:
      title: Open or close every group at once
      body: 'The <code>sk:navlistsetall</code> event with <code>{ open }</code>, sent to the <code>nav</code> with <code>setNavListGroups(nav, open)</code>, opens or closes every collapsible group. It takes the same path as a click: in Vanilla it is remembered and the other list with the same key follows. It is what an "Expand all" button sends.'
  - date: 2026-11-20
    kind: bugfix
    es:
      title: "Una fila que es botón tiene el tamaño de las de enlace"
      body: "Un <code>&lt;button&gt;</code> con <code>sk-nav-list__link</code> tomaba el tamaño de letra del padre en vez del de la lista. Ahora usa el mismo tamaño y peso que los enlaces."
    en:
      title: "A button row matches the link rows"
      body: "A <code>&lt;button&gt;</code> with <code>sk-nav-list__link</code> took its parent's font size instead of the list's. It now uses the same size and weight as the links."
  - date: 2026-10-17
    kind: feature
    target: NavListLink
    es:
      title: "navListLinkIsCurrent: la comparación de ruta, ya no a mano"
      body: "Función nueva en @skryensya/core/nav-list. Sin asumir ningún router, decide si un href cuenta como la página actual para el pathname que ya devuelve el router del consumidor: coincidencia exacta, y una ruta anidada también cuenta, salvo que href sea la raíz."
    en:
      title: "navListLinkIsCurrent: the path comparison, no longer by hand"
      body: "New function in @skryensya/core/nav-list. No router assumed, it decides whether an href counts as the current page for the pathname the consumer's own router already returns: exact match, and a nested route counts too, unless href is the root."
  - date: 2026-10-04
    kind: feature
    es:
      title: La categoría colapsable es una fila, y recuerda y se muestra sola
      body: El botón de un grupo colapsable ahora se ve como una fila de navegación (alto y margen de un enlace, tinta primaria, chevron grande), con una línea guía junto a su lista abierta y el acento en el grupo que contiene la página actual.
    en:
      title: The collapsible category is a row, and it remembers and reveals itself
      body: A collapsible group's button now reads as a navigation row (a link's height and inset, primary ink, a full-size chevron), with a guide line beside its open list and the accent on the group that holds the current page.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
