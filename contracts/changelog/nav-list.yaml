# What changed in nav-list, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "679f368ed1b20800"
entries:
  - date: 2026-10-17
    kind: feature
    target: NavListLink
    es:
      title: "navListLinkIsCurrent: la comparación de ruta, ya no a mano"
      body: "Función nueva en @skryensya/core/nav-list. Sin asumir ningún router, decide si un href cuenta como la página actual para el pathname que ya devuelve el router del consumidor: coincidencia exacta, y una ruta anidada también cuenta, salvo que href sea la raíz."
    en:
      title: "navListLinkIsCurrent: the path comparison, no longer by hand"
      body: "New function in @skryensya/core/nav-list. No router assumed, it decides whether an href counts as the current page for the pathname the consumer's own router already returns: exact match, and a nested route counts too, unless href is the root."
  - date: 2026-10-04
    kind: feature
    es:
      title: La categoría colapsable es una fila, y recuerda y se muestra sola
      body: El botón de un grupo colapsable ahora se ve como una fila de navegación (alto y margen de un enlace, tinta primaria, chevron grande), con una línea guía junto a su lista abierta y el acento en el grupo que contiene la página actual.
    en:
      title: The collapsible category is a row, and it remembers and reveals itself
      body: A collapsible group's button now reads as a navigation row (a link's height and inset, primary ink, a full-size chevron), with a guide line beside its open list and the accent on the group that holds the current page.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
