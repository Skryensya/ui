# Qué cambió en rating, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribe la entrada y pega el
# hash nuevo.
surface: "336af45f437eabc5"
entries:
  - date: 2026-10-19
    kind: bugfix
    es:
      title: Se documenta el hook que ya decidía la dirección del relleno
      body: "<code>--sk-rating-fill-direction</code> ya existía en la hoja de estilos (to right / to left según RTL) pero no estaba en la lista de hooks del contrato: nada avisaba que se podía sobrescribir."
    en:
      title: The hook that already decided the fill direction is now documented
      body: "<code>--sk-rating-fill-direction</code> already existed in the stylesheet (to right / to left depending on RTL) but was missing from the contract's hooks list: nothing said it could be overridden."
  - date: 2026-10-03
    kind: rework
    target: Rating
    es:
      title: Rating se ve más limpio en modo claro
      body: La estrella encendida deja el marrón del texto de advertencia y toma el ámbar del borde de advertencia, que mantiene 3:1 sobre una superficie clara.
    en:
      title: Rating looks cleaner in light mode
      body: The filled symbol drops the warning text brown and takes the warning border amber, which holds 3:1 on a light surface. The empty one becomes a half-strength grey so it does not compete with the filled one.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
