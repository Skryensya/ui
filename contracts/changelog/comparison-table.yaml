entries:
  - date: 2026-10-19
    kind: feature
    target: ComparisonTableScroll
    es:
      title: ComparisonTableScroll para una comparación ancha
      body: "La misma caja que TableScroll, para el mismo motivo: table-layout se queda en auto, así que ni overflow ni max-inline-size en el propio table lo limitan de verdad. Es opt-in: una comparación de dos columnas en una columna ancha nunca la necesita."
    en:
      title: ComparisonTableScroll for a wide comparison
      body: "The same box TableScroll is, for the same reason: table-layout stays auto, so neither overflow nor max-inline-size on the table itself actually caps it. Opt-in: a two-column comparison in a wide column never needs it."
