# What changed in input, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "eefc4307a3778b63"
entries:
  - date: 2026-09-17
    kind: feature
    es:
      title: Input declara forward para readonly y value
      body: >-
        Input, NativeInput y Textarea publican <code>forward</code>: <code>readonly</code>,
        <code>value</code>, cotas nativas, <code>id</code> y <code>aria-*</code>. Un attr fuera
        de la lista es <code>unknown-attr</code>; <code>class</code>/<code>style</code> siguen
        libres.
    en:
      title: Input declares forward for readonly and value
      body: >-
        Input, NativeInput and Textarea publish <code>forward</code>: <code>readonly</code>,
        <code>value</code>, native bounds, <code>id</code> and <code>aria-*</code>. An attr
        outside the list is <code>unknown-attr</code>; <code>class</code>/<code>style</code>
        stay free.
  - date: 2026-09-17
    kind: breaking
    target: NativeInput
    es:
      title: NativeInput exige type y acepta controlSize
      body: >-
        <code>type</code> pasa a ser obligatorio: sin él NativeInput era un Input que se saltaba
        FormField. <code>controlSize</code> entra en la signature (el mismo <code>data-size</code>
        que Input/Textarea). En React, NativeInput hereda el cableado de FormField
        (id/describedBy/invalid) cuando vive dentro de uno.
    en:
      title: NativeInput requires type and accepts controlSize
      body: >-
        <code>type</code> is now required: without it NativeInput was just Input that skipped
        FormField. <code>controlSize</code> joins the signature (the same <code>data-size</code>
        Input/Textarea use). In React, NativeInput inherits FormField wiring
        (id/describedBy/invalid) when nested under one.
  - date: 2026-08-18
    kind: bugfix
    target: NativeInput
    es:
      title: NativeInput ahora carga sk-input, no queda sin estilo
      body: >-
        "Nativo" nombra el CONTROL, un `<input type="time">`/`type="color"` real que la plataforma
        sigue gobernando, nunca su apariencia. Pero la plantilla no le ponía ninguna clase, así que
        salía con el borde/alto/radio por defecto del navegador en vez del contrato de apariencia
        compartido que <code>Input</code>/<code>Textarea</code> ya tienen. Ambos bindings ahora
        cargan <code>sk-input</code>, la misma clase, y un <code>className</code> propio de quien
        compone se conserva junto a ella.
    en:
      title: NativeInput now carries sk-input, no longer unstyled
      body: >-
        "Native" names the CONTROL, a real <code>&lt;input type="time"&gt;</code>/<code>type="color"</code>
        the platform still owns, never its appearance, but the template gave it no class at all, so
        it rendered with the browser's own default border/height/radius instead of the shared
        appearance contract <code>Input</code>/<code>Textarea</code> already carry. Both bindings now
        load <code>sk-input</code>, the same class, and a consumer's own <code>className</code> is
        kept alongside it.
  - date: 2026-08-14
    kind: breaking
    es:
      title: Input y Textarea ahora se anidan bajo FormField
      body: >-
        El padre que ambas signatures declaran pasa de <code>Field</code> a <code>FormField</code>, que
        es el mismo contrato con su nombre nuevo. Un árbol que anide <code>Input</code> bajo
        <code>Field</code> deja de validar: cambia el <code>contract</code> a <code>form-field</code> y
        la <code>signature</code> a <code>FormField</code>. El control en sí no cambió, sigue sin
        <code>invalid</code> y sin <code>id</code> propios porque los dos llegan del cableado del padre.
    en:
      title: Input and Textarea now nest under FormField
      body: >-
        The parent both signatures declare moves from <code>Field</code> to <code>FormField</code>, the
        same contract under its new name. A tree nesting <code>Input</code> under <code>Field</code> no
        longer validates: change the <code>contract</code> to <code>form-field</code> and the
        <code>signature</code> to <code>FormField</code>. The control itself is unchanged: it still has
        no <code>invalid</code> and no <code>id</code> of its own, because both arrive from the parent's
        wiring.
  - date: 2026-08-11
    kind: feature
    es:
      title: Input se publica como contrato, con 3 signatures
      body: >-
        Entra al catálogo con <code>Input</code>, <code>NativeInput</code>, <code>Textarea</code>: los
        dos bindings lo realizan, y la referencia de esta página sale del contrato compilado en vez de
        prosa escrita al lado. No tiene enhancer: el markup está completo por sí solo, así que las dos
        bindings son el mismo markup dos veces. Opciones: <code>controlSize</code>, <code>type</code>,
        <code>name</code>, <code>placeholder</code>, <code>disabled</code>. La hoja es
        <code>components/input.css</code>.
    en:
      title: Input is published as a contract, with 3 signatures
      body: >-
        It joins the catalogue with <code>Input</code>, <code>NativeInput</code>, <code>Textarea</code>:
        both bindings realize it, and this page's reference is rendered from the compiled contract
        rather than from prose written beside it. There is no enhancer: the markup is complete on its
        own, so both bindings are the same markup twice. Options: <code>controlSize</code>,
        <code>type</code>, <code>name</code>, <code>placeholder</code>, <code>disabled</code>. Its
        stylesheet is <code>components/input.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de input quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>21</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: input's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>21</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
