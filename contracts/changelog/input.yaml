# What changed in input, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "4cf9c2cd3a7df547"
entries:
  - date: 2026-10-26
    kind: rework
    target: Input
    es:
      title: "Input sm mide 36px, ya no igual que md"
      body: "Antes sm quedaba en 44px por el mínimo táctil y era igual que md. Ahora la escala es 28, 36, 44 y 48px, con pasos parejos."
    en:
      title: "Input sm is 36px, no longer the same as md"
      body: "sm used to sit at 44px because of the touch floor and matched md. The scale is now 28, 36, 44 and 48px, in even steps."
  - date: 2026-10-26
    kind: feature
    target: Input
    es:
      title: "Input tiene un tamaño xs"
      body: "controlSize admite xs: 28px de alto con tipografía caption, para una barra densa."
    en:
      title: "Input has an xs size"
      body: "controlSize takes xs: a 28px field with caption type, for a dense bar."
  - date: 2026-10-24
    kind: feature
    target: Input
    es:
      title: "Input acepta inputmode"
      body: "Se permite inputmode para sugerir el teclado adecuado, por ejemplo decimal, sin cambiar el tipo del campo."
    en:
      title: "Input accepts inputmode"
      body: "inputmode is allowed to suggest the right keyboard, for example decimal, without changing the field's type."
  - date: 2026-10-24
    kind: feature
    target: Input
    es:
      title: "Input puede ir dentro de un ButtonGroup"
      body: "Además de FormField, ahora Input acepta ButtonGroup como padre: se suelda al botón que actúa sobre él. Dentro del grupo, nómbralo con aria-label o con un ButtonGroupLabel."
    en:
      title: "Input can sit inside a ButtonGroup"
      body: "Besides FormField, Input now accepts ButtonGroup as its parent, welded to the button that acts on it. Inside the group, name it with aria-label or a ButtonGroupLabel."
  - date: 2026-10-17
    kind: feature
    target: Textarea
    es:
      title: "Textarea crece con el contenido: autoSize"
      body: "Nueva opción autoSize (field-sizing: content), con un tope en --sk-textarea-autosize-max-block-size (40vh por defecto). Un navegador sin soporte mantiene la caja de alto fijo de siempre."
    en:
      title: "Textarea grows with its content: autoSize"
      body: "New autoSize option (field-sizing: content), capped by --sk-textarea-autosize-max-block-size (40vh by default). A browser without support keeps the plain fixed-height box."
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
  - date: 2026-10-14
    kind: feature
    es:
      title: Variante ghost
      body: "Input, Textarea y NativeInput aceptan variant=\"ghost\": el campo sin contenedor visible, para usarlo dentro de una superficie que ya lo enmarca."
    en:
      title: Ghost variant
      body: "Input, Textarea and NativeInput take variant=\"ghost\": the field with no visible container, for use inside a surface that already frames it."
