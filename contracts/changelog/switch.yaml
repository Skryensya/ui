# What changed in switch, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "a92de9dc838ed272"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: Switch se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Switch</code>: los dos bindings lo realizan, y la referencia de esta
        página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el markup
        está completo por sí solo, así que las dos bindings son el mismo markup dos veces. Opciones:
        <code>name</code>, <code>value</code>, <code>checked</code>, <code>disabled</code>. La hoja es
        <code>components/switch.css</code>.
    en:
      title: Switch is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Switch</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        Options: <code>name</code>, <code>value</code>, <code>checked</code>, <code>disabled</code>. Its
        stylesheet is <code>components/switch.css</code>.
  - date: 2026-09-02
    kind: bugfix
    es:
      title: El estado apagado del switch ahora se ve en claro y en oscuro
      body: >-
        La pista apagada dejó de tomar <code>--color-bg-surface-sunken</code>, que en ambos modos se
        confundía con el lienzo y hacía que un switch apagado pareciera deshabilitado. Ahora usa
        <code>--color-border-default</code>, un gris medio idéntico en claro y oscuro; el pomo es una
        pastilla clara (<code>--color-text-on-media</code>) en todos los estados, con una sombra sutil
        que lo despega de la pista, y el pomo encendido ya no es casi negro en oscuro. Deshabilitado
        estrena el hook <code>--sk-switch-disabled-thumb-bg</code> para quedar un paso más apagado.
    en:
      title: The switch off state is now visible in light and dark
      body: >-
        The off track no longer uses <code>--color-bg-surface-sunken</code>, which collapsed onto the
        canvas in both modes and made an off switch look disabled. It now uses
        <code>--color-border-default</code>, a mid grey identical in light and dark; the thumb is a
        bright puck (<code>--color-text-on-media</code>) in every state, with a soft shadow that lifts
        it off the track, and the on thumb is no longer near-black in dark. Disabled gains a
        <code>--sk-switch-disabled-thumb-bg</code> hook so it sits one step flatter than off.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de switch quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>16</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: switch's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>16</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-12
    kind: feature
    es:
      title: El contrato declara las otras hojas donde vive su estilo
      body: >-
        Este componente se pinta desde mas de una hoja, asi que el contrato ahora las nombra con
        <code>hookSheets</code> y su lista de <code>hooks</code> cubre todas. Antes solo se podia
        reconciliar contra la hoja de <code>css</code>, asi que los hooks de las otras eran
        superficie publica que nadie documentaba ni verificaba. No cambia ningun estilo: cambia que
        ahora estan declarados y el compilador los chequea.
    en:
      title: The contract declares the other stylesheets its styling lives in
      body: >-
        This component paints from more than one stylesheet, so the contract now names them with
        <code>hookSheets</code> and its <code>hooks</code> list covers all of them. Before, only the
        sheet <code>css</code> names could be reconciled, so the hooks in the others were public
        surface nobody documented and nothing checked. No styling changes: what changes is that they
        are declared now, and the compiler checks them.
