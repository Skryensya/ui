# Qué cambió en switch, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribí la entrada y pegá el
# hash nuevo.
surface: "cf9067969f99852f"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: Switch se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Switch</code>: los dos bindings lo realizan, y la referencia de esta
        página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el markup
        está completo por sí solo, así que las dos bindings son el mismo markup dos veces. Opciones:
        <code>name</code>, <code>value</code>, <code>checked</code>, <code>disabled</code>. La hoja es
        <code>components/switch.css</code>.
    en:
      title: Switch is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Switch</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        Options: <code>name</code>, <code>value</code>, <code>checked</code>, <code>disabled</code>. Its
        stylesheet is <code>components/switch.css</code>.
  - date: 2026-09-02
    kind: bugfix
    es:
      title: El estado apagado del switch ahora se ve en claro y en oscuro
      body: >-
        La pista apagada dejó de tomar <code>--color-bg-surface-sunken</code>, que en ambos modos se
        confundía con el lienzo y hacía que un switch apagado pareciera deshabilitado. Ahora usa
        <code>--color-border-default</code>, un gris medio idéntico en claro y oscuro; el pomo es una
        pastilla clara (<code>--color-text-on-media</code>) en todos los estados, con una sombra sutil
        que lo despega de la pista, y el pomo encendido ya no es casi negro en oscuro. Deshabilitado
        estrena el hook <code>--sk-switch-disabled-thumb-bg</code> para quedar un paso más apagado.
    en:
      title: The switch off state is now visible in light and dark
      body: >-
        The off track no longer uses <code>--color-bg-surface-sunken</code>, which collapsed onto the
        canvas in both modes and made an off switch look disabled. It now uses
        <code>--color-border-default</code>, a mid grey identical in light and dark; the thumb is a
        bright puck (<code>--color-text-on-media</code>) in every state, with a soft shadow that lifts
        it off the track, and the on thumb is no longer near-black in dark. Disabled gains a
        <code>--sk-switch-disabled-thumb-bg</code> hook so it sits one step flatter than off.