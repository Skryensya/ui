# What changed in command-palette, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "4c0e3741738b168a"
entries:
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
  - date: 2026-11-22
    kind: feature
    es:
      title: Tolera erratas y lista lo reciente
      body: "Si nada coincide, una errata de una edición (dos desde 7 letras) en un nombre o alias aún encuentra el destino. Con la búsqueda vacía, el anfitrión puede contestar al evento sk:commandpaletterecents con las páginas recientes y se listan primero. La paleta no guarda nada."
    en:
      title: Tolerates typos and lists recents
      body: "When nothing matches, a one-edit typo (two from 7 letters) in a name or alias still finds the destination. With an empty query the host can answer the sk:commandpaletterecents event with recent pages and they are listed first. The palette stores nothing."
