# What changed in command-palette, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "77058b2f6f0d72b4"
entries:
  - date: 2026-09-17
    kind: feature
    es:
      title: Firmas interactivas declaran forward
      body: >-
        Las firmas host interactivas o de formulario publican <code>forward</code>
        (<code>id</code>/<code>aria-*</code> y attrs de enlace o formulario cuando aplica).
        Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: Interactive signatures declare forward
      body: >-
        Interactive or form host signatures publish <code>forward</code>
        (<code>id</code>/<code>aria-*</code> and link or form attrs where relevant).
        An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-09-17
    kind: feature
    es:
      title: CommandPalette declara compose y filas systemOwned
      body: >-
        <code>compose</code> Button/Dialog/Icon; <code>systemOwned</code> lista option rows rellenadas al abrir.
    en:
      title: CommandPalette declares compose and row systemOwned
      body: >-
        <code>compose</code> Button/Dialog/Icon; <code>systemOwned</code> lists option rows filled on open.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: Command palette exige label e id, cierra con closeLabel y declara Vaul
      body: >-
        <code>requires</code> pide <code>label</code> y <code>paletteId</code> (como React).
        <code>closeLabel</code> entra al contrato; el slot <code>footer</code> deja de ser
        React-only. <code>hookSheets</code> nombra <code>dialog-vaul.css</code> porque el Vaul
        por defecto no se descubre desde <code>also: sk-dialog</code>.
    en:
      title: Command palette requires label/id, closeLabel, and names Vaul sheet
      body: >-
        <code>requires</code> asks for <code>label</code> and <code>paletteId</code> (as React
        already did). <code>closeLabel</code> joins the contract; the <code>footer</code> slot is
        no longer React-only. <code>hookSheets</code> names <code>dialog-vaul.css</code> because
        default-ON Vaul is not discoverable from <code>also: sk-dialog</code>.
  - date: 2026-09-16
    kind: feature
    target: vaul
    es:
      title: Command palette usa Vaul por defecto en móvil
      body: >-
        La opción <code>vaul</code> (default <code>true</code>, atributo
        <code>data-sk-dialog-vaul</code>) entra al contrato: en viewports estrechos la paleta es
        una hoja inferior con asa de arrastre, el mismo mecanismo que <code>Dialog.vaul</code>.
        <code>vaul={false}</code> conserva el diálogo centrado a todo ancho. El template incluye
        siempre el handle; el CSS lo oculta cuando no aplica.
    en:
      title: Command palette defaults to Vaul on small screens
      body: >-
        The <code>vaul</code> option (default <code>true</code>, attribute
        <code>data-sk-dialog-vaul</code>) joins the contract: on narrow viewports the palette is a
        bottom sheet with a drag handle, the same mechanism as <code>Dialog.vaul</code>.
        <code>vaul={false}</code> keeps the centred dialog at every width. The template always
        includes the handle; CSS hides it when it does not apply.
  - date: 2026-09-01
    kind: bugfix
    es:
      title: El enhancer Vanilla adopta un diálogo que ya está abierto
      body: >-
        <code>connectCommandPalette</code> asumía que se montaba ANTES de que alguien abriera el
        diálogo: su <code>open()</code> hace el primer render, toma el foco y pone
        <code>aria-expanded</code>, y sale temprano si el diálogo ya está abierto. Un host lazy que
        muestra la hoja con <code>showModal()</code> antes de cargar el chunk del enhancer (para que
        la aparición de la hoja no dependa de un <code>import()</code>) quedaba entonces con una
        lista vacía y un combobox que se anunciaba colapsado. Ahora, si <code>root.open</code> ya es
        <code>true</code> al montar, corre ese mismo trabajo de primera apertura.
    en:
      title: The Vanilla enhancer adopts an already-open dialog
      body: >-
        <code>connectCommandPalette</code> assumed it mounted BEFORE anyone opened the dialog: its
        <code>open()</code> does the first render, takes focus and sets <code>aria-expanded</code>,
        and bails early if the dialog is already open. A lazy host that shows the sheet with
        <code>showModal()</code> before loading the enhancer chunk (so the sheet's appearance is not
        gated behind an <code>import()</code>) was then left with an empty list and a combobox that
        announced itself collapsed. Now, if <code>root.open</code> is already <code>true</code> at
        mount, it runs that same first-open work.
  - date: 2026-08-22
    kind: bugfix
    es:
      title: La fila activa ya no lleva el anillo de foco en el modo cotidiano
      body: >-
        El resalte de <code>aria-selected</code> pintaba el anillo de foco siempre, porque el tint
        de superficie hundida desaparecía en hc-dark. Ese anillo hacía que cada resultado se viera
        como un target de alto contraste. El tint ahora es una mezcla de texto sobre la superficie
        elevada (visible también en HC) y el anillo queda para <code>forced-colors</code> y el modo
        de contraste alto explícito.
    en:
      title: The active row no longer wears the focus ring in everyday mode
      body: >-
        The <code>aria-selected</code> highlight always painted the focus ring, because the sunken
        surface tint vanished in hc-dark. That ring made every result look like a high-contrast
        target. The tint is now a mix of text on the raised surface (visible in HC too) and the ring
        is reserved for <code>forced-colors</code> and explicit high contrast.
  - date: 2026-08-17
    kind: bugfix
    es:
      title: El input ya anuncia aria-controls y su propio aria-expanded real
      body: >-
        Dos gaps del patrón Combobox de WAI: <code>aria-controls</code> nunca apuntaba al listbox
        (obligatorio esté o no visible el popup, lo mismo que ya exige la sección Combobox de esta
        auditoría). Ahora el listbox lleva un id estable y el input lo referencia. Y en Vanilla,
        <code>aria-expanded</code> del input se actualizaba solo en los triggers externos, nunca en
        el propio combobox: quedaba permanentemente en <code>"false"</code> mientras el listbox ya
        tenía resultados. React ya lo hacía bien; ahora ambos bindings coinciden.
    en:
      title: The input now announces aria-controls and its own real aria-expanded
      body: >-
        Two gaps against WAI's Combobox pattern: <code>aria-controls</code> never pointed at the
        listbox (required whether or not the popup is visible, the same rule this audit's own
        Combobox section already enforces). The listbox now carries a stable id and the input
        references it. And in Vanilla, <code>aria-expanded</code> on the input only ever updated on
        the external open-triggers, never on the combobox itself: it stayed permanently
        <code>"false"</code> while the listbox already had results. React already got this right;
        both bindings now agree.
  - date: 2026-08-11
    kind: feature
    es:
      title: CommandPalette se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>CommandPalette</code>: los dos bindings lo realizan, y la referencia
        de esta página sale del contrato compilado en vez de prosa escrita al lado. El binding Vanilla
        monta sobre <code>data-sk-command-palette</code>: el markup se autora y el enhancer lo hidrata,
        así que lo que no necesita JavaScript funciona antes de que corra ninguno. Opciones:
        <code>label</code>, <code>paletteId</code>, <code>placeholder</code>, <code>emptyLabel</code>,
        <code>open</code>, <code>entries</code>. La hoja es <code>components/command-palette.css</code>.
    en:
      title: CommandPalette is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>CommandPalette</code>: both bindings realize it, and this
        page's reference is rendered from the compiled contract rather than from prose written beside
        it. The Vanilla binding mounts on <code>data-sk-command-palette</code>: the markup is authored
        and the enhancer hydrates it, so whatever needs no JavaScript works before any runs. Options:
        <code>label</code>, <code>paletteId</code>, <code>placeholder</code>, <code>emptyLabel</code>,
        <code>open</code>, <code>entries</code>. Its stylesheet is
        <code>components/command-palette.css</code>.
  - date: 2026-09-07
    kind: bugfix
    es:
      title: aria-expanded ahora sigue a la lista, no al diálogo
      body: >-
        Un combobox está expandido cuando hay algo que expandir, y eso es "la lista tiene opciones".
        El enhancer lo ponía en <code>true</code> al abrir la paleta y React lo dejaba fijo en
        <code>true</code> desde la primera tecla sin volver a revisarlo, así que una paleta recién
        abierta, o una búsqueda sin resultados, anunciaba una lista desplegada que estaba vacía: lo
        mismo que la cabecera de este contrato dice que las dos implementaciones existen para evitar.
        Ahora sale de la cantidad de resultados en los dos lados. "Sin resultados" además espera a
        que se haya escrito algo: sobre una paleta intacta respondía una pregunta que nadie hizo.
    en:
      title: aria-expanded now follows the listbox, not the dialog
      body: >-
        A combobox is expanded when there is a popup to expand, which is "the listbox has options in
        it". The enhancer set it to <code>true</code> on open, and React latched it to
        <code>true</code> on the first keystroke and never reconsidered, so a freshly opened palette
        (or a query matching nothing) announced an expanded popup over an empty list, the very thing
        this contract's header says both bindings exist to avoid. It is now derived from the result
        count on both sides. "Sin resultados" also waits until something has been asked: over an
        untouched palette it answered a question nobody put.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de command-palette quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>14</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: command-palette's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>14</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-14
    kind: feature
    es:
      title: El binding React ya se maneja con el teclado, y elegir una fila hace algo
      body: >-
        React dibujaba los resultados y no hacía nada con ellos: las flechas no movían la fila
        activa, Enter no abría nada y un click tampoco. El enhancer Vanilla hacía las cuatro cosas,
        así que lo que se publicaba como un contrato era, de un lado, un campo de búsqueda que
        encontraba un destino y no podía llegar a él. Ahora los dos bindings responden a
        <code>ArrowUp</code>/<code>ArrowDown</code>/<code>Home</code>/<code>End</code>, a
        <code>Enter</code> y al click, y una paleta que se abre con <code>showModal()</code> toma el
        foco del campo y arranca con la búsqueda vacía, igual que <code>open()</code> en Vanilla.
        Nuevo <code>onSelect</code>: sin él, activar una fila navega a su <code>href</code> como
        siempre; con él, lo decide el host (el playground selecciona un ejemplo sin recargar el
        sandbox).
    en:
      title: The React binding is operable from the keyboard, and choosing a row now does something
      body: >-
        React drew the results and did nothing with them: the arrows did not move the active row,
        Enter opened nothing, and neither did a click. The Vanilla enhancer did all four, so one half
        of what shipped as a contract was a search field that could find a destination and never
        reach it. Both bindings now answer <code>ArrowUp</code>/<code>ArrowDown</code>/
        <code>Home</code>/<code>End</code>, <code>Enter</code> and a click, and a palette opened with
        <code>showModal()</code> takes focus into the field and starts with an empty query, the same
        as Vanilla's <code>open()</code>. New <code>onSelect</code>: without it, activating a row
        navigates to its <code>href</code> as before; with it, the host decides (the playground
        selects an example without reloading the sandbox).
  - date: 2026-09-17
    kind: breaking
    es:
      title: Los textos por defecto pasan a inglés
      body: >-
        El kit es una librería en inglés y sus defaults estaban en español: <code>closeLabel</code> Close, <code>placeholder</code> Search…, <code>emptyLabel</code> No results.. Una interfaz en
        otro idioma pasa sus propios textos, y el <code>locale</code> que corresponda.
    en:
      title: Default texts move to English
      body: >-
        The kit is an English library and its defaults were Spanish: <code>closeLabel</code> Close, <code>placeholder</code> Search…, <code>emptyLabel</code> No results.. An interface in another
        language passes its own texts, and the <code>locale</code> it needs.
  - date: 2026-09-25
    kind: feature
    es:
      title: Comandos, además de destinos
      body: >-
        Una entrada puede llevar <code>command</code> en vez de <code>href</code>. Los comandos sólo
        aparecen cuando la búsqueda empieza con <code>/</code>, y una búsqueda sin <code>/</code>
        sólo lista destinos. Activar uno cierra la paleta y dispara
        <code>sk:commandpalettecommand</code> en el diálogo con <code>{ command, entry }</code>; en
        React también llama a <code>onCommand</code>. Nunca navega ni pasa por <code>onSelect</code>.
    en:
      title: Commands, alongside destinations
      body: >-
        An entry can carry <code>command</code> instead of <code>href</code>. Commands are listed only
        once the query starts with <code>/</code>, and a query without it lists only destinations.
        Activating one closes the palette and fires <code>sk:commandpalettecommand</code> on the
        dialog with <code>{ command, entry }</code>; React also calls <code>onCommand</code>. It never
        navigates and never reaches <code>onSelect</code>.
