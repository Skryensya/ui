# What changed in accordion, in the words its users read. Only appended to, never rewritten.
#
# Each entry is a `title` and a `body` per language: the title is what someone scans to know whether
# they care, the body is why, and whoever is scanning should not have to read the body to work out
# whether it was for them. The title is plain text; the body accepts markup.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "e038684b11cef48c"
entries:
  - date: 2026-10-06
    kind: bugfix
    es:
      title: El título de la sección de Accordion usa el interlineado real
      body: El título del summary se medía contra un token de interlineado que no existía y se compensaba con un ajuste.
    en:
      title: Accordion's section title uses the real line height
      body: The summary title was measured against a line-height token that did not exist and was compensated by an override.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: Agrupa secciones extensas que se abren una a la vez.
    en:
      title: First release
      body: Groups long sections that open one at a time.
