# What changed in accordion, in the words its users read. Only appended to, never rewritten.
#
# Each entry is a `title` and a `body` per language: the title is what someone scans to know whether
# they care, the body is why, and whoever is scanning should not have to read the body to work out
# whether it was for them. The title is plain text; the body accepts markup.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "f52b47fc00e201d9"
entries:
  - date: 2026-09-21
    kind: rework
    es:
      title: Details deja de ser un contrato aparte y pasa a ser parte de Accordion
      body: >-
        <code>DetailsGroup</code>, <code>Details</code>, <code>Details.Summary</code> y
        <code>Details.Content</code> viven ahora dentro del contrato <code>accordion</code>, con los
        mismos nombres, las mismas clases <code>sk-details*</code> y el mismo módulo de React. Eran
        un componente propio en el catálogo, y obligaban a elegir entre dos entradas antes de saber
        que respondían la misma pregunta (mismo movimiento que Popup dentro de Popover). Las
        entradas de su changelog bajan acá; nada que se componga hoy cambia.
    en:
      title: Details stops being its own contract and becomes part of Accordion
      body: >-
        <code>DetailsGroup</code>, <code>Details</code>, <code>Details.Summary</code> and
        <code>Details.Content</code> now live inside the <code>accordion</code> contract, under the
        same names, the same <code>sk-details*</code> classes and the same React module. They were
        their own row in the catalogue, which made a reader choose between two entries before
        learning they answered the same question (the same dissolve Popup got into Popover). Their
        changelog entries move here; nothing you compose today changes.
  - date: 2026-09-18
    kind: feature
    es:
      title: Llega el hook de peso del título de Tile
      body: >-
        Accordion pinta con <code>tile.css</code>, así que <code>--sk-tile-title-weight</code> también
        se retunea desde aquí. El valor por defecto no cambia.
    en:
      title: Tile's title weight hook reaches here
      body: >-
        Accordion paints with <code>tile.css</code>, so <code>--sk-tile-title-weight</code> is
        retunable from here too. The default is unchanged.
  - date: 2026-09-17
    kind: feature
    es:
      title: Firmas interactivas declaran forward
      body: >-
        Las firmas host interactivas o de formulario publican <code>forward</code>
        (<code>id</code>/<code>aria-*</code> y attrs de enlace o formulario cuando aplica).
        Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: Interactive signatures declare forward
      body: >-
        Interactive or form host signatures publish <code>forward</code>
        (<code>id</code>/<code>aria-*</code> and link or form attrs where relevant).
        An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: feature
    es:
      title: eventDetails nombra source y trigger
      body: >-
        <code>eventDetails</code> declara <code>source</code> (parte que despacha el CustomEvent) y, cuando es claro, <code>trigger</code> (parte que el usuario activa). Un agente sabe dónde escuchar y qué control provoca el evento.
    en:
      title: eventDetails names source and trigger
      body: >-
        <code>eventDetails</code> declares <code>source</code> (part that dispatches the CustomEvent) and, when clear, <code>trigger</code> (part the user activates). An agent knows where to listen and which control causes the event.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-09-17
    kind: feature
    target: Accordion.Item
    es:
      title: Accordion.Item declara compose de Tile
      body: >-
        <code>compose</code> documenta que cada sección es chrome de ExpandableTile (<code>systemOwned</code> + <code>tile.css</code> vía hookSheets).
    en:
      title: Accordion.Item declares compose of Tile
      body: >-
        <code>compose</code> documents each section as ExpandableTile chrome (<code>systemOwned</code> + <code>tile.css</code> via hookSheets).
  - date: 2026-09-17
    kind: bugfix
    target: Accordion
    es:
      title: type=multiple excluye collapsible
      body: >-
        <code>Accordion</code> declara <code>excludes</code>: con <code>type="multiple"</code> no
        se admite <code>collapsible</code> (cada sección ya puede cerrarse sola; los bindings ya
        ignoraban la combinación).
    en:
      title: type=multiple excludes collapsible
      body: >-
        <code>Accordion</code> declares <code>excludes</code>: with <code>type="multiple"</code>,
        <code>collapsible</code> is refused (every open section can close on its own; bindings
        already ignored the combo).
  - date: 2026-09-16
    kind: bugfix
    es:
      title: React alinea defaultOpen, el evento valueChange y el host section
      body: >-
        <code>Accordion.Item</code> respeta <code>defaultOpen</code> cuando el root no trae
        <code>defaultValue</code>/<code>value</code> (como vanilla con <code>data-default-open</code>).
        Al cambiar el conjunto abierto, React despacha <code>sk:accordionvaluechange</code> en el
        root además de <code>onValueChange</code>. El host del ítem queda fijo en
        <code>section</code> (se quita <code>as</code>), <code>headingLevel</code> se acota a 1..6,
        y <code>collapsible</code> sólo aplica en <code>type="single"</code>.
    en:
      title: React aligns defaultOpen, the valueChange event, and the section host
      body: >-
        <code>Accordion.Item</code> honours <code>defaultOpen</code> when the root has no
        <code>defaultValue</code>/<code>value</code> (same as vanilla
        <code>data-default-open</code>). On open-set changes, React dispatches
        <code>sk:accordionvaluechange</code> on the root as well as <code>onValueChange</code>.
        The item host is fixed to <code>section</code> (<code>as</code> removed),
        <code>headingLevel</code> clamps to 1..6, and <code>collapsible</code> only applies when
        <code>type="single"</code>.
  - date: 2026-09-16
    kind: feature
    target: defaultValue
    es:
      title: El acordeón declara defaultValue en el contrato
      body: >-
        La opción <code>defaultValue</code> (<code>data-default-value</code>) pasa al contrato:
        es el canal del root para el conjunto inicial abierto (en markup, valores separados por
        coma si <code>type="multiple"</code>). React ya lo exponía; vanilla ya lo leía; ahora
        <code>validate_ui</code> y el manifiesto lo conocen. El <code>value</code> controlado y
        <code>onValueChange</code> siguen siendo wiring del binding, como en Tabs. Los intents
        dejan de afirmar "solo una abierta".
    en:
      title: Accordion publishes defaultValue on the contract
      body: >-
        The <code>defaultValue</code> option (<code>data-default-value</code>) joins the contract:
        it is the root channel for the initial open set (comma-separated in markup when
        <code>type="multiple"</code>). React already exposed it; vanilla already read it; now
        <code>validate_ui</code> and the manifest know it. Controlled <code>value</code> and
        <code>onValueChange</code> stay binding wiring, as with Tabs. Intents no longer claim
        "only one open".
  - date: 2026-09-11
    kind: bugfix
    es:
      title: La primera sección redondea sus esquinas de arriba
      body: >-
        La primera sección y su trigger declaran el radio del marco
        (<code>--sk-accordion-radius</code>) en sus dos esquinas superiores, que son las que
        ocupan; el resto de las secciones sigue plano, porque entre dos de ellas hay un divisor
        recto de los dos lados. Pintado se veía igual, porque el marco recorta con <code>overflow: hidden</code>;
        lo que cambia es que el elemento ahora dice la forma que tiene, así cualquier cosa que lea
        el elemento en vez del resultado pintado (un diagrama de anatomía, una capa de estado
        propia) deja de dibujar una esquina cuadrada sobre una redonda.
    en:
      title: The first section rounds its top corners
      body: >-
        The first section and its trigger now declare the frame's radius
        (<code>--sk-accordion-radius</code>) on the two corners they actually occupy; every section
        below stays flat, because the seam between two of them is a straight divider on both sides. Painted it
        looked the same already, because the frame clips with <code>overflow: hidden</code>; what
        changes is that the element now states the shape it has, so anything reading the element
        rather than the painted result (an anatomy diagram, a state layer of your own) stops
        drawing a square corner over a round one.
  - date: 2026-08-14
    kind: feature
    target: headingLevel
    es:
      title: Cada trigger se anuncia en el outline de la página
      body: >-
        <code>Accordion.Trigger</code> tiene una nueva opción <code>headingLevel</code> (por
        defecto <code>3</code>): envuelve el botón en un nodo <code>role="heading"</code> con
        <code>aria-level</code>, para que un lector de pantalla que navega por encabezados
        encuentre cada sección. El WAI-ARIA APG lo pide; ningún trigger lo tenía hasta ahora.
    en:
      title: Every trigger announces itself on the page outline
      body: >-
        <code>Accordion.Trigger</code> has a new <code>headingLevel</code> option (default
        <code>3</code>): it wraps the button in a <code>role="heading"</code> node with
        <code>aria-level</code>, so a screen reader navigating by heading finds each section. The
        WAI-ARIA APG asks for this; no trigger had it before.
  - date: 2026-08-04
    kind: feature
    target: valueChange
    es:
      title: El evento de cambio sale publicado en la referencia
      body: >-
        El contrato declara <code>sk:accordionvaluechange</code>. El evento no es nuevo ni cambió de
        nombre: lo que cambió es que antes había que encontrarlo en la prosa.
    en:
      title: The value-change event is published in the reference
      body: >-
        The contract declares <code>sk:accordionvaluechange</code>. The event is neither new nor
        renamed; what changed is that finding it used to mean reading the prose.
  - date: 2026-08-01
    kind: bugfix
    target: content
    es:
      title: La parte content se busca sólo como hija directa
      body: >-
        El enhancer la buscaba en cualquier descendiente, así que una sección construida con
        <code>TileContent</code> ataba su propio título como panel: la sección no se plegaba y su
        contenido quedaba expuesto al lector de pantalla.
    en:
      title: The content part is scoped to a direct child
      body: >-
        The enhancer looked for it on any descendant, so a section built with
        <code>TileContent</code> bound its own title as the panel: the section never collapsed and
        its content stayed exposed to a screen reader.
  - date: 2026-07-29
    kind: feature
    es:
      title: Primera publicación del contrato
      body: >-
        <code>Accordion</code> con <code>type</code> y <code>collapsible</code>, y las tres firmas
        que lo componen.
    en:
      title: First published contract
      body: >-
        <code>Accordion</code> with <code>type</code> and <code>collapsible</code>, plus the three
        signatures that compose it.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de accordion quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>6</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: accordion's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>6</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-12
    kind: feature
    es:
      title: El contrato declara las otras hojas donde vive su estilo
      body: >-
        Este componente se pinta desde mas de una hoja, asi que el contrato ahora las nombra con
        <code>hookSheets</code> y su lista de <code>hooks</code> cubre todas. Antes solo se podia
        reconciliar contra la hoja de <code>css</code>, asi que los hooks de las otras eran
        superficie publica que nadie documentaba ni verificaba. No cambia ningun estilo: cambia que
        ahora estan declarados y el compilador los chequea.
    en:
      title: The contract declares the other stylesheets its styling lives in
      body: >-
        This component paints from more than one stylesheet, so the contract now names them with
        <code>hookSheets</code> and its <code>hooks</code> list covers all of them. Before, only the
        sheet <code>css</code> names could be reconciled, so the hooks in the others were public
        surface nobody documented and nothing checked. No styling changes: what changes is that they
        are declared now, and the compiler checks them.
  - date: 2026-09-16
    kind: bugfix
    es:
      title: El contrato declara el rango de sus números
      body: >-
        <code>headingLevel</code> acepta enteros de 1 a 6. React ya lo recortaba; ahora un árbol con 7 no valida.
    en:
      title: The contract declares the range of its numbers
      body: >-
        <code>headingLevel</code> takes whole numbers from 1 to 6. React already clamped it; now a tree with 7 does not validate.
  - date: 2026-09-17
    kind: feature
    es:
      title: Firmas interactivas declaran forward
      body: >-
        Las firmas host interactivas o de formulario publican <code>forward</code>
        (<code>id</code>/<code>aria-*</code> y attrs de enlace o formulario cuando aplica).
        Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: Interactive signatures declare forward
      body: >-
        Interactive or form host signatures publish <code>forward</code>
        (<code>id</code>/<code>aria-*</code> and link or form attrs where relevant).
        An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: feature
    target: Details.Summary
    es:
      title: Details.Summary declara compose del chevron Icon
      body: >-
        El indicador chevron-down/up queda documentado como <code>compose</code> de
        <code>icon</code> con <code>systemOwned</code> (ya estaba horneado vía
        <code>data-sk-icon</code>).
    en:
      title: Details.Summary declares compose of the chevron Icon
      body: >-
        The chevron-down/up indicator is documented as <code>compose</code> of
        <code>icon</code> with <code>systemOwned</code> (already baked via
        <code>data-sk-icon</code>).
  - date: 2026-08-11
    kind: feature
    es:
      title: Details se publica como contrato, con 4 signatures
      body: >-
        Entra al catálogo con <code>DetailsGroup</code>, <code>Details</code>,
        <code>Details.Summary</code>, <code>Details.Content</code>: los dos bindings lo realizan, y la
        referencia de esta página sale del contrato compilado en vez de prosa escrita al lado. No tiene
        enhancer: el markup está completo por sí solo, así que las dos bindings son el mismo markup dos
        veces. Opciones: <code>name</code>, <code>open</code>. La hoja es
        <code>components/details.css</code>.
    en:
      title: Details is published as a contract, with 4 signatures
      body: >-
        It joins the catalogue with <code>DetailsGroup</code>, <code>Details</code>,
        <code>Details.Summary</code>, <code>Details.Content</code>: both bindings realize it, and this
        page's reference is rendered from the compiled contract rather than from prose written beside
        it. There is no enhancer: the markup is complete on its own, so both bindings are the same
        markup twice. Options: <code>name</code>, <code>open</code>. Its stylesheet is
        <code>components/details.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de details quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>20</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: details's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>20</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: Details ya no exige vivir dentro de DetailsGroup
      body: >-
        Un disclosure suelto es el caso común; el grupo sólo coordina exclusividad vía
        <code>name</code>. El contrato dejaba de validar un <code>Details</code> en la raíz, aunque
        React y el HTML nativo sí lo permiten.
    en:
      title: Details no longer requires a DetailsGroup ancestor
      body: >-
        A lone disclosure is the common case; the group only coordinates exclusivity via
        <code>name</code>. The contract rejected a top-level <code>Details</code> even though React
        and native HTML allow it.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Se van las clases de título que ningún árbol usaba
      body: >-
        <code>sk-details__heading</code>, <code>sk-details__title</code> y
        <code>sk-details__description</code> tenían estilo pero no eran partes del contrato ni las usaba
        nadie: un título dentro del summary se compone con Typography. Salen con los hooks que sólo
        ellas leían, <code>--sk-details-title-font-size</code> y
        <code>--sk-details-description-font-size</code>.
    en:
      title: The title classes no tree used are gone
      body: >-
        <code>sk-details__heading</code>, <code>sk-details__title</code> and
        <code>sk-details__description</code> were styled but were not contract parts and nothing used
        them: a title inside the summary is composed with Typography. They go with the hooks only they
        read, <code>--sk-details-title-font-size</code> and <code>--sk-details-description-font-size</code>.
