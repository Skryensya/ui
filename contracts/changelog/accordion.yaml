# What changed in accordion, in the words its users read. Only appended to, never rewritten.
#
# Each entry is a `title` and a `body` per language: the title is what someone scans to know whether
# they care, the body is why, and whoever is scanning should not have to read the body to work out
# whether it was for them. The title is plain text; the body accepts markup.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "5333a1488047af15"
entries:
  - date: 2026-11-23
    kind: feature
    target: variant
    es:
      title: Una variante con cada sección en su tarjeta
      body: '<code>variant="separated"</code>: cada sección es una tarjeta propia, con espacio entre ellas (<code>--sk-accordion-gap</code>), y la abierta se eleva con un borde más firme (<code>--sk-accordion-open-elevation</code>). Para un FAQ de producto donde cada pregunta se sostiene sola. Como seamless y divided, no lleva <code>appearance</code>.'
    en:
      title: A variant with each section on its own card
      body: '<code>variant="separated"</code>: every section is a card of its own, with room between them (<code>--sk-accordion-gap</code>), and the open one is raised with a firmer edge (<code>--sk-accordion-open-elevation</code>). For a product FAQ where each question stands alone. Like seamless and divided, it takes no <code>appearance</code>.'
  - date: 2026-11-23
    kind: feature
    es:
      title: Acordeones sin marco
      body: "<code>variant</code> elige la forma: <code>framed</code> (el de siempre), <code>seamless</code> (solo títulos, un más o menos y espacio, sin líneas ni fondos) y <code>divided</code> (títulos con chevron y una línea fina entre secciones). Ninguno muestra la descripción del título. <code>appearance</code> decora el marco, así que es solo para <code>framed</code>."
    en:
      title: Accordions without a frame
      body: "<code>variant</code> picks the shape: <code>framed</code> (as before), <code>seamless</code> (titles, a plus or minus and space only, no lines or fills) and <code>divided</code> (titles with a chevron and a hairline between sections). Neither shows a title’s description. <code>appearance</code> decorates the frame, so it is for <code>framed</code> only."
  - date: 2026-11-23
    kind: bugfix
    es:
      title: El anillo de foco del summary de Details se ve entero
      body: 'Con el teclado, el anillo de foco del summary de Details (solo quedaba la línea de abajo) se veía cortado por un contenedor que recorta. Ahora se ve entero. Se dibuja hacia adentro.'
    en:
      title: The Details summary’s focus ring is drawn whole
      body: 'With the keyboard, the focus ring of a Details summary (only its bottom line showed) was cut by a clipping container. It is now drawn whole. It is drawn inside.'
  - date: 2026-10-25
    kind: breaking
    target: appearance
    es:
      title: "Cada apariencia tiene su propia hoja"
      body: "Las reglas de `tactile`, `brutalist`, `frosted` pasan de accordion.css a accordion.tactile.css, tile.tactile.css, details.tactile.css, accordion.brutalist.css, tile.brutalist.css, details.brutalist.css, accordion.frosted.css, tile.frosted.css, details.frosted.css. Importa la hoja del valor que uses; sin ella, ese valor no recibe su pintura. Los hooks siguen declarados en accordion.css."
    en:
      title: "Each appearance has its own stylesheet"
      body: "The rules for `tactile`, `brutalist`, `frosted` move from accordion.css to accordion.tactile.css, tile.tactile.css, details.tactile.css, accordion.brutalist.css, tile.brutalist.css, details.brutalist.css, accordion.frosted.css, tile.frosted.css, details.frosted.css. Import the sheet for the value you use; without it, that value does not get its paint. The hooks are still declared in accordion.css."
  - date: 2026-10-17
    kind: feature
    target: Details
    es:
      title: "Details y DetailsGroup tienen un tamaño sm"
      body: "Nueva opción size (sm/md) para Details y DetailsGroup: sm reduce el relleno del summary y su alto mínimo, para una disclosure dentro de un panel ya denso (un drawer, un sidebar)."
    en:
      title: "Details and DetailsGroup get a sm size"
      body: "New size option (sm/md) on Details and DetailsGroup: sm tightens the summary's padding and minimum height, for a disclosure sitting inside an already-dense panel (a drawer, a sidebar)."
  - date: 2026-10-06
    kind: bugfix
    es:
      title: El título de la sección de Accordion usa el interlineado real
      body: El título del summary se medía contra un token de interlineado que no existía y se compensaba con un ajuste.
    en:
      title: Accordion's section title uses the real line height
      body: The summary title was measured against a line-height token that did not exist and was compensated by an override.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
  - date: 2026-10-24
    kind: bugfix
    es:
      title: El encabezado del trigger siempre declara su nivel
      body: "El markup de Vanilla omitía `aria-level` cuando `headingLevel` quedaba en su valor por defecto, y un `role=\"heading\"` sin nivel es ARIA inválido. Ahora siempre se escribe (3 por defecto)."
    en:
      title: The trigger heading always states its level
      body: "Vanilla markup left out `aria-level` when `headingLevel` stayed at its default, and a `role=\"heading\"` with no level is invalid ARIA. It is now always written (3 by default)."
