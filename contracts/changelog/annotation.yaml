# Qué cambió en annotation, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribe la entrada y pega el
# hash nuevo.
surface: "19551c5c83e4397d"
entries:
  - date: 2026-09-20
    kind: rework
    es:
      title: En pantallas angostas las etiquetas se agrupan en filas, no en una columna
      body: >-
        Debajo de 40rem los cuatro márgenes ya no se apilan uno por línea: forman dos grupos que
        envuelven en filas arriba y abajo del espécimen, y la clave baja a su propia línea. Las
        quince etiquetas de FileUpload pasaron de 543px de columna a cuatro filas, y el diagrama de
        1058px a 593px. <code>mobileAlign="end"</code> ahora empuja la etiqueta al final de SU fila
        (<code>margin-inline-start: auto</code>) en vez de alinearla en el eje cruzado.
    en:
      title: Narrow screens cluster the labels into rows instead of one column
      body: >-
        Below 40rem the four margins no longer stack one per line: they become two clusters that
        wrap into rows above and below the specimen, and the key drops to a line of its own.
        FileUpload's fifteen names went from 543px of column to four rows, and the diagram from
        1058px to 593px. <code>mobileAlign="end"</code> now pushes a label to the end of ITS row
        (<code>margin-inline-start: auto</code>) rather than aligning it on the cross axis.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-09-17
    kind: feature
    es:
      title: Annotation declara systemOwned para leaders
      body: >-
        <code>systemOwned</code> lista mark/leader/ring que el binding dibuja tras medir; el template deja el SVG vacío.
    en:
      title: Annotation declares systemOwned for leaders
      body: >-
        <code>systemOwned</code> lists mark/leader/ring the binding draws after measure; the template leaves the SVG empty.
  - date: 2026-09-16
    kind: bugfix
    target: for
    es:
      title: Annotated exige for único por etiqueta y deja de publicar side/for en el marco
      body: >-
        Cada entrada de <code>items</code> usa <code>for</code> como clave: sin selector la etiqueta
        no nombra nada, y dos etiquetas con el mismo selector reclamarían la misma parte. Las
        opciones <code>side</code> y <code>for</code> salen del bag del marco (solo viven en la
        entrada), que es donde siempre se escribían.
    en:
      title: Annotated requires a unique for per label and drops frame-level side/for
      body: >-
        Each <code>items</code> entry uses <code>for</code> as its key: without a selector the label
        names nothing, and two labels sharing a selector would claim the same part.
        <code>side</code> and <code>for</code> leave the frame option bag (they only live on the
        entry), which is where they were always authored.
  - date: 2026-09-11
    kind: rework
    target: ringRadius
    es:
      title: El anillo toma la esquina de la parte que envuelve
      body: >-
        <code>ringRadius</code> se queda sin default: en vez de un radio fijo para todo el dibujo,
        cada anillo ahora lee el <code>border-radius</code> de la parte que rodea, así una píldora
        se marca como píldora y una tarjeta como tarjeta. El anillo queda concéntrico con la parte
        (la distancia se le descuenta a la esquina igual que a la caja), y si el marco o una
        etiqueta escriben <code>ringRadius</code>, ese número manda sobre todas las esquinas que
        tiene abajo, que es lo que quiere un diagrama donde las partes tienen formas distintas y
        las marcas no deberían. Aparte, en reposo la marca adelgazó: el anillo pasó de 2px a 1px,
        el mismo pelo que su guía, y el gris de reposo lleva el alfa en el color
        (<code>--sk-annotation-ring-color-rest</code>), así el aparato queda por encima de la
        muestra sin pisarla.
    en:
      title: A ring takes the corner of the part it wraps
      body: >-
        <code>ringRadius</code> loses its default: instead of one fixed corner for the whole
        drawing, every ring now reads the <code>border-radius</code> of the part it outlines, so a
        pill is marked as a pill and a card as a card. The ring stays concentric with its part (the
        distance comes off the corner the same way it comes off the box), and a
        <code>ringRadius</code> written on the frame or on one label still overrides every corner
        under it, which is what a diagram wants when the parts are different shapes and the marks
        should not be. Separately, the mark at rest got thinner: the ring drops from 2px to
        1px, the same hairline as its leader, and the resting grey carries its alpha in the colour
        (<code>--sk-annotation-ring-color-rest</code>), so the apparatus sits over the specimen
        rather than on it.
  - date: 2026-09-11
    kind: bugfix
    target: inert
    es:
      title: La muestra anotada ya no recibe foco
      body: >-
        <code>inert</code> queda prendido por defecto: el acordeón, el breadcrumb o lo que sea
        que se esté anotando es una muestra, no un control. Tab lo salta, y los bindings le
        sacan el <code>tabindex</code> a todo lo de adentro para que nada se publicite como
        parada. Las etiquetas siguen siendo enfocables, que es como se revela una marca sin
        puntero. <code>inert={false}</code> sigue existiendo para el diagrama sobre una UI viva.
    en:
      title: An annotated specimen no longer takes focus
      body: >-
        <code>inert</code> is now on by default: the accordion, breadcrumb or whatever is being
        annotated is a specimen, not a control. Tab skips it, and both bindings take
        <code>tabindex</code> off everything inside so nothing advertises itself as a stop. The
        labels stay focusable, which is how a mark is revealed without a pointer.
        <code>inert={false}</code> still exists for a diagram over a live UI.
  - date: 2026-09-10
    kind: feature
    es:
      title: Annotation se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Annotated</code>: un marco que nombra las partes de lo que tiene
        adentro. El sujeto ocupa la celda del medio de una grilla de tres por tres y las etiquetas
        viven en los cuatro márgenes, que se dimensionan solos según lo que contienen, así que una
        etiqueta no puede quedar encima de la pieza que nombra. Cada etiqueta apunta con
        <code>for</code>, un selector CSS resuelto dentro del sujeto, y pide un margen con
        <code>side</code> (<code>inline-start</code>, <code>inline-end</code>,
        <code>block-start</code>, <code>block-end</code>); la línea guía que las une es de uno o dos
        tramos, sólo rectos o de 45 grados, que es la menor cantidad que siempre alcanza, y termina
        en un anillo (<code>sk-annotated__ring</code>) que rodea la parte entera, apenas por dentro
        de su caja, con la forma que dibuja <code>:focus-visible</code>. En reposo no hay ningún
        anillo: aparece el de la etiqueta que se está leyendo, con el puntero o con el foco, y por
        eso las etiquetas son enfocables. <code>ringPlacement</code> elige de qué lado del borde de
        la parte va el anillo (<code>inset</code> por defecto, <code>offset</code> para partes que
        son líneas de texto sueltas), <code>ringDistance</code> cuántos píxeles y
        <code>ringRadius</code> el redondeo de la esquina; las tres se pueden pisar por etiqueta,
        para la parte que no se parece a sus vecinas. Con <code>match: "all"</code> una etiqueta
        nombra <strong>todas</strong> las coincidencias de su selector en vez de la primera, con una
        guía a cada una saliendo del mismo borde: para el nombre que es genuinamente plural, como el
        <code>sk-breadcrumb__item</code> de un Breadcrumb, que no es la primera miga sino todas. El
        marco
        toma <code>label</code> (lo nombra y lo convierte en un <code>group</code>) e
        <code>inert</code> (el sujeto es una muestra: no toma puntero, ni foco, ni teclado). La
        geometría es pura y vive en <code>@skryensya/core/annotation</code>; las dos bindings sólo
        miden con un <code>ResizeObserver</code> y escriben un <code>translate</code> por etiqueta y
        el <code>d</code> de cada guía, así que el dibujo se rehace cuando cambia el tamaño del
        contenedor. La hoja es <code>components/annotation.css</code>.
    en:
      title: Annotation is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Annotated</code>: a frame that names the parts of whatever
        is inside it. The subject holds the middle cell of a three-by-three grid and the labels hold
        the four margins, which size themselves to what they contain, so a label cannot end up over
        the piece it names. Each label points with <code>for</code>, a CSS selector resolved inside
        the subject, and asks for a margin with <code>side</code> (<code>inline-start</code>,
        <code>inline-end</code>, <code>block-start</code>, <code>block-end</code>); the leader line
        joining them is one or two segments, axis-aligned or at exactly 45 degrees, which is the
        fewest that always reaches, and it ends in a ring (<code>sk-annotated__ring</code>) that
        outlines the whole part, just inside its box, in the shape <code>:focus-visible</code> draws.
        At rest no ring is drawn at all: the one belonging to the label being read comes up on hover
        or focus, which is why the labels are focusable. <code>ringPlacement</code> picks which side
        of a part's edge the ring sits on (<code>inset</code> by default, <code>offset</code> for
        parts that are single lines of text), <code>ringDistance</code> how many pixels and
        <code>ringRadius</code> the corner; all three can be overridden per label, for the part that
        is unlike its neighbours. With <code>match: "all"</code> a label names <strong>every</strong>
        match of its selector rather than the first, with one leader to each leaving the same edge:
        for the name that is genuinely plural, such as a Breadcrumb's <code>sk-breadcrumb__item</code>,
        which is not the first crumb but all of them. The
        frame takes <code>label</code> (names it and makes it a
        <code>group</code>) and <code>inert</code> (the subject is a specimen: no pointer, no focus,
        no keyboard). The geometry is pure and lives in <code>@skryensya/core/annotation</code>; both
        bindings only measure with a <code>ResizeObserver</code> and write a <code>translate</code>
        per label plus each leader's <code>d</code>, so the drawing is redone whenever the container
        changes size. Its stylesheet is <code>components/annotation.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de annotation quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>21</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: annotation's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>21</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: El contrato declara el rango de sus números
      body: >-
        <code>ringDistance</code> y <code>ringRadius</code> no bajan de 0. Un valor fuera de rango deja de validar en vez de llegar al binding.
    en:
      title: The contract declares the range of its numbers
      body: >-
        <code>ringDistance</code> and <code>ringRadius</code> do not go below 0. A value out of range stops validating instead of reaching the binding.
  - date: 2026-09-19
    kind: feature
    target: Annotated
    es:
      title: Un pie de leyenda para el diagrama, en la esquina que nunca se usa
      body: >-
        Slot <code>key</code> y parte <code>sk-annotated__key</code>: una línea abajo a la izquierda sobre el dibujo entero, típicamente qué significa una
        abreviatura de las etiquetas ("* = sk-file-upload"). Existe porque un nombre de parte es bloque más elemento, y un diagrama de diez partes repite el
        bloque diez veces en sus márgenes, donde cada repetición se le cobra al ancho del sujeto: medido en FileUpload, solo el prefijo repetido apretaba el
        espécimen de 480px a 292px. Las cuatro etiquetas van a los puntos medios de los bordes, así que las cuatro esquinas están libres por construcción y
        la leyenda no puede chocar con ninguna.
    en:
      title: A key for the diagram, in the corner nothing else uses
      body: >-
        A <code>key</code> slot and a <code>sk-annotated__key</code> part: one line in the bottom-left about the drawing as a whole, usually what a shorthand
        in the labels stands for ("* = sk-file-upload"). It exists because a part name is a block plus an element, and a diagram of ten parts repeats that
        block ten times in its margins, where every repetition is charged to the subject's width: measured on FileUpload, the repeated prefix alone squeezed
        the specimen from 480px to 292px. Labels go to the four edge midpoints, so all four corners are free by construction and a key cannot collide with one.
  - date: 2026-09-22
    kind: feature
    target: Annotated
    es:
      title: Modo numerado, con los nombres en una leyenda debajo
      body: >-
        Opción <code>numbered</code> y partes <code>sk-annotated__legend</code> y <code>sk-annotated__legend-item</code>: cada burbuja lleva sólo su número
        (un contador de CSS) y los nombres pasan a un <code>&lt;ol&gt;</code> debajo del marco. Las guías y los anillos no cambian, y leer una entrada de la
        lista enciende su número, su guía y su parte. Las burbujas quedan <code>aria-hidden</code> y el foco pasa a las entradas. Un marco numerado no se
        apila en pantallas angostas: sus márgenes miden una burbuja, así que cada número se queda al lado de su parte.
    en:
      title: A numbered mode, with the names in a legend below
      body: >-
        A <code>numbered</code> option and <code>sk-annotated__legend</code> and <code>sk-annotated__legend-item</code> parts: each bubble carries only its
        number (a CSS counter) and the names move to an <code>&lt;ol&gt;</code> under the frame. Leaders and rings are unchanged, and reading a list entry
        lights its number, its leader and its part. The bubbles become <code>aria-hidden</code> and focus moves to the entries. A numbered frame does not
        stack on narrow screens: its gutters are one bubble wide, so every number stays beside its part.
  - date: 2026-09-22
    kind: rework
    target: Annotated
    es:
      title: El anillo sólo aparece en la marca que se está leyendo
      body: >-
        En reposo ya no se dibuja ningún anillo; queda sólo la guía en gris. El anillo aparece, en acento, al pasar el puntero por la etiqueta o por la parte,
        o al enfocar la etiqueta.
    en:
      title: The ring only appears on the mark being read
      body: >-
        No ring is drawn at rest any more; only the grey leader remains. The ring appears, in accent, when the label or the part is hovered, or the label is
        focused.
  - date: 2026-09-23
    kind: rework
    target: Annotated
    es:
      title: Las etiquetas prefieren una guía recta
      body: >-
        Al repartir las etiquetas de un margen, cada una se mantiene, si hay lugar, en el tramo desde el cual su guía llega al anillo en un solo segmento, y
        es la vecina con más holgura la que se corre. Una guía sólo dobla cuando ninguna distribución deja recta a todas.
    en:
      title: Labels prefer a straight leader
      body: >-
        When a gutter's labels are distributed, each one stays, where there is room, within the stretch from which its leader reaches the ring in a single
        segment, and the neighbour with more slack is the one that moves. A leader only bends when no arrangement keeps them all straight.
  - date: 2026-09-23
    kind: feature
    target: Annotated
    es:
      title: Corchetes para las partes que son un área
      body: >-
        Opción por etiqueta <code>mark</code>: con <code>bracket</code>, la parte se marca con una línea paralela a su lado, del mismo largo, con un tick
        perpendicular en cada extremo y la etiqueta sobre su centro, en lugar de una guía hacia el hijo que caiga en el medio. Es para contenedores: un
        acordeón, uno de sus ítems, un panel abierto. Los corchetes que se solaparían se apilan en pistas hacia afuera, y un contenedor queda siempre por
        fuera de lo que contiene; dos partes que sólo se tocan en un extremo comparten pista, encadenadas. El margen reserva su espacio con <code>--sk-annotated-room-*</code>. En el layout apilado de pantallas angostas, vuelve
        a ser un anillo.
    en:
      title: Brackets for parts that are an area
      body: >-
        A per-label <code>mark</code> option: with <code>bracket</code>, the part is marked by a line parallel to its side, exactly as long, with a
        perpendicular tick at each end and the label on its middle, instead of a leader into whichever child sits there. It is for containers: an
        accordion, one of its items, an open panel. Brackets that would overlap stack outward in tracks, and a container always sits outside what it
        contains; two parts that only meet end to end share a track, chained. The gutter reserves their room through <code>--sk-annotated-room-*</code>. In the narrow-screen stacked layout it falls back to a ring.
  - date: 2026-09-23
    kind: breaking
    target: Annotated
    es:
      title: El host es una figura, y la leyenda vive fuera del marco
      body: >-
        El host pasa a ser <code>sk-annotated-figure</code>, que contiene el marco <code>sk-annotated</code> (la grilla del dibujo) y, como hermana y no
        como celda de esa grilla, la leyenda de <code>numbered</code>. La leyenda se lee en columnas hacia abajo (1, 2, 3 por la primera y sigue arriba de
        la segunda), con un máximo de dos. Los hooks se declaran en la figura para que la leyenda los herede; el markup escrito a mano que monta
        <code>data-sk-annotated</code> sobre el marco sigue funcionando. Con leyenda, la figura es una tarjeta de dos bandas: el dibujo sobre la superficie y,
        debajo de una línea, la leyenda sobre un fondo hundido (<code>--sk-annotated-surface-bg</code>, <code>--sk-annotated-legend-bg</code>, <code>--sk-annotated-figure-inset</code>).
    en:
      title: The host is a figure, and the legend lives outside the frame
      body: >-
        The host is now <code>sk-annotated-figure</code>, holding the <code>sk-annotated</code> frame (the drawing's grid) and, as a sibling rather than a
        cell of that grid, the <code>numbered</code> legend. The legend reads in columns downward (1, 2, 3 down the first, carrying on at the top of the
        second), two at most. Hooks are declared on the figure so the legend inherits them; hand-written markup that mounts <code>data-sk-annotated</code>
        on the frame keeps working. With a legend, the figure is a card of two bands: the drawing on the surface and, below a hairline, the legend on a sunken
        ground (<code>--sk-annotated-surface-bg</code>, <code>--sk-annotated-legend-bg</code>, <code>--sk-annotated-figure-inset</code>).
  - date: 2026-09-23
    kind: feature
    target: Annotated
    es:
      title: Un diagrama con zoom para leerlo en el teléfono
      body: >-
        Opción <code>zoomable</code>: el marco se pone dentro de un <code>Canvas</code>, se diseña a su propio ancho y se muestra ajustado, con zoom y
        desplazamiento (arrastrar, Ctrl/Cmd + rueda, dos dedos, <code>+</code>/<code>-</code>/<code>0</code>). La leyenda queda afuera, sin escalar. Las
        guías se miden en las coordenadas propias del marco, así que siguen sobre sus partes a cualquier zoom. Etiquetas <code>zoomInLabel</code>,
        <code>zoomOutLabel</code>, <code>fitLabel</code> y avisos <code>touchHint</code>, <code>wheelHint</code>.
    en:
      title: A zoomable diagram, legible on a phone
      body: >-
        A <code>zoomable</code> option: the frame goes inside a <code>Canvas</code>, laid out at its own width and shown fitted, with zoom and pan (drag,
        Ctrl/Cmd + wheel, two fingers, <code>+</code>/<code>-</code>/<code>0</code>). The legend stays outside, unscaled. Leaders are measured in the
        frame's own coordinates, so they stay on their parts at any zoom. <code>zoomInLabel</code>, <code>zoomOutLabel</code>, <code>fitLabel</code>
        labels and <code>touchHint</code>, <code>wheelHint</code> hints.
