# What changed in kbd, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "30761bf91ac36284"
entries:
  - date: 2026-10-25
    kind: breaking
    target: appearance
    es:
      title: "Cada apariencia tiene su propia hoja"
      body: "Las reglas de `brutalist` pasan de kbd.css a kbd.brutalist.css. Importa la hoja del valor que uses; sin ella, ese valor no recibe su pintura. Los hooks siguen declarados en kbd.css."
    en:
      title: "Each appearance has its own stylesheet"
      body: "The rules for `brutalist` move from kbd.css to kbd.brutalist.css. Import the sheet for the value you use; without it, that value does not get its paint. The hooks are still declared in kbd.css."
  - date: 2026-10-02
    kind: bugfix
    es:
      title: Kbd publica el hook de sus iconos estrechos
      body: El contrato ahora declara <code>--sk-kbd-icon</code>, el hook interno que alimenta los glifos de flechas y Enter.
    en:
      title: Kbd publishes the hook for its narrow icons
      body: The contract now declares <code>--sk-kbd-icon</code>, the internal hook that feeds the arrow and Enter glyphs.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y una hoja de estilos para marcado simple."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a stylesheet for plain markup."
