# What changed in kbd, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "fbf500587e92805a"
entries:
  - date: 2026-10-02
    kind: bugfix
    es:
      title: Kbd publica el hook de sus iconos estrechos
      body: El contrato ahora declara <code>--sk-kbd-icon</code>, el hook interno que alimenta los glifos de flechas y Enter.
    en:
      title: Kbd publishes the hook for its narrow icons
      body: The contract now declares <code>--sk-kbd-icon</code>, the internal hook that feeds the arrow and Enter glyphs.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: Representa teclas y combinaciones de teclado dentro del contenido.
    en:
      title: First release
      body: Represents keys and keyboard combinations inside content.
