# What changed in dialog, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "2bbf41792ff83510"
entries:
  - date: 2026-10-25
    kind: breaking
    target: appearance
    es:
      title: "Cada apariencia tiene su propia hoja"
      body: "Las reglas de `brutalist`, `frosted` pasan de dialog.css a dialog.brutalist.css, dialog.frosted.css. Importa la hoja del valor que uses; sin ella, ese valor no recibe su pintura. Los hooks siguen declarados en dialog.css."
    en:
      title: "Each appearance has its own stylesheet"
      body: "The rules for `brutalist`, `frosted` move from dialog.css to dialog.brutalist.css, dialog.frosted.css. Import the sheet for the value you use; without it, that value does not get its paint. The hooks are still declared in dialog.css."
  - date: 2026-10-17
    kind: feature
    es:
      title: "--sk-dialog-exit-duration: cerrar sin animación, en una línea"
      body: "Nuevo par de hooks (duration/easing) que la transición de salida lee en vez de la compartida --motion-exit-duration. En 0s, un diálogo que se cierra porque la página detrás ya navegó no se demora esperando su propia salida."
    en:
      title: "--sk-dialog-exit-duration: closing with no animation, in one line"
      body: "New pair of hooks (duration/easing) the exit transition reads instead of the shared --motion-exit-duration. At 0s, a dialog closing because the page behind it already navigated does not linger waiting on its own exit."
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
