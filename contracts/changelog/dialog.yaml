# Qué cambió en dialog, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribí la entrada y pegá el
# hash nuevo.
surface: "88b75e89f4f07519"
entries:
  - date: 2026-08-22
    kind: bugfix
    es:
      title: El marco deja de leerse como alto contraste, y la entrada coincide con Popover
      body: >-
        El borde usaba <code>--color-border-default</code>, el mismo peldaño que el modo HC, así que
        un dialog cotidiano se veía recuadrado. Ahora lee <code>--color-border-subtle</code> (como
        Menu y Popover); el ancho sigue en 1px porque en HC el panel y la página siguen siendo el
        mismo relleno. La entrada materializa con los tokens compartidos (opacidad, escala, blur y
        un drop corto) y el backdrop ya no aparece de golpe.
    en:
      title: The frame no longer reads as high contrast, and enter matches Popover
      body: >-
        The border used <code>--color-border-default</code>, the same rung high-contrast mode uses,
        so an everyday dialog looked framed. It now reads <code>--color-border-subtle</code> (like
        Menu and Popover); the width stays 1px because in HC the panel and the page are still the
        same fill. Enter materialises with the shared tokens (opacity, scale, blur and a short drop)
        and the backdrop no longer snaps in.
  - date: 2026-08-14
    kind: feature
    target: alert
    es:
      title: Nueva opción alert para el patrón Alert Dialog
      body: >-
        <code>alert</code> pone <code>role="alertdialog"</code>, <code>aria-modal="true"</code> y
        <code>aria-describedby</code> apuntando al body, para una confirmación destructiva o un
        error bloqueante que necesita atención inmediata. El foco sigue siendo del consumidor:
        poné <code>autofocus</code> en la acción menos destructiva.
    en:
      title: New alert option for the Alert Dialog pattern
      body: >-
        <code>alert</code> sets <code>role="alertdialog"</code>, <code>aria-modal="true"</code> and
        <code>aria-describedby</code> pointing at the body, for a destructive confirmation or a
        blocking error that needs immediate attention. Focus is still the consumer's: put
        <code>autofocus</code> on the least destructive action.
  - date: 2026-08-14
    kind: bugfix
    target: title
    es:
      title: El título ahora nombra el diálogo por aria-labelledby
      body: >-
        Sin esto, un lector de pantalla anunciaba "dialog" en vez del título: <code>&lt;dialog&gt;</code>
        no obtiene nombre accesible de un <code>&lt;h2&gt;</code> anidado por sí solo.
    en:
      title: The title now names the dialog via aria-labelledby
      body: >-
        Without this, a screen reader announced "dialog" instead of the title: <code>&lt;dialog&gt;</code>
        gets no accessible name from a nested <code>&lt;h2&gt;</code> on its own.
  - date: 2026-08-11
    kind: feature
    es:
      title: Dialog se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Dialog</code>: los dos bindings lo realizan, y la referencia de esta
        página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el markup
        está completo por sí solo, así que las dos bindings son el mismo markup dos veces. Opciones:
        <code>closeLabel</code>, <code>open</code>, <code>vaul</code>. La hoja es
        <code>components/dialog.css</code>.
    en:
      title: Dialog is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Dialog</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        Options: <code>closeLabel</code>, <code>open</code>, <code>vaul</code>. Its stylesheet is
        <code>components/dialog.css</code>.