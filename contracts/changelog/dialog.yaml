# What changed in dialog, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "94613cc44aad7936"
entries:
  - date: 2026-09-17
    kind: feature
    es:
      title: Firmas interactivas declaran forward
      body: >-
        Las firmas host interactivas o de formulario publican <code>forward</code>
        (<code>id</code>/<code>aria-*</code> y attrs de enlace o formulario cuando aplica).
        Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: Interactive signatures declare forward
      body: >-
        Interactive or form host signatures publish <code>forward</code>
        (<code>id</code>/<code>aria-*</code> and link or form attrs where relevant).
        An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: feature
    es:
      title: Dialog declara compose de Button e Icon en el cierre
      body: >-
        <code>compose</code> documenta el botón de cierre como Button + Icon
        <code>systemOwned</code> (antes sólo <code>also: sk-button</code>). Las hojas de Button
        siguen resolviéndose por <code>also</code>.
    en:
      title: Dialog declares compose of Button and Icon on close
      body: >-
        <code>compose</code> documents the close control as Button + Icon
        <code>systemOwned</code> (previously only <code>also: sk-button</code>). Button sheets
        still resolve via <code>also</code>.
  - date: 2026-09-16
    kind: bugfix
    target: closeLabel
    es:
      title: Dialog declara dialog-vaul.css y closeLabel como aria-label
      body: >-
        <code>hookSheets</code> nombra <code>patterns/dialog-vaul.css</code> para que las stages
        carguen la composición cuando un árbol usa <code>vaul</code>. <code>closeLabel</code>
        publica <code>aria-label</code> en el botón de cierre (como <code>Tag.removeLabel</code>),
        sin <code>data-close-label</code> ni <code>machineInput</code>. React exige
        <code>title</code> string y <code>children</code> como el contrato.
    en:
      title: Dialog names dialog-vaul.css and closeLabel as aria-label
      body: >-
        <code>hookSheets</code> names <code>patterns/dialog-vaul.css</code> so stages load the
        composition when a tree opts into <code>vaul</code>. <code>closeLabel</code> publishes
        <code>aria-label</code> on the close button (like <code>Tag.removeLabel</code>), without
        <code>data-close-label</code> or <code>machineInput</code>. React requires a string
        <code>title</code> and <code>children</code> to match the contract.
  - date: 2026-08-22
    kind: bugfix
    es:
      title: El marco deja de leerse como alto contraste, y la entrada coincide con Popover
      body: >-
        El borde usaba <code>--color-border-default</code>, el mismo peldaño que el modo HC, así que
        un dialog cotidiano se veía recuadrado. Ahora lee <code>--color-border-subtle</code> (como
        Menu y Popover); el ancho sigue en 1px porque en HC el panel y la página siguen siendo el
        mismo relleno. La entrada materializa con los tokens compartidos (opacidad, escala, blur y
        un drop corto) y el backdrop ya no aparece de golpe.
    en:
      title: The frame no longer reads as high contrast, and enter matches Popover
      body: >-
        The border used <code>--color-border-default</code>, the same rung high-contrast mode uses,
        so an everyday dialog looked framed. It now reads <code>--color-border-subtle</code> (like
        Menu and Popover); the width stays 1px because in HC the panel and the page are still the
        same fill. Enter materialises with the shared tokens (opacity, scale, blur and a short drop)
        and the backdrop no longer snaps in.
  - date: 2026-08-14
    kind: feature
    target: alert
    es:
      title: Nueva opción alert para el patrón Alert Dialog
      body: >-
        <code>alert</code> pone <code>role="alertdialog"</code>, <code>aria-modal="true"</code> y
        <code>aria-describedby</code> apuntando al body, para una confirmación destructiva o un
        error bloqueante que necesita atención inmediata. El foco sigue siendo del consumidor:
        pon <code>autofocus</code> en la acción menos destructiva.
    en:
      title: New alert option for the Alert Dialog pattern
      body: >-
        <code>alert</code> sets <code>role="alertdialog"</code>, <code>aria-modal="true"</code> and
        <code>aria-describedby</code> pointing at the body, for a destructive confirmation or a
        blocking error that needs immediate attention. Focus is still the consumer's: put
        <code>autofocus</code> on the least destructive action.
  - date: 2026-08-14
    kind: bugfix
    target: title
    es:
      title: El título ahora nombra el diálogo por aria-labelledby
      body: >-
        Sin esto, un lector de pantalla anunciaba "dialog" en vez del título: <code>&lt;dialog&gt;</code>
        no obtiene nombre accesible de un <code>&lt;h2&gt;</code> anidado por sí solo.
    en:
      title: The title now names the dialog via aria-labelledby
      body: >-
        Without this, a screen reader announced "dialog" instead of the title: <code>&lt;dialog&gt;</code>
        gets no accessible name from a nested <code>&lt;h2&gt;</code> on its own.
  - date: 2026-08-11
    kind: feature
    es:
      title: Dialog se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Dialog</code>: los dos bindings lo realizan, y la referencia de esta
        página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el markup
        está completo por sí solo, así que las dos bindings son el mismo markup dos veces. Opciones:
        <code>closeLabel</code>, <code>open</code>, <code>vaul</code>. La hoja es
        <code>components/dialog.css</code>.
    en:
      title: Dialog is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Dialog</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        Options: <code>closeLabel</code>, <code>open</code>, <code>vaul</code>. Its stylesheet is
        <code>components/dialog.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de dialog quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>13</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: dialog's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>13</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Los textos por defecto pasan a inglés
      body: >-
        El kit es una librería en inglés y sus defaults estaban en español: <code>closeLabel</code> Close. Una interfaz en
        otro idioma pasa sus propios textos, y el <code>locale</code> que corresponda.
    en:
      title: Default texts move to English
      body: >-
        The kit is an English library and its defaults were Spanish: <code>closeLabel</code> Close. An interface in another
        language passes its own texts, and the <code>locale</code> it needs.
