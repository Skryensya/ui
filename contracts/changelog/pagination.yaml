# What changed in pagination, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "2cb8049a7911d0fa"
entries:
  - date: 2026-08-22
    kind: bugfix
    es:
      title: La página actual es una tecla raised, no un botón primary
      body: >-
        <code>aria-current="page"</code> pintaba <code>--color-action-accent</code> y texto
        on-accent, un Submit azul en una fila de ghosts. Ahora es superficie raised, texto
        primario y el mismo bisel de tres capas que Kbd y Segmented. No hay opción nueva: el
        default marca el lugar sin gritar marca.
    en:
      title: The current page is a raised key, not a action button
      body: >-
        <code>aria-current="page"</code> painted <code>--color-action-accent</code> and on-accent
        text, a blue Submit sitting in a row of ghosts. It is now a raised surface, primary text
        and the same three-layer bevel Kbd and Segmented use. No new option: the default marks
        the place without shouting brand.
  - date: 2026-08-11
    kind: feature
    es:
      title: Pagination se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Pagination</code>: los dos bindings lo realizan, y la referencia de
        esta página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el
        markup está completo por sí solo, así que las dos bindings son el mismo markup dos veces.
        Opciones: <code>page</code>, <code>total</code>, <code>siblings</code>, <code>label</code>,
        <code>previousLabel</code>, <code>nextLabel</code>. La hoja es
        <code>components/pagination.css</code>.
    en:
      title: Pagination is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Pagination</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        Options: <code>page</code>, <code>total</code>, <code>siblings</code>, <code>label</code>,
        <code>previousLabel</code>, <code>nextLabel</code>. Its stylesheet is
        <code>components/pagination.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de pagination quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>25</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: pagination's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>25</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
