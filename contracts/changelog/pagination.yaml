# Qué cambió en pagination, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribí la entrada y pegá el
# hash nuevo.
surface: "5aeb996747e14e63"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: Pagination se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Pagination</code>: los dos bindings lo realizan, y la referencia de
        esta página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el
        markup está completo por sí solo, así que las dos bindings son el mismo markup dos veces.
        Opciones: <code>page</code>, <code>total</code>, <code>siblings</code>, <code>label</code>,
        <code>previousLabel</code>, <code>nextLabel</code>. La hoja es
        <code>components/pagination.css</code>.
    en:
      title: Pagination is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Pagination</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        Options: <code>page</code>, <code>total</code>, <code>siblings</code>, <code>label</code>,
        <code>previousLabel</code>, <code>nextLabel</code>. Its stylesheet is
        <code>components/pagination.css</code>.