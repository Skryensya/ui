# What changed in pagination, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "dcb977326aa314e2"
entries:
  - date: 2026-09-17
    kind: feature
    es:
      title: Firmas interactivas declaran forward
      body: >-
        Las firmas host interactivas o de formulario publican <code>forward</code>
        (<code>id</code>/<code>aria-*</code> y attrs de enlace o formulario cuando aplica).
        Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: Interactive signatures declare forward
      body: >-
        Interactive or form host signatures publish <code>forward</code>
        (<code>id</code>/<code>aria-*</code> and link or form attrs where relevant).
        An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: feature
    es:
      title: eventDetails nombra source y trigger
      body: >-
        <code>eventDetails</code> declara <code>source</code> (parte que despacha el CustomEvent) y, cuando es claro, <code>trigger</code> (parte que el usuario activa). Un agente sabe dónde escuchar y qué control provoca el evento.
    en:
      title: eventDetails names source and trigger
      body: >-
        <code>eventDetails</code> declares <code>source</code> (part that dispatches the CustomEvent) and, when clear, <code>trigger</code> (part the user activates). An agent knows where to listen and which control causes the event.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-08-22
    kind: bugfix
    es:
      title: La página actual es una tecla raised, no un botón primary
      body: >-
        <code>aria-current="page"</code> pintaba <code>--color-action-accent</code> y texto
        on-accent, un Submit azul en una fila de ghosts. Ahora es superficie raised, texto
        primario y el mismo bisel de tres capas que Kbd y Segmented. No hay opción nueva: el
        default marca el lugar sin gritar marca.
    en:
      title: The current page is a raised key, not a action button
      body: >-
        <code>aria-current="page"</code> painted <code>--color-action-accent</code> and on-accent
        text, a blue Submit sitting in a row of ghosts. It is now a raised surface, primary text
        and the same three-layer bevel Kbd and Segmented use. No new option: the default marks
        the place without shouting brand.
  - date: 2026-08-11
    kind: feature
    es:
      title: Pagination se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Pagination</code>: los dos bindings lo realizan, y la referencia de
        esta página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el
        markup está completo por sí solo, así que las dos bindings son el mismo markup dos veces.
        Opciones: <code>page</code>, <code>total</code>, <code>siblings</code>, <code>label</code>,
        <code>previousLabel</code>, <code>nextLabel</code>. La hoja es
        <code>components/pagination.css</code>.
    en:
      title: Pagination is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Pagination</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        Options: <code>page</code>, <code>total</code>, <code>siblings</code>, <code>label</code>,
        <code>previousLabel</code>, <code>nextLabel</code>. Its stylesheet is
        <code>components/pagination.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de pagination quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>25</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: pagination's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>25</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: El contrato declara el rango de sus números
      body: >-
        <code>page</code> y <code>total</code> son enteros desde 1 y <code>siblings</code> desde 0. Un valor fuera de rango deja de validar en vez de llegar al binding.
    en:
      title: The contract declares the range of its numbers
      body: >-
        <code>page</code> and <code>total</code> are whole numbers from 1 and <code>siblings</code> from 0. A value out of range stops validating instead of reaching the binding.
  - date: 2026-09-17
    kind: feature
    es:
      title: El contrato publica pageChange
      body: >-
        <code>events.pageChange</code> es <code>sk:paginationpagechange</code> (detail <code>{ page }</code>). React lo despacha en la raíz; no hay enhancer Vanilla porque el markup del rango ya es estático.
    en:
      title: The contract publishes pageChange
      body: >-
        <code>events.pageChange</code> is <code>sk:paginationpagechange</code> (detail <code>{ page }</code>). React dispatches it on the root; there is no Vanilla enhancer because the range markup is already static.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: page no supera total
      body: >-
        Una página mayor que el total deja de validar.
    en:
      title: page does not pass total
      body: >-
        A page past the total stops validating.
