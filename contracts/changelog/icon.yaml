# What changed in icon, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "37cc733011b5ce87"
entries:
  - date: 2026-11-23
    kind: feature
    target: name
    es:
      title: Una marca para Gallery
      body: 'Nuevo rol <code>component-gallery</code>: la marca de Gallery, varias fotos apiladas en cada colección.'
    en:
      title: A mark for Gallery
      body: 'New role <code>component-gallery</code>: the Gallery''s mark, a stack of photos in every collection.'
  - date: 2026-11-23
    kind: feature
    target: name
    es:
      title: Un rol para guardar
      body: 'Nuevo rol <code>favorite</code>: guardar algo para volver a verlo (una lista de deseos, un elemento guardado). Un corazón en cada colección. No es <code>like</code>, que es aprobar lo que dijo otro.'
    en:
      title: A role for keeping
      body: 'New role <code>favorite</code>: keeping something to come back to (a wishlist, a saved item). A heart in every collection. Not <code>like</code>, which approves of what someone else said.'
  - date: 2026-11-23
    kind: feature
    target: name
    es:
      title: Logos de marcas
      body: 'Nombres <code>brand-github</code>, <code>brand-x</code>, <code>brand-instagram</code> y 21 más. Opcionales en un set como las marcas de componentes: <code>skryensya icons &lt;set&gt; --brands</code> los escribe, con el logo de la propia colección cuando lo tiene (comparte su trazo) y el de Tabler cuando no.'
    en:
      title: Brand logos
      body: 'Names <code>brand-github</code>, <code>brand-x</code>, <code>brand-instagram</code> and 21 more. Optional in a set like the component marks: <code>skryensya icons &lt;set&gt; --brands</code> writes them, with the collection’s own logo where it has one (it shares its stroke) and Tabler’s where it does not.'
  - date: 2026-11-23
    kind: feature
    target: name
    es:
      title: Expandir todo y contraer todo
      body: "Nuevos roles <code>expand-all</code> y <code>collapse-all</code>: abrir o cerrar todas las secciones de una lista a la vez. Un doble caret hacia abajo o hacia arriba, en cada colección. Además, un icono con <code>hidden</code> ahora sí se oculta."
    en:
      title: Expand all and collapse all
      body: "New roles <code>expand-all</code> and <code>collapse-all</code>: opening or closing every section of a list at once. A double caret pointing down or up, in every collection. Also, an icon with <code>hidden</code> is now actually hidden."
  - date: 2026-11-22
    kind: feature
    target: name
    es:
      title: Una marca para Magnifier
      body: "Nuevo rol <code>component-magnifier</code>: la marca de la lupa, una lupa con un signo más en cada colección."
    en:
      title: A mark for Magnifier
      body: "New role <code>component-magnifier</code>: the Magnifier's mark, a magnifying glass with a plus in every collection."
  - date: 2026-11-20
    kind: feature
    target: name
    es:
      title: Una marca por componente del kit
      body: "Nuevos roles <code>component-*</code> (<code>component-carousel</code>, <code>component-qr-code</code>…), uno por componente, para un catálogo o un sidebar. Son opcionales en un set: <code>skryensya icons &lt;set&gt; --components</code> los escribe, y todos los presets los dibujan."
    en:
      title: One mark per kit component
      body: "New <code>component-*</code> roles (<code>component-carousel</code>, <code>component-qr-code</code>…), one per component, for a catalogue or a sidebar. Optional in a set: <code>skryensya icons &lt;set&gt; --components</code> writes them, and every preset draws them."
  - date: 2026-11-20
    kind: breaking
    es:
      title: Los sets vienen de Iconify y no hay uno por defecto
      body: "Los paquetes <code>@skryensya/icons-*</code> ya no existen y React no trae Lucide. Instalas <code>@iconify-json/&lt;set&gt;</code> como dependencia de desarrollo y <code>skryensya icons &lt;set&gt;</code> escribe solo los roles en tu proyecto. Receta en <code>docs/migrations/0003-icons-from-iconify.md</code>."
    en:
      title: Sets come from Iconify, and there is no default
      body: "The <code>@skryensya/icons-*</code> packages are gone and React no longer ships Lucide. Install <code>@iconify-json/&lt;set&gt;</code> as a dev dependency and <code>skryensya icons &lt;set&gt;</code> writes only the roles into your project. Recipe in <code>docs/migrations/0003-icons-from-iconify.md</code>."
  - date: 2026-10-17
    kind: feature
    target: name
    es:
      title: Tres roles de icono para la navegación por archivos
      body: Nuevos roles <code>home</code>, <code>file-text</code> y <code>folder-open</code>, dibujados por los tres sets publicados (Lucide, Material, Phosphor).
    en:
      title: Three icon roles for file navigation
      body: New roles <code>home</code>, <code>file-text</code> and <code>folder-open</code>, drawn by all three published sets (Lucide, Material, Phosphor).
  - date: 2026-10-02
    kind: feature
    target: name
    es:
      title: Nuevo rol de icono mask
      body: "<code>mask</code> es el símbolo que ocupa el lugar de un carácter oculto: lo dibuja <code>OtpInput</code> sobre cada casilla llena cuando el código está enmascarado."
    en:
      title: New icon role mask
      body: "<code>mask</code> is the symbol that stands in for a hidden character: <code>OtpInput</code> draws it over each filled box when the code is masked."
  - date: 2026-10-09
    kind: feature
    target: name
    es:
      title: Ocho roles de icono para los controles de un reproductor
      body: Nuevos roles <code>play</code>, <code>pause</code>, <code>replay</code>, <code>volume</code>, <code>volume-muted</code>, <code>captions</code>, <code>fullscreen</code> y <code>fullscreen-exit</code>.
    en:
      title: Eight icon roles for a player's controls
      body: New roles <code>play</code>, <code>pause</code>, <code>replay</code>, <code>volume</code>, <code>volume-muted</code>, <code>captions</code>, <code>fullscreen</code> and <code>fullscreen-exit</code>.
  - date: 2026-10-09
    kind: feature
    target: name
    es:
      title: Dos roles de icono para moverse por una lista de pistas
      body: "Nuevos roles <code>track-previous</code> y <code>track-next</code>: la pista anterior y la siguiente de un reproductor."
    en:
      title: Two icon roles for moving along a list of tracks
      body: "New roles <code>track-previous</code> and <code>track-next</code>: the track before and after the current one in a player."
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
