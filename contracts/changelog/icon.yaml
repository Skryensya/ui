# What changed in icon, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "74eb4b77c0cd5ff1"
entries:
  - date: 2026-09-05
    kind: feature
    es:
      title: El vocabulario estable gana vote-up y vote-down
      body: >-
        Dos roles nuevos para la acción de votar, que ya cubren los tres sets publicados. Son ROLES y
        no dibujos, que es lo que esta lista pide: Lucide ocupa el rol con `ArrowBigUp`, Phosphor con
        `arrow-fat-up` y Material ni siquiera dibuja una flecha, dibuja un pulgar. Tres dibujos
        distintos para una sola intención es exactamente el caso que el vocabulario existe para
        resolver, y por eso el nombre no es `arrow-big-up`: ese es el nombre que UN set le da al
        dibujo, y dejaría a los otros dos publicando un icono que se llama como algo que no dibujan.
        Como `IconSet` es completo, agregar un rol es aditivo para quien consume y trabajo nuevo para
        quien dibuja un set: los tres del repo ya lo traen.
    en:
      title: The stable vocabulary gains vote-up and vote-down
      body: >-
        Two new roles for the act of voting, already covered by all three published sets. They are
        ROLES and not drawings, which is what this list asks for: Lucide fills the role with
        `ArrowBigUp`, Phosphor with `arrow-fat-up`, and Material does not draw an arrow at all, it
        draws a thumb. Three different drawings for one intention is exactly the case the vocabulary
        exists to resolve, and it is why the name is not `arrow-big-up`: that is what ONE set calls
        the drawing, and it would leave the other two publishing an icon named after something they
        do not draw. Because `IconSet` is complete, adding a role is additive for a consumer and new
        work for whoever draws a set; all three in this repo already ship it.
  - date: 2026-09-02
    kind: feature
    target: name
    es:
      title: El rol language se enlaza en todos los sets
      body: >-
        <code>language</code> nombra elegir el idioma de una app, no un dibujo: lo cubren los tres
        sets publicados (Lucide lo dibuja como dos trazos de escritura, Phosphor y Material como un
        par <code>A文</code>).
    en:
      title: The language role is linked by every icon set
      body: >-
        <code>language</code> names picking an app's language, not a drawing: all three published
        sets cover it (Lucide draws it as two script strokes, Phosphor and Material as an
        <code>A文</code> pair).
  - date: 2026-08-21
    kind: feature
    target: name
    es:
      title: El rol zoom-out se enlaza en todos los sets
      body: >-
        <code>zoom-out</code> nombra alejar la vista, no una lupa. Los tres sets publicados lo
        cubren.
    en:
      title: The zoom-out role is linked by every icon set
      body: >-
        <code>zoom-out</code> names pulling the view back, not a magnifying glass. All three
        published sets cover it.
  - date: 2026-08-05
    kind: feature
    target: name
    es:
      title: Los roles file y folder se enlazan en todos los sets
      body: >-
        <code>file</code> y <code>folder</code> nombran la estructura de un explorador sin clasificar
        cada extensión. Los tres sets publicados los cubren.
    en:
      title: File and folder roles are linked by every icon set
      body: >-
        <code>file</code> and <code>folder</code> name file-browser structure without classifying
        every extension. All three published sets cover them.
