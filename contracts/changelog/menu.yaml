# Qué cambió en menu, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribí la entrada y pegá el
# hash nuevo.
surface: "20ef55911e9a836e"
entries:
  - date: 2026-08-16
    kind: feature
    target: triggerLabel
    es:
      title: Nueva opción triggerLabel; el trigger ya no exige contenido visible
      body: >-
        Se agrega <code>triggerLabel</code>: el nombre accesible del BOTÓN trigger en sí, distinto
        de <code>label</code> a propósito. <code>label</code> es una descripción más completa del
        menú como un todo ("Acciones del archivo" contra un trigger visible más corto, "Acciones");
        reusarla en el botón habría pisado su propio texto visible con una cadena DISTINTA, un
        desajuste "Label in Name" (WCAG 2.5.3) entre lo que lee una persona y lo que anuncia un
        lector de pantalla. Pensada para el trigger de solo-ícono — el patrón real de un split
        button (el segmento del menú es sólo el chevron, sin texto) o el botón "más acciones" de
        una barra de herramientas — que hasta ahora no tenía forma correcta de anunciar un nombre.
        El slot <code>trigger</code> deja de ser obligatorio: se puede omitir del todo y dejar que
        el chevron que el template ya pinta sea el único contenido visible, nombrado por esta
        opción en vez de por su propio texto.
    en:
      title: New triggerLabel option; the trigger no longer requires visible content
      body: >-
        Adds <code>triggerLabel</code>: the TRIGGER BUTTON's own accessible name, deliberately
        separate from <code>label</code>. <code>label</code> is a fuller description of the menu
        as a whole ("File actions" against a shorter visible trigger, "Actions"); reusing it on the
        button would have overwritten its own visible text with a DIFFERENT string, a "Label in
        Name" mismatch (WCAG 2.5.3) between what a sighted user reads and what a screen reader
        announces. Built for the icon-only trigger — the real split-button pattern (the menu half
        is just a chevron, no text) or a toolbar's "more actions" button — which had no correct way
        to announce a name until now. The <code>trigger</code> slot is no longer required: it can
        be left empty entirely, letting the chevron the template already paints be the only visible
        content, named by this option instead of by its own text.
  - date: 2026-08-13
    kind: bugfix
    target: debugSafetyTriangle
    es:
      title: El safe area de un submenú ahora lo sostiene de verdad
      body: >-
        Cruzar en diagonal hacia un submenú abierto ya no lo cierra ni resalta la fila de abajo. El
        polígono de <code>@zag-js/menu</code> no alcanzaba: sólo puede vetar un cierre temprano
        durante los 100ms de <code>waitForCloseDelay</code>, no extenderlos, así que con el puntero
        quieto adentro del polígono el submenú igual se cerraba a los ~90ms. Ahora hay un elemento
        real —un triángulo recortado con <code>clip-path</code> dentro del trigger— así que el
        navegador nunca dispara <code>pointerleave</code> mientras se cruza y el temporizador ni se
        enciende. Vale para cualquier profundidad. Nuevas partes: <code>sk-menu__safe-area</code>,
        <code>sk-menu__intent-readout</code>. <code>debugSafetyTriangle</code> ahora pinta ese mismo
        elemento en vez de dibujar un SVG aparte, y su estado dejó de ser un badge flotante encima
        del trigger para ocupar su propio lugar arriba de él.
    en:
      title: A submenu's safe area now actually holds it open
      body: >-
        Crossing diagonally toward an open submenu no longer closes it or highlights the row below.
        <code>@zag-js/menu</code>'s polygon was not enough: it can only veto an early close during
        <code>waitForCloseDelay</code>'s 100ms, never extend them, so a pointer parked motionless
        inside the polygon still lost the submenu at ~90ms. There is now a real element — a
        <code>clip-path</code> triangle inside the trigger — so the browser fires no
        <code>pointerleave</code> during the crossing and the timer is never lit. It holds at any
        depth. New parts: <code>sk-menu__safe-area</code>, <code>sk-menu__intent-readout</code>.
        <code>debugSafetyTriangle</code> now paints that very element instead of drawing a separate
        SVG, and its status moved out of a floating badge that covered the trigger into its own space
        above it.
  - date: 2026-08-13
    kind: feature
    target: density
    es:
      title: Menu acepta density compact y un flag de debug del triángulo de intención
      body: >-
        <code>density</code> comprime las filas (<code>data-density="compact"</code>), el mismo idioma
        que List. Como el contenido se porta a <code>body</code>, el binding React lo vuelve a estampar
        en cada positioner. <code>debugSafetyTriangle</code> no cambia el comportamiento: sólo dibuja
        la geometría de intención que la machine ya aplica al cruzar un sibling hacia un submenu.
    en:
      title: Menu accepts compact density and a debug flag for the intent triangle
      body: >-
        <code>density</code> tightens the rows (<code>data-density="compact"</code>), the same idiom as
        List. Because the content portals to <code>body</code>, the React binding re-stamps it on every
        positioner. <code>debugSafetyTriangle</code> does not change behaviour: it only draws the intent
        geometry the machine already applies when crossing a sibling toward a submenu.
  - date: 2026-08-11
    kind: feature
    es:
      title: Menu se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Menu</code>: los dos bindings lo realizan, y la referencia de esta
        página sale del contrato compilado en vez de prosa escrita al lado. El binding Vanilla monta
        sobre <code>data-sk-menu</code>: el markup se autora y el enhancer lo hidrata, así que lo que no
        necesita JavaScript funciona antes de que corra ninguno. Opciones: <code>label</code>,
        <code>disabled</code>. La hoja es <code>components/menu.css</code>.
    en:
      title: Menu is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Menu</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. The
        Vanilla binding mounts on <code>data-sk-menu</code>: the markup is authored and the enhancer
        hydrates it, so whatever needs no JavaScript works before any runs. Options: <code>label</code>,
        <code>disabled</code>. Its stylesheet is <code>components/menu.css</code>.