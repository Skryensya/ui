# What changed in separator, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "f79deebf1cf837b3"
entries:
  - date: 2026-10-17
    kind: bugfix
    target: LabelledSeparator
    es:
      title: "Una etiqueta vacía ya no deja un nombre accesible vacío"
      body: "children=\"\" (un valor calculado que resultó vacío) seguía apuntando aria-labelledby a un span sin texto: eso da un nombre accesible explícito y vacío, peor que el \"separator\" sin nombre que este componente existe para reemplazar. Ahora, sin etiqueta, omite aria-labelledby y deja que ese mismo respaldo vuelva a aplicar."
    en:
      title: "An empty label no longer leaves an empty accessible name"
      body: "children=\"\" (a computed value that came up empty) still pointed aria-labelledby at a textless span, which gives an explicit, empty accessible name - worse than the nameless \"separator\" this component exists to replace. With no label, it now omits aria-labelledby and lets that same fallback take back over."
  - date: 2026-10-06
    kind: bugfix
    target: Separator
    es:
      title: Separator dibuja su línea sin <code>data-orientation</code>
      body: La regla horizontal exigía <code>data-orientation="horizontal"</code>, que es el valor por defecto y que el emisor no escribe, así que un <code>Separator</code> sin orientación explícita no se veía.
    en:
      title: Separator draws its line without <code>data-orientation</code>
      body: The horizontal rule required <code>data-orientation="horizontal"</code>, which is the default and which the emitter does not write, so a <code>Separator</code> with no explicit orientation was invisible.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y una hoja de estilos para marcado simple."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a stylesheet for plain markup."
