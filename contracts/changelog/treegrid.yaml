# What changed in treegrid, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "3b0f0353626c7981"
entries:
  - date: 2026-09-17
    kind: feature
    es:
      title: Firmas interactivas declaran forward
      body: >-
        Las firmas host interactivas o de formulario publican <code>forward</code>
        (<code>id</code>/<code>aria-*</code> y attrs de enlace o formulario cuando aplica).
        Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: Interactive signatures declare forward
      body: >-
        Interactive or form host signatures publish <code>forward</code>
        (<code>id</code>/<code>aria-*</code> and link or form attrs where relevant).
        An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: feature
    es:
      title: eventDetails nombra source y trigger
      body: >-
        <code>eventDetails</code> declara <code>source</code> (parte que despacha el CustomEvent) y, cuando es claro, <code>trigger</code> (parte que el usuario activa). Un agente sabe dónde escuchar y qué control provoca el evento.
    en:
      title: eventDetails names source and trigger
      body: >-
        <code>eventDetails</code> declares <code>source</code> (part that dispatches the CustomEvent) and, when clear, <code>trigger</code> (part the user activates). An agent knows where to listen and which control causes the event.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-08-25
    kind: bugfix
    target: Treegrid
    es:
      title: El aviso de resizeLabel dejaba de estar acotado a Treegrid
      body: >-
        Mismo bug que <code>table.yaml</code> registra para su propia familia: la regla de a11y de
        <code>resizeLabel</code> no traía <code>signatures</code>, así que aplicaba a las ocho
        signatures de <code>treegrid</code> por igual, aunque <code>resizableColumns</code> es una
        opción sólo de <code>Treegrid</code>. <code>TreegridScroll</code>, <code>TreegridRow</code>,
        <code>TreegridCell</code> y el resto avisaban siempre, sin importar si la composición pedía
        columnas redimensionables. Se agrega <code>signatures: ["Treegrid"]</code>.
    en:
      title: The resizeLabel advisory used to fire outside Treegrid
      body: >-
        Same bug `table.yaml` records for its own family: the <code>resizeLabel</code> a11y rule
        carried no <code>signatures</code>, so it applied to all eight <code>treegrid</code>
        signatures equally, even though <code>resizableColumns</code> is <code>Treegrid</code>'s
        own option alone. <code>TreegridScroll</code>, <code>TreegridRow</code>,
        <code>TreegridCell</code> and the rest warned unconditionally, regardless of whether the
        composition asked for resizable columns. Adds <code>signatures: ["Treegrid"]</code>.
  - date: 2026-08-16
    kind: feature
    target: Treegrid
    es:
      title: Nueva opción columnWeights; la columna de jerarquía arranca más ancha por defecto
      body: >-
        Se agrega <code>columnWeights</code>: un número positivo por columna, separado por comas,
        que decide el reparto INICIAL del ancho antes de cualquier arrastre. Mismo mecanismo que
        la opción homónima de <code>Table</code>. Sin ella, un treegrid redimensionable ya no
        reparte el ancho parejo entre columnas: la columna 0 (la que lleva la indentación por
        nivel, el botón de expandir/colapsar y la etiqueta de la fila) arranca con el doble de
        peso que las demás por defecto, así que no se aprieta tanto como una columna de metadata
        plana al lado. El arrastre en sí no cambia: el peso sólo decide la semilla inicial.
    en:
      title: New columnWeights option; the hierarchy column starts wider by default
      body: >-
        Adds <code>columnWeights</code>: one positive number per column, comma-separated, that
        decides the width's INITIAL split before any drag: same mechanism as <code>Table</code>'s
        own option of the same name. Omitted, a resizable treegrid no longer splits width evenly
        across columns: column 0 (the one carrying per-level indentation, the disclosure button,
        and the row's own label) starts with double the weight of the rest by default, so it does
        not get squeezed as hard as a flat metadata column beside it. Dragging itself is
        unchanged: the weight only decides the initial seed.
  - date: 2026-08-16
    kind: feature
    target: Treegrid
    es:
      title: Nueva opción resizableColumns, columnas redimensionables por arrastre
      body: >-
        Se agrega <code>resizableColumns</code> (opt-in, apagada por defecto: el alcance auditado
        de <code>treegrid-1</code> sigue siendo texto plano sin chrome extra a menos que el
        consumidor lo pida). Encendida, el binding inserta un separador WAI-ARIA APG "Window
        Splitter" real (<code>role="separator"</code>, <code>aria-orientation="vertical"</code>,
        flechas/Shift+flecha/Home/End/Enter) entre cada par de encabezados de columna. Nunca el
        último, no tiene vecino siguiente con quien redistribuir ancho. Es el mismo primitivo
        compartido que ya usa el separador de <code>Sidebar</code>
        (<code>@skryensya/core/splitter</code>, publicado esta sesión: el emparejador de teclado y
        el umbral de arrastre puro en un solo lugar, en vez de reescritos en cada consumidor), con
        la diferencia real documentada en <code>resolveColumnResize</code>: <code>Sidebar</code>
        pinza UN valor contra un límite fijo vía CSS <code>clamp()</code>; una columna redistribuye
        ancho entre un PAR de vecinos cuya suma se mantiene fija, así que ninguna otra columna se
        mueve. Requiere <code>resizeLabel</code> (nueva opción, gate de a11y): el separador es
        binding-insertado, nunca escrito a mano, así que nada más lo nombra para un lector de pantalla.
    en:
      title: New resizableColumns option, drag-to-resize columns
      body: >-
        Adds <code>resizableColumns</code> (opt-in, off by default: `treegrid-1`'s own audited
        scope stays plain text with no extra chrome unless a consumer asks for it). Turned on, the
        binding inserts a real WAI-ARIA APG "Window Splitter" separator
        (<code>role="separator"</code>, <code>aria-orientation="vertical"</code>,
        arrows/Shift+arrow/Home/End/Enter) between every pair of column headers: never the last,
        which has no next neighbor to redistribute width with. It is the same shared primitive
        Sidebar's own separator now uses too (<code>@skryensya/core/splitter</code>, published this
        session: the keyboard matcher and drag threshold live in one pure place instead of being
        rewritten per consumer), with the real difference documented on
        <code>resolveColumnResize</code>: Sidebar clamps ONE value against a fixed bound via a CSS
        <code>clamp()</code>; a column redistributes width between a PAIR of neighbors whose sum
        stays fixed, so no other column ever moves. Requires <code>resizeLabel</code> (a new
        option, an a11y gate). The separator is binding-inserted, never authored, so nothing else
        names it for a screen reader.
  - date: 2026-08-15
    kind: bugfix
    target: TreegridRow
    es:
      title: Corrige el desalineado de columnas y el chevron pasa a ser un botón real
      body: >-
        <code>sk-interactive</code> en el <code>&lt;tr&gt;</code> pintaba su capa de estado con un
        <code>::before</code>: un hijo generado de una fila entra al algoritmo de layout de tabla
        igual que cualquier otro, así que el navegador lo envolvía en una celda anónima y corría
        cada <code>&lt;td&gt;</code> real una columna a la derecha (medido: Chromium 140, la
        última celda de cada fila terminaba con ancho 0): el <code>&lt;th&gt;</code> y el
        <code>&lt;td&gt;</code> dejaban de alinear y el grid se leía roto. Se quita esa clase del
        <code>&lt;tr&gt;</code>; cada <code>TreegridCell</code> ya la lleva y sigue dando su propio
        estado de hover/press. El chevron, que era un <code>::before</code> puramente decorativo
        sin elemento real, ahora es un <code>&lt;button&gt;</code> de verdad que el binding inserta
        en la primera celda de una fila rama. Visible al puntero, con su propio estado
        hover/press, pero <code>aria-hidden</code> y fuera del tabindex propio: el
        <code>aria-expanded</code> de la fila sigue siendo lo único que anuncia un lector de
        pantalla, así que este alcance (treegrid-1) no gana un control enfocable dentro de una
        celda.
    en:
      title: Fixes column misalignment; the chevron becomes a real button
      body: >-
        <code>sk-interactive</code> on the <code>&lt;tr&gt;</code> painted its state layer with a
        <code>::before</code>: a row's generated child enters the table layout algorithm the same
        as any other, so the browser wrapped it into an anonymous table-cell and pushed every real
        <code>&lt;td&gt;</code> one column right (measured: Chromium 140, each row's last cell
        ended up at width 0): the <code>&lt;th&gt;</code> and <code>&lt;td&gt;</code> stopped
        lining up and the grid read as broken. That class is removed from the <code>&lt;tr&gt;</code>;
        each <code>TreegridCell</code> already carries it and still gives its own hover/press
        state. The chevron, previously a purely decorative <code>::before</code> with no real
        element, is now a genuine <code>&lt;button&gt;</code> the binding inserts into a branch
        row's first cell. Visible to a pointer, with its own hover/press state, but
        <code>aria-hidden</code> and out of the tab order: the row's own <code>aria-expanded</code>
        remains the only thing a screen reader announces, so this scope (treegrid-1) does not gain
        a focusable control inside a cell.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de treegrid quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>4</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: treegrid's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>4</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-16
    kind: breaking
    target: TreegridRow
    es:
      title: TreegridRow exige value, las celdas son sólo texto y los eventos quedan publicados
      body: >-
        <code>value</code> pasa a ser obligatorio en cada fila: React ya lo exigía para guardar el
        estado, y los dos eventos lo reportan (Vanilla anunciaba <code>null</code> sin él).
        <code>TreegridCell</code> acepta sólo texto, el alcance auditado de <code>treegrid-1</code>.
        El contrato publica <code>sk-treegrid-expanded-change</code> y
        <code>sk-treegrid-activate</code>, y React ahora también los despacha en la tabla.
    en:
      title: TreegridRow requires value, cells are text only, and the events are published
      body: >-
        <code>value</code> is now required on every row: React already required it to hold state,
        and both events report it (Vanilla announced <code>null</code> without one).
        <code>TreegridCell</code> accepts text only, the audited <code>treegrid-1</code> scope. The
        contract publishes <code>sk-treegrid-expanded-change</code> and
        <code>sk-treegrid-activate</code>, and React now dispatches them on the table too.
  - date: 2026-09-16
    kind: bugfix
    es:
      title: Las filas de un Treegrid tienen que decir la verdad sobre su jerarquía
      body: >-
        El validador ahora comprueba lo que <code>aria-level</code>, <code>aria-posinset</code> y
        <code>aria-setsize</code> le prometen a un lector de pantalla: la profundidad crece de a un
        nivel, los hermanos comparten <code>setSize</code> y se numeran de 1 a n, una fila con filas
        más profundas debajo declara <code>expanded</code>, y ningún <code>value</code> se repite.
        Una rama sin hijos sólo genera un aviso, porque una carpeta vacía es real.
    en:
      title: Treegrid rows have to tell the truth about their hierarchy
      body: >-
        The validator now checks what <code>aria-level</code>, <code>aria-posinset</code> and
        <code>aria-setsize</code> promise a screen reader: depth grows one level at a time, siblings
        share <code>setSize</code> and are numbered 1 to n, a row with deeper rows under it states
        <code>expanded</code>, and no <code>value</code> repeats. A branch with no children only
        draws an advisory, because an empty folder is real.
  - date: 2026-09-16
    kind: bugfix
    es:
      title: El contrato declara el rango de sus números
      body: >-
        <code>level</code>, <code>setSize</code> y <code>posInset</code> son enteros desde 1. Un 0 o un 1.5 dejan de validar en vez de anunciarse tal cual.
    en:
      title: The contract declares the range of its numbers
      body: >-
        <code>level</code>, <code>setSize</code> and <code>posInset</code> are whole numbers from 1. A 0 or a 1.5 stops validating instead of being announced as written.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Cada evento lleva el nombre de su familia
      body: >-
        <code>sk-treegrid-expanded-change</code> → <code>sk:treegridexpandedchange</code>, <code>sk-treegrid-activate</code> → <code>sk:treegridactivate</code>. Un mismo nombre ya no lo despachan varias familias: un listener sobre una raíz deja
        de recibir los eventos de un componente distinto anidado adentro.
    en:
      title: Every event carries its family in its name
      body: >-
        <code>sk-treegrid-expanded-change</code> → <code>sk:treegridexpandedchange</code>, <code>sk-treegrid-activate</code> → <code>sk:treegridactivate</code>. No two families dispatch the same name any more: a listener on a root stops receiving
        the events of a different component nested inside it.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: columnWeights se valida como lista, una entrada por columna
      body: >-
        <code>columnWeights</code> declara que es una lista de números positivos separados por coma
        y cuántas entradas debe tener: una por columna de la primera fila. Antes una lista con un 0 o
        con una entrada de más validaba, y el binding la descartaba en silencio para usar su reparto
        por defecto.
    en:
      title: columnWeights is validated as a list, one entry per column
      body: >-
        <code>columnWeights</code> declares that it is a comma-separated list of positive numbers and
        how many entries it takes: one per column of the first row. A list with a 0 or one entry too
        many used to validate, and the binding silently dropped it for its default split.
