# Qué cambió en comment-thread, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribí la entrada y pegá el
# hash nuevo.
surface: "fae2f4110942292e"
entries:
  - date: 2026-09-07
    kind: bugfix
    es:
      title: Los botones de voto ya no pierden sus clicks contra el control de plegado
      body: >-
        El control que pliega las respuestas mide 24px de cara, pero como todo Button expande su
        área táctil a 44px, su caja de click sobresalía unos 6px del canal hacia la columna de
        contenido. La fila de acciones venía en sentido contrario: cuando arranca con el grupo de
        voto se corre esos mismos 6px hacia la izquierda por corrección óptica. Las dos se cruzaban
        justo encima de la flecha de voto positivo, y como el control de plegado lleva
        <code>z-index: 1</code> para poder interrumpir la línea del hilo, ganaba él: el upvote
        quedaba debajo de una caja invisible que se comía el click.
        El grupo de voto ahora se apila por encima. Solo dentro de un comentario: un
        <code>CommentVote</code> suelto no tiene ninguna nota de la que despegarse.
    en:
      title: The vote buttons no longer lose their clicks to the fold control
      body: >-
        The reply-fold control has a 24px face, but like every Button it expands its touch target to
        44px, so its click box overhung the gutter by about 6px into the content column. The actions
        row came the other way: a row that leads with the vote group is pulled left by exactly those
        6px for optical correction. The two met right over the upvote arrow, and because the fold
        control carries <code>z-index: 1</code> so it can interrupt the thread line, it won: the
        upvote sat under an invisible box that swallowed the click.
        The vote group now stacks above it. Only inside a comment: a standalone
        <code>CommentVote</code> has no gutter node to clear.
  - date: 2026-09-07
    kind: feature
    target: collapsible
    es:
      title: El control que pliega las respuestas ahora es un Button xs de verdad
      body: >-
        El handle que monta sobre la línea del hilo dejaba de ser una cara achicada a mano: era un
        <code>sm</code> recortado a <code>--size-icon-md</code> (20px) con los hooks de Button
        desde el CSS de comment-thread. Ahora es <code>data-size="xs"</code>, un tamaño que la
        escala publica (ver el changelog de <code>button</code>), así que el nodo mide 24px, que
        es lo que <code>xs</code> pinta en todos lados.
        Se ve un poco más grande que antes (20px a 24px) y esa es la única diferencia visible. A
        cambio, la medida ya no vive acá: cualquier otro componente que necesite un nodo del mismo
        tamaño lo pide por su nombre, y el piso de 24px es el de WCAG 2.2 SC 2.5.8 en vez de un
        número que había quedado atado al token de un icono. El área de click era 44px y sigue
        siendo 44px.
        Nada que se autore a mano se rompe: quien haya escrito el markup del control con
        <code>data-size="sm"</code> lo sigue viendo funcionar, sólo que con la cara vieja.
    en:
      title: The reply-fold control is now a real xs Button
      body: >-
        The handle riding on the thread's rail used to be a hand-shrunk face: an <code>sm</code>
        cut down to <code>--size-icon-md</code> (20px) through Button's hooks, from
        comment-thread's own CSS. It is now <code>data-size="xs"</code>, a size the scale
        publishes (see <code>button</code>'s own changelog), so the node measures 24px, which is
        what <code>xs</code> paints everywhere.
        It reads slightly larger than before (20px to 24px) and that is the only visible
        difference. In exchange the measurement no longer lives here: any other component that
        needs a node this size asks for it by name, and the 24px floor is WCAG 2.2 SC 2.5.8's
        rather than a number that had been tied to an icon token. The hit area was 44px and is
        still 44px.
        Nothing hand-authored breaks: markup written with <code>data-size="sm"</code> on this
        control keeps working, just with the old face.
  - date: 2026-09-07
    kind: feature
    es:
      title: En un teléfono el composer es un Vaul, y arriba sigue en flujo
      body: >-
        Las dos cajas de escribir (la respuesta de un comentario y el composer del hilo) pasan de
        `&lt;div&gt;` a `&lt;dialog&gt;`. Debajo de <code>--breakpoint-desktop</code> el binding las abre con
        <code>showModal()</code> y quedan ancladas al borde inferior; por encima siguen en flujo,
        exactamente donde estaban. Es UN nodo en dos presentaciones y no dos nodos: duplicarlo
        duplicaría el control que pasa quien lo usa, con ids y labels repetidos y el borrador partido
        en dos. Toda la pintura del panel viene del pattern Vaul a través de la clase
        <code>sk-vaul</code>, que pone el binding; acá sólo se reasignan sus hooks, igual que hace
        Drawer. Sin enhancer la caja se queda en flujo a cualquier ancho, que es el mismo fallback
        que describe la decisión 9. El disparador de responder ahora declara
        <code>aria-haspopup="dialog"</code> además de <code>aria-expanded</code>: lo primero dice qué
        abre, lo segundo si está abierto. Y como el composer del hilo siempre estuvo abierto en
        flujo, en móvil necesita una forma de entrar: <code>composerTriggerLabel</code> nombra ese
        control, que sólo existe donde la caja es una hoja.
    en:
      title: On a phone the composer is a Vaul, and stays in flow above it
      body: >-
        Both write boxes (a comment's reply and the thread's own composer) go from `&lt;div&gt;` to
        `&lt;dialog&gt;`. Below <code>--breakpoint-desktop</code> the binding opens them with
        <code>showModal()</code> and they arrive from the block-end edge; above it they stay in flow,
        exactly where they were. ONE node in two presentations rather than two nodes: rendering it
        twice would duplicate the consumer's own control, which means duplicate ids, duplicate labels
        and a draft split across two fields. Every bit of panel, edge, slide and backdrop comes from
        the Vaul pattern through the <code>sk-vaul</code> class the binding adds; this contract only
        reassigns its hooks, the same deal Drawer keeps. With no enhancer the box stays in flow at
        every width, the fallback decision 9 describes. The reply trigger now carries
        <code>aria-haspopup="dialog"</code> alongside <code>aria-expanded</code>: the first says what
        it opens, the second whether it is open. And because the thread's composer was always open in
        flow, on a phone it needs a way in: <code>composerTriggerLabel</code> names that control,
        which exists only where the box is a sheet.
  - date: 2026-09-05
    kind: feature
    es:
      title: La API en Vanilla se completa con hooks, blueprint, escritura de estado y veto
      body: >-
        Cuatro cambios que persiguen lo mismo, que un consumidor de Vanilla nunca tenga que tocar
        clases internas. `data-sk-comment-avatar`/`-author`/`-timestamp` completan el
        direccionamiento: antes sólo el cuerpo tenía hook, así que llenar un comentario obligaba a
        buscar `.sk-comment__author`, que es de la hoja de estilos y se mueve cuando cambia la
        pintura. `CommentTemplate` publica un blueprint que se clona para crear un comentario en
        runtime, igual que `ToastTemplate`; es deliberadamente un `&lt;template&gt;` y no un
        `renderComment(data)`, porque generar anatomía en el binding crearía una segunda fuente que
        mantener en línea con el template del contrato. `setCommentVote(group, { voted, count })`
        escribe un voto: son tres atributos que tienen que coincidir (`data-voted` pinta, dos
        `aria-pressed` anuncian) y escritos a mano se separaron dos veces. Y los tres eventos ahora
        son `cancelable`: `preventDefault()` sobre `reply` conserva el borrador y la caja abierta,
        para que un POST fallido no se lleve lo que la persona escribió.
    en:
      title: The Vanilla API completed with hooks, blueprint, state writing and veto
      body: >-
        Four changes chasing the same thing, that a Vanilla consumer never has to reach for internal
        classes. `data-sk-comment-avatar`/`-author`/`-timestamp` complete the addressing: only the
        body had a hook before, so filling a comment meant querying `.sk-comment__author`, which
        belongs to the stylesheet and moves whenever the paint does. `CommentTemplate` publishes a
        blueprint to clone when creating a comment at runtime, the same shape `ToastTemplate` has;
        deliberately a `&lt;template&gt;` and not a `renderComment(data)`, because generating anatomy in
        the binding would create a second source of it to keep in step with the contract's template.
        `setCommentVote(group, { voted, count })` writes a vote: three attributes have to agree
        (`data-voted` paints, two `aria-pressed` announce) and written by hand they drifted apart
        twice. And the three events are now `cancelable`: `preventDefault()` on `reply` keeps the
        draft and the open box, so a failed POST does not take what the person wrote with it.
  - date: 2026-09-05
    kind: feature
    es:
      title: CommentComposer gana cancelar, y deja de traer superficie propia
      body: >-
        `cancellable` agrega un control de cancelar al lado de publicar. Cuando la caja tiene algo
        escrito, cancelar NO la cierra: despacha `sk:commentdiscard` con lo escrito y se detiene,
        para que quien lo use confirme antes de tirar un borrador. Vacía se cierra sola, porque no
        hay nada que perder y un diálogo sobre nada es uno que se aprende a descartar sin leer. La
        misma reserva que ya tiene borrar: el componente reporta, la app decide. Además el composer
        dejó de envolverse en un `Box`: el control que recibe ya dibuja su propia superficie, así
        que la caja era un marco alrededor de un marco.
    en:
      title: CommentComposer gains cancel, and stops bringing a surface of its own
      body: >-
        `cancellable` adds a cancel control beside submit. When the box has something written in it,
        cancel does NOT close it: it dispatches `sk:commentdiscard` with the draft and stops, so a
        consumer can confirm before anything is thrown away. An empty one just closes, because there
        is nothing to lose and a dialog about nothing is one a reader learns to dismiss unread. The
        same restraint delete already keeps: the component reports, the app decides. The composer
        also stopped wrapping itself in a `Box` - the control it is handed already draws a surface,
        so the box was a frame around a frame.
  - date: 2026-09-04
    kind: feature
    es:
      title: Nuevo componente CommentThread, en cinco piezas
      body: >-
        Comentarios anidados como cinco signatures que se usan juntas o sueltas: `Comment` (autor,
        cuándo y qué dijo, la pieza más simple y válida sin hilo alrededor), `CommentActions` (la
        fila de votar/responder/borrar), `CommentVote` (arriba, contador, abajo), `CommentComposer`
        (la caja de escribir) y `CommentThread` (el contenedor que los nombra). Las respuestas
        recursan por COMPOSICIÓN - `Comment.replies` acepta `Comment` - así cada slot a cualquier
        profundidad admite contenido compuesto: un Avatar junto al nombre, texto rico en el cuerpo.
        El composer NO entrega ningún control: su slot acepta cualquier signature, igual que el de
        `FormField`, así que un field, un textarea o un editor entran por igual. Data-driven y sin
        backend - cada acción se devuelve al consumidor, nunca llama a una red ni guarda un
        borrador. Sin `role="feed"` ni `role="tree"`: `&lt;article&gt;` anidado nativo, la misma jerarquía
        implícita que un `&lt;article&gt;` dentro de otro ya le da a un lector de pantalla sin autoría
        manual de `aria-level`. El plegado es opcional (`collapsible`), su control sólo existe donde
        HAY respuestas que plegar, y oculta las RESPUESTAS, no el
        comentario: un hilo se hace largo por lo que cuelga de un comentario, así que esconder lo
        que alguien dijo para saltarse la discusión de abajo perdería justo lo que se estaba
        leyendo. Usa el mismo patrón de disclosure que `NavListGroup` (`aria-expanded` + `hidden`),
        no una máquina de Zag. Borrar no
        trae modal propio - quien lo consuma compone `Dialog` (`alert: true`) si lo necesita.
    en:
      title: New CommentThread component, as five pieces
      body: >-
        Nested comments as five signatures usable together or apart: `Comment` (an author, when and
        what they said - the simplest piece, valid with no thread around it), `CommentActions` (the
        vote/reply/delete row), `CommentVote` (up, count, down), `CommentComposer` (the write box)
        and `CommentThread` (the container that names them). Replies recurse by COMPOSITION -
        `Comment.replies` takes `Comment` - so every slot at every depth accepts composed content:
        rich text in the body, whatever names a person. The avatar is its OWN slot rather than
        content inside `author`, because it is structural: the thread line descends from it, past
        the fold control riding on it, into each reply's own avatar. The composer SHIPS NO CONTROL: its slot
        takes any signature at all, exactly as `FormField`'s own does, so a field, a textarea or an
        editor all fit. Data-driven, no backend - every action is handed back to the consumer, and
        it never calls a network or persists a draft. No `role="feed"`, no `role="tree"`: plain
        nested `&lt;article&gt;`, the same implicit hierarchy a nested `&lt;article&gt;` already gives a screen
        reader with no hand-authored `aria-level`. Folding is opt-in (`collapsible`), its control exists only where there ARE
        replies to fold, and it hides the REPLIES, not the
        comment: a thread gets long because of what hangs off a comment, so hiding what someone said
        in order to skip the argument under it would lose the thing being read. It uses the same
        disclosure pattern `NavListGroup` already does (`aria-expanded` + `hidden`), not a Zag
        machine. Delete carries no modal of its own - a consumer composes `Dialog` (`alert: true`)
        if they want one.
  - date: 2026-09-07
    kind: bugfix
    es:
      title: Un voto sin marcar ahora se anuncia como un toggle apagado
      body: >-
        Los botones de voto sólo escribían <code>aria-pressed="true"</code> cuando el voto estaba
        puesto, así que uno sin marcar no llevaba el atributo y un lector de pantalla lo leía como un
        botón común: se perdía el hecho de que se puede presionar. Ahora la base es
        <code>false</code> y sube a <code>true</code> en el que corresponde.
        Además el binding de React escribe los atributos de opción que el contrato ya definía en sus
        hosts (<code>data-collapse-label</code>, <code>data-composer-trigger-label</code>,
        <code>data-reply</code>, <code>data-delete-label</code>, los de voto y los del composer), y
        el disparador del composer se emite siempre en vez de sólo cuando la vista es una hoja: qué
        tan ancha es la pantalla ya lo decide el CSS, y decidirlo también en JS hacía que los dos
        bindings dibujaran DOM distinto al mismo ancho.
    en:
      title: An unset vote now announces itself as a toggle that is off
      body: >-
        The vote buttons only wrote <code>aria-pressed="true"</code> when the vote was cast, so an
        unset one carried no attribute at all and a screen reader read it as an ordinary button,
        losing the fact that it can be pressed. The base is now <code>false</code>, raised to
        <code>true</code> on whichever one is cast.
        The React binding also writes the option attributes the contract already declared on its
        hosts (<code>data-collapse-label</code>, <code>data-composer-trigger-label</code>,
        <code>data-reply</code>, <code>data-delete-label</code>, the vote pair's and the composer's),
        and the composer trigger is now always emitted rather than only when the view is a sheet:
        how wide the screen is was already a CSS decision, and deciding it in JS as well made the two
        bindings render different DOM at the same width.
  - date: 2026-09-07
    kind: bugfix
    es:
      title: El disparador del composer ya no depende del orden de importación
      body: >-
        La regla que lo esconde arriba del breakpoint pesaba una clase, igual que el
        <code>display: inline-flex</code> que <code>button.css</code> le da a todo
        <code>.sk-button</code>, y las dos viven en la misma capa: cuál ganaba lo decidía qué hoja
        importaba último la página. Medido en vivo, el disparador aparecía a cualquier ancho apenas
        cambiaba ese orden, que es justo la "segunda puerta de entrada que no hace nada" que la regla
        de al lado existe para evitar. Ahora la regla lleva dos clases y el empate no existe.
    en:
      title: The composer trigger no longer depends on import order
      body: >-
        The rule hiding it above the breakpoint weighed one class, exactly like the
        <code>display: inline-flex</code> <code>button.css</code> gives every <code>.sk-button</code>,
        and both live in the same layer: which one won came down to whichever stylesheet a page
        imported last. Measured live, the trigger showed at every width the moment that order
        changed, which is precisely the "second way in that does nothing" the rule beside it exists
        to prevent. The rule now carries two classes and the tie is gone.
