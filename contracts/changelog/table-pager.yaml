# What changed in table-pager, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "1df30b10f8fdd075"
entries:
  - date: 2026-09-17
    kind: feature
    es:
      title: eventDetails nombra source y trigger
      body: >-
        <code>eventDetails</code> declara <code>source</code> (parte que despacha el CustomEvent) y, cuando es claro, <code>trigger</code> (parte que el usuario activa). Un agente sabe dónde escuchar y qué control provoca el evento.
    en:
      title: eventDetails names source and trigger
      body: >-
        <code>eventDetails</code> declares <code>source</code> (part that dispatches the CustomEvent) and, when clear, <code>trigger</code> (part the user activates). An agent knows where to listen and which control causes the event.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-08-11
    kind: feature
    es:
      title: TablePager se publica como contrato, con 6 signatures
      body: >-
        Entra al catálogo con <code>TablePager</code>, <code>TablePagerBar</code>,
        <code>TablePagerSize</code>, <code>TablePagerEnd</code>, <code>TablePagerStatus</code>,
        <code>TablePagerNav</code>: los dos bindings lo realizan, y la referencia de esta página sale
        del contrato compilado en vez de prosa escrita al lado. El binding Vanilla monta sobre
        <code>data-sk-table-pager</code>: el markup se autora y el enhancer lo hidrata, así que lo que
        no necesita JavaScript funciona antes de que corra ninguno. Opciones: <code>pageSize</code>,
        <code>page</code>, <code>siblings</code>, <code>statusTemplate</code>,
        <code>previousLabel</code>, <code>nextLabel</code>, <code>pageLabel</code>,
        <code>navLabel</code>. La hoja es <code>patterns/table-pager.css</code>.
    en:
      title: TablePager is published as a contract, with 6 signatures
      body: >-
        It joins the catalogue with <code>TablePager</code>, <code>TablePagerBar</code>,
        <code>TablePagerSize</code>, <code>TablePagerEnd</code>, <code>TablePagerStatus</code>,
        <code>TablePagerNav</code>: both bindings realize it, and this page's reference is rendered from
        the compiled contract rather than from prose written beside it. The Vanilla binding mounts on
        <code>data-sk-table-pager</code>: the markup is authored and the enhancer hydrates it, so
        whatever needs no JavaScript works before any runs. Options: <code>pageSize</code>,
        <code>page</code>, <code>siblings</code>, <code>statusTemplate</code>,
        <code>previousLabel</code>, <code>nextLabel</code>, <code>pageLabel</code>,
        <code>navLabel</code>. Its stylesheet is <code>patterns/table-pager.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de table-pager quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>7</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: table-pager's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>7</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-12
    kind: feature
    es:
      title: El contrato declara las otras hojas donde vive su estilo
      body: >-
        Este componente se pinta desde mas de una hoja, asi que el contrato ahora las nombra con
        <code>hookSheets</code> y su lista de <code>hooks</code> cubre todas. Antes solo se podia
        reconciliar contra la hoja de <code>css</code>, asi que los hooks de las otras eran
        superficie publica que nadie documentaba ni verificaba. No cambia ningun estilo: cambia que
        ahora estan declarados y el compilador los chequea.
    en:
      title: The contract declares the other stylesheets its styling lives in
      body: >-
        This component paints from more than one stylesheet, so the contract now names them with
        <code>hookSheets</code> and its <code>hooks</code> list covers all of them. Before, only the
        sheet <code>css</code> names could be reconciled, so the hooks in the others were public
        surface nobody documented and nothing checked. No styling changes: what changes is that they
        are declared now, and the compiler checks them.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Cada evento lleva el nombre de su familia
      body: >-
        <code>sk-table-pager-change</code> → <code>sk:tablepagerchange</code>. Un mismo nombre ya no lo despachan varias familias: un listener sobre una raíz deja
        de recibir los eventos de un componente distinto anidado adentro. El contrato ahora los declara en <code>events</code>, así que el compilador los publica.
    en:
      title: Every event carries its family in its name
      body: >-
        <code>sk-table-pager-change</code> → <code>sk:tablepagerchange</code>. No two families dispatch the same name any more: a listener on a root stops receiving
        the events of a different component nested inside it. The contract now declares them in <code>events</code>, so the compiler publishes them.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: El contrato declara el rango de sus números
      body: >-
        <code>pageSize</code> y <code>page</code> son enteros desde 1 y <code>siblings</code> desde 0. Un valor fuera de rango deja de validar en vez de llegar al binding.
    en:
      title: The contract declares the range of its numbers
      body: >-
        <code>pageSize</code> and <code>page</code> are whole numbers from 1 and <code>siblings</code> from 0. A value out of range stops validating instead of reaching the binding.
  - date: 2026-09-17
    kind: breaking
    es:
      title: El pager pagina las filas del cuerpo, también en React
      body: >-
        Las filas que se paginan son las de <code>table &gt; tbody</code>: ya no hace falta marcarlas
        con <code>data-sk-table-pager-row</code>, un atributo que el contrato nunca nombró, así que una
        tabla compuesta desde un árbol no paginaba nada. La lógica pasa a
        <code>@skryensya/core/table-pager-dom</code> y la corren los dos bindings: el TablePager de
        React sólo dibujaba la carcasa. El tamaño de página escucha el <code>change</code> de cualquier
        select en <code>TablePagerSize</code>, así que <code>Select.native</code> también funciona. Los
        slots fijan orden y cantidad: una tabla, después una barra, con navegación.
        <code>navLabel</code> llega a React como <code>label</code>.
    en:
      title: The pager pages the body rows, in React too
      body: >-
        The rows it pages are those of <code>table &gt; tbody</code>: they no longer need
        <code>data-sk-table-pager-row</code>, an attribute the contract never named, so a table composed
        from a tree paged nothing. The logic moves to <code>@skryensya/core/table-pager-dom</code> and
        both bindings run it: React's TablePager only drew the shell. Page size listens for
        <code>change</code> on any select in <code>TablePagerSize</code>, so <code>Select.native</code>
        works too. The slots fix order and count: one table, then one bar, with a nav.
        <code>navLabel</code> reaches React as <code>label</code>.
