# Qué cambió en table-pager, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribí la entrada y pegá el
# hash nuevo.
surface: "a6cf671b63bf430a"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: TablePager se publica como contrato, con 6 signatures
      body: >-
        Entra al catálogo con <code>TablePager</code>, <code>TablePagerBar</code>,
        <code>TablePagerSize</code>, <code>TablePagerEnd</code>, <code>TablePagerStatus</code>,
        <code>TablePagerNav</code>: los dos bindings lo realizan, y la referencia de esta página sale
        del contrato compilado en vez de prosa escrita al lado. El binding Vanilla monta sobre
        <code>data-sk-table-pager</code>: el markup se autora y el enhancer lo hidrata, así que lo que
        no necesita JavaScript funciona antes de que corra ninguno. Opciones: <code>pageSize</code>,
        <code>page</code>, <code>siblings</code>, <code>statusTemplate</code>,
        <code>previousLabel</code>, <code>nextLabel</code>, <code>pageLabel</code>,
        <code>navLabel</code>. La hoja es <code>patterns/table-pager.css</code>.
    en:
      title: TablePager is published as a contract, with 6 signatures
      body: >-
        It joins the catalogue with <code>TablePager</code>, <code>TablePagerBar</code>,
        <code>TablePagerSize</code>, <code>TablePagerEnd</code>, <code>TablePagerStatus</code>,
        <code>TablePagerNav</code>: both bindings realize it, and this page's reference is rendered from
        the compiled contract rather than from prose written beside it. The Vanilla binding mounts on
        <code>data-sk-table-pager</code>: the markup is authored and the enhancer hydrates it, so
        whatever needs no JavaScript works before any runs. Options: <code>pageSize</code>,
        <code>page</code>, <code>siblings</code>, <code>statusTemplate</code>,
        <code>previousLabel</code>, <code>nextLabel</code>, <code>pageLabel</code>,
        <code>navLabel</code>. Its stylesheet is <code>patterns/table-pager.css</code>.