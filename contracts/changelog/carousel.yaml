# What changed in carousel, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "6dee59dcc21a5938"
entries:
  - date: 2026-09-17
    kind: feature
    es:
      title: eventDetails nombra source y trigger
      body: >-
        <code>eventDetails</code> declara <code>source</code> (parte que despacha el CustomEvent) y, cuando es claro, <code>trigger</code> (parte que el usuario activa). Un agente sabe dónde escuchar y qué control provoca el evento.
    en:
      title: eventDetails names source and trigger
      body: >-
        <code>eventDetails</code> declares <code>source</code> (part that dispatches the CustomEvent) and, when clear, <code>trigger</code> (part the user activates). An agent knows where to listen and which control causes the event.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-09-17
    kind: feature
    es:
      title: Carousel declara systemOwned para controles inyectados
      body: >-
        <code>systemOwned</code> lista controls/button/autoplay/dots/dot que el enhancer (o los
        pseudo-elementos nativos) aportan; el template sólo autentica track + slides.
    en:
      title: Carousel declares systemOwned for injected controls
      body: >-
        <code>systemOwned</code> lists controls/button/autoplay/dots/dot that the enhancer (or
        native pseudo-elements) supply; the template only authors track + slides.
  - date: 2026-09-16
    kind: bugfix
    es:
      title: Carousel publica change y goto en el contrato
      body: >-
        <code>events.change</code> (<code>sk-carousel-change</code>) y <code>events.goto</code>
        (<code>sk-carousel-goto</code>) ya existían en el módulo y en el enhancer; ahora el contrato
        los declara para que un árbol y un agente los encuentren.
    en:
      title: Carousel publishes change and goto on the contract
      body: >-
        <code>events.change</code> (<code>sk-carousel-change</code>) and <code>events.goto</code>
        (<code>sk-carousel-goto</code>) already lived in the module and enhancer; the contract now
        declares them so a tree and an agent can find them.
  - date: 2026-08-14
    kind: bugfix
    target: root
    es:
      title: El carrusel exige un nombre accesible para su región
      body: >-
        <code>role="region"</code> y <code>aria-roledescription="carousel"</code> los pone la máquina,
        pero ninguno de los dos NOMBRA el carrusel. La misma regla de landmark que <code>nav-list</code>
        y <code>tabs</code> ya se exigen a sí mismos: <code>aria-label</code> o <code>aria-labelledby</code>.
    en:
      title: The carousel requires an accessible name for its region
      body: >-
        <code>role="region"</code> and <code>aria-roledescription="carousel"</code> come from the
        machine, but neither NAMES the carousel. Same landmark rule <code>nav-list</code> and
        <code>tabs</code> already enforce on themselves: <code>aria-label</code> or
        <code>aria-labelledby</code>.
  - date: 2026-08-11
    kind: feature
    es:
      title: Carousel se publica como contrato, con 2 signatures
      body: >-
        Entra al catálogo con <code>Carousel</code>, <code>CarouselSlide</code>: los dos bindings lo
        realizan, y la referencia de esta página sale del contrato compilado en vez de prosa escrita al
        lado. No tiene enhancer: el markup está completo por sí solo, así que las dos bindings son el
        mismo markup dos veces. Opciones: <code>loop</code>, <code>autoplay</code>,
        <code>autoplayDelay</code>, <code>mounted</code>, <code>slideSize</code>,
        <code>orientation</code>, <code>controls</code>, <code>mouseDrag</code>. La hoja es
        <code>components/carousel.css</code>.
    en:
      title: Carousel is published as a contract, with 2 signatures
      body: >-
        It joins the catalogue with <code>Carousel</code>, <code>CarouselSlide</code>: both bindings
        realize it, and this page's reference is rendered from the compiled contract rather than from
        prose written beside it. There is no enhancer: the markup is complete on its own, so both
        bindings are the same markup twice. Options: <code>loop</code>, <code>autoplay</code>,
        <code>autoplayDelay</code>, <code>mounted</code>, <code>slideSize</code>,
        <code>orientation</code>, <code>controls</code>, <code>mouseDrag</code>. Its stylesheet is
        <code>components/carousel.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de carousel quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>17</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: carousel's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>17</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Cada evento lleva el nombre de su familia
      body: >-
        <code>sk-carousel-change</code> → <code>sk:carouselchange</code>, <code>sk-carousel-goto</code> → <code>sk:carouselgoto</code>. Un mismo nombre ya no lo despachan varias familias: un listener sobre una raíz deja
        de recibir los eventos de un componente distinto anidado adentro.
    en:
      title: Every event carries its family in its name
      body: >-
        <code>sk-carousel-change</code> → <code>sk:carouselchange</code>, <code>sk-carousel-goto</code> → <code>sk:carouselgoto</code>. No two families dispatch the same name any more: a listener on a root stops receiving
        the events of a different component nested inside it.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: El contrato declara el rango de sus números
      body: >-
        <code>autoplayDelay</code> es al menos 1 ms. Un valor fuera de rango deja de validar en vez de llegar al binding.
    en:
      title: The contract declares the range of its numbers
      body: >-
        <code>autoplayDelay</code> is at least 1 ms. A value out of range stops validating instead of reaching the binding.
