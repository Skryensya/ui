# What changed in carousel, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "5d82091433882c98"
entries:
  - date: 2026-11-21
    kind: bugfix
    es:
      title: "CurveCarousel: bend curva de verdad y focus es una pantalla curva"
      body: "bend no curvaba: will-change: opacity aplanaba la slide y sus bandas giraban sin perspectiva. Ahora la imagen se curva y no se corta entre bandas. focus usa una rueda más cerrada y la cámara más cerca, así la slide del frente es una pantalla curva y las vecinas doblan por los lados."
    en:
      title: "CurveCarousel: bend really curves and focus is a curved screen"
      body: "bend did not curve: will-change: opacity flattened the slide and its bands turned without perspective. Now the picture curves and is not chopped between bands. focus uses a tighter wheel and a closer camera, so the front slide is a curved screen and its neighbours wrap round the sides."
  - date: 2026-11-21
    kind: bugfix
    es:
      title: "CurveCarousel: teclado y primer render"
      body: "El stepper es una sola parada de Tab y las flechas recorren las slides con el foco detrás; las slides ocultas tras la rueda quedan fuera del Tab y cada cambio se anuncia. Ya no se ve la tira plana antes de montar: la rueda aparece ya armada. En Vanilla carga un módulo propio, sin Svelte ni Zag."
    en:
      title: "CurveCarousel: keyboard and first render"
      body: "The stepper is a single Tab stop and the arrows walk the slides with the focus behind them; slides hidden behind the wheel leave the Tab order and each change is announced. The flat strip no longer shows before mount: the wheel appears already built. In Vanilla it loads its own module, without Svelte or Zag."
  - date: 2026-11-21
    kind: feature
    es:
      title: "CurveCarousel: tarjetas altas y una en foco"
      body: "tall hace cada slide vertical 9:16 y focus apaisada 16:9, grande al frente con la anterior y la siguiente asomando a los lados; su contenido la llena. fade desvanece los dos lados siempre. La rueda ya no recorta lo que sobresale. Arrastrar más de un 15% de una slide ya lleva a la siguiente."
    en:
      title: "CurveCarousel: tall cards and one in focus"
      body: "tall makes each slide a portrait 9:16 and focus a large landscape 16:9 at the front, the one before and the one after peeking at the sides; the content fills it. fade dissolves both sides, always. The wheel no longer clips what stands out. Dragging past 15% of a slide now goes to the next one."
  - date: 2026-11-21
    kind: feature
    es:
      title: "CurveCarousel es una rueda: gira sin fin, con inercia, y con un stepper"
      body: "Se arrastra con el mouse o el dedo y sigue girando hasta detenerse en una slide (momentum), sin fin (infinite); los dos se apagan con \"off\". Cinco slides a la vez en escritorio. En vez de prev/next lleva un stepper, que con autoplay muestra el progreso. Nuevos: curveStrength, bend y fade. loop, controls, indicator, snap, mouseDrag y edgePadding salen de esta firma."
    en:
      title: "CurveCarousel is a wheel: it rolls without end, with momentum, and a stepper"
      body: "Drag it with the mouse or a finger and it keeps turning until it rests on a slide (momentum), without end (infinite); both turn off with \"off\". Five slides at a time on a desktop. Instead of prev/next it has a stepper, which shows the progress under autoplay. New: curveStrength, bend and fade. loop, controls, indicator, snap, mouseDrag and edgePadding leave this signature."
  - date: 2026-11-21
    kind: feature
    es:
      title: "CurveCarousel: un anillo de verdad, con la cámara dentro"
      body: "Las slides avanzan por el arco de una circunferencia, con el mismo espacio entre ellas, y cada una sigue la tangente del anillo. En concave la cámara está cerca del centro, así que los lados se agrandan como con un gran angular. --sk-carousel-perspective ajusta ese efecto; --sk-carousel-curve-angle y --sk-carousel-curve-depth desaparecen."
    en:
      title: "CurveCarousel: a real ring, with the camera inside it"
      body: "Slides move along the arc of a circle, evenly spaced, each lying along the ring's tangent. In concave the camera sits near the centre, so the sides swell as through a wide lens. --sk-carousel-perspective tunes that; --sk-carousel-curve-angle and --sk-carousel-curve-depth are gone."
  - date: 2026-11-21
    kind: feature
    es:
      title: "CurveCarousel: el anillo como componente propio"
      body: "La curva pasa a su propia firma, Carousel.curve (CurveCarousel en React), con su página. Centra la slide en reposo, dimensiona las slides y el aire en los extremos, y abre en la del medio: solo se escribe curve. Carousel queda plano y ya no acepta curve."
    en:
      title: "CurveCarousel: the ring as a component of its own"
      body: "The curve moves to its own signature, Carousel.curve (CurveCarousel in React), with its own page. It centres the slide at rest, sizes the slides and the air at the ends, and opens on the middle one: only curve is written. Carousel stays flat and no longer takes curve."
  - date: 2026-11-21
    kind: feature
    es:
      title: "curve: las slides sobre un anillo, desde fuera o desde dentro"
      body: "curve=\"convex\" mira el anillo desde fuera (la slide del centro queda más cerca) y curve=\"concave\" desde dentro (queda más lejos). Es solo CSS sobre la misma pista, así que la máquina, los controles y el teclado no cambian; sin soporte o con movimiento reducido la pista queda plana. defaultPage elige la página en la que abre."
    en:
      title: "curve: the slides on a ring, from outside or from inside"
      body: "curve=\"convex\" looks at the ring from outside (the centred slide is nearest) and curve=\"concave\" from inside (it is farthest). CSS only on the same track, so the machine, the controls and the keyboard are unchanged; without support or under reduced motion the track stays flat. defaultPage picks the page it opens on."
  - date: 2026-10-19
    kind: feature
    target: fade
    es:
      title: Bordes que se desvanecen y un contador en vez de puntos
      body: "<code>fade</code> compone FadeEdge para desvanecer los dos extremos de la pista, así el slide que se asoma se libera en vez de cortarse en seco. <code>indicator=\"count\"</code> cambia los puntos por un contador \"2 / 5\"."
    en:
      title: Fading edges and a counter in place of dots
      body: "<code>fade</code> composes FadeEdge to fade the track's two ends, so a peeking slide releases instead of hard-clipping. <code>indicator=\"count\"</code> swaps the dots for a \"2 / 5\" counter."
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
  - date: 2026-10-14
    kind: feature
    es:
      title: Alineación, paso, snap suave y aire en los bordes
      body: "Nuevas opciones align, slidesPerMove, snap=\"proximity\" y edgePadding: slide centrado, avance de varios en varios y arrastre que puede quedar entre slides."
    en:
      title: Alignment, step, soft snap and edge padding
      body: "New options align, slidesPerMove, snap=\"proximity\" and edgePadding: a centred slide, moving several at a time and a drag that can rest between slides."
