entries:
  - date: 2026-10-19
    kind: feature
    target: fade
    es:
      title: Bordes que se desvanecen y un contador en vez de puntos
      body: "<code>fade</code> compone FadeEdge para desvanecer los dos extremos de la pista, así el slide que se asoma se libera en vez de cortarse en seco. <code>indicator=\"count\"</code> cambia los puntos por un contador \"2 / 5\"."
    en:
      title: Fading edges and a counter in place of dots
      body: "<code>fade</code> composes FadeEdge to fade the track's two ends, so a peeking slide releases instead of hard-clipping. <code>indicator=\"count\"</code> swaps the dots for a \"2 / 5\" counter."
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
  - date: 2026-10-14
    kind: feature
    es:
      title: Alineación, paso, snap suave y aire en los bordes
      body: "Nuevas opciones align, slidesPerMove, snap=\"proximity\" y edgePadding: slide centrado, avance de varios en varios y arrastre que puede quedar entre slides."
    en:
      title: Alignment, step, soft snap and edge padding
      body: "New options align, slidesPerMove, snap=\"proximity\" and edgePadding: a centred slide, moving several at a time and a drag that can rest between slides."
