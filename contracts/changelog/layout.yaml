# Qué cambió en layout, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribí la entrada y pegá el
# hash nuevo.
surface: "1de00956bf02b97b"
entries:
  - date: 2026-08-21
    kind: feature
    es:
      title: El rail de LayoutGrid va antes, después, o en ambos lados
      body: >-
        <code>data-width="rail"</code> sigue sentándose después del contenido;
        <code>data-width="rail-start"</code> lo pone antes; la misma
        <code>sk-layout-grid</code> puede llevar los dos a la vez. El aire entre
        rail y contenido es <code>--sk-layout-rail-gap</code> (un paso de
        <code>space-inline</code>, no el track de breakout, que dejaba un hueco
        de lectura entre la prosa y su índice).
    en:
      title: LayoutGrid's rail can sit before, after, or on both sides
      body: >-
        <code>data-width="rail"</code> still sits after the content;
        <code>data-width="rail-start"</code> puts it before; the same
        <code>sk-layout-grid</code> can carry both at once. The air between rail
        and content is <code>--sk-layout-rail-gap</code> (one
        <code>space-inline</code> step, not the breakout track, which left a
        reading-measure gap between the prose and its index).
  - date: 2026-08-21
    kind: feature
    es:
      title: LayoutGrid publica una columna de rail
      body: >-
        <code>data-width="rail"</code> reserva una columna aparte del flujo principal, junto a él —
        no un span de contenido como <code>narrow</code>/<code>breakout</code>, sino un hijo directo
        de otro tipo, para un TOC, navegación contextual o cualquier otro elemento de apoyo. Fijo en
        ancho (<code>--sk-layout-rail-inline-size</code>, 14rem por defecto) y colapsa a una fila
        propia sobre el contenido por debajo de <code>wide</code> (72rem); <code>--sk-layout-rail-row-span</code>
        lo estira para acompañar tantas filas del contenido como declare quien lo compone. No tiene
        enhancer: <code>patterns/layout.css</code> resuelve todo.
    en:
      title: LayoutGrid publishes a rail column
      body: >-
        <code>data-width="rail"</code> reserves a column of its own beside the main flow — not a
        content span like <code>narrow</code>/<code>breakout</code>, but a direct child of a
        different kind, for a TOC, contextual navigation, or any other supporting element. Fixed in
        width (<code>--sk-layout-rail-inline-size</code>, 14rem by default) and collapses to its own
        row above the content below <code>wide</code> (72rem); <code>--sk-layout-rail-row-span</code>
        stretches it to match however many rows of content whoever composes it declares. No enhancer:
        <code>patterns/layout.css</code> resolves all of it.
  - date: 2026-08-20
    kind: feature
    es:
      title: Main se publica como landmark de layout
      body: >-
        <code>Main</code> entra al catálogo como el landmark <code>&lt;main&gt;</code> de la página: una
        región de shell, no un componente de contenido, así que sus hijos quedan opcionales para que una
        plantilla pueda mostrar el chrome antes de que la aplicación decida qué va ahí. No tiene enhancer.
    en:
      title: Main is published as the layout landmark
      body: >-
        <code>Main</code> joins the catalogue as the page's <code>&lt;main&gt;</code> landmark: a shell
        region, not a content component, so its children stay optional so a template can show chrome
        before an application decides what belongs there. It has no enhancer.
  - date: 2026-08-11
    kind: feature
    es:
      title: Layout se publica como contrato, con 4 signatures
      body: >-
        Entra al catálogo con <code>Stack</code>, <code>Inline</code>, <code>Grid</code>,
        <code>DensityScope</code>: los dos bindings lo realizan, y la referencia de esta página sale del
        contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el markup está completo
        por sí solo, así que las dos bindings son el mismo markup dos veces. Opciones: <code>gap</code>,
        <code>align</code>, <code>inlineAlign</code>, <code>justify</code>, <code>equal</code>,
        <code>wrap</code>, <code>columns</code>, <code>multicol</code>, <code>densityFactor</code>. La
        hoja es <code>patterns/layout.css</code>.
    en:
      title: Layout is published as a contract, with 4 signatures
      body: >-
        It joins the catalogue with <code>Stack</code>, <code>Inline</code>, <code>Grid</code>,
        <code>DensityScope</code>: both bindings realize it, and this page's reference is rendered from
        the compiled contract rather than from prose written beside it. There is no enhancer: the markup
        is complete on its own, so both bindings are the same markup twice. Options: <code>gap</code>,
        <code>align</code>, <code>inlineAlign</code>, <code>justify</code>, <code>equal</code>,
        <code>wrap</code>, <code>columns</code>, <code>multicol</code>, <code>densityFactor</code>. Its
        stylesheet is <code>patterns/layout.css</code>.
  - date: 2026-08-11
    kind: feature
    es:
      title: LayoutGrid agrega medidas de contenido y full bleed
      body: >-
        <code>LayoutGrid</code> suma una grilla de página con columnas <code>narrow</code>,
        <code>content</code>, <code>breakout</code> y <code>full-width</code>. Cada hijo directo queda
        en content por defecto y puede elegir otra columna con <code>data-width</code>; un hijo full-width
        hereda la grilla para que su contenido vuelva a content automáticamente. No tiene enhancer:
        <code>@skryensya/core/patterns/layout.css</code> resuelve todo el comportamiento y React sólo
        imprime la misma clase.
    en:
      title: LayoutGrid adds content measures and full bleed
      body: >-
        <code>LayoutGrid</code> adds a page grid with <code>narrow</code>, <code>content</code>,
        <code>breakout</code>, and <code>full-width</code> columns. Every direct child defaults to
        content and can choose another column with <code>data-width</code>; a full-width child inherits
        the grid so its content returns to content automatically. It has no enhancer:
        <code>@skryensya/core/patterns/layout.css</code> supplies all behavior and React only renders the
        same class.