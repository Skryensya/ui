# What changed in layout, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "fb145adc000926c0"
entries:
  - date: 2026-09-10
    kind: feature
    target: blockStart
    es:
      title: Inline gana blockStart, incluido auto para el piso de una card
      body: >-
        La opción nueva <code>blockStart</code> (<code>data-block-start</code>) pone aire encima
        de la fila: los mismos pasos de la escala de stack, más <code>auto</code>. El default es
        <code>none</code>, así un Inline de rótulo y valor no crece un hueco que nadie pidió.
        <code>auto</code> es el caso del piso de una card: la altura que sobra en la columna queda
        ARRIBA de la fila, y un Box cuya última hija es esa Inline se vuelve una columna flex que
        llena su celda. No hay un componente <code>ButtonWrapper</code>; la fila de botones ya era
        el intent <code>button-row</code> de Inline.
    en:
      title: Inline gains blockStart, including auto for a card's floor
      body: >-
        The new <code>blockStart</code> option (<code>data-block-start</code>) puts space above the
        row: the same steps as the stack scale, plus <code>auto</code>. The default is
        <code>none</code>, so a label-and-value Inline does not grow a gap nobody asked for.
        <code>auto</code> is the card-floor case: leftover height in the column sits ABOVE the row,
        and a Box whose last child is that Inline becomes a flex column that fills its cell. There
        is no <code>ButtonWrapper</code> component; the button row was already Inline's
        <code>button-row</code> intent.
  - date: 2026-09-04
    kind: breaking
    es:
      title: DensityScope se retira del contrato
      body: >-
        El signature <code>DensityScope</code> y la opción <code>densityFactor</code> de
        <code>layout</code> ya no existen; con ellos se va también el componente React
        <code>&lt;DensityScope&gt;</code>. El motor que quedaba debajo NO se tocó:
        <code>--sk-density</code>, <code>--sk-density-factor</code> y el atributo
        <code>data-sk-density-scope</code> siguen siendo el mismo mecanismo semántico
        (<code>semantic/_density.scss</code>), autorable a mano en cualquier elemento - es
        exactamente como ya lo usan <code>CopyButton</code> y la galería de presets, ninguno de los
        dos pasaba por este signature. Lo que se retira es sólo la envoltura de árbol de uso que
        escribía ese atributo por vos; una migración cambia un nodo
        <code>{ contract: "layout", signature: "DensityScope", options: { densityFactor } }</code>
        por un <code>Box</code>/<code>Stack</code> con
        <code>attrs: { "data-sk-density-scope": "", style: "--sk-density-factor: …" }</code>.
    en:
      title: DensityScope leaves the contract
      body: >-
        The <code>DensityScope</code> signature and <code>layout</code>'s <code>densityFactor</code>
        option are gone, and with them the React <code>&lt;DensityScope&gt;</code> component. The engine
        underneath was NOT touched: <code>--sk-density</code>, <code>--sk-density-factor</code> and
        the <code>data-sk-density-scope</code> attribute stay exactly the same semantic mechanism
        (<code>semantic/_density.scss</code>), hand-authorable on any element - it's exactly how
        <code>CopyButton</code> and the presets gallery already use it, neither ever went through
        this signature. What leaves is only the usage-tree wrapper that wrote that attribute for
        you; a migration swaps a node
        <code>{ contract: "layout", signature: "DensityScope", options: { densityFactor } }</code>
        for a <code>Box</code>/<code>Stack</code> carrying
        <code>attrs: { "data-sk-density-scope": "", style: "--sk-density-factor: …" }</code>.
  - date: 2026-09-02
    kind: rework
    es:
      title: Inline alinea sus items al borde inferior por defecto, no al centro
      body: >-
        El default de <code>inlineAlign</code> (la opción de <code>Inline</code>, <code>data-align</code>
        en el markup) pasa de <code>"center"</code> a <code>"end"</code>: una fila que mezcla, por
        ejemplo, una etiqueta y un control de distinta altura ahora asienta sus items sobre un borde
        inferior compartido en vez de flotar cada uno en su propio centro vertical, que se lee como una
        sola línea. Una composición que dependía del centrado vuelve a él con
        <code>inlineAlign: "center"</code> (<code>data-align="center"</code>), un valor que antes no
        hacía falta declarar y ahora sí. <code>patterns/layout.css</code> acompaña el cambio
        (<code>.sk-inline</code> arranca en <code>align-items: flex-end</code>).
    en:
      title: Inline aligns its items to the bottom edge by default, not the center
      body: >-
        The default for <code>inlineAlign</code> (<code>Inline</code>'s option, <code>data-align</code>
        in markup) moves from <code>"center"</code> to <code>"end"</code>: a row mixing, say, a label
        and a control of different heights now sits its items on a shared bottom edge rather than each
        floating at its own vertical center, so it reads as one line. A composition that relied on
        centering gets it back with <code>inlineAlign: "center"</code> (<code>data-align="center"</code>),
        a value that did not need declaring before and now does. <code>patterns/layout.css</code>
        matches the change (<code>.sk-inline</code> starts at <code>align-items: flex-end</code>).
  - date: 2026-08-26
    kind: feature
    es:
      title: Grid agrega una quinta columna y un modo responsive con celdas destacadas
      body: >-
        <code>columns</code> acepta <code>"5"</code>, y la opción nueva <code>responsive</code>
        (<code>data-responsive</code>) hace que el número declarado sea el TECHO y no el ancho fijo:
        la grilla arranca en una sola columna y va sumando carriles en 36rem, 52rem, 72rem y 90rem
        hasta llegar al que se pidió. A diferencia de <code>multicol</code>, son filas reales de CSS
        Grid, así que un hijo directo puede pedir más de un carril con <code>data-span</code>, acotado
        a los carriles que existan en ese momento. La regla para elegir: <code>multicol</code> cuando
        cada card deba conservar su propia altura estilo Pinterest, <code>responsive</code> cuando
        importe más tener una celda destacada ancha que evitar huecos bajo las vecinas más bajas.
    en:
      title: Grid grows a fifth column and a responsive mode with featured cells
      body: >-
        <code>columns</code> accepts <code>"5"</code>, and the new <code>responsive</code> option
        (<code>data-responsive</code>) makes the declared number a CEILING rather than a fixed width:
        the grid starts at one column and adds lanes at 36rem, 52rem, 72rem and 90rem until it reaches
        the one that was asked for. Unlike <code>multicol</code>, these are real CSS Grid rows, so a
        direct child can request more than one lane with <code>data-span</code>, capped to however many
        lanes exist at that moment. The rule for choosing: <code>multicol</code> when every card should
        keep its own Pinterest-style height, <code>responsive</code> when one wide featured cell matters
        more than avoiding gaps under its shorter neighbours.
  - date: 2026-08-21
    kind: feature
    es:
      title: El rail de LayoutGrid va antes, después, o en ambos lados
      body: >-
        <code>data-width="rail"</code> sigue sentándose después del contenido;
        <code>data-width="rail-start"</code> lo pone antes; la misma
        <code>sk-layout-grid</code> puede llevar los dos a la vez. El aire entre
        rail y contenido es <code>--sk-layout-rail-gap</code> (un paso de
        <code>space-inline</code>, no el track de breakout, que dejaba un hueco
        de lectura entre la prosa y su índice).
    en:
      title: LayoutGrid's rail can sit before, after, or on both sides
      body: >-
        <code>data-width="rail"</code> still sits after the content;
        <code>data-width="rail-start"</code> puts it before; the same
        <code>sk-layout-grid</code> can carry both at once. The air between rail
        and content is <code>--sk-layout-rail-gap</code> (one
        <code>space-inline</code> step, not the breakout track, which left a
        reading-measure gap between the prose and its index).
  - date: 2026-08-21
    kind: feature
    es:
      title: LayoutGrid publica una columna de rail
      body: >-
        <code>data-width="rail"</code> reserva una columna aparte del flujo principal, junto a él -
        no un span de contenido como <code>narrow</code>/<code>breakout</code>, sino un hijo directo
        de otro tipo, para un TOC, navegación contextual o cualquier otro elemento de apoyo. Fijo en
        ancho (<code>--sk-layout-rail-inline-size</code>, 14rem por defecto) y colapsa a una fila
        propia sobre el contenido por debajo de <code>wide</code> (72rem); <code>--sk-layout-rail-row-span</code>
        lo estira para acompañar tantas filas del contenido como declare quien lo compone. No tiene
        enhancer: <code>patterns/layout.css</code> resuelve todo.
    en:
      title: LayoutGrid publishes a rail column
      body: >-
        <code>data-width="rail"</code> reserves a column of its own beside the main flow: not a
        content span like <code>narrow</code>/<code>breakout</code>, but a direct child of a
        different kind, for a TOC, contextual navigation, or any other supporting element. Fixed in
        width (<code>--sk-layout-rail-inline-size</code>, 14rem by default) and collapses to its own
        row above the content below <code>wide</code> (72rem); <code>--sk-layout-rail-row-span</code>
        stretches it to match however many rows of content whoever composes it declares. No enhancer:
        <code>patterns/layout.css</code> resolves all of it.
  - date: 2026-08-20
    kind: feature
    es:
      title: Main se publica como landmark de layout
      body: >-
        <code>Main</code> entra al catálogo como el landmark <code>&lt;main&gt;</code> de la página: una
        región de shell, no un componente de contenido, así que sus hijos quedan opcionales para que una
        plantilla pueda mostrar el chrome antes de que la aplicación decida qué va ahí. No tiene enhancer.
    en:
      title: Main is published as the layout landmark
      body: >-
        <code>Main</code> joins the catalogue as the page's <code>&lt;main&gt;</code> landmark: a shell
        region, not a content component, so its children stay optional so a template can show chrome
        before an application decides what belongs there. It has no enhancer.
  - date: 2026-08-11
    kind: feature
    es:
      title: Layout se publica como contrato, con 4 signatures
      body: >-
        Entra al catálogo con <code>Stack</code>, <code>Inline</code>, <code>Grid</code>,
        <code>DensityScope</code>: los dos bindings lo realizan, y la referencia de esta página sale del
        contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el markup está completo
        por sí solo, así que las dos bindings son el mismo markup dos veces. Opciones: <code>gap</code>,
        <code>align</code>, <code>inlineAlign</code>, <code>justify</code>, <code>equal</code>,
        <code>wrap</code>, <code>columns</code>, <code>multicol</code>, <code>densityFactor</code>. La
        hoja es <code>patterns/layout.css</code>.
    en:
      title: Layout is published as a contract, with 4 signatures
      body: >-
        It joins the catalogue with <code>Stack</code>, <code>Inline</code>, <code>Grid</code>,
        <code>DensityScope</code>: both bindings realize it, and this page's reference is rendered from
        the compiled contract rather than from prose written beside it. There is no enhancer: the markup
        is complete on its own, so both bindings are the same markup twice. Options: <code>gap</code>,
        <code>align</code>, <code>inlineAlign</code>, <code>justify</code>, <code>equal</code>,
        <code>wrap</code>, <code>columns</code>, <code>multicol</code>, <code>densityFactor</code>. Its
        stylesheet is <code>patterns/layout.css</code>.
  - date: 2026-08-11
    kind: feature
    es:
      title: LayoutGrid agrega medidas de contenido y full bleed
      body: >-
        <code>LayoutGrid</code> suma una grilla de página con columnas <code>narrow</code>,
        <code>content</code>, <code>breakout</code> y <code>full-width</code>. Cada hijo directo queda
        en content por defecto y puede elegir otra columna con <code>data-width</code>; un hijo full-width
        hereda la grilla para que su contenido vuelva a content automáticamente. No tiene enhancer:
        <code>@skryensya/core/patterns/layout.css</code> resuelve todo el comportamiento y React sólo
        imprime la misma clase.
    en:
      title: LayoutGrid adds content measures and full bleed
      body: >-
        <code>LayoutGrid</code> adds a page grid with <code>narrow</code>, <code>content</code>,
        <code>breakout</code>, and <code>full-width</code> columns. Every direct child defaults to
        content and can choose another column with <code>data-width</code>; a full-width child inherits
        the grid so its content returns to content automatically. It has no enhancer:
        <code>@skryensya/core/patterns/layout.css</code> supplies all behavior and React only renders the
        same class.