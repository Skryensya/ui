# What changed in tooltip, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "4316ecc63a91a121"
entries:
  - date: 2026-11-20
    kind: bugfix
    es:
      title: "Abre junto a su trigger después de hacer scroll"
      body: "El tooltip calculaba su posición en coordenadas del documento mientras la caja es <code>position: fixed</code>, así que tras hacer scroll abría desplazado lo mismo que se había scrolleado. Ahora usa coordenadas de la ventana de punta a punta."
    en:
      title: "Opens next to its trigger after a scroll"
      body: "The tooltip measured its position in document coordinates while the box is <code>position: fixed</code>, so after a scroll it opened as far off as the page had moved. It now uses viewport coordinates end to end."
  - date: 2026-10-19
    kind: bugfix
    es:
      title: Se retira el hook --sk-tooltip-offset, que no hacía nada
      body: "Estaba en la lista de hooks del contrato, pero ninguna hoja de estilos de Tooltip lo declara: sobrescribirlo no cambiaba nada, en silencio."
    en:
      title: --sk-tooltip-offset removed; it did nothing
      body: "It was listed as a contract hook, but no Tooltip stylesheet ever declares it: overriding it changed nothing, silently."
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
