# What changed in tooltip, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "ea6bdc9c9a9c24ea"
entries:
  - date: 2026-09-25
    kind: bugfix
    target: arrow
    es:
      title: React escribe data-arrow en la raíz
      body: >-
        La opción <code>arrow</code> se escribe como <code>data-arrow</code> en la raíz, y el markup lo hacía pero React no: dibujaba la
        flecha sin decirlo. Ahora las dos raíces son iguales.
    en:
      title: React writes data-arrow on the root
      body: >-
        The <code>arrow</code> option is written as <code>data-arrow</code> on the root, and markup did so while React did not: it drew the
        arrow without saying it. Both roots now match.
  - date: 2026-09-17
    kind: feature
    es:
      title: Firmas interactivas declaran forward
      body: >-
        Las firmas host interactivas o de formulario publican <code>forward</code>
        (<code>id</code>/<code>aria-*</code> y attrs de enlace o formulario cuando aplica).
        Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: Interactive signatures declare forward
      body: >-
        Interactive or form host signatures publish <code>forward</code>
        (<code>id</code>/<code>aria-*</code> and link or form attrs where relevant).
        An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: feature
    es:
      title: portals declara container de React
      body: >-
        <code>portals: { container: true }</code> documenta el ref React-only que acota el portal (por defecto <code>document.body</code>). El markup sigue anclado en el subárbol.
    en:
      title: portals declares the React container
      body: >-
        <code>portals: { container: true }</code> documents the React-only ref that scopes the portal (default <code>document.body</code>). Markup stays in the subtree.
  - date: 2026-09-17
    kind: feature
    es:
      title: eventDetails nombra source y trigger
      body: >-
        <code>eventDetails</code> declara <code>source</code> (parte que despacha el CustomEvent) y, cuando es claro, <code>trigger</code> (parte que el usuario activa). Un agente sabe dónde escuchar y qué control provoca el evento.
    en:
      title: eventDetails names source and trigger
      body: >-
        <code>eventDetails</code> declares <code>source</code> (part that dispatches the CustomEvent) and, when clear, <code>trigger</code> (part the user activates). An agent knows where to listen and which control causes the event.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-09-16
    kind: feature
    target: openChange
    es:
      title: Tooltip publica eventos, opciones de máquina y anchored.css
      body: >-
        El contrato declara <code>events.openChange</code> (<code>sk:openchange</code>),
        las opciones de máquina <code>interactive</code>, <code>openDelay</code>,
        <code>closeDelay</code>, <code>disabled</code> y <code>defaultOpen</code>, y
        <code>hookSheets</code> para <code>anchored.css</code>. Vanilla alinea el nombre del
        evento; React lo despacha junto con <code>onOpenChange</code>.
    en:
      title: Tooltip publishes events, machine options, and anchored.css
      body: >-
        The contract declares <code>events.openChange</code> (<code>sk:openchange</code>),
        machine options <code>interactive</code>, <code>openDelay</code>,
        <code>closeDelay</code>, <code>disabled</code> and <code>defaultOpen</code>, and
        <code>hookSheets</code> for <code>anchored.css</code>. Vanilla aligns the event name;
        React dispatches it alongside <code>onOpenChange</code>.
  - date: 2026-09-02
    kind: rework
    es:
      title: El tooltip se cierra al instante, sin animación de salida
      body: >-
        Un tooltip sigue apareciendo con su materialize suave, pero al cerrarse desaparece en el
        mismo frame en vez de desvanecerse. La asimetría es a propósito: cuando el puntero se va, o
        cuando se activa el control que el tooltip describe (un botón de sólo icono, una opción de un
        segmented), un fade de salida se lee como demora sobre algo que ya se leyó o sobre un control
        cuyo estado acaba de cambiar. Aplica a los dos bindings; no hay nada que autorar.
    en:
      title: The tooltip closes instantly, with no exit animation
      body: >-
        A tooltip still appears with its soft materialize, but on close it disappears in the same
        frame rather than fading. The asymmetry is deliberate: when the pointer leaves, or when the
        control the tooltip describes is activated (an icon-only button, a segmented option), an exit
        fade reads as lag over something already read or over a control whose state just changed.
        Applies to both bindings; nothing to author.
  - date: 2026-08-11
    kind: feature
    es:
      title: Tooltip se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Tooltip</code>: los dos bindings lo realizan, y la referencia de
        esta página sale del contrato compilado en vez de prosa escrita al lado. El binding Vanilla
        monta sobre <code>data-sk-anchor</code>: el markup se autora y el enhancer lo hidrata, así que
        lo que no necesita JavaScript funciona antes de que corra ninguno. Opciones:
        <code>placement</code>, <code>arrow</code>. La hoja es <code>components/tooltip.css</code>.
    en:
      title: Tooltip is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Tooltip</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. The
        Vanilla binding mounts on <code>data-sk-anchor</code>: the markup is authored and the enhancer
        hydrates it, so whatever needs no JavaScript works before any runs. Options:
        <code>placement</code>, <code>arrow</code>. Its stylesheet is
        <code>components/tooltip.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de tooltip quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>13</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: tooltip's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>13</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Cada evento lleva el nombre de su familia
      body: >-
        <code>sk:openchange</code> → <code>sk:tooltipopenchange</code>. Un mismo nombre ya no lo despachan varias familias: un listener sobre una raíz deja
        de recibir los eventos de un componente distinto anidado adentro.
    en:
      title: Every event carries its family in its name
      body: >-
        <code>sk:openchange</code> → <code>sk:tooltipopenchange</code>. No two families dispatch the same name any more: a listener on a root stops receiving
        the events of a different component nested inside it.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: El contrato declara el rango de sus números
      body: >-
        <code>openDelay</code> y <code>closeDelay</code> no bajan de 0. Un valor fuera de rango deja de validar en vez de llegar al binding.
    en:
      title: The contract declares the range of its numbers
      body: >-
        <code>openDelay</code> and <code>closeDelay</code> do not go below 0. A value out of range stops validating instead of reaching the binding.
