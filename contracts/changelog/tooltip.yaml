# What changed in tooltip, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "d1d397de62d2439c"
entries:
  - date: 2026-09-02
    kind: rework
    es:
      title: El tooltip se cierra al instante, sin animación de salida
      body: >-
        Un tooltip sigue apareciendo con su materialize suave, pero al cerrarse desaparece en el
        mismo frame en vez de desvanecerse. La asimetría es a propósito: cuando el puntero se va, o
        cuando se activa el control que el tooltip describe (un botón de sólo icono, una opción de un
        segmented), un fade de salida se lee como demora sobre algo que ya se leyó o sobre un control
        cuyo estado acaba de cambiar. Aplica a los dos bindings; no hay nada que autorar.
    en:
      title: The tooltip closes instantly, with no exit animation
      body: >-
        A tooltip still appears with its soft materialize, but on close it disappears in the same
        frame rather than fading. The asymmetry is deliberate: when the pointer leaves, or when the
        control the tooltip describes is activated (an icon-only button, a segmented option), an exit
        fade reads as lag over something already read or over a control whose state just changed.
        Applies to both bindings; nothing to author.
  - date: 2026-08-11
    kind: feature
    es:
      title: Tooltip se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Tooltip</code>: los dos bindings lo realizan, y la referencia de
        esta página sale del contrato compilado en vez de prosa escrita al lado. El binding Vanilla
        monta sobre <code>data-sk-anchor</code>: el markup se autora y el enhancer lo hidrata, así que
        lo que no necesita JavaScript funciona antes de que corra ninguno. Opciones:
        <code>placement</code>, <code>arrow</code>. La hoja es <code>components/tooltip.css</code>.
    en:
      title: Tooltip is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Tooltip</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. The
        Vanilla binding mounts on <code>data-sk-anchor</code>: the markup is authored and the enhancer
        hydrates it, so whatever needs no JavaScript works before any runs. Options:
        <code>placement</code>, <code>arrow</code>. Its stylesheet is
        <code>components/tooltip.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de tooltip quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>13</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: tooltip's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>13</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
