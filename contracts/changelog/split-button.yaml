# Qué cambió en split-button, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribí la entrada y pegá el
# hash nuevo.
surface: "8b403d17383b0ffe"
entries:
  - date: 2026-08-24
    kind: breaking
    target: SplitButton
    es:
      title: El slot primary pasa a llamarse action
      body: >-
        <code>SplitButton</code> deja de llamar <code>primary</code> a la mitad que ejecuta la
        acción por defecto. El nombre describía una jerarquía que el contrato no puede comprobar.
        El slot se llama ahora <code>action</code>; sigue aceptando la misma signature
        <code>Button.action</code> y el template conserva el mismo orden: acción primero, menú
        después. En React, la prop compuesta también pasa de <code>primary</code> a
        <code>action</code>. Las props planas (<code>children</code>, <code>variant</code>,
        <code>size</code>) no cambian.
    en:
      title: The primary slot is renamed to action
      body: >-
        <code>SplitButton</code> no longer calls the half that runs the default action
        <code>primary</code>. The name described hierarchy the contract cannot verify. The slot is
        now <code>action</code>; it still accepts the same <code>Button.action</code> signature and
        the template keeps the same order: action first, menu after it. In React, the composed prop
        is renamed from <code>primary</code> to <code>action</code> too. The flat props
        (<code>children</code>, <code>variant</code>, <code>size</code>) do not change.
  - date: 2026-08-17
    kind: feature
    target: SplitButton
    es:
      title: El segmento primario ya es un Button compuesto, no una parte propia del contrato
      body: >-
        El slot que hasta ahora era texto plano (<code>children</code>, con <code>variant</code>/
        <code>size</code> como opciones de este mismo contrato) pasa a llamarse
        <code>action</code> y acepta una signature <code>Button.action</code> compuesta -
        exactamente lo mismo que <code>menu</code> ya hacía con <code>Menu</code>. El template ya
        no tiene una parte "action" propia: la renderiza el `<button>` real que compone el
        autor, con `sk-button` como cualquier otro Button de la página, ninguna clase propia de
        split-button encima. `squareEnd` no es una opción. Es un hecho estático de este contrato
        (la mitad de acción siempre tiene un trigger pegado a su lado), así que el autor lo pasa
        él mismo al componer su propio Button, la misma responsabilidad que ya tenía con
        `triggerLabel` en el Menu compuesto. El binding de React conserva una capa de conveniencia
        con props planas (`children`/`variant`/`size` directo en `<SplitButton>`), que por dentro
        arma un `<Button>` real. Nunca un `<button>` a mano imitándolo.
    en:
      title: The action segment is now a composed Button, not the contract's own part
      body: >-
        The slot that used to be plain text (`children`, with `variant`/`size` as this same
        contract's own options) is renamed `action` and takes a composed `Button.action`
        signature instead. Exactly what `menu` already did with `Menu`. The template no longer
        has an "action" part of its own: it is rendered by the real `<button>` the author
        composes, carrying `sk-button` like any other Button on the page, no split-button-specific
        class on top. `squareEnd` is not an option. It is a static fact of this contract (the
        action half always has a trigger glued to its side), so the author sets it themselves
        when composing their own Button, the same responsibility they already had for
        `triggerLabel` on the composed Menu. The React binding keeps a flat-prop convenience layer
        (`children`/`variant`/`size` directly on `<SplitButton>`), which internally builds a real
        `<Button>`: never a hand-rolled `<button>` imitating one.
  - date: 2026-08-17
    kind: bugfix
    target: label
    es:
      title: El relleno y la esquina soldada del primario ya no dependen de este archivo
      body: >-
        La regla que le daba color a <code>.sk-split-button__action</code> tenía EXACTAMENTE la
        misma especificidad que la propia regla base de <code>.sk-button</code> (una clase contra
        una clase). Un empate genuino que decidía en silencio cuál de las dos hojas de estilo la
        página insertaba segunda, y en la práctica lo decidía al revés (confirmado en vivo: el
        segmento primario salía sin relleno, gris, con las CUATRO esquinas redondeadas en vez de la
        esquina cuadrada del empalme). Esa arquitectura completa se retira: el segmento primario
        ahora ES un <code>&lt;button&gt;</code> normal, pintado por las mismas reglas
        <code>[data-variant]</code>/<code>[data-size]</code> de cualquier otro <code>Button</code>
        de la página, con la esquina soldada resuelta por las nuevas opciones
        <code>squareStart</code>/<code>squareEnd</code> de Button (opción estática
        <code>data-square-end</code> en el primario, siempre encendida: nunca configurable, la
        alternativa no tiene sentido para este contrato). El trigger llega al mismo lugar por las
        nuevas opciones homónimas de Menu (<code>triggerVariant</code>/<code>triggerSize</code>/
        <code>triggerSquareStart</code>). Este archivo, y su hoja de estilo, se quedan solo con lo
        que genuinamente es de un split button y de ningún otro control: el layout que suelda los
        dos y la línea divisoria entre ellos. También se agrega <code>role="group"</code> al raíz
        (ARIA17, WAI-ARIA no tiene un patrón dedicado de "split button") con una nueva opción
        <code>label</code>, opcional: cada mitad ya anuncia su propio nombre, así que el nombre del
        grupo es un plus, no la única fuente de identidad de ninguno de los dos botones.
    en:
      title: The action segment's fill and welded corner no longer depend on this file
      body: >-
        The rule that gave `.sk-split-button__action` its own fill had EXACTLY the same
        specificity as `.sk-button`'s own base rule (one class against one class). A genuine tie
        that whichever stylesheet the page inserted second silently decided, and decided backwards
        in practice (confirmed live: the action segment rendered unstyled, gray, with all FOUR
        corners rounded instead of the one squared at the seam). That whole architecture is
        retired: the action segment is now a genuinely plain <code>&lt;button&gt;</code>, painted
        by the same <code>[data-variant]</code>/<code>[data-size]</code> rules any other
        <code>Button</code> on the page reads, with the welded corner resolved by Button's own new
        <code>squareStart</code>/<code>squareEnd</code> options (a static <code>data-square-end</code>
        on the action, always on: never configurable, the alternative makes no sense for this
        contract). The trigger reaches the same place through Menu's identically-named new options
        (<code>triggerVariant</code>/<code>triggerSize</code>/<code>triggerSquareStart</code>).
        This file, and its stylesheet, are left with only what genuinely belongs to a split button
        and no other control: the layout that welds the two, and the divider line between them.
        Also adds <code>role="group"</code> to the root (ARIA17: WAI-ARIA has no dedicated "split
        button" pattern) with a new, optional <code>label</code> option: each half already
        announces its own name, so the group's own name is a bonus, not either button's only
        source of identity.
  - date: 2026-08-16
    kind: feature
    es:
      title: Nuevas opciones variant y size; los dos segmentos ya escalan juntos
      body: >-
        Se agregan <code>variant</code> (<code>action</code>/<code>danger</code>/<code>ghost</code>,
        default <code>action</code>) y <code>size</code> (<code>sm</code>/<code>md</code>/<code>lg</code>,
        default <code>md</code>): el vocabulario de <code>Button</code>, restringido a las tres
        variantes que tienen sentido para una acción DOMINANTE (el propio contrato ya lo dice:
        "acción accent estable"; <code>neutral</code>/<code>subtle</code>/<code>translucent</code>
        de Button son para un control que NO es lo único que la pantalla más necesita señalar). El
        segmento del menú siempre combina: <code>split-button.css</code> lee el mismo
        <code>data-variant</code>/<code>data-size</code> del botón de acción mediante un selector de
        hermanos y re-deriva el relleno y las proporciones del trigger desde ahí. Un solo control
        en cualquier combinación, nunca una acción llena de un color en un tamaño y un menú de otro.
    en:
      title: New variant and size options; the two segments now scale together
      body: >-
        Adds <code>variant</code> (<code>action</code>/<code>danger</code>/<code>ghost</code>,
        default <code>action</code>) and <code>size</code> (<code>sm</code>/<code>md</code>/<code>lg</code>,
        default <code>md</code>): <code>Button</code>'s own vocabulary, restricted to the three
        variants that make sense for a DOMINANT action (the contract's own doc already says so:
        "a stable accent action"; Button's own <code>neutral</code>/<code>subtle</code>/
        <code>translucent</code> are for a control that is NOT the one thing a screen most needs to
        point at). The menu segment always matches: <code>split-button.css</code> reads the SAME
        <code>data-variant</code>/<code>data-size</code> off the action button via a sibling
        selector and re-derives the trigger's own fill and proportions from it. One control at
        every combination, never a full-color, full-size action beside a mismatched dropdown.
  - date: 2026-08-16
    kind: bugfix
    es:
      title: El segmento de menú ya no muestra un chevron duplicado ni pierde su nombre
      body: >-
        La página componía el <code>trigger</code> del <code>Menu</code> con un ícono chevron
        propio: pero el template de <code>Menu</code> ya pinta su propio chevron en el trigger,
        siempre, para cualquier consumidor: el segundo salía visible al lado del primero. Ese
        trigger de solo-ícono además dejaba el botón sin nombre accesible (su único contenido era
        un svg <code>aria-hidden</code>). El patrón real de un split button: el de GitHub, el
        <code>dropdown-toggle-split</code> de Bootstrap, el <code>SplitButton</code> de Fluent: es
        exactamente esto: un segmento de solo-ícono, sin texto visible, nombrado por
        <code>aria-label</code>. La nueva opción <code>triggerLabel</code> de Menu hace eso posible
        correctamente: un chevron, un nombre real, sin inventar un segundo control de solo-lectura
        visual. El estilo también cambió: el segmento del menú ahora comparte el relleno del
        primario (antes era un botón gris neutro pegado al lado, dos controles que no leían como
        uno) con una sola línea divisoria entre los dos, en vez de un borde completo alrededor del
        segmento del menú.
    en:
      title: The menu segment no longer shows a doubled chevron or loses its name
      body: >-
        The page composed <code>Menu</code>'s <code>trigger</code> with its own chevron icon: but
        <code>Menu</code>'s own template already paints a chevron on the trigger, always, for every
        consumer: the second one rendered visibly beside the first. That icon-only trigger also
        left the button with no accessible name at all (its only content was an
        <code>aria-hidden</code> svg). The real split-button pattern: GitHub's, Bootstrap's
        <code>dropdown-toggle-split</code>, Fluent's <code>SplitButton</code>: is exactly this: an
        icon-only segment, no visible text, named by <code>aria-label</code>. Menu's new
        <code>triggerLabel</code> option makes that possible correctly: one chevron, a real name,
        no second visual-only control invented to carry it. The styling changed too: the menu
        segment now shares the action half's own fill (it used to be a plain neutral gray button
        parked beside it, two controls that did not read as one) with a single hairline divider
        between the two, instead of a full border around the menu segment.
  - date: 2026-08-11
    kind: feature
    es:
      title: SplitButton se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>SplitButton</code>: los dos bindings lo realizan, y la referencia de
        esta página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el
        markup está completo por sí solo, así que las dos bindings son el mismo markup dos veces. No
        tiene opciones: el elemento ES el significado. La hoja es
        <code>components/split-button.css</code>.
    en:
      title: SplitButton is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>SplitButton</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        It has no options: the element IS the meaning. Its stylesheet is
        <code>components/split-button.css</code>.