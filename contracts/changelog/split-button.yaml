# Qué cambió en split-button, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribí la entrada y pegá el
# hash nuevo.
surface: "efe82c420bcdf739"
entries:
  - date: 2026-08-16
    kind: feature
    target: variant
    es:
      title: Nuevas opciones variant y size; los dos segmentos ya escalan juntos
      body: >-
        Se agregan <code>variant</code> (<code>primary</code>/<code>danger</code>/<code>ghost</code>,
        default <code>primary</code>) y <code>size</code> (<code>sm</code>/<code>md</code>/<code>lg</code>,
        default <code>md</code>) — el vocabulario de <code>Button</code>, restringido a las tres
        variantes que tienen sentido para una acción DOMINANTE (el propio contrato ya lo dice:
        "acción principal estable"; <code>neutral</code>/<code>subtle</code>/<code>translucent</code>
        de Button son para un control que NO es lo único que la pantalla más necesita señalar). El
        segmento del menú siempre combina: <code>split-button.css</code> lee el mismo
        <code>data-variant</code>/<code>data-size</code> del botón primario mediante un selector de
        hermanos y re-deriva el relleno y las proporciones del trigger desde ahí — un solo control
        en cualquier combinación, nunca una acción llena de un color en un tamaño y un menú de otro.
    en:
      title: New variant and size options; the two segments now scale together
      body: >-
        Adds <code>variant</code> (<code>primary</code>/<code>danger</code>/<code>ghost</code>,
        default <code>primary</code>) and <code>size</code> (<code>sm</code>/<code>md</code>/<code>lg</code>,
        default <code>md</code>) — <code>Button</code>'s own vocabulary, restricted to the three
        variants that make sense for a DOMINANT action (the contract's own doc already says so:
        "a stable primary action"; Button's own <code>neutral</code>/<code>subtle</code>/
        <code>translucent</code> are for a control that is NOT the one thing a screen most needs to
        point at). The menu segment always matches: <code>split-button.css</code> reads the SAME
        <code>data-variant</code>/<code>data-size</code> off the primary button via a sibling
        selector and re-derives the trigger's own fill and proportions from it — one control at
        every combination, never a full-color, full-size action beside a mismatched dropdown.
  - date: 2026-08-16
    kind: bugfix
    es:
      title: El segmento de menú ya no muestra un chevron duplicado ni pierde su nombre
      body: >-
        La página componía el <code>trigger</code> del <code>Menu</code> con un ícono chevron
        propio — pero el template de <code>Menu</code> ya pinta su propio chevron en el trigger,
        siempre, para cualquier consumidor: el segundo salía visible al lado del primero. Ese
        trigger de solo-ícono además dejaba el botón sin nombre accesible (su único contenido era
        un svg <code>aria-hidden</code>). El patrón real de un split button — el de GitHub, el
        <code>dropdown-toggle-split</code> de Bootstrap, el <code>SplitButton</code> de Fluent — es
        exactamente esto: un segmento de solo-ícono, sin texto visible, nombrado por
        <code>aria-label</code>. La nueva opción <code>triggerLabel</code> de Menu hace eso posible
        correctamente: un chevron, un nombre real, sin inventar un segundo control de solo-lectura
        visual. El estilo también cambió: el segmento del menú ahora comparte el relleno del
        primario (antes era un botón gris neutro pegado al lado, dos controles que no leían como
        uno) con una sola línea divisoria entre los dos, en vez de un borde completo alrededor del
        segmento del menú.
    en:
      title: The menu segment no longer shows a doubled chevron or loses its name
      body: >-
        The page composed <code>Menu</code>'s <code>trigger</code> with its own chevron icon — but
        <code>Menu</code>'s own template already paints a chevron on the trigger, always, for every
        consumer: the second one rendered visibly beside the first. That icon-only trigger also
        left the button with no accessible name at all (its only content was an
        <code>aria-hidden</code> svg). The real split-button pattern — GitHub's, Bootstrap's
        <code>dropdown-toggle-split</code>, Fluent's <code>SplitButton</code> — is exactly this: an
        icon-only segment, no visible text, named by <code>aria-label</code>. Menu's new
        <code>triggerLabel</code> option makes that possible correctly: one chevron, a real name,
        no second visual-only control invented to carry it. The styling changed too: the menu
        segment now shares the primary half's own fill (it used to be a plain neutral gray button
        parked beside it, two controls that did not read as one) with a single hairline divider
        between the two, instead of a full border around the menu segment.
  - date: 2026-08-11
    kind: feature
    es:
      title: SplitButton se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>SplitButton</code>: los dos bindings lo realizan, y la referencia de
        esta página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el
        markup está completo por sí solo, así que las dos bindings son el mismo markup dos veces. No
        tiene opciones: el elemento ES el significado. La hoja es
        <code>components/split-button.css</code>.
    en:
      title: SplitButton is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>SplitButton</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        It has no options: the element IS the meaning. Its stylesheet is
        <code>components/split-button.css</code>.