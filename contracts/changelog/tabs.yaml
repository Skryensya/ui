# What changed in tabs, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "7baf93fcbcf583a1"
entries:
  - date: 2026-09-14
    kind: feature
    target: variant
    es:
      title: Tabs suma la opción variant
      body: >-
        <code>variant="hanging"</code> pone la línea arriba de la lista: los triggers cuelgan de
        ella con las esquinas redondeadas abajo, y la barra del seleccionado queda en el borde
        superior. <code>underline</code> sigue siendo el valor por defecto. Es sólo CSS, ortogonal a
        <code>size</code> y <code>orientation</code>.
    en:
      title: Tabs gains the variant option
      body: >-
        <code>variant="hanging"</code> moves the line to the top of the list: the triggers hang from
        it with their rounded corners at the bottom, and the selected bar sits on the top edge.
        <code>underline</code> stays the default. It is CSS-only, orthogonal to <code>size</code>
        and <code>orientation</code>.
  - date: 2026-08-20
    kind: feature
    target: size
    es:
      title: Tabs suma la opción size
      body: >-
        <code>size</code> controla el alto de la fila de triggers, su relleno horizontal y el
        tamaño de la etiqueta: <code>sm</code> o <code>md</code> (por defecto). Es sólo CSS,
        ortogonal a <code>orientation</code>: cualquier orientación puede ser <code>sm</code>.
    en:
      title: Tabs gains the size option
      body: >-
        <code>size</code> controls the trigger row's height, its inline padding and the label
        size: <code>sm</code> or <code>md</code> (default). It is CSS-only, orthogonal to
        <code>orientation</code>: any orientation can be <code>sm</code>.
  - date: 2026-08-11
    kind: feature
    es:
      title: Tabs se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Tabs</code>: los dos bindings lo realizan, y la referencia de esta
        página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el markup
        está completo por sí solo, así que las dos bindings son el mismo markup dos veces. Opciones:
        <code>orientation</code>, <code>activationMode</code>, <code>value</code>. La hoja es
        <code>components/tabs.css</code>.
    en:
      title: Tabs is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Tabs</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        Options: <code>orientation</code>, <code>activationMode</code>, <code>value</code>. Its
        stylesheet is <code>components/tabs.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de tabs quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>15</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: tabs's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>15</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
