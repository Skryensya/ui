# What changed in tabs, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "4b585755a0f96792"
entries:
  - date: 2026-11-23
    kind: bugfix
    es:
      title: El anillo de foco de una pestaña se ve entero
      body: 'Con el teclado, el anillo de foco de una pestaña (la tira que hace scroll) se veía cortado por un contenedor que recorta. Ahora se ve entero. Se dibuja hacia adentro.'
    en:
      title: A tab’s focus ring is drawn whole
      body: 'With the keyboard, the focus ring of a tab (the scrolling strip) was cut by a clipping container. It is now drawn whole. It is drawn inside.'
  - date: 2026-11-22
    kind: bugfix
    es:
      title: Las pestañas ya no hacen saltar la página al cargar
      body: "Antes de que el script monte, el marcado mostraba todos los paneles y la página saltaba cuando se ocultaban. Ahora solo se ve el panel que empieza elegido; sin JavaScript se siguen viendo todos."
    en:
      title: Tabs no longer make the page jump on load
      body: "Before the script mounted, the markup showed every panel, and the page jumped when they hid. Now only the panel that starts selected shows; without JavaScript every panel still shows."
  - date: 2026-11-22
    kind: feature
    es:
      title: La tira puede ir debajo y repartirse en filas
      body: "<code>listPlacement: after</code> muestra la tira de pestañas debajo de los paneles, y <code>wrap</code> la reparte en filas en vez de desplazarla. Juntas sirven para una galería con miniaturas debajo de la foto. El orden del DOM no cambia, así que el teclado y los lectores de pantalla siguen igual."
    en:
      title: The strip can sit below and wrap
      body: "<code>listPlacement: after</code> shows the tab strip below the panels, and <code>wrap</code> breaks it onto rows instead of scrolling. Together they make a gallery with thumbnails under the photo. The DOM order does not change, so the keyboard and screen readers behave the same."
  - date: 2026-11-20
    kind: feature
    es:
      title: "Pestañas con borde o con fondo, desde tokens"
      body: "--sk-tabs-trigger-border-width y -border-color dibujan un borde abierto del lado del riel; --sk-tabs-trigger-selected-bg y -selected-border-color marcan la elegida; --sk-tabs-list-border-width afina o quita el riel. Por defecto nada cambia."
    en:
      title: "Outlined or filled tabs, from tokens"
      body: "--sk-tabs-trigger-border-width and -border-color draw a border open on the rail side; --sk-tabs-trigger-selected-bg and -selected-border-color mark the selected one; --sk-tabs-list-border-width thins or removes the rail. Nothing changes by default."
  - date: 2026-11-20
    kind: bugfix
    es:
      title: "Un panel ancho ya no ensancha las pestañas"
      body: "La columna de las Tabs horizontales podía crecer con su contenido: un panel ancho empujaba la lista y el panel fuera de una pantalla angosta. Ahora la columna se ajusta al contenedor."
    en:
      title: "A wide panel no longer widens the tabs"
      body: "The horizontal Tabs column grew with its content: a wide panel pushed the list and the panel past a narrow screen. The column now fits its container."
  - date: 2026-10-17
    kind: feature
    es:
      title: "Un ítem sin children ya no es un error: es el selector sin panel propio"
      body: "children pasa a opcional en cada ítem. Uno sin children no recibe panel ni aria-controls: para elegir entre dos vistas de un contenido compartido (leyendo value/onValueChange), no para cada uno tener su propia sección."
    en:
      title: "An item with no children is no longer an error: it is the panel-less selector"
      body: "children becomes optional on each item. One with no children gets neither a panel nor aria-controls: for choosing between two views of shared content (reading value/onValueChange), not for each to own its own section."
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
