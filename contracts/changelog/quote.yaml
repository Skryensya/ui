# What changed in quote, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "6fd39360b4c83ff6"
entries:
  - date: 2026-10-18
    kind: bugfix
    target: Quote
    es:
      title: "Un attribution o source calculado y vacío ya no deja una leyenda vacía"
      body: "La leyenda se mostraba con attribution !== undefined || source !== undefined; un valor calculado que llegaba como \"\" seguía contando como dado, así que aparecía un figcaption vacío (o un <cite> vacío si solo source era \"\"). Ahora una cadena vacía cuenta como ausente, igual para attribution, source e image."
    en:
      title: "A computed, empty attribution or source no longer leaves an empty caption"
      body: "The caption showed whenever attribution !== undefined || source !== undefined; a computed value that came up \"\" still counted as given, so an empty figcaption appeared (or an empty <cite> when only source was \"\"). An empty string now counts as absent, the same way for attribution, source and image."
  - date: 2026-10-02
    kind: feature
    target: media
    es:
      title: Quote acepta la imagen de la persona citada
      body: "Nuevo slot <code>image</code>: un <code>Avatar</code> (con foto o con iniciales) junto al nombre. Decora la atribución y no la reemplaza, así que por sí solo no hace aparecer el caption."
    en:
      title: Quote accepts a picture of the person quoted
      body: "New <code>image</code> slot: an <code>Avatar</code> (photo or initials) beside the name. It decorates the attribution and does not replace it, so on its own it does not make the caption appear."
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y una hoja de estilos para marcado simple."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a stylesheet for plain markup."
