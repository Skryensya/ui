# What changed in window, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "f52b3a8b0b4a7b4f"
entries:
  - date: 2026-10-25
    kind: breaking
    target: appearance
    es:
      title: "Cada apariencia tiene su propia hoja"
      body: "Las reglas de `brutalist`, `frosted` pasan de window.css a window.brutalist.css, window.frosted.css. Importa la hoja del valor que uses; sin ella, ese valor no recibe su pintura. Los hooks siguen declarados en window.css."
    en:
      title: "Each appearance has its own stylesheet"
      body: "The rules for `brutalist`, `frosted` move from window.css to window.brutalist.css, window.frosted.css. Import the sheet for the value you use; without it, that value does not get its paint. The hooks are still declared in window.css."
  - date: 2026-10-08
    kind: breaking
    target: appearance
    es:
      title: Window deja de ofrecer tactile y refina el vidrio
      body: "El marco acepta <code>plain</code>, <code>brutalist</code> y <code>frosted</code>. Se retiran <code>tactile</code> y <code>--sk-window-depth</code>: usa <code>plain</code> para una superficie sólida."
    en:
      title: Window drops tactile and refines its glass
      body: "The frame accepts <code>plain</code>, <code>brutalist</code> and <code>frosted</code>. <code>tactile</code> and <code>--sk-window-depth</code> are removed: use <code>plain</code> for a solid surface."
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
