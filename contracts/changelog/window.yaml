# What changed in window, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "23ddd7374de027d9"
entries:
  - date: 2026-10-08
    kind: breaking
    target: appearance
    es:
      title: Window deja de ofrecer tactile y refina el vidrio
      body: >-
        El marco acepta <code>plain</code>, <code>brutalist</code> y <code>frosted</code>.
        Se retiran <code>tactile</code> y <code>--sk-window-depth</code>: usa <code>plain</code>
        para una superficie sólida. El disparador conserva la appearance de Button.
        Frosted usa una sola lámina de vidrio, una barra de título apenas tintada y un borde interior
        iluminado. Con transparencia reducida o contraste alto vuelve a una superficie opaca.
    en:
      title: Window drops tactile and refines its glass
      body: >-
        The frame accepts <code>plain</code>, <code>brutalist</code> and <code>frosted</code>.
        <code>tactile</code> and <code>--sk-window-depth</code> are removed: use <code>plain</code>
        for a solid surface. The trigger keeps Button's appearance axis.
        Frosted uses one glass sheet, a lightly tinted title bar and an illuminated inner edge.
        Reduced transparency or high contrast restores an opaque surface.
  - date: 2026-09-26
    kind: feature
    target: Window
    es:
      title: Tamaño mínimo y arrastre contenido
      body: >-
        La ventana tiene un mínimo de 240 × 120 px, ampliable con <code>minWidth</code> y
        <code>minHeight</code>. El arrastre no sale del viewport o del contenedor indicado por
        <code>boundary</code>. En React, el portal <code>container</code> también limita el arrastre.
    en:
      title: Minimum size and contained dragging
      body: >-
        Windows have a 240 × 120 px minimum, increased with <code>minWidth</code> and
        <code>minHeight</code>. Dragging stays within the viewport or the container selected by
        <code>boundary</code>. In React, the portal <code>container</code> also bounds dragging.
  - date: 2026-09-26
    kind: feature
    target: triggerAppearance
    es:
      title: El disparador acepta la appearance de Button
      body: >-
        <code>triggerAppearance</code> lleva el eje <code>appearance</code> de Button al disparador, igual que
        <code>triggerVariant</code>, y lo pinta la hoja de Button.
    en:
      title: The trigger takes Button's appearance
      body: >-
        <code>triggerAppearance</code> forwards Button's <code>appearance</code> axis to the trigger, like
        <code>triggerVariant</code>, painted by Button's own sheet.
  - date: 2026-09-26
    kind: feature
    target: appearance
    es:
      title: Window suma appearance plain, tactile, brutalist y frosted
      body: >-
        <code>Window</code> acepta <code>appearance</code>, el mismo eje de Button, Tile, Box y Avatar, escrito
        en el contenido. <code>tactile</code> es una losa con saliente, <code>brutalist</code> un borde negro y
        una sombra dura que se reduce detrás de otra ventana, y <code>frosted</code> un material translúcido,
        opaco donde el material no es fiable. Hooks nuevos <code>--sk-window-depth</code>,
        <code>--sk-window-brutalist-*</code> y <code>--sk-window-frost-*</code>.
    en:
      title: Window adds plain, tactile, brutalist and frosted appearances
      body: >-
        <code>Window</code> accepts <code>appearance</code>, the same axis as Button, Tile, Box and Avatar,
        written on the content. <code>tactile</code> is a slab with a ledge, <code>brutalist</code> a black edge
        and a hard offset that shrinks behind another window, and <code>frosted</code> a translucent material,
        opaque wherever the material cannot be trusted. New hooks <code>--sk-window-depth</code>,
        <code>--sk-window-brutalist-*</code> and <code>--sk-window-frost-*</code>.
  - date: 2026-09-25
    kind: feature
    target: Window
    es:
      title: Una ventana que se mueve, cambia de tamaño y se minimiza
      body: >-
        Nuevo contrato <code>Window</code> sobre la máquina <code>@zag-js/floating-panel</code>, la misma en los dos bindings. Es un panel no
        modal: la barra de título lo arrastra, los bordes y esquinas lo redimensionan, y sus controles lo minimizan, lo maximizan, lo restauran y
        lo cierran. Con el foco adentro, las flechas lo mueven y Escape lo cierra (o cancela el arrastre en curso). Varias ventanas abiertas se
        apilan y la última enfocada queda arriba. El contenido es un <code>role="dialog"</code> sin <code>aria-modal</code>, nombrado por su
        título. Los nombres de los controles son opciones (<code>closeLabel</code>, <code>minimizeLabel</code>, <code>maximizeLabel</code>,
        <code>restoreLabel</code>). Eventos: <code>sk:windowopenchange</code> y <code>sk:windowstagechange</code>. La hoja es
        <code>components/window.css</code>.
    en:
      title: A window that moves, resizes and minimizes
      body: >-
        New <code>Window</code> contract on the <code>@zag-js/floating-panel</code> machine, the same one in both bindings. It is a non-modal
        panel: the title bar drags it, the edges and corners resize it, and its controls minimize, maximize, restore and close it. With focus
        inside, the arrow keys move it and Escape closes it (or cancels the drag in progress). Several open windows stack, and the last one
        focused sits on top. The content is a <code>role="dialog"</code> with no <code>aria-modal</code>, named by its title. The controls'
        names are options (<code>closeLabel</code>, <code>minimizeLabel</code>, <code>maximizeLabel</code>, <code>restoreLabel</code>).
        Events: <code>sk:windowopenchange</code> and <code>sk:windowstagechange</code>. Its stylesheet is <code>components/window.css</code>.
