# Qué cambió en image-frame, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribí la entrada y pegá el
# hash nuevo.
surface: "21da09cc8993982d"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: ImageFrame se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>ImageFrame</code>: los dos bindings lo realizan, y la referencia de
        esta página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el
        markup está completo por sí solo, así que las dos bindings son el mismo markup dos veces.
        Opciones: <code>aspect</code>, <code>fit</code>, <code>position</code>, <code>radius</code>,
        <code>border</code>, <code>src</code>, <code>alt</code>. La hoja es
        <code>patterns/image-frame.css</code>.
    en:
      title: ImageFrame is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>ImageFrame</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        Options: <code>aspect</code>, <code>fit</code>, <code>position</code>, <code>radius</code>,
        <code>border</code>, <code>src</code>, <code>alt</code>. Its stylesheet is
        <code>patterns/image-frame.css</code>.