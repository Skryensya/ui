# What changed in image-frame, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "b2ac47b280d34844"
entries:
  - date: 2026-11-22
    kind: feature
    es:
      title: Proporción 4/5
      body: "<code>aspect</code> acepta <code>4/5</code>, la proporción habitual de una foto de producto. Reservar la proporción evita que la página salte cuando la imagen termina de cargar."
    en:
      title: A 4/5 aspect
      body: "<code>aspect</code> accepts <code>4/5</code>, the usual shape of a product photo. Reserving the shape keeps the page from jumping when the image finishes loading."
  - date: 2026-11-22
    kind: feature
    es:
      title: Un marco que puede ir dentro de un botón
      body: "<code>frameElement</code> acepta <code>span</code>: un botón o una etiqueta solo admiten contenido de frase, así que una miniatura que es una pestaña, o la cara de un radio, va en un span. Se ve igual que el marco de siempre."
    en:
      title: A frame that can sit inside a button
      body: "<code>frameElement</code> accepts <code>span</code>: a button or a label only holds phrasing content, so a thumbnail that is a tab, or the face of a radio, is a span. It looks the same as any frame."
  - date: 2026-10-02
    kind: chore
    es:
      title: ImageFrame compone MediaOverlay
      body: El pie sobre la foto que ImageFrame admite se llama ahora <code>MediaOverlay</code> (antes <code>MediaCaption</code>).
    en:
      title: ImageFrame composes MediaOverlay
      body: The caption ImageFrame accepts over the media is now called <code>MediaOverlay</code> (formerly <code>MediaCaption</code>).
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y una hoja de estilos para marcado simple."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a stylesheet for plain markup."
