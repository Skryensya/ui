# What changed in hero, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "4cf2621e93bc51a4"
entries:
  - date: 2026-10-06
    kind: bugfix
    es:
      title: Hero aplica su superficie y su padding por defecto sin atributos
      body: Las reglas de <code>surface="surface"</code> y <code>padding="xl"</code> sólo valían si el atributo estaba escrito. Ahora también valen cuando falta, que es lo que emite el compilador con los defaults omitidos.
    en:
      title: Hero applies its default surface and padding without attributes
      body: The <code>surface="surface"</code> and <code>padding="xl"</code> rules only held when the attribute was written. They now also hold when it is absent, which is what the compiler emits with defaults left out.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: Abre una página con superficie propia y espacio generoso.
    en:
      title: First release
      body: Opens a page with a surface of its own and generous room.
