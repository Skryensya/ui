# What changed in tag, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "dfbec22a204662b5"
entries:
  - date: 2026-10-25
    kind: breaking
    target: appearance
    es:
      title: "Cada apariencia tiene su propia hoja"
      body: "Las reglas de `brutalist` pasan de tag.css a tag.brutalist.css. Importa la hoja del valor que uses; sin ella, ese valor no recibe su pintura. Los hooks siguen declarados en tag.css."
    en:
      title: "Each appearance has its own stylesheet"
      body: "The rules for `brutalist` move from tag.css to tag.brutalist.css. Import the sheet for the value you use; without it, that value does not get its paint. The hooks are still declared in tag.css."
  - date: 2026-10-17
    kind: feature
    target: disabled
    es:
      title: Tag tiene disabled
      body: "<code>aria-disabled</code> en la raíz (todo anfitrión lo entiende, hasta el <code>span</code>); <code>Tag</code> removible y <code>Tag.toggle</code> además reciben el <code>disabled</code> nativo real, en el botón de quitar o en el propio chip. No existe en <code>Tag.link</code> - un enlace tampoco se puede deshabilitar de forma nativa."
    en:
      title: Tag has disabled
      body: "<code>aria-disabled</code> on the root (every host understands it, even the <code>span</code>); removable <code>Tag</code> and <code>Tag.toggle</code> also get the real native <code>disabled</code>, on the remove button or on the chip itself. Not on <code>Tag.link</code> - a link cannot be natively disabled either."
  - date: 2026-10-17
    kind: feature
    target: Tag.toggle
    es:
      title: Tag se puede seleccionar con Tag.toggle
      body: "Un tercer anfitrión, además de <code>span</code> (removible) y <code>a</code> (navega): un <code>button</code> real con <code>selected</code> → <code>aria-pressed</code>, para un chip de filtro que el lector activa y desactiva. No se puede combinar con <code>removable</code> ni <code>href</code> - un botón no puede anidar otro botón."
    en:
      title: Tag can be selected with Tag.toggle
      body: "A third host, beside <code>span</code> (removable) and <code>a</code> (navigates): a real <code>button</code> with <code>selected</code> → <code>aria-pressed</code>, for a filter chip the reader turns on and off. It cannot combine with <code>removable</code> or <code>href</code> - a button cannot nest another button."
  - date: 2026-10-17
    kind: breaking
    target: tone
    es:
      title: El tono de Tag ya no acepta success, warning ni danger
      body: "Esos tres pertenecen a Badge (un estado de solo lectura): solo <code>neutral</code> y <code>accent</code> quedan en Tag, así que un chip removible o navegable ya no se puede pintar como si fuera un badge de estado."
    en:
      title: Tag's tone no longer accepts success, warning or danger
      body: "Those three belong to Badge (a read-only status report): only <code>neutral</code> and <code>accent</code> remain on Tag, so a removable or navigable chip can no longer be painted as if it were a status badge."
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y una hoja de estilos para marcado simple."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a stylesheet for plain markup."
