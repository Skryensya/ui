# What changed in tag, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "bd4001aee09e2b89"
entries:
  - date: 2026-09-17
    kind: feature
    es:
      title: Tag.compose declara button e icon
      body: >-
        El control remove es Button+Icon de sistema; <code>compose</code> lo declara
        (<code>systemOwned</code>), igual que Dialog close.
    en:
      title: Tag.compose declares button and icon
      body: >-
        The remove control is system-owned Button+Icon; <code>compose</code> declares it
        (<code>systemOwned</code>), same as Dialog close.
  - date: 2026-09-17
    kind: feature
    es:
      title: eventDetails nombra source y trigger
      body: >-
        <code>eventDetails</code> declara <code>source</code> (parte que despacha el CustomEvent) y, cuando es claro, <code>trigger</code> (parte que el usuario activa). Un agente sabe dónde escuchar y qué control provoca el evento.
    en:
      title: eventDetails names source and trigger
      body: >-
        <code>eventDetails</code> declares <code>source</code> (part that dispatches the CustomEvent) and, when clear, <code>trigger</code> (part the user activates). An agent knows where to listen and which control causes the event.
  - date: 2026-09-17
    kind: feature
    es:
      title: Tag declara forward para id, enlace y aria-*
      body: >-
        <code>Tag</code> publica <code>id</code>/<code>aria-*</code>; <code>Tag.link</code> añade <code>target</code>/<code>rel</code>/<code>download</code>. Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: Tag declares forward for id, link, and aria-*
      body: >-
        <code>Tag</code> publishes <code>id</code>/<code>aria-*</code>; <code>Tag.link</code> adds <code>target</code>/<code>rel</code>/<code>download</code>. An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: React tipa children como texto
      body: >-
        El binding React declara <code>children: string</code>, igual que el slot del contrato
        (<code>accepts: "text"</code>).
    en:
      title: React types children as text
      body: >-
        The React binding declares <code>children: string</code>, matching the contract slot
        (<code>accepts: "text"</code>).
  - date: 2026-09-16
    kind: breaking
    target: removable
    es:
      title: removable es la única puerta del control de quitar
      body: >-
        <code>removable</code> decide si existe el botón; <code>onRemove</code> ya no lo implica.
        El contrato publica el evento <code>remove</code> (<code>sk:tagremove</code>), exige
        <code>removeLabel</code> cuando el tag es removible, y el slot de children acepta sólo
        texto. En React hay que pasar <code>removable</code> explícitamente.
    en:
      title: removable is the only gate for the dismiss control
      body: >-
        <code>removable</code> decides whether the button exists; <code>onRemove</code> no longer
        implies it. The contract publishes the <code>remove</code> event
        (<code>sk:tagremove</code>), requires <code>removeLabel</code> when the tag is removable,
        and the children slot accepts text only. In React, pass <code>removable</code> explicitly.
  - date: 2026-08-24
    kind: feature
    target: Tag.link
    es:
      title: Tag.link publica las etiquetas navegables
      body: >-
        Se agrega <code>Tag.link</code>: una etiqueta que navega a una faceta, tema o palabra
        clave con host <code>&lt;a&gt;</code> y opción requerida <code>href</code>. El
        <code>Tag</code> existente queda como host <code>&lt;span&gt;</code> cuando no hay
        <code>href</code>. Un tag navegable no puede ser removible: <code>removable</code> y
        <code>removeLabel</code> quedan prohibidos en esta firma para no esconder dos acciones en
        un solo objetivo interactivo.
    en:
      title: Tag.link publishes navigable tags
      body: >-
        Adds <code>Tag.link</code>: a tag that navigates to a facet, topic or keyword with an
        <code>&lt;a&gt;</code> host and required <code>href</code> option. The existing
        <code>Tag</code> stays a <code>&lt;span&gt;</code> host when there is no
        <code>href</code>. A navigable tag cannot be removable: <code>removable</code> and
        <code>removeLabel</code> are forbidden on this signature so one interactive target does not
        hide two actions.
  - date: 2026-08-11
    kind: feature
    es:
      title: Tag se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Tag</code>: los dos bindings lo realizan, y la referencia de esta
        página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el markup
        está completo por sí solo, así que las dos bindings son el mismo markup dos veces. Opciones:
        <code>tone</code>, <code>removable</code>, <code>removeLabel</code>. La hoja es
        <code>components/tag.css</code>.
    en:
      title: Tag is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Tag</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        Options: <code>tone</code>, <code>removable</code>, <code>removeLabel</code>. Its stylesheet is
        <code>components/tag.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de tag quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>6</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: tag's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>6</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
