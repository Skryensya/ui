# What changed in tag, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "deb1843b2cdec951"
entries:
  - date: 2026-08-24
    kind: feature
    target: Tag.link
    es:
      title: Tag.link publica las etiquetas navegables
      body: >-
        Se agrega <code>Tag.link</code>: una etiqueta que navega a una faceta, tema o palabra
        clave con host <code>&lt;a&gt;</code> y opción requerida <code>href</code>. El
        <code>Tag</code> existente queda como host <code>&lt;span&gt;</code> cuando no hay
        <code>href</code>. Un tag navegable no puede ser removible: <code>removable</code> y
        <code>removeLabel</code> quedan prohibidos en esta firma para no esconder dos acciones en
        un solo objetivo interactivo.
    en:
      title: Tag.link publishes navigable tags
      body: >-
        Adds <code>Tag.link</code>: a tag that navigates to a facet, topic or keyword with an
        <code>&lt;a&gt;</code> host and required <code>href</code> option. The existing
        <code>Tag</code> stays a <code>&lt;span&gt;</code> host when there is no
        <code>href</code>. A navigable tag cannot be removable: <code>removable</code> and
        <code>removeLabel</code> are forbidden on this signature so one interactive target does not
        hide two actions.
  - date: 2026-08-11
    kind: feature
    es:
      title: Tag se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Tag</code>: los dos bindings lo realizan, y la referencia de esta
        página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el markup
        está completo por sí solo, así que las dos bindings son el mismo markup dos veces. Opciones:
        <code>tone</code>, <code>removable</code>, <code>removeLabel</code>. La hoja es
        <code>components/tag.css</code>.
    en:
      title: Tag is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Tag</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        Options: <code>tone</code>, <code>removable</code>, <code>removeLabel</code>. Its stylesheet is
        <code>components/tag.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de tag quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>11</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: tag's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>11</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
