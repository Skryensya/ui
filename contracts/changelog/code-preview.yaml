# What changed in code-preview, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "aa5a5e50beb061b0"
entries:
  - date: 2026-10-03
    kind: chore
    target: CodePreview
    es:
      title: CodePreview documenta el hook de interlineado
      body: <code>--sk-code-preview-line-height</code> ya existía en el CSS y ahora está declarado en el contrato, así que aparece en la referencia y se puede ajustar como cualquier otro hook.
    en:
      title: CodePreview documents its line-height hook
      body: <code>--sk-code-preview-line-height</code> was already in the CSS and is now declared in the contract, so it shows in the reference and can be tuned like any other hook.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: Presenta bloques de código legibles, resaltados y copiables.
    en:
      title: First release
      body: Displays readable, highlighted, and copyable code blocks.
  - date: 2026-10-13
    kind: breaking
    es:
      title: El botón de copiar flota sobre el código
      body: El código ocupa todo el contenedor y el botón es absoluto en la esquina. Se va el gancho --sk-code-preview-copy-sticky-top.
    en:
      title: The copy button floats over the code
      body: The code fills the container and the button is absolutely placed in the corner. The --sk-code-preview-copy-sticky-top hook is gone.
