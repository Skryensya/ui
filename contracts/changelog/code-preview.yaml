# Qué cambió en code-preview, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribí la entrada y pegá el
# hash nuevo.
surface: "1cbad9af9c272a02"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: CodePreview se publica como contrato, con 2 signatures
      body: >-
        Entra al catálogo con <code>CodePreview</code>, <code>CodePreview.density</code>: los dos
        bindings lo realizan, y la referencia de esta página sale del contrato compilado en vez de prosa
        escrita al lado. El binding Vanilla monta sobre <code>data-sk-code-preview</code>: el markup se
        autora y el enhancer lo hidrata, así que lo que no necesita JavaScript funciona antes de que
        corra ninguno. Opciones: <code>collapsible</code>, <code>lines</code>,
        <code>previewLines</code>, <code>moreLabel</code>, <code>lessLabel</code>,
        <code>switchLabel</code>. La hoja es <code>components/code-preview.css</code>.
    en:
      title: CodePreview is published as a contract, with 2 signatures
      body: >-
        It joins the catalogue with <code>CodePreview</code>, <code>CodePreview.density</code>: both
        bindings realize it, and this page's reference is rendered from the compiled contract rather
        than from prose written beside it. The Vanilla binding mounts on
        <code>data-sk-code-preview</code>: the markup is authored and the enhancer hydrates it, so
        whatever needs no JavaScript works before any runs. Options: <code>collapsible</code>,
        <code>lines</code>, <code>previewLines</code>, <code>moreLabel</code>, <code>lessLabel</code>,
        <code>switchLabel</code>. Its stylesheet is <code>components/code-preview.css</code>.