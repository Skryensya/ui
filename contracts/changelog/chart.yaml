# Qué cambió en chart, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribí la entrada y pegá el
# hash nuevo.
surface: "fcfadcbdb10dc886"
entries:
  - date: 2026-08-26
    kind: feature
    target: Chart
    es:
      title: Chart se publica como contrato, una serie de valores con nombre hecha visible
      body: >-
        Entra al catálogo con una sola signature, <code>Chart</code>, y con una decisión que explica
        todo lo demás: <strong>los datos son una lista</strong>. Las entradas viven en un slot
        <code>items</code>, el mismo que ya usan <code>Tabs</code> y <code>Segmented</code> para sus
        colecciones, y no en un objeto opaco que se le pasa a una librería. Eso compra cuatro cosas a
        la vez. Accesibilidad de verdad y no un resumen: la serie es una lista real de texto real, así
        que un lector de pantalla lee "Dic, 14, Ene, 23" desde el DOM, en lugar del
        <code>&lt;svg aria-label="gráfico de aportes"&gt;</code> de siempre, que avisa que hay datos y
        después se niega a decir cuáles. Barras sin motor: cada entrada trae su valor y la hoja
        <code>components/chart.css</code> lo divide por el máximo de la serie para sacar la altura, así
        que un gráfico de barras se pinta desde markup autorado. Un renderer que es opcional por
        construcción: <code>line</code> y <code>area</code> necesitan un path, y eso sí es geometría, así
        que <code>@skryensya/charts</code> lo dibuja como un overlay <code>aria-hidden</code> encima de
        este mismo markup; el motor es una MEJORA de un gráfico que ya funcionaba, no lo que lo hace
        funcionar, y cambiarlo nunca puede romper a nadie porque ningún consumidor lo nombró. Y
        validación: un slot <code>items</code> es data que el compilador revisa y que la MCP puede
        componer. Opciones: <code>kind</code>
        (<code>bar</code>/<code>line</code>/<code>area</code>), <code>tone</code>, <code>height</code>,
        <code>labels</code>, <code>values</code>, <code>grid</code>, <code>flush</code> (para el gráfico
        que ES el borde inferior de una card), <code>format</code>, <code>currency</code>,
        <code>locale</code>, <code>description</code> y <code>label</code>, requerida: una serie de
        números sin nada que diga qué miden es el único gráfico peor que ningún gráfico. Cada entrada
        toma <code>value</code>, un <code>tone</code> propio para destacarla contra sus hermanas, y los
        slots <code>label</code> y <code>text</code>. Lo que este contrato deliberadamente NO tiene:
        título, subtítulo, acción ni superficie propia. Todo eso es de lo que contenga al gráfico, y
        ponerlo acá habría hecho crecer exactamente la card con variantes que Card se niega a ser: un
        gráfico dentro de una card es una COMPOSICIÓN, publicada como recipe.
    en:
      title: Chart is published as a contract, a series of labelled values made visible
      body: >-
        It joins the catalogue with one signature, <code>Chart</code>, and with one decision that
        explains every other: <strong>the data is a list</strong>. Entries live in an
        <code>items</code> slot, the same one <code>Tabs</code> and <code>Segmented</code> already use
        for their collections, rather than in an opaque object handed to a library. That buys four
        things at once. Real accessibility instead of a summary: the series is a real list of real
        text, so a screen reader reads "Dec, 14, Jan, 23" off the DOM, instead of the usual
        <code>&lt;svg aria-label="a chart of contributions"&gt;</code>, which announces that data
        exists and then refuses to say what it is. Bars with no engine: each entry carries its value
        and <code>components/chart.css</code> divides it by the series maximum to get a height, so a
        bar chart paints from authored markup. A renderer that is optional by construction:
        <code>line</code> and <code>area</code> need a path, and that really is geometry, so
        <code>@skryensya/charts</code> draws it as an <code>aria-hidden</code> overlay on top of this
        same markup; the engine is an UPGRADE to a chart that already worked, not the thing that makes
        it work, and swapping it can never break anyone because no consumer ever named it. And
        validation: an <code>items</code> slot is data the compiler checks and the MCP can compose.
        Options: <code>kind</code> (<code>bar</code>/<code>line</code>/<code>area</code>),
        <code>tone</code>, <code>height</code>, <code>labels</code>, <code>values</code>,
        <code>grid</code>, <code>flush</code> (for the chart that IS the bottom edge of a card),
        <code>format</code>, <code>currency</code>, <code>locale</code>, <code>description</code> and
        <code>label</code>, required: a series of numbers with nothing saying what it measures is the
        one chart worse than no chart. Each entry takes a <code>value</code>, its own
        <code>tone</code> to emphasize it against its siblings, and the <code>label</code> and
        <code>text</code> slots. What this contract deliberately does NOT have: a title, a subtitle,
        an action, or a surface of its own. Those belong to whatever contains the chart, and putting
        them here would have grown exactly the card-with-variants that Card refuses to be: a chart in
        a card is a COMPOSITION, published as a recipe.
  - date: 2026-09-07
    kind: bugfix
    es:
      title: labels deja de escribir un data-labels vacío cuando está encendido
      body: >-
        <code>labels</code> existe para poder decir <code>false</code>: la hoja tiene una regla para
        <code>[data-labels="false"]</code> y ninguna para el caso verdadero, porque verdadero es
        simplemente "con etiquetas, como siempre". El emisor igual escribía un
        <code>data-labels=""</code> sin sentido que React nunca escribió, y G2 lo leía como una
        divergencia entre bindings. Ahora un booleano que declara <code>falseValue</code> y no
        <code>trueValue</code> no escribe nada cuando es verdadero.
    en:
      title: labels stops writing an empty data-labels when it is on
      body: >-
        <code>labels</code> exists in order to say <code>false</code>: the stylesheet has a rule for
        <code>[data-labels="false"]</code> and none for the true case, because true is simply "with
        labels, as always". The emitter wrote a meaningless <code>data-labels=""</code> anyway, which
        React never wrote, and G2 read it as a divergence between bindings. A boolean that declares a
        <code>falseValue</code> and no <code>trueValue</code> now writes nothing when true.
