# Qué cambió en box, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribí la entrada y pegá el
# hash nuevo.
surface: "a6414aca22a7eb08"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: Box se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Box</code>: los dos bindings lo realizan, y la referencia de esta
        página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el markup
        está completo por sí solo, así que las dos bindings son el mismo markup dos veces. Opciones:
        <code>padding</code>, <code>surface</code>, <code>border</code>. La hoja es
        <code>patterns/box.css</code>.
    en:
      title: Box is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Box</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        Options: <code>padding</code>, <code>surface</code>, <code>border</code>. Its stylesheet is
        <code>patterns/box.css</code>.