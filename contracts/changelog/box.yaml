# What changed in box, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "f484eb9501e2e2f4"
entries:
  - date: 2026-10-06
    kind: feature
    target: show
    es:
      title: Box existe de un solo lado de la línea expandida con show
      body: <code>show</code> (<code>compact</code> o <code>expanded</code>) oculta la caja del otro lado de 52rem de su contenedor. <code>paddingExpanded</code> también responde ahora al contenedor y no a la ventana.
    en:
      title: Box exists on one side of the expanded line with show
      body: <code>show</code> (<code>compact</code> or <code>expanded</code>) hides the box on the other side of its 52rem container. <code>paddingExpanded</code> also answers to the container now, not the window.
  - date: 2026-10-04
    kind: feature
    target: radius
    es:
      title: Box elige sus esquinas con radius
      body: <code>radius</code> (<code>none</code>, <code>control</code>, <code>surface</code>) cambia la curvatura de las esquinas. Sin él, el Box conserva el radio de superficie de siempre.
    en:
      title: Box chooses its corners with radius
      body: <code>radius</code> (<code>none</code>, <code>control</code>, <code>surface</code>) sets how round the corners are. Without it the Box keeps the surface radius it always had.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y una hoja de estilos para marcado simple."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a stylesheet for plain markup."
