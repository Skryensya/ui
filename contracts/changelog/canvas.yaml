  - date: 2026-11-22
    kind: feature
    es:
      title: Más fluido, con doble clic, inercia y minimapa
      body: "Pan y zoom escriben una vez por cuadro, y sk-canvas-view también llega una vez por cuadro. El pellizco del trackpad en Safari de escritorio hace zoom. Shift + flecha mueve la vista tres veces más lejos. Doble clic o toque acerca donde cae y, en el máximo, ajusta. Un arrastre rápido sigue deslizándose al soltarlo (no con movimiento reducido). Con zoom aparece un minimapa que marca qué parte se ve; no recibe gestos y se oculta en pantallas estrechas."
    en:
      title: Smoother, with double click, glide and minimap
      body: "Pan and zoom write once per frame, and sk-canvas-view also arrives once per frame. A trackpad pinch in desktop Safari zooms. Shift + arrow moves the view three times as far. Double click or tap zooms in where it lands and, at the maximum, fits. A fast drag keeps gliding after release (not under reduced motion). While zoomed, a minimap marks which part is showing; it takes no gestures and is hidden on narrow screens."
