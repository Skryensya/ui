# What changed in skip-link, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "bc20e3b43199655d"
entries:
  - date: 2026-09-17
    kind: feature
    es:
      title: Firmas interactivas declaran forward
      body: >-
        Las firmas host interactivas o de formulario publican <code>forward</code>
        (<code>id</code>/<code>aria-*</code> y attrs de enlace o formulario cuando aplica).
        Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: Interactive signatures declare forward
      body: >-
        Interactive or form host signatures publish <code>forward</code>
        (<code>id</code>/<code>aria-*</code> and link or form attrs where relevant).
        An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: feature
    es:
      title: href exige un ancla in-page
      body: >-
        <code>href</code> ahora lleva <code>pattern</code> <code>^#.+$</code>: un SkipLink es un
        salto dentro de la página, no un Link disfrazado. Un path o una URL absoluta fallan la
        validación. React tipa <code>children</code> como <code>string</code>, al mismo nivel que
        el slot <code>text</code> del contrato.
    en:
      title: href requires an in-page hash
      body: >-
        <code>href</code> now carries the <code>pattern</code> <code>^#.+$</code>: a SkipLink is an
        in-page jump, not a Link in disguise. A path or absolute URL fails validation. React types
        <code>children</code> as <code>string</code>, matching the contract's <code>text</code> slot.
  - date: 2026-08-23
    kind: bugfix
    es:
      title: El enlace de salto ya no aparece por debajo del header pegajoso
      body: >-
        El componente siempre declaró <code>--sk-skip-link-z</code> en <code>--z-toast</code> (400)
        para quedar por encima de cualquier chrome fijado por la página, pero esa capa se perdía en
        el único momento en que el enlace es visible: al recibir el foco. El state layer
        (<code>patterns/state-layer.css</code>) baja un <code>z-index: var(--z-focus)</code> (50) en
        <code>.sk-interactive:focus-visible</code>, un selector (0,2,0) que le ganaba a la regla base
        (0,1,1). Así que el enlace enfocado se pintaba en 50, debajo de un navbar en
        <code>--z-sticky</code> (100). Medido en este sitio: <code>elementFromPoint</code> en el
        centro del enlace devolvía el contenido del navbar. Ahora
        <code>a.sk-skip-link:focus</code> (0,2,1) re-declara su propia capa y gana en la cascada, sin
        <code>!important</code> y sin tocar el pattern compartido. Un consumidor que además lo quiera
        más abajo sigue teniendo <code>--sk-skip-link-offset</code>.
    en:
      title: The skip link no longer renders underneath the sticky header
      body: >-
        The component always declared <code>--sk-skip-link-z</code> as <code>--z-toast</code> (400)
        so it would clear any chrome the page pins, but that layer was lost at the one moment the
        link is visible at all: on focus. The state layer (<code>patterns/state-layer.css</code>)
        sets <code>z-index: var(--z-focus)</code> (50) on <code>.sk-interactive:focus-visible</code>,
        a (0,2,0) selector that outranked the base rule's (0,1,1), so a focused link painted at 50,
        below a navbar at <code>--z-sticky</code> (100). Measured on this site:
        <code>elementFromPoint</code> at the link's centre returned the navbar's own contents.
        <code>a.sk-skip-link:focus</code> (0,2,1) now re-declares its own layer and wins in the
        cascade, with no <code>!important</code> and no change to the shared pattern. A consumer that
        also wants it lower still has <code>--sk-skip-link-offset</code>.
  - date: 2026-08-11
    kind: feature
    es:
      title: SkipLink se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>SkipLink</code>: los dos bindings lo realizan, y la referencia de
        esta página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el
        markup está completo por sí solo, así que las dos bindings son el mismo markup dos veces.
        Opciones: <code>href</code>. La hoja es <code>components/skip-link.css</code>.
    en:
      title: SkipLink is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>SkipLink</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        Options: <code>href</code>. Its stylesheet is <code>components/skip-link.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de skip-link quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>12</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: skip-link's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>12</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
