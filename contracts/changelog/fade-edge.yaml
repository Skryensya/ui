# What changed in fade-edge, in the words its users read. Only appended to, never rewritten.
surface: "ed88d4a77c2d37c6"
entries:
  - date: 2026-10-08
    kind: bugfix
    es:
      title: El fundido de color sigue el borde visible
      body: La banda de color compensa el desplazamiento del contenedor para no moverse con el contenido. Con scrollAware desaparece al llegar al extremo, también en los modos de ambos lados.
    en:
      title: Color fades follow the visible edge
      body: Color bands compensate for the container's scroll offset instead of moving with its content. With scrollAware they disappear at the corresponding edge, including paired-axis modes.
  - date: 2026-09-07
    kind: feature
    es:
      title: FadeEdge se publica como composición de pintura
      body: >-
        La clase existente <code>sk-fade-edge</code> entra al catálogo como <code>FadeEdge</code>.
        Envuelve cualquier contenido sin cambiar su semántica ni comportamiento, y expone
        <code>mode</code>, <code>direction</code>, <code>size</code> y <code>color</code>. Marquee puede
        componerse adentro cuando necesita un borde suave; el efecto no forma parte de su contrato.
    en:
      title: FadeEdge ships as a paint-only composition
      body: >-
        The existing <code>sk-fade-edge</code> class joins the catalogue as <code>FadeEdge</code>. It
        wraps any content without changing its semantics or behavior, and exposes <code>mode</code>,
        <code>direction</code>, <code>size</code>, and <code>color</code>. Marquee can be composed inside
        when it needs a soft edge; the effect does not become part of Marquee's contract.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de fade-edge quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>4</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: fade-edge's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>4</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: color sólo va con mode color
      body: >-
        Con el modo transparente por defecto, <code>color</code> se escribía y no pintaba nada. Ahora esa combinación deja de validar.
    en:
      title: color only goes with mode color
      body: >-
        With the default transparent mode, <code>color</code> was written and painted nothing. That combination stops validating.
  - date: 2026-09-25
    kind: feature
    es:
      title: FadeEdge puede retirar el fundido al llegar al borde
      body: >-
        Nueva opción <code>scrollAware</code> (<code>data-scroll-aware</code>): cuando el scroll llega
        al borde al que apunta el fundido, o el contenido entra sin scrollear, se escribe
        <code>data-at-edge</code> y el fundido se retira. Sin la opción no cambia nada. En markup
        escrito a mano hace falta <code>data-sk-fade-edge</code> para que el enhancer lo encuentre.
    en:
      title: FadeEdge can retire its fade at the edge
      body: >-
        New <code>scrollAware</code> option (<code>data-scroll-aware</code>): once the scroll reaches
        the edge the fade points at, or the content fits without scrolling, <code>data-at-edge</code>
        is written and the fade retires. Without the option nothing changes. Authored markup needs
        <code>data-sk-fade-edge</code> for the enhancer to find it.
  - date: 2026-09-30
    kind: feature
    es:
      title: FadeEdge deja la barra de scroll a la vista y desvanece ambos extremos
      body: >-
        La máscara ya no desvanece la barra de scroll del propio FadeEdge: los bindings miden su
        grosor y lo reservan. Nuevas direcciones <code>horizontal</code> y <code>vertical</code> que
        desvanecen los dos extremos del eje; con <code>scrollAware</code>, cada uno se retira al llegar
        a su borde. Donde el navegador tiene scroll timelines, <code>scrollAware</code> funciona en CSS
        desde el primer cuadro, sin esperar al script. El enhancer ahora se monta en todo FadeEdge.
    en:
      title: FadeEdge keeps its scrollbar visible and fades both ends
      body: >-
        The mask no longer fades the FadeEdge's own scrollbar: the bindings measure its thickness and
        keep it out. New <code>horizontal</code> and <code>vertical</code> directions fade both ends of
        the axis; with <code>scrollAware</code>, each retires at its own edge. Where the browser has
        scroll timelines, <code>scrollAware</code> works in CSS from the first frame, without waiting
        for script. The enhancer now mounts on every FadeEdge.
