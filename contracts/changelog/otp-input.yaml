# Qué cambió en otp-input, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribe la entrada y pega el
# hash nuevo.
surface: "fc28e34c721cf53a"
entries:
  - date: 2026-10-02
    kind: feature
    target: groupSize
    es:
      title: Nueva opción groupSize para agrupar las casillas
      body: "<code>groupSize</code> (<code>2</code>, <code>3</code> o <code>4</code>) separa las casillas en grupos de ese tamaño con un espacio más ancho entre uno y otro: <code>123 456</code> en vez de <code>123456</code>."
    en:
      title: New groupSize option to group the boxes
      body: "<code>groupSize</code> (<code>2</code>, <code>3</code> or <code>4</code>) sets the boxes apart in groups of that size with a wider gap between one and the next: <code>123 456</code> instead of <code>123456</code>."
  - date: 2026-10-02
    kind: breaking
    target: placeholder
    es:
      title: Las casillas vacías ya no muestran ○ por defecto
      body: El valor por defecto de <code>placeholder</code> pasa de <code>○</code> a vacío.
    en:
      title: Empty boxes no longer show ○ by default
      body: The default of <code>placeholder</code> changes from <code>○</code> to empty. A row of circles on a field nobody has touched read as a decoration to ignore, and each box's border already says "type here".
  - date: 2026-10-02
    kind: feature
    target: mask
    es:
      title: Con mask, cada casilla llena muestra un icono en vez de los puntos del navegador
      body: Un navegador dibuja los caracteres de un campo de contraseña como sus propios puntos, y ese glifo no se puede cambiar.
    en:
      title: With mask, each filled box shows an icon instead of the browser's dots
      body: A browser draws a password field's characters as its own dots, and that glyph cannot be changed.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: Un código de un solo uso, con un campo por dígito.
    en:
      title: First release
      body: A one-time code, one field per digit.
