# What changed in vaul, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "796e072bd665546a"
entries:
  - date: 2026-10-06
    kind: bugfix
    es:
      title: Vaul se dibuja en su borde por defecto antes de que cargue su JS
      body: 'Las reglas de <code>edge="block-end"</code> exigían el atributo, que el enhancer escribe al montar: antes de eso el panel no estaba anclado. Ahora valen también sin atributo.'
    en:
      title: Vaul draws on its default edge before its JS loads
      body: 'The <code>edge="block-end"</code> rules required the attribute, which the enhancer writes on mount: before that the panel was not anchored. They now also hold without it.'
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
