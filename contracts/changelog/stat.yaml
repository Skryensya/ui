# What changed in stat, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "f0a11f0e56139cc3"
entries:
  - date: 2026-10-18
    kind: bugfix
    target: Stat
    es:
      title: "suffix/locale/fractionDigits ya aplican a un value numérico sin count aparte"
      body: "El formato solo se activaba cuando count !== undefined. count existe para el camino de texto ya escrito (vanilla, un value string más el número crudo al lado); un <Stat value={82} suffix=\"%\" /> sin count - el uso documentado en React - mostraba 82 pelado, sin la unidad. Ahora el formato se activa según si el valor mismo es numérico."
    en:
      title: "suffix/locale/fractionDigits now apply to a numeric value with no separate count"
      body: "Formatting only turned on when count !== undefined. count exists for the authored-text path (vanilla: a value string plus the raw number beside it); a plain <Stat value={82} suffix=\"%\" /> with no count - the documented React usage - rendered a bare 82, no unit. Formatting now turns on based on whether the value itself is numeric."
  - date: 2026-10-06
    kind: bugfix
    target: Stat
    es:
      title: El valor de Stat se lee como cifra, no como código
      body: <code>.sk-stat__value</code> usaba la fuente de código y el tamaño <code>h2</code>. Ahora usa la fuente del cuerpo con números tabulares y el tamaño <code>h1</code>, así que una cifra clave se ve como parte de la página.
    en:
      title: Stat's value reads as a figure, not as code
      body: <code>.sk-stat__value</code> used the code font at the <code>h2</code> size. It now uses the body font with tabular numbers at the <code>h1</code> size, so a key figure reads as part of the page.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
