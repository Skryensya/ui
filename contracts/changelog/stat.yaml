# What changed in stat, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "f0a11f0e56139cc3"
entries:
  - date: 2026-10-06
    kind: bugfix
    target: Stat
    es:
      title: El valor de Stat se lee como cifra, no como código
      body: <code>.sk-stat__value</code> usaba la fuente de código y el tamaño <code>h2</code>. Ahora usa la fuente del cuerpo con números tabulares y el tamaño <code>h1</code>, así que una cifra clave se ve como parte de la página.
    en:
      title: Stat's value reads as a figure, not as code
      body: <code>.sk-stat__value</code> used the code font at the <code>h2</code> size. It now uses the body font with tabular numbers at the <code>h1</code> size, so a key figure reads as part of the page.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: Destaca una métrica con su etiqueta y contexto.
    en:
      title: First release
      body: Highlights a metric with its label and context.
