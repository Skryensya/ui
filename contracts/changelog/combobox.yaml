# What changed in combobox, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "55ea955bf1773367"
entries:
  - date: 2026-10-25
    kind: breaking
    target: appearance
    es:
      title: "Cada apariencia tiene su propia hoja"
      body: "Las reglas de `brutalist`, `frosted` pasan de combobox.css a combobox.brutalist.css, combobox.frosted.css. Importa la hoja del valor que uses; sin ella, ese valor no recibe su pintura. Los hooks siguen declarados en combobox.css."
    en:
      title: "Each appearance has its own stylesheet"
      body: "The rules for `brutalist`, `frosted` move from combobox.css to combobox.brutalist.css, combobox.frosted.css. Import the sheet for the value you use; without it, that value does not get its paint. The hooks are still declared in combobox.css."
  - date: 2026-10-19
    kind: feature
    target: max
    es:
      title: max limita cuántas opciones se pueden elegir
      body: "En modo multiple, al llegar a max toda opción no elegida se deshabilita (el check sigue visible en las ya elegidas) y el placeholder desaparece: no invita a buscar algo que no puede ir a ningún lado."
    en:
      title: max caps how many options can be chosen
      body: "In multiple mode, once max is reached every unchosen option disables (the check stays visible on the ones already picked) and the placeholder drops: nothing invites a search that could not go anywhere."
  - date: 2026-10-17
    kind: feature
    es:
      title: "options y aria-label: Select migra a Combobox sin reescribir su árbol de opciones"
      body: "El binding de React acepta options (la forma de SelectOption, ya un subconjunto de ComboboxItem) como alias de items, y aria-label/aria-labelledby como nombre accesible oculto, igual que Select. El contrato declarativo sigue exigiendo un label visible; esto es específico del binding de React."
    en:
      title: "options and aria-label: Select moves to Combobox without rewriting its options tree"
      body: "The React binding accepts options (SelectOption's shape, already a subset of ComboboxItem) as an alias for items, and aria-label/aria-labelledby as a hidden accessible name, the same as Select. The declarative contract still requires a visible label; this is React-binding-specific."
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
