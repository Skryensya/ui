# What changed in breadcrumb, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "83e45c16dc0976ca"
entries:
  - date: 2026-08-19
    kind: feature
    es:
      title: Breadcrumb colapsa los niveles intermedios en un Menu real cuando el ancho no alcanza
      body: >-
        Un enhancer nuevo (los dos bindings) mide si la senda entra en una sola línea; cuando no,
        esconde los niveles ancestro. Nunca el primero ni la página actual. Detrás de un
        disclosure «…» que abre un <a href="/componentes/menu">Menu</a> real con esos mismos
        niveles: el patrón de teclado ARIA de un menú (flechas, Home/End, typeahead), no una lista
        plana. La machine, el posicionamiento y el estilo del panel son los de Menu, compuestos
        junto al propio trigger de Breadcrumb, el mismo movimiento que ya hace el dropdown de cada
        <code>MenubarItem</code>. Nueva opción <code>collapsedLabel</code>, nueva part
        <code>collapseTrigger</code>. Sin JS (o con menos de cuatro niveles) el markup sigue
        completo por sí solo, como antes.
    en:
      title: Breadcrumb collapses ancestor levels into a real Menu when the width does not fit
      body: >-
        A new enhancer (both bindings) measures whether the trail fits on one line; when it does
        not, it hides the ancestor levels: never the first one or the current page. Behind a
        "…" disclosure that opens a real <a href="/en/components/menu">Menu</a> holding those same
        levels: an ARIA menu's own keyboard pattern (arrow keys, Home/End, typeahead), not a plain
        list. The machine, positioning and panel styling are Menu's, composed beside Breadcrumb's
        own trigger: the same move every <code>MenubarItem</code>'s dropdown already makes. New
        option <code>collapsedLabel</code>, new part <code>collapseTrigger</code>. Without JS (or
        under four levels) the markup is still complete on its own, as before.
  - date: 2026-08-11
    kind: feature
    es:
      title: Breadcrumb se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Breadcrumb</code>: los dos bindings lo realizan, y la referencia de
        esta página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el
        markup está completo por sí solo, así que las dos bindings son el mismo markup dos veces.
        Opciones: <code>label</code>. La hoja es <code>components/breadcrumb.css</code>.
    en:
      title: Breadcrumb is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Breadcrumb</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        Options: <code>label</code>. Its stylesheet is <code>components/breadcrumb.css</code>.