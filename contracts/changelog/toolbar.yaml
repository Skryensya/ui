# What changed in toolbar, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "2e15d83cab5d0570"
entries:
  - date: 2026-10-25
    kind: breaking
    target: appearance
    es:
      title: "Cada apariencia tiene su propia hoja"
      body: "Las reglas de `tactile`, `brutalist`, `frosted` pasan de toolbar.css a toolbar.tactile.css, toolbar.brutalist.css, toolbar.frosted.css. Importa la hoja del valor que uses; sin ella, ese valor no recibe su pintura. Los hooks siguen declarados en toolbar.css."
    en:
      title: "Each appearance has its own stylesheet"
      body: "The rules for `tactile`, `brutalist`, `frosted` move from toolbar.css to toolbar.tactile.css, toolbar.brutalist.css, toolbar.frosted.css. Import the sheet for the value you use; without it, that value does not get its paint. The hooks are still declared in toolbar.css."
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
  - date: 2026-10-17
    kind: feature
    es:
      title: "Reparto del espacio con justify, y ya no se aplasta en un contenedor angosto"
      body: "Nueva opción justify (start/center/end/between) para repartir los controles en el eje principal. También se corrige que la barra no se encogía como ítem flex dentro de un contenedor angosto, así que flex-wrap nunca llegaba a envolver."
    en:
      title: "Spacing the bar's controls with justify, and it no longer refuses to shrink"
      body: "New justify option (start/center/end/between) to spread the bar's controls along its main axis. Also fixes the bar not shrinking as a flex item inside a narrow container, so flex-wrap never got the chance to wrap."
