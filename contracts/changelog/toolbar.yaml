# What changed in toolbar, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "8995f50c928b2042"
entries:
  - date: 2026-09-17
    kind: feature
    es:
      title: Firmas interactivas declaran forward
      body: >-
        Las firmas host interactivas o de formulario publican <code>forward</code>
        (<code>id</code>/<code>aria-*</code> y attrs de enlace o formulario cuando aplica).
        Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: Interactive signatures declare forward
      body: >-
        Interactive or form host signatures publish <code>forward</code>
        (<code>id</code>/<code>aria-*</code> and link or form attrs where relevant).
        An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-08-11
    kind: feature
    es:
      title: Toolbar se publica como contrato, con 3 signatures
      body: >-
        Entra al catálogo con <code>Toolbar</code>, <code>ToolbarGroup</code>,
        <code>ToolbarSeparator</code>: los dos bindings lo realizan, y la referencia de esta página sale
        del contrato compilado en vez de prosa escrita al lado. El binding Vanilla monta sobre
        <code>data-sk-toolbar</code>: el markup se autora y el enhancer lo hidrata, así que lo que no
        necesita JavaScript funciona antes de que corra ninguno. Opciones: <code>orientation</code>,
        <code>label</code>, <code>loopFocus</code>. La hoja es <code>components/toolbar.css</code>.
    en:
      title: Toolbar is published as a contract, with 3 signatures
      body: >-
        It joins the catalogue with <code>Toolbar</code>, <code>ToolbarGroup</code>,
        <code>ToolbarSeparator</code>: both bindings realize it, and this page's reference is rendered
        from the compiled contract rather than from prose written beside it. The Vanilla binding mounts
        on <code>data-sk-toolbar</code>: the markup is authored and the enhancer hydrates it, so
        whatever needs no JavaScript works before any runs. Options: <code>orientation</code>,
        <code>label</code>, <code>loopFocus</code>. Its stylesheet is
        <code>components/toolbar.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de toolbar quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>7</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: toolbar's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>7</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-17
    kind: feature
    es:
      title: ToolbarGroup admite groupLabel y loopFocus escribe false
      body: >-
        <code>ToolbarGroup</code> acepta <code>groupLabel</code> (<code>aria-label</code>).
        <code>loopFocus</code> pasa a <code>falseValue: "false"</code> en vez de un atributo de
        presencia, alineado con React.
    en:
      title: ToolbarGroup takes groupLabel and loopFocus writes false
      body: >-
        <code>ToolbarGroup</code> accepts <code>groupLabel</code> (<code>aria-label</code>).
        <code>loopFocus</code> now uses <code>falseValue: "false"</code> instead of a presence
        attribute, matching React.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: La barra tiene de verdad una sola parada de tabulación
      body: >-
        El contrato prometía una parada y ningún binding manejaba <code>tabindex</code>: las flechas
        movían el foco, pero Tab seguía pasando por cada botón. Ahora los dos aplican roving
        tabindex con la misma función de core (<code>toolbarStops</code>): un Segmented o unas Tabs
        adentro cuentan como una parada, Tab vuelve al último control usado, y un control agregado
        después del montaje entra en la cuenta la primera vez que el foco llega a la barra.
    en:
      title: The bar really has one tab stop
      body: >-
        The contract promised one stop and neither binding managed <code>tabindex</code>: arrow keys
        moved focus, but Tab still visited every button. Both now apply a roving tabindex through the
        same core function (<code>toolbarStops</code>): a Segmented or Tabs inside counts as one stop,
        Tab returns to the last control used, and a control added after mount joins the first time
        focus reaches the bar.
