# Qué cambió en callout, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribí la entrada y pegá el
# hash nuevo.
surface: "c3f1ab0cad0a3cf2"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: Callout se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Callout</code>: los dos bindings lo realizan, y la referencia de
        esta página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el
        markup está completo por sí solo, así que las dos bindings son el mismo markup dos veces.
        Opciones: <code>tone</code>. La hoja es <code>components/callout.css</code>.
    en:
      title: Callout is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Callout</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        Options: <code>tone</code>. Its stylesheet is <code>components/callout.css</code>.
  - date: 2026-09-07
    kind: rework
    es:
      title: La fila de acciones ahora restringe el tono, no el énfasis
      body: >-
        El slot <code>actions</code> limitaba <code>variant</code> a
        <code>translucent</code>/<code>danger</code>. Era la misma regla de siempre dicha en el
        vocabulario que Button tenía entonces: un solo enum cargaba a la vez qué tan fuerte es un
        botón y qué significa, así que "que no compita con la llamada a la acción de la página" sólo
        se podía escribir prohibiendo el relleno de acento. Ahora que son dos ejes, la regla dice lo
        que siempre quiso decir y limita <code>tone</code> a <code>neutral</code>/<code>danger</code>.
        El énfasis queda libre: una acción destructiva acá puede ser <code>solid</code> para
        destacarse, y una neutral puede ser <code>translucent</code> para integrarse al color del
        callout.
    en:
      title: The action row now restricts tone rather than emphasis
      body: >-
        The <code>actions</code> slot narrowed <code>variant</code> to
        <code>translucent</code>/<code>danger</code>. That was the same rule stated in the vocabulary
        Button had at the time: one enum carried both how loud a button is and what it means, so "do
        not compete with the page's call to action" could only be spelled by banning the accent fill.
        Now that those are separate axes, the rule says what it always meant and narrows
        <code>tone</code> to <code>neutral</code>/<code>danger</code>. Emphasis is left open: a
        destructive action here can be <code>solid</code> so it stands out, and a neutral one can be
        <code>translucent</code> so it blends into the callout's own colour.
