# What changed in callout, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "f775ee85aa62e902"
entries:
  - date: 2026-09-27
    kind: bugfix
    target: appearance
    es:
      title: Un callout frosted con tono mantiene su texto legible
      body: >-
        La lámina de un callout con tono sube de 72% a 94% (el neutro se queda en 72%): sobre un fondo negro o blanco, su texto caía a 2.8:1.
    en:
      title: A toned frosted callout keeps its text legible
      body: >-
        A toned callout's sheet rises from 72% to 94% (neutral stays at 72%): over a black or white backdrop its text fell to 2.8:1.
  - date: 2026-09-26
    kind: feature
    target: appearance
    es:
      title: Callout suma appearance plain, brutalist y frosted
      body: >-
        <code>brutalist</code> dibuja la caja con borde negro y sombra dura (el tono conserva su relleno y su
        tinta); <code>frosted</code> la hace una lámina teñida translúcida, opaca donde el material no es
        fiable. Sin <code>tactile</code>: un callout no se presiona.
    en:
      title: Callout adds plain, brutalist and frosted appearances
      body: >-
        <code>brutalist</code> draws the box with a black edge and a hard offset (the tone keeps its fill and
        ink); <code>frosted</code> makes it a see-through tinted sheet, opaque wherever the material cannot be
        trusted. No <code>tactile</code>: a callout is never pressed.
  - date: 2026-08-11
    kind: feature
    es:
      title: Callout se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Callout</code>: los dos bindings lo realizan, y la referencia de
        esta página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el
        markup está completo por sí solo, así que las dos bindings son el mismo markup dos veces.
        Opciones: <code>tone</code>. La hoja es <code>components/callout.css</code>.
    en:
      title: Callout is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Callout</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        Options: <code>tone</code>. Its stylesheet is <code>components/callout.css</code>.
  - date: 2026-09-07
    kind: rework
    es:
      title: La fila de acciones ahora restringe el tono, no el énfasis
      body: >-
        El slot <code>actions</code> limitaba <code>variant</code> a
        <code>translucent</code>/<code>danger</code>. Era la misma regla de siempre dicha en el
        vocabulario que Button tenía entonces: un solo enum cargaba a la vez qué tan fuerte es un
        botón y qué significa, así que "que no compita con la llamada a la acción de la página" sólo
        se podía escribir prohibiendo el relleno de acento. Ahora que son dos ejes, la regla dice lo
        que siempre quiso decir y limita <code>tone</code> a <code>neutral</code>/<code>danger</code>.
        El énfasis queda libre: una acción destructiva aquí puede ser <code>solid</code> para
        destacarse, y una neutral puede ser <code>translucent</code> para integrarse al color del
        callout.
    en:
      title: The action row now restricts tone rather than emphasis
      body: >-
        The <code>actions</code> slot narrowed <code>variant</code> to
        <code>translucent</code>/<code>danger</code>. That was the same rule stated in the vocabulary
        Button had at the time: one enum carried both how loud a button is and what it means, so "do
        not compete with the page's call to action" could only be spelled by banning the accent fill.
        Now that those are separate axes, the rule says what it always meant and narrows
        <code>tone</code> to <code>neutral</code>/<code>danger</code>. Emphasis is left open: a
        destructive action here can be <code>solid</code> so it stands out, and a neutral one can be
        <code>translucent</code> so it blends into the callout's own colour.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de callout quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>5</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: callout's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>5</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
