# What changed in wrapper, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "596e0b834a83e7bd"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: Wrapper se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Wrapper</code>: los dos bindings lo realizan, y la referencia de
        esta página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el
        markup está completo por sí solo, así que las dos bindings son el mismo markup dos veces.
        Opciones: <code>wrapperSize</code>. La hoja es <code>patterns/wrapper.css</code>.
    en:
      title: Wrapper is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Wrapper</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        Options: <code>wrapperSize</code>. Its stylesheet is <code>patterns/wrapper.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de wrapper quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>2</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: wrapper's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>2</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-12
    kind: feature
    es:
      title: El contrato declara las otras hojas donde vive su estilo
      body: >-
        Este componente se pinta desde mas de una hoja, asi que el contrato ahora las nombra con
        <code>hookSheets</code> y su lista de <code>hooks</code> cubre todas. Antes solo se podia
        reconciliar contra la hoja de <code>css</code>, asi que los hooks de las otras eran
        superficie publica que nadie documentaba ni verificaba. No cambia ningun estilo: cambia que
        ahora estan declarados y el compilador los chequea.
    en:
      title: The contract declares the other stylesheets its styling lives in
      body: >-
        This component paints from more than one stylesheet, so the contract now names them with
        <code>hookSheets</code> and its <code>hooks</code> list covers all of them. Before, only the
        sheet <code>css</code> names could be reconciled, so the hooks in the others were public
        surface nobody documented and nothing checked. No styling changes: what changes is that they
        are declared now, and the compiler checks them.
  - date: 2026-09-16
    kind: bugfix
    es:
      title: Wrapper publica sólo su parte y sus hooks
      body: >-
        El contrato compartía las partes de todo layout y declaraba <code>box.css</code> como hoja
        propia, así que anunciaba los hooks <code>--sk-box-*</code> y cualquier composición con un
        Wrapper cargaba esa hoja sin usarla. Ahora publica sólo <code>sk-wrapper</code>,
        <code>--sk-wrapper-max</code> y <code>--sk-wrapper-padding-inline</code>. El markup y los
        estilos no cambian. La guía de uso aclara que <code>full</code> conserva los gutters y que
        los Wrappers no se anidan.
    en:
      title: Wrapper publishes only its own part and hooks
      body: >-
        The contract shared every layout part and named <code>box.css</code> as one of its sheets,
        so it advertised the <code>--sk-box-*</code> hooks and any composition holding a Wrapper
        loaded that sheet for nothing. It now publishes only <code>sk-wrapper</code>,
        <code>--sk-wrapper-max</code> and <code>--sk-wrapper-padding-inline</code>. Markup and
        styling are unchanged. The usage guidance now says <code>full</code> keeps its gutters and
        that Wrappers do not nest.
  - date: 2026-09-17
    kind: feature
    es:
      title: Wrapper elige su elemento desde el árbol
      body: >-
        <code>wrapperElement</code> acepta <code>div</code>, <code>section</code>, <code>article</code>,
        <code>aside</code>, <code>header</code>, <code>footer</code>, <code>nav</code> y
        <code>main</code>. React ya lo permitía con <code>as</code>, pero un árbol sólo podía emitir
        un <code>div</code>, así que una región o un landmark no tenía forma de escribirse.
    en:
      title: Wrapper choose their element from the tree
      body: >-
        <code>wrapperElement</code> takes <code>div</code>, <code>section</code>, <code>article</code>,
        <code>aside</code>, <code>header</code>, <code>footer</code>, <code>nav</code> and
        <code>main</code>. React already allowed it through <code>as</code>, but a tree could only
        emit a <code>div</code>, so a region or a landmark had no way to be written.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: Un Wrapper no puede ir dentro de otro
      body: >-
        El validador rechaza un Wrapper anidado en otro a cualquier profundidad: sumaba dos juegos de gutters y el techo de afuera mandaba igual.
    en:
      title: A Wrapper cannot sit inside another
      body: >-
        The validator rejects a Wrapper nested in another at any depth: it added a second set of gutters while the outer ceiling won anyway.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie cubre también las restricciones
      body: >-
        El hash de superficie ahora incluye las restricciones entre opciones (<code>implies</code>, <code>excludes</code>, <code>notInside</code>, <code>pairs</code>) y <code>outputHooks</code>. Este contrato no cambió; sólo cambió lo que el hash mide.
    en:
      title: The surface hash also covers constraints
      body: >-
        The surface hash now covers the constraints between options (<code>implies</code>, <code>excludes</code>, <code>notInside</code>, <code>pairs</code>) and <code>outputHooks</code>. This contract did not change; only what the hash measures did.
