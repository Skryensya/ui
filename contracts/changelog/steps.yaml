# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "93e7e8c9d9048283"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: Steps se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Steps</code>: los dos bindings lo realizan, y la referencia de esta
        página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el markup
        está completo por sí solo, así que las dos bindings son el mismo markup dos veces. No tiene
        opciones: el elemento ES el significado. La hoja es <code>components/steps.css</code>.
    en:
      title: Steps is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Steps</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        It has no options: the element IS the meaning. Its stylesheet is
        <code>components/steps.css</code>.