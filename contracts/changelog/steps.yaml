# What changed in steps, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "7bcad44afb91f05a"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: Steps se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Steps</code>: los dos bindings lo realizan, y la referencia de esta
        página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el markup
        está completo por sí solo, así que las dos bindings son el mismo markup dos veces. No tiene
        opciones: el elemento ES el significado. La hoja es <code>components/steps.css</code>.
    en:
      title: Steps is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Steps</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        It has no options: the element IS the meaning. Its stylesheet is
        <code>components/steps.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de steps quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>3</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: steps's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>3</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-17
    kind: breaking
    es:
      title: status decide el paso actual, y orientation entra al contrato
      body: >-
        Una entrada ya no lleva <code>current</code>: el paso con <code>status: "current"</code>
        recibe <code>aria-current="step"</code>. Antes eran dos datos sueltos, así que un árbol podía
        marcar un paso como actual sin anunciarlo, y React (que lo derivaba del estado) contestaba
        distinto que el markup. <code>orientation</code> fija la dirección del riel, lo que React ya
        aceptaba como <code>data-orientation</code>.
    en:
      title: status decides the current stage, and orientation joins the contract
      body: >-
        An entry no longer takes <code>current</code>: the stage with <code>status: "current"</code>
        gets <code>aria-current="step"</code>. They used to be two loose facts, so a tree could mark a
        stage current without announcing it, and React (which derived it from status) answered
        differently from the markup. <code>orientation</code> pins the rail's direction, what React
        already took as <code>data-orientation</code>.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: A lo sumo un paso actual
      body: >-
        Dos pasos con <code>status: "current"</code> dejan de validar. Ninguno sigue siendo válido: un proceso terminado no tiene paso actual.
    en:
      title: At most one current stage
      body: >-
        Two stages with <code>status: "current"</code> stop validating. None is still valid: a finished process has no current stage.
