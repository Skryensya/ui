# What changed in badge, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "7292c19dfaecedeb"
entries:
  - date: 2026-09-17
    kind: feature
    target: BadgeHolder
    es:
      title: BadgeHolder declara hitTesting para el badge anclado
      body: >-
        <code>BadgeHolder.hitTesting.childrenNone</code> nombra <code>Badge</code> y
        <code>BadgeDot</code>: bajo el holder no reciben clics (<code>pointer-events: none</code>
        en la hoja). El manifiesto y el vocabulario publican el canal.
    en:
      title: BadgeHolder declares hitTesting for the anchored badge
      body: >-
        <code>BadgeHolder.hitTesting.childrenNone</code> names <code>Badge</code> and
        <code>BadgeDot</code>: under the holder they do not receive clicks
        (<code>pointer-events: none</code> in the stylesheet). The manifest and vocabulary publish
        the channel.
  - date: 2026-09-16
    kind: feature
    target: BadgeHolder
    es:
      title: BadgeHolder acepta pills, avatares con foto, y ordena ancla → badge
      body: >-
        El slot de <code>BadgeHolder</code> ahora admite <code>Badge</code> (conteo en esquina) y
        <code>Avatar.image</code> además de Dot e initials, con <code>ordered</code> y cardinalidad
        por signature. El badge anclado sigue sin recibir clics (<code>pointer-events: none</code>
        en la hoja). Los intents de <code>Badge</code> dejan de solaparse con unread-dot.
    en:
      title: BadgeHolder accepts pills, photo avatars, and orders anchor → badge
      body: >-
        <code>BadgeHolder</code>'s slot now allows <code>Badge</code> (corner counts) and
        <code>Avatar.image</code> alongside Dot and initials, with <code>ordered</code> and
        per-signature cardinality. The anchored badge still does not receive clicks
        (<code>pointer-events: none</code> in the stylesheet). <code>Badge</code> intents no longer
        overlap unread-dot.
  - date: 2026-08-27
    kind: feature
    es:
      title: BadgeDot puede pulsar para estados vivos
      body: >-
        <code>BadgeDot</code> suma <code>pulse</code>, que autoría
        <code>data-pulse</code> y dibuja un halo pulsante con el color del punto. La animación usa
        sólo <code>scale</code> y <code>opacity</code>, y se apaga con
        <code>prefers-reduced-motion</code>.
    en:
      title: BadgeDot can pulse for live states
      body: >-
        <code>BadgeDot</code> adds <code>pulse</code>, authoring <code>data-pulse</code> and drawing
        a pulsing halo in the dot's own color. The animation uses only <code>scale</code> and
        <code>opacity</code>, and turns off under <code>prefers-reduced-motion</code>.
  - date: 2026-08-27
    kind: feature
    es:
      title: Badge suma tamaño sm para conteos compactos
      body: >-
        <code>Badge</code> ahora acepta <code>size="sm"</code>, que autoría
        <code>data-size="sm"</code> y reduce la altura del badge de texto para vivir dentro de
        navegación compacta, como el conteo trailing del Sidebar. El tamaño por defecto conserva la
        altura anterior.
    en:
      title: Badge adds an sm size for compact counts
      body: >-
        <code>Badge</code> now accepts <code>size="sm"</code>, authoring
        <code>data-size="sm"</code> and reducing the text badge's height for compact navigation,
        including Sidebar trailing counts. The default size keeps the previous height.
  - date: 2026-08-17
    kind: breaking
    es:
      title: BadgeDot exige un label y autoría role="status"
      body: >-
        <code>BadgeDot</code> no tiene contenido visible propio: sin nombre accesible, un lector de
        pantalla no anuncia nada de lo que el punto comunica (no leído, en línea). Cada uso real ya
        pasaba <code>aria-label</code>/<code>role="status"</code> por fuera del contrato, a mano; ahora
        <code>label</code> es una opción real y <b>obligatoria</b>, y <code>role="status"</code> se
        autoría siempre. Quien componía un <code>BadgeDot</code> sin nombrarlo antes ahora falla la
        validación en vez de renderizar en silencio sin nombre accesible.
    en:
      title: BadgeDot now requires a label and authors role="status"
      body: >-
        <code>BadgeDot</code> has no visible content of its own: without an accessible name, a screen
        reader announces nothing of what the dot communicates (unread, online). Every real usage was
        already passing <code>aria-label</code>/<code>role="status"</code> outside the contract, by
        hand; <code>label</code> is now a real, <b>required</b> option, and <code>role="status"</code>
        is always authored. Composing a <code>BadgeDot</code> without naming it now fails validation
        instead of silently rendering with no accessible name.
  - date: 2026-08-11
    kind: feature
    es:
      title: Badge se publica como contrato, con 3 signatures
      body: >-
        Entra al catálogo con <code>Badge</code>, <code>BadgeDot</code>, <code>BadgeHolder</code>: los
        dos bindings lo realizan, y la referencia de esta página sale del contrato compilado en vez de
        prosa escrita al lado. No tiene enhancer: el markup está completo por sí solo, así que las dos
        bindings son el mismo markup dos veces. Opciones: <code>tone</code>. La hoja es
        <code>components/badge.css</code>.
    en:
      title: Badge is published as a contract, with 3 signatures
      body: >-
        It joins the catalogue with <code>Badge</code>, <code>BadgeDot</code>, <code>BadgeHolder</code>:
        both bindings realize it, and this page's reference is rendered from the compiled contract
        rather than from prose written beside it. There is no enhancer: the markup is complete on its
        own, so both bindings are the same markup twice. Options: <code>tone</code>. Its stylesheet is
        <code>components/badge.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de badge quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>13</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: badge's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>13</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-17
    kind: breaking
    es:
      title: BadgeHolder toma exactamente un ancla y un badge
      body: >-
        Antes cada firma era opcional por separado, así que un ancla sola, un badge solo o dos anclas distintas validaban. Ahora los anclas y los badges se cuentan como grupo: uno de cada.
    en:
      title: BadgeHolder takes exactly one anchor and one badge
      body: >-
        Each signature used to be optional on its own, so a lone anchor, a lone badge or two different anchors validated. Anchors and badges now count as groups: one of each.
