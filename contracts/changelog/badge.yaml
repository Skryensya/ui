# What changed in badge, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "7b37569208e272a0"
entries:
  - date: 2026-10-25
    kind: breaking
    target: appearance
    es:
      title: "Cada apariencia tiene su propia hoja"
      body: "Las reglas de `brutalist` pasan de badge.css a badge.brutalist.css. Importa la hoja del valor que uses; sin ella, ese valor no recibe su pintura. Los hooks siguen declarados en badge.css."
    en:
      title: "Each appearance has its own stylesheet"
      body: "The rules for `brutalist` move from badge.css to badge.brutalist.css. Import the sheet for the value you use; without it, that value does not get its paint. The hooks are still declared in badge.css."
  - date: 2026-10-07
    kind: feature
    target: size
    es:
      title: Badge suma size xs, la versión compacta
      body: '<code>size="xs"</code> quita el relleno vertical y aprieta el horizontal, con la misma letra que <code>sm</code>: no hace más alta la línea sobre la que se apoya.'
    en:
      title: Badge adds size xs, the compact one
      body: '<code>size="xs"</code> drops the vertical padding and tightens the horizontal, at the same type size as <code>sm</code>: it does not make the line it sits on any taller.'
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y una hoja de estilos para marcado simple."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a stylesheet for plain markup."
