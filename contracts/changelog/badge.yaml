# Qué cambió en badge, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribí la entrada y pegá el
# hash nuevo.
surface: "48e30fb817fb7751"
entries:
  - date: 2026-08-17
    kind: breaking
    es:
      title: BadgeDot exige un label y autoría role="status"
      body: >-
        <code>BadgeDot</code> no tiene contenido visible propio — sin nombre accesible, un lector de
        pantalla no anuncia nada de lo que el punto comunica (no leído, en línea). Cada uso real ya
        pasaba <code>aria-label</code>/<code>role="status"</code> por fuera del contrato, a mano; ahora
        <code>label</code> es una opción real y <b>obligatoria</b>, y <code>role="status"</code> se
        autoría siempre. Quien componía un <code>BadgeDot</code> sin nombrarlo antes ahora falla la
        validación en vez de renderizar en silencio sin nombre accesible.
    en:
      title: BadgeDot now requires a label and authors role="status"
      body: >-
        <code>BadgeDot</code> has no visible content of its own — without an accessible name, a screen
        reader announces nothing of what the dot communicates (unread, online). Every real usage was
        already passing <code>aria-label</code>/<code>role="status"</code> outside the contract, by
        hand; <code>label</code> is now a real, <b>required</b> option, and <code>role="status"</code>
        is always authored. Composing a <code>BadgeDot</code> without naming it now fails validation
        instead of silently rendering with no accessible name.
  - date: 2026-08-11
    kind: feature
    es:
      title: Badge se publica como contrato, con 3 signatures
      body: >-
        Entra al catálogo con <code>Badge</code>, <code>BadgeDot</code>, <code>BadgeHolder</code>: los
        dos bindings lo realizan, y la referencia de esta página sale del contrato compilado en vez de
        prosa escrita al lado. No tiene enhancer: el markup está completo por sí solo, así que las dos
        bindings son el mismo markup dos veces. Opciones: <code>tone</code>. La hoja es
        <code>components/badge.css</code>.
    en:
      title: Badge is published as a contract, with 3 signatures
      body: >-
        It joins the catalogue with <code>Badge</code>, <code>BadgeDot</code>, <code>BadgeHolder</code>:
        both bindings realize it, and this page's reference is rendered from the compiled contract
        rather than from prose written beside it. There is no enhancer: the markup is complete on its
        own, so both bindings are the same markup twice. Options: <code>tone</code>. Its stylesheet is
        <code>components/badge.css</code>.