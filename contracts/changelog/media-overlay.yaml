# What changed in media-overlay, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "1ef58b7bddf30491"
entries:
  - date: 2026-10-06
    kind: bugfix
    target: MediaOverlay
    es:
      title: Cada línea del overlay conserva su propio ancho
      body: "El overlay es una grilla y estiraba a sus hijos: una Badge cruzaba toda la imagen. Ahora cada línea (<code>justify-items: start</code>) conserva su ancho."
    en:
      title: Each line of the overlay keeps its own width
      body: "The overlay is a grid and stretched its children: a Badge ran across the whole image. Each line now keeps its width (<code>justify-items: start</code>)."
  - date: 2026-10-02
    kind: breaking
    es:
      title: MediaGradient pasa a llamarse MediaOverlay
      body: El contrato, <code>MediaCaption</code> y <code>MediaGradient</code> son ahora <code>MediaOverlay</code> y <code>MediaOverlayShade</code>.
    en:
      title: MediaGradient is now MediaOverlay
      body: The contract, <code>MediaCaption</code> and <code>MediaGradient</code> are now <code>MediaOverlay</code> and <code>MediaOverlayShade</code>.
  - date: 2026-10-02
    kind: breaking
    es:
      title: strength deja de usar tallas
      body: "<code>strength</code> mide cuánto oscurece, no un tamaño: <code>sm</code>, <code>md</code> y <code>lg</code> pasan a ser <code>subtle</code>, <code>moderate</code> (por defecto) y <code>strong</code>."
    en:
      title: strength no longer uses sizes
      body: "<code>strength</code> is how much it darkens, not a size: <code>sm</code>, <code>md</code> and <code>lg</code> are now <code>subtle</code>, <code>moderate</code> (the default) and <code>strong</code>."
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y una hoja de estilos para marcado simple."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a stylesheet for plain markup."
