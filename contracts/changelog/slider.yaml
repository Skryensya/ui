# What changed in slider, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "a0ca6e9edc3aab97"
entries:
  - date: 2026-09-17
    kind: feature
    es:
      title: Slider declara forward para id y aria-*
      body: >-
        Slider y SliderRange publican <code>forward</code> con <code>id</code>/<code>aria-*</code>. Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: Slider declares forward for id and aria-*
      body: >-
        Slider and SliderRange publish <code>forward</code> with <code>id</code>/<code>aria-*</code>. An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: feature
    es:
      title: eventDetails nombra source y trigger
      body: >-
        <code>eventDetails</code> declara <code>source</code> (parte que despacha el CustomEvent) y, cuando es claro, <code>trigger</code> (parte que el usuario activa). Un agente sabe dónde escuchar y qué control provoca el evento.
    en:
      title: eventDetails names source and trigger
      body: >-
        <code>eventDetails</code> declares <code>source</code> (part that dispatches the CustomEvent) and, when clear, <code>trigger</code> (part the user activates). An agent knows where to listen and which control causes the event.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-09-17
    kind: feature
    es:
      title: Mount en la signature y React despacha el evento DOM
      body: >-
        <code>Slider</code>/<code>SliderRange</code> declaran <code>mount</code> en la signature
        (<code>data-sk-slider</code> / <code>data-sk-slider-range</code>), no sólo en el template.
        React despacha <code>sk:slidervaluechange</code> con el mismo detalle que Vanilla
        (<code>{ value }</code> o <code>{ low, high }</code>) y estampa el mount en la raíz.
    en:
      title: Mount on the signature and React dispatches the DOM event
      body: >-
        <code>Slider</code>/<code>SliderRange</code> declare <code>mount</code> on the signature
        (<code>data-sk-slider</code> / <code>data-sk-slider-range</code>), not only on the template.
        React dispatches <code>sk:slidervaluechange</code> with the same detail Vanilla uses
        (<code>{ value }</code> or <code>{ low, high }</code>) and stamps the mount on the root.
  - date: 2026-09-17
    kind: chore
    es:
      title: surface hash refreshed after concurrent contract edit
      body: >-
        Unblocked the compiler gate after a parallel edit moved the published surface. Not an
        audited change set; full slider audit still pending.
    en:
      title: surface hash refreshed after concurrent contract edit
      body: >-
        Unblocked the compiler gate after a parallel edit moved the published surface. Not an
        audited change set; full slider audit still pending.
  - date: 2026-08-26
    kind: chore
    target: Slider
    es:
      title: Slider usa las máquinas de Zag 1.43.3
      body: >-
        Se actualiza la dependencia <code>@zag-js/slider</code> de 1.42.0 a 1.43.3. La API
        publicada del contrato no agrega opciones ni cambia slots, pero la superficie compilada
        registra la versión de la máquina que hidrata el control.
    en:
      title: Slider uses the Zag 1.43.3 machines
      body: >-
        Updates the <code>@zag-js/slider</code> dependency from 1.42.0 to 1.43.3. The published
        contract API adds no options and changes no slots, but the compiled surface records the
        machine version that hydrates the control.
  - date: 2026-08-18
    kind: bugfix
    target: SliderRange
    es:
      title: SliderRange no pintaba nada, en ningún binding
      body: >-
        <code>--sk-slider-track</code>, <code>--sk-slider-fill-color</code>,
        <code>--sk-slider-track-size</code> y <code>--sk-slider-thumb-hit</code> sólo estaban
        definidas en <code>.sk-slider</code>, la clase que <code>also</code> pone en los DOS
        <code>&lt;input&gt;</code> hijos, nunca en <code>.sk-slider-range</code> mismo. Las custom
        properties heredan hacia abajo, nunca hacia arriba, así que el wrapper y su propio track/
        fill nunca vieron ningún valor: <code>block-size</code> caía al <code>auto</code> inicial y,
        con todos los hijos en <code>position: absolute</code>, nada en flujo normal le daba altura
        al wrapper. El control entero salía a 0×100%, con el track invisible. Invisible en jsdom
        (que nunca calcula layout real) y sólo detectable con un layout de navegador de verdad; el
        primer árbol canónico de <code>SliderRange</code> es lo que finalmente lo hizo evidente.
    en:
      title: SliderRange painted nothing, in either binding
      body: >-
        <code>--sk-slider-track</code>, <code>--sk-slider-fill-color</code>,
        <code>--sk-slider-track-size</code> and <code>--sk-slider-thumb-hit</code> were only ever
        defined on <code>.sk-slider</code>, the class <code>also</code> puts on the TWO child
        <code>&lt;input&gt;</code>s, never on <code>.sk-slider-range</code> itself. Custom properties
        inherit downward, never up, so the wrapper and its own track/fill never saw a value:
        <code>block-size</code> fell back to its initial <code>auto</code>, and with every child
        absolutely positioned, nothing in normal flow gave the wrapper a height. The whole control
        rendered at 0×100%, with an invisible track. Invisible in jsdom (which never computes real
        layout) and only catchable with a real browser layout; the first canonical tree
        <code>SliderRange</code> ever had is what finally surfaced it.
  - date: 2026-08-18
    kind: bugfix
    target: SliderRange
    es:
      title: SliderRange.lowValue/highValue llegaban a React como un solo defaultValue
      body: >-
        Las dos opciones apuntaban al mismo nombre de prop, <code>defaultValue</code>, y el binding
        React en realidad espera <code>defaultLowValue</code>/<code>defaultHighValue</code>: ninguno
        de los dos extremos llegaba nunca al componente, que se quedaba en sus propios valores por
        defecto (0 y 100) sin importar qué autorara el árbol. Invisible hasta ahora porque ningún
        árbol canónico había puesto <code>lowValue</code>/<code>highValue</code> en algo distinto del
        default. El chequeo de cobertura que exige un árbol por cada signature publicada fue lo que
        lo hizo evidente.
    en:
      title: SliderRange.lowValue/highValue reached React as one shared defaultValue
      body: >-
        Both options pointed at the same prop name, <code>defaultValue</code>, and the React binding
        actually expects <code>defaultLowValue</code>/<code>defaultHighValue</code>: neither end ever
        reached the component, which stayed at its own defaults (0 and 100) no matter what a tree
        authored. Invisible until now because no canonical tree had ever set
        <code>lowValue</code>/<code>highValue</code> to anything but the default: the coverage check
        that requires one tree per published signature is what surfaced it.
  - date: 2026-08-15
    kind: feature
    target: SliderRange
    es:
      title: Nueva signature SliderRange, un rango de dos extremos
      body: >-
        Cubre el patrón WAI-ARIA APG "Slider (Multi-Thumb)" con dos <code>&lt;input
        type="range"&gt;</code> nativos en vez del widget SVG a medida que documenta el ejemplo de
        WAI. El propio patrón advierte que un widget custom puede dar problemas con lectores de
        pantalla táctiles, y dos inputs nativos ya traen teclado, formulario y árbol de
        accesibilidad de la plataforma. Opciones: <code>lowValue</code>/<code>highValue</code>
        (posición inicial de cada extremo), <code>lowLabel</code>/<code>highLabel</code>
        (obligatorias, nombran cada extremo por separado), más <code>min</code>/<code>max</code>/
        <code>step</code>/<code>disabled</code> compartidos. Ningún extremo puede arrastrarse más
        allá del otro.
    en:
      title: New SliderRange signature, a two-ended range
      body: >-
        Covers the WAI-ARIA APG "Slider (Multi-Thumb)" pattern with two native <code>&lt;input
        type="range"&gt;</code> elements instead of the custom SVG widget the WAI example
        documents. The pattern itself warns a hand-rolled widget can be difficult for touch-based
        screen reader users, and two native inputs already get keyboard, form participation and
        the accessibility tree from the platform. Options: <code>lowValue</code>/
        <code>highValue</code> (each end's starting position), <code>lowLabel</code>/
        <code>highLabel</code> (required, name each end separately), plus shared
        <code>min</code>/<code>max</code>/<code>step</code>/<code>disabled</code>. Neither end can
        be dragged past the other.
  - date: 2026-08-11
    kind: feature
    es:
      title: Slider se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Slider</code>: los dos bindings lo realizan, y la referencia de esta
        página sale del contrato compilado en vez de prosa escrita al lado. El binding Vanilla monta
        sobre <code>data-sk-slider</code>: el markup se autora y el enhancer lo hidrata, así que lo que
        no necesita JavaScript funciona antes de que corra ninguno. Opciones: <code>value</code>,
        <code>min</code>, <code>max</code>, <code>step</code>, <code>name</code>, <code>disabled</code>.
        La hoja es <code>components/slider.css</code>.
    en:
      title: Slider is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Slider</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. The
        Vanilla binding mounts on <code>data-sk-slider</code>: the markup is authored and the enhancer
        hydrates it, so whatever needs no JavaScript works before any runs. Options: <code>value</code>,
        <code>min</code>, <code>max</code>, <code>step</code>, <code>name</code>, <code>disabled</code>.
        Its stylesheet is <code>components/slider.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de slider quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>8</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: slider's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>8</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Cada evento lleva el nombre de su familia
      body: >-
        <code>sk-value-change</code> → <code>sk:slidervaluechange</code>. Un mismo nombre ya no lo despachan varias familias: un listener sobre una raíz deja
        de recibir los eventos de un componente distinto anidado adentro. El contrato ahora los declara en <code>events</code>, así que el compilador los publica.
    en:
      title: Every event carries its family in its name
      body: >-
        <code>sk-value-change</code> → <code>sk:slidervaluechange</code>. No two families dispatch the same name any more: a listener on a root stops receiving
        the events of a different component nested inside it. The contract now declares them in <code>events</code>, so the compiler publishes them.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: Un Slider necesita nombre y su valor tiene que caer dentro de su rango
      body: >-
        Los dos bindings nombran el pulgar desde el <code>aria-label</code> o
        <code>aria-labelledby</code> de la raíz, pero nada lo exigía: un Slider sin nombre se anunciaba
        como un número suelto. Ahora es obligatorio. <code>value</code> tiene que quedar entre
        <code>min</code> y <code>max</code>, y en SliderRange el extremo bajo no puede superar al alto
        (nueva regla <code>between</code>).
    en:
      title: A Slider needs a name and its value has to fall inside its range
      body: >-
        Both bindings name the thumb from the root's <code>aria-label</code> or
        <code>aria-labelledby</code>, but nothing required one: an unnamed Slider was announced as a
        bare number. It is now required. <code>value</code> has to sit between <code>min</code> and
        <code>max</code>, and in SliderRange the low end cannot pass the high end (new
        <code>between</code> rule).
