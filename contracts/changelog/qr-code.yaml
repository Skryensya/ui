# Qué cambió en qr-code, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribe la entrada y pega el
# hash nuevo.
surface: "f3af0447f5ed5964"
entries:
  - date: 2026-09-09
    kind: feature
    es:
      title: QR se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>QR</code>: un texto hecho escaneable. El símbolo se dibuja como
        UN solo <code>path</code> y no como un elemento por módulo, que a versión 40 son 16.020
        elementos y 669KB contra uno y 113KB. Opciones: <code>value</code>, <code>label</code>,
        <code>level</code>, <code>moduleShape</code>, <code>quietZone</code>, <code>logoRatio</code>
        y <code>qrSize</code>; el slot <code>logo</code> acepta cualquier nodo publicado. La hoja es
        <code>components/qr-code.css</code>.
    en:
      title: QR is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>QR</code>: a string made scannable. The symbol is drawn as
        ONE <code>path</code> rather than an element per module, which at version 40 is 16,020
        elements and 669KB against one and 113KB. Options: <code>value</code>, <code>label</code>,
        <code>level</code>, <code>moduleShape</code>, <code>quietZone</code>, <code>logoRatio</code>
        and <code>qrSize</code>; the <code>logo</code> slot takes any published node. Its stylesheet
        is <code>components/qr-code.css</code>.

  - date: 2026-09-09
    kind: feature
    es: 
      title: QR suma tone y polarity, y su default de corrección pasa a Q
      body: >-
        <code>tone</code> pinta los módulos con la paleta de Chart y <code>polarity</code> decide de
        qué lado va el contraste. <code>light</code> por defecto  -  módulos oscuros sobre papel
        claro, fijo  -  porque los colores seguían el esquema de la página y en modo oscuro el
        símbolo se invertía solo y dejaba de escanear. El default de <code>level</code> pasa de
        <code>M</code> a <code>Q</code>: este contrato trae logo, tinte y formas, que son lo que
        gasta el presupuesto de corrección. <code>logoRatio</code> ahora se serializa como custom
        property, sin la cual la caja del logo medía cero.
    en: 
      title: QR gains tone and polarity, and its correction default moves to Q
      body: >-
        <code>tone</code> paints the modules from Chart's palette and <code>polarity</code> decides
        which way the contrast runs. <code>light</code> by default  -  dark modules on light paper,
        pinned  -  because the colours used to follow the page's scheme, so in dark mode the symbol
        inverted itself and stopped scanning. The <code>level</code> default moves from
        <code>M</code> to <code>Q</code>: this contract ships a logo, a tint and shapes, which are
        what spends the error budget. <code>logoRatio</code> now serializes as a custom property,
        without which the logo box measured zero.

  - date: 2026-09-09
    kind: feature
    es: 
      title: polarity suma auto y pasa a ser el default
      body: >-
        Tercer valor para <code>polarity</code>: <code>auto</code> hereda el <code>color-scheme</code>
        en vez de fijarlo, así que el símbolo se da vuelta con el modo claro/oscuro, y es el default.
        Los colores siempre salieron de los mismos tokens y el SVG siempre fue inline con
        <code>fill="currentColor"</code>; cada valor sólo elige qué rama de <code>light-dark()</code>
        gana. Es una decisión con costo: la norma sólo garantiza oscuro-sobre-claro, así que para
        imprimir o proyectar hay que pedir <code>light</code>.
    en: 
      title: polarity gains auto, and auto becomes the default
      body: >-
        A third value for <code>polarity</code>: <code>auto</code> inherits <code>color-scheme</code>
        instead of pinning it, so the symbol flips with light and dark mode, and it is the default.
        The colours always came from the same tokens and the SVG was always inline with
        <code>fill="currentColor"</code>; each value only chooses which branch of
        <code>light-dark()</code> wins. It is a trade: the standard only guarantees dark-on-light, so
        anything printed or projected should ask for <code>light</code>.

  - date: 2026-09-09
    kind: breaking
    es:
      title: QR pasa a llamarse QRCode, y el contrato se publica como qr-code
      body: >-
        La signature es <code>QRCode</code> y el id del contrato es <code>qr-code</code>. Con eso se
        mueven los imports (<code>@skryensya/core/qr-code</code>, <code>@skryensya/react/qr-code</code>),
        la hoja (<code>components/qr-code.css</code>), las clases (<code>.sk-qr-code</code>), los
        tokens de tamaño (<code>--size-qr-code-*</code>) y la ruta de la documentación
        (<code>/components/qr-code</code>). El nombre corto era ambiguo escrito solo: QR es el formato,
        no el componente. El buscador ahora encuentra la página por <em>quick response code</em>,
        <em>código de respuesta rápida</em> y demás alias.
    en:
      title: QR is renamed QRCode, and the contract publishes as qr-code
      body: >-
        The signature is <code>QRCode</code> and the contract id is <code>qr-code</code>. That moves
        the imports (<code>@skryensya/core/qr-code</code>, <code>@skryensya/react/qr-code</code>), the
        stylesheet (<code>components/qr-code.css</code>), the classes (<code>.sk-qr-code</code>), the
        size tokens (<code>--size-qr-code-*</code>) and the docs route
        (<code>/components/qr-code</code>). The short name read as ambiguous on its own: QR is the
        format, not the component. Search now reaches the page through <em>quick response code</em>,
        <em>código de respuesta rápida</em> and the other aliases.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de qr-code quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>6</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: qr-code's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>6</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: El contrato declara el rango de sus números
      body: >-
        <code>quietZone</code> es un entero desde 0 y <code>logoRatio</code> va de 0 a 1. Un valor fuera de rango deja de validar en vez de llegar al binding.
    en:
      title: The contract declares the range of its numbers
      body: >-
        <code>quietZone</code> is a whole number from 0 and <code>logoRatio</code> goes from 0 to 1. A value out of range stops validating instead of reaching the binding.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: moduleShape llega al DOM y logoRatio topea en 0.5
      body: >-
        <code>moduleShape</code> deja de ser <code>computedInput</code>: la hoja lee
        <code>data-module-shape</code> para el <code>shape-rendering</code>, así que el atributo tiene
        que existir. <code>logoRatio</code> ahora valida hasta 0.5, el mismo tope que usa el encoder
        al vaciar el agujero del logo.
    en:
      title: moduleShape reaches the DOM and logoRatio caps at 0.5
      body: >-
        <code>moduleShape</code> is no longer <code>computedInput</code>: the stylesheet reads
        <code>data-module-shape</code> for <code>shape-rendering</code>, so the attribute has to exist.
        <code>logoRatio</code> now validates up to 0.5, the same cap the encoder uses when clearing
        the logo hole.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: Un logo necesita logoRatio
      body: >-
        Un logo sin <code>logoRatio</code> pintaba una cubierta de tamaño cero.
    en:
      title: A logo needs logoRatio
      body: >-
        A logo without <code>logoRatio</code> painted a zero-size cover.

  - date: 2026-09-25
    kind: bugfix
    es:
      title: Con dot y rounded, los tres patrones de posición siguen siendo cuadrados
      body: >-
        <code>moduleShape="dot"</code> y <code>"rounded"</code> también redondeaban los tres cuadrados de las esquinas, que son
        lo que una cámara busca para encontrar el código antes de leer un solo bit. El contenido seguía intacto, pero un
        lector podía no localizar el símbolo. Ahora esos tres patrones se dibujan siempre sólidos y la forma elegida se aplica
        al resto de los módulos. Lo que codifica el símbolo no cambia.
    en:
      title: With dot and rounded, the three finder patterns stay square
      body: >-
        <code>moduleShape="dot"</code> and <code>"rounded"</code> also rounded the three corner squares, which are what a
        camera looks for to find the code before reading a single bit. The payload was intact, but a reader could fail to
        locate the symbol. Those three patterns are now always drawn solid and the chosen shape applies to every other module.
        What the symbol encodes does not change.

  - date: 2026-09-25
    kind: feature
    es:
      title: Un QR se puede dibujar y cambiar en el navegador, sin framework
      body: >-
        Nuevo enhancer Vanilla <code>data-sk-qr-code</code> (<code>@skryensya/vanilla/qr-code</code>): dibuja un QR cuyo valor sólo
        se conoce en el navegador y lo redibuja cuando cambia <code>data-value</code>, <code>data-level</code>,
        <code>data-mask</code>, <code>data-module-shape</code> o <code>data-quiet-zone</code>, con el mismo codificador que React y
        el markup emitido. Por eso <code>value</code>, <code>level</code>, <code>mask</code> y <code>quietZone</code> ahora se
        escriben como atributos en ambos bindings. Un QR ya dibujado no se codifica de nuevo al cargar. Si el valor no cabe, el
        dibujo queda vacío y la raíz lleva <code>data-sk-qr-error</code>: nunca sigue mostrando el código anterior.
    en:
      title: A QR can be drawn and changed in the browser, with no framework
      body: >-
        New Vanilla enhancer <code>data-sk-qr-code</code> (<code>@skryensya/vanilla/qr-code</code>): it draws a QR whose value is
        only known in the browser and redraws it when <code>data-value</code>, <code>data-level</code>, <code>data-mask</code>,
        <code>data-module-shape</code> or <code>data-quiet-zone</code> change, with the same encoder as React and the emitted
        markup. That is why <code>value</code>, <code>level</code>, <code>mask</code> and <code>quietZone</code> are now written
        as attributes by both bindings. A QR that is already drawn is not encoded again on load. When the value does not fit,
        the drawing is left empty and the root carries <code>data-sk-qr-error</code>: it never keeps showing the previous code.

  - date: 2026-09-25
    kind: feature
    es:
      title: Exportar un QR como PNG, JPEG, WebP o SVG
      body: >-
        <code>downloadQrCode</code>, <code>qrCodeToBlob</code>, <code>qrCodeToDataUrl</code> y <code>qrCodeToSvg</code>
        (<code>@skryensya/core/qr-code-export</code>, reexportados desde <code>@skryensya/react/qr-code</code> y
        <code>@skryensya/vanilla/qr-code</code>) exportan el QR tal como está dibujado, con el tono en colores literales, el
        papel pintado y el logo cuando es un <code>&lt;svg&gt;</code> o una <code>&lt;img&gt;</code> con CORS. Por defecto sale
        oscuro sobre claro aunque la página esté en modo oscuro; <code>polarity: "as-drawn"</code> exporta lo que se ve.
        <code>QRCode</code> en React acepta <code>ref</code>. El contrato sigue sin botón de descarga: es una función que llama
        el tuyo.
    en:
      title: Export a QR as PNG, JPEG, WebP or SVG
      body: >-
        <code>downloadQrCode</code>, <code>qrCodeToBlob</code>, <code>qrCodeToDataUrl</code> and <code>qrCodeToSvg</code>
        (<code>@skryensya/core/qr-code-export</code>, re-exported from <code>@skryensya/react/qr-code</code> and
        <code>@skryensya/vanilla/qr-code</code>) export the QR as it is drawn, with the tone as literal colours, the paper
        painted and the logo when it is an <code>&lt;svg&gt;</code> or an <code>&lt;img&gt;</code> served with CORS. By default
        it comes out dark on light even when the page is in dark mode; <code>polarity: "as-drawn"</code> exports what is on
        screen. React's <code>QRCode</code> accepts a <code>ref</code>. The contract still has no download button: this is a
        function your own button calls.
