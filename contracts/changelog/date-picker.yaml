# What changed in date-picker, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "3f2bc90f1f97ea16"
entries:
  - date: 2026-10-30
    kind: bugfix
    es:
      title: "Popup de rango centrado bajo el campo"
      body: "El popup de rango se centra bajo el campo, en lugar de alinearse a su inicio. Mantiene el ajuste al viewport y la hoja en móvil."
    en:
      title: "Range popup centered below the field"
      body: "The range popup is centered below the field instead of aligned to its start. Viewport collision handling and the mobile sheet are preserved."
  - date: 2026-10-30
    kind: feature
    target: numOfMonths
    es:
      title: "Rangos con dos meses y dos campos"
      body: "El selector de rangos muestra dos meses por defecto y permite introducir ambas fechas en React y Vanilla. numOfMonths permite volver a uno. En móvil, los meses se apilan en una hoja con cierre explícito, sin reducir los botones de día."
    en:
      title: "Ranges with two months and two fields"
      body: "Range pickers show two months by default and support entering both dates in React and Vanilla. numOfMonths can switch back to one. On mobile, months stack inside a sheet with an explicit close button, without shrinking day targets."
  - date: 2026-10-25
    kind: breaking
    target: appearance
    es:
      title: "Cada apariencia tiene su propia hoja"
      body: "Las reglas de `brutalist`, `frosted` pasan de date-picker.css a date-picker.brutalist.css, date-picker.frosted.css. Importa la hoja del valor que uses; sin ella, ese valor no recibe su pintura. Los hooks siguen declarados en date-picker.css."
    en:
      title: "Each appearance has its own stylesheet"
      body: "The rules for `brutalist`, `frosted` move from date-picker.css to date-picker.brutalist.css, date-picker.frosted.css. Import the sheet for the value you use; without it, that value does not get its paint. The hooks are still declared in date-picker.css."
  - date: 2026-10-19
    kind: bugfix
    es:
      title: Se retiran ocho hooks de anchoring que no hacían nada
      body: "<code>--sk-anchored-align</code>, <code>--sk-anchored-arrow-edge</code>, <code>--sk-anchored-arrow-near</code>, <code>--sk-anchored-justify</code>, <code>--sk-anchored-offset</code>, <code>--sk-anchored-position-area</code>, <code>--sk-anchored-position-try</code> y <code>--sk-anchored-size</code> estaban en la lista de hooks, pero ninguna hoja de estilos de la librería los declara jamás, ni siquiera el patrón <code>anchored.css</code> que los originó: sobrescribir cualquiera de ellos no hacía nada, en silencio. Solo queda <code>--sk-anchored-z</code>, el único que de verdad se usa."
    en:
      title: Eight dead anchoring hooks removed
      body: "<code>--sk-anchored-align</code>, <code>--sk-anchored-arrow-edge</code>, <code>--sk-anchored-arrow-near</code>, <code>--sk-anchored-justify</code>, <code>--sk-anchored-offset</code>, <code>--sk-anchored-position-area</code>, <code>--sk-anchored-position-try</code> and <code>--sk-anchored-size</code> were listed as hooks, but no stylesheet in the library ever declares them, not even the <code>anchored.css</code> pattern they came from: overriding any of them did nothing, silently. Only <code>--sk-anchored-z</code> remains, the one actually in use."
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
