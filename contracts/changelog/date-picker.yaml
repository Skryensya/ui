# What changed in date-picker, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "04565f50824b8074"
entries:
  - date: 2026-09-17
    kind: feature
    es:
      title: Firmas interactivas declaran forward
      body: >-
        Las firmas host interactivas o de formulario publican <code>forward</code>
        (<code>id</code>/<code>aria-*</code> y attrs de enlace o formulario cuando aplica).
        Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: Interactive signatures declare forward
      body: >-
        Interactive or form host signatures publish <code>forward</code>
        (<code>id</code>/<code>aria-*</code> and link or form attrs where relevant).
        An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: feature
    es:
      title: portals declara container de React
      body: >-
        <code>portals: { container: true }</code> documenta el ref React-only que acota el portal (por defecto <code>document.body</code>). El markup sigue anclado en el subárbol.
    en:
      title: portals declares the React container
      body: >-
        <code>portals: { container: true }</code> documents the React-only ref that scopes the portal (default <code>document.body</code>). Markup stays in the subtree.
  - date: 2026-09-17
    kind: feature
    es:
      title: eventDetails nombra source y trigger
      body: >-
        <code>eventDetails</code> declara <code>source</code> (parte que despacha el CustomEvent) y, cuando es claro, <code>trigger</code> (parte que el usuario activa). Un agente sabe dónde escuchar y qué control provoca el evento.
    en:
      title: eventDetails names source and trigger
      body: >-
        <code>eventDetails</code> declares <code>source</code> (part that dispatches the CustomEvent) and, when clear, <code>trigger</code> (part the user activates). An agent knows where to listen and which control causes the event.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-09-17
    kind: feature
    es:
      title: DatePicker declara compose de Button, Icon y Calendar
      body: >-
        <code>compose</code> documenta controles y el body Calendar inyectado (<code>systemOwned</code>).
    en:
      title: DatePicker declares compose of Button, Icon, and Calendar
      body: >-
        <code>compose</code> documents controls and the injected Calendar body (<code>systemOwned</code>).
  - date: 2026-09-17
    kind: bugfix
    target: value
    es:
      title: value, min y max exigen ISO YYYY-MM-DD
      body: >-
        Las tres opciones llevan el mismo <code>pattern</code> que Calendar (un día, o dos
        separados por espacio en un rango). Vale para <code>DatePicker</code> y
        <code>DatePicker.native</code>.
    en:
      title: value, min, and max require ISO YYYY-MM-DD
      body: >-
        All three options carry the same <code>pattern</code> as Calendar (one day, or two
        space-separated for a range). Applies to <code>DatePicker</code> and
        <code>DatePicker.native</code>.
  - date: 2026-08-11
    kind: feature
    es:
      title: DatePicker se publica como contrato, con 2 signatures
      body: >-
        Entra al catálogo con <code>DatePicker</code>, <code>DatePicker.native</code>: los dos bindings
        lo realizan, y la referencia de esta página sale del contrato compilado en vez de prosa escrita
        al lado. El binding Vanilla monta sobre <code>data-sk-date-picker</code>: el markup se autora y
        el enhancer lo hidrata, así que lo que no necesita JavaScript funciona antes de que corra
        ninguno. Opciones: <code>name</code>, <code>value</code>, <code>min</code>, <code>max</code>,
        <code>selectionMode</code>, <code>locale</code>, <code>timeZone</code>, <code>disabled</code>,
        <code>readOnly</code>, <code>required</code>, <code>placeholder</code>, <code>clearLabel</code>.
        La hoja es <code>components/date-picker.css</code>.
    en:
      title: DatePicker is published as a contract, with 2 signatures
      body: >-
        It joins the catalogue with <code>DatePicker</code>, <code>DatePicker.native</code>: both
        bindings realize it, and this page's reference is rendered from the compiled contract rather
        than from prose written beside it. The Vanilla binding mounts on
        <code>data-sk-date-picker</code>: the markup is authored and the enhancer hydrates it, so
        whatever needs no JavaScript works before any runs. Options: <code>name</code>,
        <code>value</code>, <code>min</code>, <code>max</code>, <code>selectionMode</code>,
        <code>locale</code>, <code>timeZone</code>, <code>disabled</code>, <code>readOnly</code>,
        <code>required</code>, <code>placeholder</code>, <code>clearLabel</code>. Its stylesheet is
        <code>components/date-picker.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de date-picker quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>33</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: date-picker's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>33</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Cada evento lleva el nombre de su familia
      body: >-
        <code>sk-value-change</code> → <code>sk:datepickervaluechange</code>. Un mismo nombre ya no lo despachan varias familias: un listener sobre una raíz deja
        de recibir los eventos de un componente distinto anidado adentro. El contrato ahora los declara en <code>events</code>, así que el compilador los publica.
    en:
      title: Every event carries its family in its name
      body: >-
        <code>sk-value-change</code> → <code>sk:datepickervaluechange</code>. No two families dispatch the same name any more: a listener on a root stops receiving
        the events of a different component nested inside it. The contract now declares them in <code>events</code>, so the compiler publishes them.
  - date: 2026-09-17
    kind: feature
    es:
      title: Anclaje, invalid y el native con bounds reales
      body: >-
        El contrato declara <code>hookSheets</code> de <code>anchored.css</code> (el calendario
        flotante) y la opción <code>invalid</code>. <code>DatePicker.native</code> admite
        <code>value</code>/<code>min</code>/<code>max</code>/<code>disabled</code>/<code>readOnly</code>/<code>required</code>
        como atributos HTML reales. React despacha <code>sk:datepickervaluechange</code> como Vanilla.
    en:
      title: Anchoring, invalid, and native with real bounds
      body: >-
        The contract declares <code>hookSheets</code> for <code>anchored.css</code> (the floating
        calendar) and the <code>invalid</code> option. <code>DatePicker.native</code> accepts
        <code>value</code>/<code>min</code>/<code>max</code>/<code>disabled</code>/<code>readOnly</code>/<code>required</code>
        as real HTML attributes. React dispatches <code>sk:datepickervaluechange</code> like Vanilla.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Los textos por defecto pasan a inglés
      body: >-
        El kit es una librería en inglés y sus defaults estaban en español: <code>locale</code> en, <code>clearLabel</code> Clear. Una interfaz en
        otro idioma pasa sus propios textos, y el <code>locale</code> que corresponda.
    en:
      title: Default texts move to English
      body: >-
        The kit is an English library and its defaults were Spanish: <code>locale</code> en, <code>clearLabel</code> Clear. An interface in another
        language passes its own texts, and the <code>locale</code> it needs.
