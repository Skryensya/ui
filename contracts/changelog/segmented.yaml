# What changed in segmented, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "d6f8fb2faf2c82c1"
entries:
  - date: 2026-09-17
    kind: feature
    es:
      title: Firmas interactivas declaran forward
      body: >-
        Las firmas host interactivas o de formulario publican <code>forward</code>
        (<code>id</code>/<code>aria-*</code> y attrs de enlace o formulario cuando aplica).
        Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: Interactive signatures declare forward
      body: >-
        Interactive or form host signatures publish <code>forward</code>
        (<code>id</code>/<code>aria-*</code> and link or form attrs where relevant).
        An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: feature
    es:
      title: eventDetails nombra source y trigger
      body: >-
        <code>eventDetails</code> declara <code>source</code> (parte que despacha el CustomEvent) y, cuando es claro, <code>trigger</code> (parte que el usuario activa). Un agente sabe dónde escuchar y qué control provoca el evento.
    en:
      title: eventDetails names source and trigger
      body: >-
        <code>eventDetails</code> declares <code>source</code> (part that dispatches the CustomEvent) and, when clear, <code>trigger</code> (part the user activates). An agent knows where to listen and which control causes the event.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-08-23
    kind: rework
    es:
      title: El track pasa a leerse como un control, no como un hueco hundido
      body: >-
        <code>--sk-segmented-bg</code> pasa de <code>--color-bg-surface-sunken</code> a
        <code>--color-action-neutral</code> y <code>--sk-segmented-border-color</code> de
        <code>--color-border-subtle</code> a <code>--color-border-default</code>: los mismos dos
        tokens que usa el variant <code>neutral</code> de <code>Button</code>. Sentado en una fila
        junto a un botón, el track hundido con un borde casi invisible se leía más liviano y turbio
        que sus vecinos, más cerca de una superficie deshabilitada que de algo que se presiona.
        <code>ComponentPreview</code> ya venía pisando esos dos hooks en su propio header por
        exactamente esa razón. Un consumidor arreglándose el componente para sí mismo mientras el
        resto se quedaba con la versión liviana -; ese override se borró y ésta es la apariencia
        publicada. La geometría no cambia (alto, padding, radio, gap), y el anillo de acento del
        thumb es lo que lo mantiene visible sin depender de que el track sea oscuro.
        <strong>Si quieres el pozo de vuelta:</strong> redeclará esos dos hooks en tu propio scope.
    en:
      title: The track now reads as a control, not as a recessed well
      body: >-
        <code>--sk-segmented-bg</code> moves from <code>--color-bg-surface-sunken</code> to
        <code>--color-action-neutral</code>, and <code>--sk-segmented-border-color</code> from
        <code>--color-border-subtle</code> to <code>--color-border-default</code>: the same two
        tokens <code>Button</code>'s <code>neutral</code> variant already reads. Sitting in a row
        beside a button, the sunken track behind a barely-findable border read lighter and muddier
        than its neighbours. Closer to a disabled surface than to something you press.
        <code>ComponentPreview</code> had already been overriding both hooks in its own header for
        exactly that reason, one consumer quietly fixing the component for itself while every other
        consumer kept the lighter version; that override is gone and this is the published look.
        Geometry is unchanged (height, padding, radius, gap), and the thumb's accent ring is what
        keeps it findable without depending on a dark track.
        <strong>To get the well back:</strong> redeclare those two hooks in your own scope.
  - date: 2026-08-22
    kind: bugfix
    es:
      title: El selected ya no se confunde con el hover
      body: >-
        El pulgar raised de piedra y el wash de hover se leían como la misma pastilla. Selected
        mezcla un poco de <code>--color-bg-accent-subtle</code> sobre raised y toma texto accent;
        el state layer de selected se apaga (el pulgar ya es el indicador), así el hover sigue
        siendo sólo el tinte compartido.
    en:
      title: Selected no longer reads as hover
      body: >-
        The raised stone thumb and the hover wash read as the same pill. Selected now mixes a
        little <code>--color-bg-accent-subtle</code> into raised and takes accent text; the
        selected state-layer rung is muted (the thumb already is the indicator), so hover stays
        the shared tint alone.
  - date: 2026-08-22
    kind: bugfix
    es:
      title: La opción activa es un pulgar raised, no un chip de acento
      body: >-
        El fill de <code>--color-bg-accent-subtle</code> hacía que cada Segmented (Vanilla/React,
        presets, densidad) se leyera como un toggle de marca. El riel ahora es superficie hundida
        y la opción elegida una tecla raised, con el mismo bisel de tres capas que Kbd: highlight,
        peldaño y elevación. El texto pasa a primario. No hay opción nueva: el default deja de
        gritar para poder sentarse en chrome y en formularios.
    en:
      title: The active option is a raised thumb, not an accent chip
      body: >-
        The <code>--color-bg-accent-subtle</code> fill made every Segmented (Vanilla/React, presets,
        density) read as a brand toggle. The track is now a sunken well and the chosen option a
        raised key, with the same three-layer bevel Kbd uses: highlight, ledge and elevation. Text
        goes to primary. No new option: the default stops shouting so it can sit in chrome and in
        forms.
  - date: 2026-08-17
    kind: breaking
    target: label
    es:
      title: label ahora es obligatoria. El radiogroup necesita un nombre
      body: >-
        El patrón Radio Group de WAI espera que <code>role="radiogroup"</code> tenga un nombre
        accesible, y este contrato no tenía forma de dárselo. Las tres instancias reales del
        catálogo ya pasaban <code>aria-label</code> por fuera, a mano, un comentario propio de la
        demo lo admitía explícitamente ("Segmented's contract does not map it"). Ahora
        <code>label</code> es una opción real y obligatoria.
    en:
      title: label is now required. The radiogroup needs a name
      body: >-
        WAI's Radio Group pattern expects `role="radiogroup"` to carry an accessible name, and this
        contract had no way to give it one. The catalogue's three real instances already passed
        `aria-label` outside the contract, by hand, one demo's own comment admitted it explicitly
        ("Segmented's contract does not map it"). `label` is now a real, required option.
  - date: 2026-08-11
    kind: feature
    es:
      title: Segmented se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Segmented</code>: los dos bindings lo realizan, y la referencia de
        esta página sale del contrato compilado en vez de prosa escrita al lado. El binding Vanilla
        monta sobre <code>data-sk-segmented</code>: el markup se autora y el enhancer lo hidrata, así
        que lo que no necesita JavaScript funciona antes de que corra ninguno. Opciones:
        <code>value</code>. La hoja es <code>components/segmented.css</code>.
    en:
      title: Segmented is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Segmented</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. The
        Vanilla binding mounts on <code>data-sk-segmented</code>: the markup is authored and the
        enhancer hydrates it, so whatever needs no JavaScript works before any runs. Options:
        <code>value</code>. Its stylesheet is <code>components/segmented.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de segmented quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>14</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: segmented's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>14</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-16
    kind: bugfix
    es:
      title: El validador comprueba que el valor inicial nombre una entrada que existe
      body: >-
        <code>value</code> ahora declara que nombra entradas de <code>items</code> por su
        <code>value</code>. Un árbol que apunta a una entrada inexistente deja de validar
        (<code>unknown-key</code>) en vez de renderizar sin nada seleccionado ni decir por qué. El
        markup y los bindings no cambian.
    en:
      title: The validator checks that the initial value names an entry that exist
      body: >-
        <code>value</code> now declares that it names entries of <code>items</code> by their
        <code>value</code>. A tree pointing at an entry that does not exist stops validating
        (<code>unknown-key</code>) instead of rendering with nothing selected and no reason given.
        Markup and bindings are unchanged.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: React despacha el mismo evento DOM que Vanilla y estampa el mount
      body: >-
        Al cambiar la selección, React ahora despacha <code>sk:segmentedvaluechange</code> en la
        raíz (antes solo llamaba <code>onValueChange</code>). También escribe
        <code>data-sk-segmented</code> y <code>data-sk-segmented-option</code>, los mismos mount
        marks que el enhancer Vanilla escanea. El hash de superficie no cambia: el contrato ya
        declaraba el evento y el mount.
    en:
      title: React dispatches the same DOM event as Vanilla and stamps the mount
      body: >-
        On selection change, React now dispatches <code>sk:segmentedvaluechange</code> on the root
        (it previously only called <code>onValueChange</code>). It also writes
        <code>data-sk-segmented</code> and <code>data-sk-segmented-option</code>, the same mount
        marks the Vanilla enhancer scans. The surface hash is unchanged: the contract already
        declared the event and the mount.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Cada evento lleva el nombre de su familia
      body: >-
        <code>sk-value-change</code> → <code>sk:segmentedvaluechange</code>. Un mismo nombre ya no lo despachan varias familias: un listener sobre una raíz deja
        de recibir los eventos de un componente distinto anidado adentro. El contrato ahora los declara en <code>events</code>, así que el compilador los publica.
    en:
      title: Every event carries its family in its name
      body: >-
        <code>sk-value-change</code> → <code>sk:segmentedvaluechange</code>. No two families dispatch the same name any more: a listener on a root stops receiving
        the events of a different component nested inside it. The contract now declares them in <code>events</code>, so the compiler publishes them.
