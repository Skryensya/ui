# What changed in segmented, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "a147b2b8fcfbd0a6"
entries:
  - date: 2026-10-28
    kind: bugfix
    es:
      title: La opción elegida dice <code>aria-checked="true"</code>
      body: "El HTML emitido marcaba la opción elegida con un <code>aria-checked</code> vacío, que no es un valor ARIA válido; ahora escribe <code>true</code>. Además, una opción cuyo texto termina en un elemento (\"EN\" y su nombre oculto) ya no recibe un salto de línea antes de <code>&lt;/button&gt;</code>, que se convertía en una columna vacía y 4px de relleno extra a un lado."
    en:
      title: The chosen option says <code>aria-checked="true"</code>
      body: "Emitted HTML marked the chosen option with an empty <code>aria-checked</code>, which is not a valid ARIA value; it now writes <code>true</code>. And an option whose content ends in an element (\"EN\" and its hidden name) no longer gets a line break before <code>&lt;/button&gt;</code>, which became an empty column and 4px of extra padding on one side."
  - date: 2026-10-28
    kind: feature
    es:
      title: Las opciones de solo icono pueden mostrar un tooltip
      body: "Con <code>iconLabel=\"tooltip\"</code>, una opción con un icono y su texto oculto visualmente (su nombre accesible) muestra ese texto en un Tooltip del kit al pasar el puntero o al llegar con el teclado. Es solo visual: el lector de pantalla ya lee el nombre, así que no se repite como descripción. Es opcional: solo ese valor carga <code>tooltip.css</code> y <code>anchored.css</code>."
    en:
      title: Icon-only options can show a tooltip
      body: "With <code>iconLabel=\"tooltip\"</code>, an option with an icon and visually hidden words (its accessible name) shows those words in the kit's Tooltip on hover or keyboard focus. It is visual only: a screen reader already reads the name, so it is not repeated as a description. It is opt-in: only that value loads <code>tooltip.css</code> and <code>anchored.css</code>."
  - date: 2026-10-28
    kind: feature
    es:
      title: La barra puede ocupar todo el ancho
      body: "Con <code>fill</code> la pista toma el ancho de su contenedor y las opciones lo reparten en partes iguales: para una elección que es una fila propia, como un panel de ajustes o un formulario."
    en:
      title: The bar can take the full width
      body: "With <code>fill</code> the track takes its container's width and the options share it equally: for a choice that is a row of its own, like a settings panel or a form."
  - date: 2026-10-26
    kind: feature
    es:
      title: Una opción admite un icono delante del texto
      body: "La etiqueta de cada opción es ahora un nodo, como en Tabs: puede llevar un <code>Icon</code> seguido de la palabra. Con <code>iconPosition=\"block\"</code> el icono va encima y la barra crece en alto. La pista deja de tener alto fijo (pasa a mínimo) y nunca dibuja barra de desplazamiento, ni dentro de <code>.sk-scrollbar</code>."
    en:
      title: An option takes an icon before its text
      body: "Each option's label is now a node, as in Tabs: it can hold an <code>Icon</code> followed by the word. With <code>iconPosition=\"block\"</code> the icon goes above and the bar grows taller. The track's height becomes a minimum instead of fixed, and it never draws a scrollbar, not even inside <code>.sk-scrollbar</code>."
  - date: 2026-10-25
    kind: breaking
    target: appearance
    es:
      title: "Cada apariencia tiene su propia hoja"
      body: "Las reglas de `tactile`, `brutalist`, `frosted` pasan de segmented.css a segmented.tactile.css, segmented.brutalist.css, segmented.frosted.css. Importa la hoja del valor que uses; sin ella, ese valor no recibe su pintura. Los hooks siguen declarados en segmented.css."
    en:
      title: "Each appearance has its own stylesheet"
      body: "The rules for `tactile`, `brutalist`, `frosted` move from segmented.css to segmented.tactile.css, segmented.brutalist.css, segmented.frosted.css. Import the sheet for the value you use; without it, that value does not get its paint. The hooks are still declared in segmented.css."
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
