# What changed in color-picker, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "32a6d8a7ae2d66ef"
entries:
  - date: 2026-09-03
    kind: bugfix
    es:
      title: El panel ya no se compara contra el binding equivocado en las pruebas de simetría
      body: >-
        <code>ColorPicker</code> y <code>ColorPicker.compact</code> declaran ahora <code>portals:
        true</code>: el binding React ya portaba su panel con <code>&lt;Portal&gt;</code>, pero sin
        esta marca <code>render-tree.tsx</code> nunca le pasaba un contenedor propio, así que todas
        las instancias de la página portaban al mismo <code>document.body</code> sin distinción. La
        primera vez que un árbol canónico ejerció ambos bindings (antes de esto, cero cobertura) el
        gate de simetría no podía emparejar el panel de una instancia con el de la otra. De paso se
        sincronizaron dos atributos que el binding React nunca restataba del molde del contrato: el
        input oculto lleva <code>aria-hidden="true"</code> y el disparador del gotero lleva
        <code>data-icon-only</code>, igual que ya hacía Vanilla.
    en:
      title: The panel no longer compares against the wrong binding in symmetry tests
      body: >-
        <code>ColorPicker</code> and <code>ColorPicker.compact</code> now declare <code>portals:
        true</code>: the React binding already portalled its panel with <code>&lt;Portal&gt;</code>,
        but without this flag <code>render-tree.tsx</code> never handed it a scoped container, so
        every instance on the page portalled into the same <code>document.body</code> with no way to
        tell them apart. The first time a canonical tree exercised both bindings (zero coverage
        before this), the symmetry gate could not pair one instance's panel with the other's. Two
        attributes the React binding never restated from the contract's own template got synced
        along the way: the hidden input carries <code>aria-hidden="true"</code> and the eyedropper
        trigger carries <code>data-icon-only</code>, matching what Vanilla already did.
  - date: 2026-08-26
    kind: feature
    es:
      title: ColorPicker se publica como contrato, con 3 signatures
      body: >-
        Entra al catálogo con <code>ColorPicker</code>, <code>ColorPicker.compact</code> y
        <code>ColorPicker.native</code>: las dos primeras corren sobre <code>@zag-js/color-picker</code>
        (área, riel de matiz, riel de alfa, filas hex/RGB/HSL/OKLCH y presets), la tercera es un
        <code>input type="color"</code> real. OKLCH no es un formato nativo de la máquina; su fila lee y
        escribe a través de una conversión propia (<code>@skryensya/core/color</code>) sobre el mismo
        color que la máquina ya expone. El binding Vanilla monta sobre
        <code>data-sk-color-picker</code>. Opciones: <code>name</code>, <code>value</code>,
        <code>disabled</code>, <code>readOnly</code>, <code>required</code>, <code>invalid</code>,
        <code>triggerLabel</code>, <code>swatches</code>. La hoja es
        <code>components/color-picker.css</code>.
    en:
      title: ColorPicker is published as a contract, with 3 signatures
      body: >-
        It joins the catalogue with <code>ColorPicker</code>, <code>ColorPicker.compact</code> and
        <code>ColorPicker.native</code>: the first two run on <code>@zag-js/color-picker</code> (area,
        hue rail, alpha rail, hex/RGB/HSL/OKLCH rows and presets), the third is a real
        <code>input type="color"</code>. OKLCH is not one of the machine's own formats; its row reads
        and writes through a conversion this system owns (<code>@skryensya/core/color</code>) over the
        same color the machine already exposes. The Vanilla binding mounts on
        <code>data-sk-color-picker</code>. Options: <code>name</code>, <code>value</code>,
        <code>disabled</code>, <code>readOnly</code>, <code>required</code>, <code>invalid</code>,
        <code>triggerLabel</code>, <code>swatches</code>. Its stylesheet is
        <code>components/color-picker.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de color-picker quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>31</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: color-picker's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>31</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
