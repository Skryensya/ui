# What changed in tree-view, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "c81881cd8cf51eb5"
entries:
  - date: 2026-09-17
    kind: feature
    es:
      title: Firmas interactivas declaran forward
      body: >-
        Las firmas host interactivas o de formulario publican <code>forward</code>
        (<code>id</code>/<code>aria-*</code> y attrs de enlace o formulario cuando aplica).
        Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: Interactive signatures declare forward
      body: >-
        Interactive or form host signatures publish <code>forward</code>
        (<code>id</code>/<code>aria-*</code> and link or form attrs where relevant).
        An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: feature
    es:
      title: eventDetails nombra source y trigger
      body: >-
        <code>eventDetails</code> declara <code>source</code> (parte que despacha el CustomEvent) y, cuando es claro, <code>trigger</code> (parte que el usuario activa). Un agente sabe dónde escuchar y qué control provoca el evento.
    en:
      title: eventDetails names source and trigger
      body: >-
        <code>eventDetails</code> declares <code>source</code> (part that dispatches the CustomEvent) and, when clear, <code>trigger</code> (part the user activates). An agent knows where to listen and which control causes the event.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-08-06
    kind: rework
    es:
      title: TreeView se estrecha, un paso de sangría más corto y tipografía de 12px
      body: >-
        Un árbol paga la sangría una vez por nivel, así que era lo que más ancho costaba: el paso
        baja de 16px a 12px, el inset de cada fila de 8px a 4px y las etiquetas pasan a
        <code>--font-size-caption</code> (12px), la misma tipografía que ya hablan Menu y NavList
        al lado. La altura de fila no se mueve. Si tenías un árbol calibrado al ancho anterior,
        <code>--sk-tree-indent</code> y el nuevo <code>--sk-tree-row-inset</code> lo devuelven a
        donde estaba.
    en:
      title: TreeView gets narrower, a shorter indent step and 12px type
      body: >-
        A tree pays its indent once per level, so that is where the width went: the step drops
        from 16px to 12px, each row's inset from 8px to 4px, and labels move to
        <code>--font-size-caption</code> (12px), the type Menu and NavList beside it already
        speak. Row height is unchanged. If you had a tree tuned to the old width,
        <code>--sk-tree-indent</code> and the new <code>--sk-tree-row-inset</code> put it back.
  - date: 2026-08-05
    kind: feature
    target: branchIcon
    es:
      title: TreeView diferencia carpetas y archivos con iconos estructurales
      body: >-
        <code>branchIcon</code> se renderiza en las ramas y <code>leafIcon</code> en las hojas. Un
        explorador puede usar una carpeta y un archivo para toda la jerarquía, sin iconos por extensión.
    en:
      title: TreeView distinguishes folders and files with structural icons
      body: >-
        <code>branchIcon</code> renders on branches and <code>leafIcon</code> on leaves. A file browser
        can use one folder and one file icon throughout the hierarchy, without extension-specific icons.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de tree-view quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>9</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: tree-view's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>9</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-14
    kind: bugfix
    target: itemIcon
    es:
      title: Una fila sin icono deja de reservarle la columna
      body: >-
        <code>branchIcon</code> y <code>leafIcon</code> son ranuras independientes, pero la columna
        del icono se decidía mirando el árbol entero: bastaba un icono en cualquier parte para que
        TODAS las filas reservaran el hueco. Con una sola de las dos ranuras puesta, las filas de la
        otra quedaban con tres pistas y dos hijos, y el nombre caía dentro de la pista del icono:
        medido, <code>20px</code> de ancho, así que cada hoja se recortaba a <code>in…</code> junto a
        una pista vacía. Ahora la columna la pide cada fila que de verdad lleva icono, así que la
        plantilla nunca contradice a sus hijos y la que no lo lleva empieza la etiqueta pegada a su
        sangría. En un árbol con las dos ranuras puestas, o con ninguna, nada cambia.
    en:
      title: A row with no icon stops reserving the column for one
      body: >-
        <code>branchIcon</code> and <code>leafIcon</code> are independent slots, but the icon column
        was decided by looking at the whole tree: one icon anywhere and EVERY row reserved the space.
        With only one of the two slots passed, the other kind of row kept three tracks and rendered
        two children, and the name landed inside the icon track: measured at <code>20px</code> wide,
        so every leaf ellipsised to <code>in…</code> beside an empty track. The column is now opted
        into by each row that actually carries an icon, so the template can never disagree with its
        children, and a row without one starts its label at its own indent. A tree with both slots
        passed, or with neither, is unchanged.
  - date: 2026-09-14
    kind: rework
    es:
      title: El icono de carpeta/archivo baja a 16px y se pinta un tono por debajo de la etiqueta
      body: >-
        <code>--sk-tree-node-icon-size</code> pasa de <code>--size-icon-md</code> a
        <code>--size-icon-sm</code>: la fila escribe en <code>--font-size-caption</code> (12px), así
        que un glifo de 20px iba muy por encima del nombre que etiquetaba y la vista aterrizaba en
        una columna de carpetas iguales antes de leer un solo archivo. El nuevo
        <code>--sk-tree-node-icon-color</code> lo pinta además en
        <code>--color-text-secondary</code>, la misma relación que List ya publica entre su ranura
        inicial y su título. Los dos son hooks: si querías el tamaño o el color anteriores, se
        recuperan con una declaración.
    en:
      title: The folder/file icon drops to 16px and sits a tone under the label
      body: >-
        <code>--sk-tree-node-icon-size</code> moves from <code>--size-icon-md</code> to
        <code>--size-icon-sm</code>: the row sets <code>--font-size-caption</code> (12px), so a 20px
        glyph ran well above the name it was labelling and the eye landed on a column of identical
        folders before reaching a single filename. The new
        <code>--sk-tree-node-icon-color</code> also paints it <code>--color-text-secondary</code>,
        the same relationship List already publishes between its leading slot and its title. Both are
        hooks: if you want the previous size or colour, one declaration puts them back.
  - date: 2026-09-14
    kind: rework
    target: branchIndicator
    es:
      title: El chevron por defecto se dibuja, ya no es el carácter ›
      body: >-
        Sin ranura <code>branchIndicator</code>, el template escribía un <code>›</code> literal: el
        último glifo de texto que quedaba en el sistema, renderizado con lo que la fuente del lector
        traiga para ese punto de código, así que salía fino y más chico que cualquier otro chevron de
        la página. Ahora el span sale vacío y la hoja lo dibuja con <code>mask-image</code>, el mismo
        trazo <code>chevron-right</code> del set de iconos que ya usa la divulgación de Treegrid. Un
        <code>branchIndicator</code> tuyo sigue ganando; el nuevo
        <code>--sk-tree-indicator-color</code> tiñe los dos por igual, así que el dibujado y el
        escrito a mano son la misma marca.
    en:
      title: The default chevron is drawn, no longer the › character
      body: >-
        With no <code>branchIndicator</code> slot the template wrote a literal <code>›</code>: the
        last text glyph left in the system, rendered with whatever the reader's font ships for that
        code point, so it came out thin and smaller than every other chevron on the page. The span
        now ships empty and the stylesheet draws it with <code>mask-image</code>, the same
        <code>chevron-right</code> path from the icon set that Treegrid's disclosure already uses.
        Your own <code>branchIndicator</code> still wins; the new
        <code>--sk-tree-indicator-color</code> tints both alike, so the drawn one and a hand-written
        one are the same mark.
  - date: 2026-09-14
    kind: rework
    es:
      title: La hoja deja de pintarse sobre su columna vacía de chevron
      body: >-
        Una hoja conserva la columna del chevron vacía para que las etiquetas de un nivel se
        alineen, pero la capa de estado se pinta a <code>inset: 0</code>, así que la píldora de una
        hoja seleccionada cruzaba también ese tramo muerto: medido, empezaba 31px a la izquierda de
        su propio texto. Una fila a sangre entera puede cargar espacio vacío; una píldora redondeada
        no, se lee como un botón puesto donde no hay nada que pulsar. Ahora la pintura empieza donde
        empieza el contenido. El área clicable no se toca: la fila entera sigue respondiendo.
    en:
      title: A leaf stops painting over its empty chevron column
      body: >-
        A leaf keeps the chevron column empty so labels on a level line up, but the state layer
        paints at <code>inset: 0</code>, so a selected leaf's pill ran across that dead stretch too:
        measured, it began 31px to the left of its own text. A full-bleed row can carry empty space;
        a rounded pill cannot, it reads as a button drawn where there is nothing to press. The paint
        now starts where the content starts. The hit area is untouched: the whole row still responds.
  - date: 2026-09-14
    kind: feature
    target: branchIcon
    es:
      title: El icono de carpeta y el de archivo se tiñen por separado, y la carpeta va en accent
      body: >-
        <code>--sk-tree-branch-icon-color</code> y <code>--sk-tree-leaf-icon-color</code> separan los
        dos marcadores, que hasta ahora solo se distinguían por su forma. El default pone la rama en
        <code>--color-text-accent</code> y deja la hoja en secundario: un árbol es mayormente hojas,
        así que teñir esas gasta el accent en la mayoría de las filas y pone una columna de marcas de
        color delante de los nombres. La rama, además, es la fila que hace algo al pulsarla.
        <code>--sk-tree-node-icon-color</code> sigue siendo la perilla única: la hoja cae en ella y
        moverla mueve las dos si redeclaras también la rama.
    en:
      title: Folder and file icons tint separately, and the folder takes the accent
      body: >-
        <code>--sk-tree-branch-icon-color</code> and <code>--sk-tree-leaf-icon-color</code> split the
        two markers, which until now differed only in shape. The default puts the branch on
        <code>--color-text-accent</code> and leaves the leaf secondary: a tree is mostly leaves, so
        tinting those spends the accent on the majority of the rows and puts a column of coloured
        marks in front of the names. The branch is also the row that does something when you press
        it. <code>--sk-tree-node-icon-color</code> is still the single knob: the leaf falls back to
        it, and redeclaring the branch alongside moves both.
  - date: 2026-09-14
    kind: rework
    target: item
    es:
      title: La fila baja de 32px a 26px, medida como la de Toc y no como un boton
      body: >-
        La altura salia de <code>--size-control-sm</code> (32px), la de un Button pequeño, pero el
        tipo de la fila siempre fue <code>--font-size-caption</code> (12px) contra los 14px que habla
        ese boton: tipo chico dentro de una caja pensada para tipo grande, que es de donde venia la
        sensacion de filas altas y sueltas. Ademas la analogia apuntaba al componente equivocado. Un
        Button es algo que colocas de a uno; una fila de arbol es chrome de un riel, repetido decenas
        de veces, y el componente que ya vive en esa posicion es Toc. Ahora la altura se deriva igual
        que <code>.sk-toc__link</code>, <code>--space-inset-xs</code> por lado mas el interlineado de
        caption: 26px medidos, los mismos que Toc. Si retocas la densidad o el paso de caption, los
        dos se mueven juntos.
    en:
      title: The row drops from 32px to 26px, measured like a Toc row rather than a button
      body: >-
        Its height came from <code>--size-control-sm</code> (32px), a small Button's, but the row's
        type has always been <code>--font-size-caption</code> (12px) against the 14px that button
        speaks: small type inside a box built for bigger type, which is where the tall, loose feel
        came from. The analogy also pointed at the wrong component. A Button is something you place
        one at a time; a tree row is chrome in a rail, repeated dozens of times, and the component
        already in that position is Toc. The height now derives the way <code>.sk-toc__link</code>
        does, <code>--space-inset-xs</code> a side plus the caption line-height: 26px measured, the
        same as Toc. Retune the density or the caption step and the two move together.
  - date: 2026-09-14
    kind: bugfix
    target: item
    es:
      title: El area clicable de una fila deja de invadir la fila vecina
      body: >-
        El pad de toque estiraba cada fila hasta <code>--size-touch-target</code> (44px) en los dos
        ejes, como hace Button. A 32px de fila todavia daba: crecia 6px dentro de un hueco de 8px. A
        una fila mas baja deja de dar, porque el pad de la fila siguiente empieza antes de que
        termine la cara de esta, y un click sobre un nombre podia abrir el de abajo. Limitarlo a la
        mitad del hueco no alcanza: el hueco solo separa hermanos, y una rama y su primer hijo van
        pegados, asi que ahi la separacion real es 0. Medido pixel por pixel, cada rama seguia
        perdiendo 4px de su propia cara. Ahora no crece en vertical: el area clicable es exactamente
        la cara, como en Toc, y los 26px ya cumplen el minimo de 24px de WCAG 2.2 SC 2.5.8 por si
        solos.
    en:
      title: A row's hit area stops reaching into its neighbour
      body: >-
        The touch pad stretched every row to <code>--size-touch-target</code> (44px) on both axes,
        the way Button does. At a 32px row that still worked: it grew 6px into an 8px gap. At a
        shorter row it stops working, because the next row's pad begins before this row's face ends,
        and a click on a name could open the one below it. Capping it at half the gap is not enough:
        the gap only separates siblings, and a branch sits flush against its first child, so the real
        spacing there is 0. Hit-tested pixel by pixel, every branch was still losing 4px of its own
        face. It no longer grows vertically: the hit area is exactly the face, as in Toc, and 26px
        already clears WCAG 2.2 SC 2.5.8's 24px minimum on its own.
  - date: 2026-09-14
    kind: bugfix
    target: branchContent
    es:
      title: Una rama y su primer hijo dejan de ir pegados
      body: >-
        El <code>gap</code> de la grilla solo separa HERMANOS, asi que una carpeta quedaba a 0px del
        archivo justo debajo (contra los 8px que habia entre hermanos) y las dos filas se leian como
        un bloque, con el icono de carpeta tocando el de archivo. Ahora
        <code>--sk-tree-row-gap</code> tambien se aplica bajo la fila padre, con
        <code>padding-block-start</code> y no con margen: la guia es un
        <code>border-inline-start</code> de esa misma caja, asi que el padding empuja al primer hijo
        pero la linea sigue arrancando a la altura del chevron del que cuelga. Medido, todas las
        separaciones del arbol son ahora iguales.
    en:
      title: A branch and its first child stop sitting flush
      body: >-
        The grid <code>gap</code> only separates SIBLINGS, so a folder sat 0px from the file directly
        beneath it (against the 8px between siblings) and the two rows read as one block, the folder
        icon touching the file icon. <code>--sk-tree-row-gap</code> now applies under the parent row
        too, as <code>padding-block-start</code> rather than a margin: the guide is a
        <code>border-inline-start</code> on that same box, so the padding pushes the first child down
        while the line still starts level with the chevron it hangs from. Measured, every spacing in
        the tree is now equal.
  - date: 2026-09-14
    kind: rework
    target: item
    es:
      title: La hoja ya no reserva la columna del chevron que nunca dibuja
      body: >-
        Una hoja no tiene divulgación, así que la columna vacía que cargaba solo existía para que su
        etiqueta arrancara bajo la de la rama de arriba. Esa alineación se paga siempre, en cada hoja
        de cada árbol, tenga o no ramas al lado. Ahora la plantilla de una hoja es una sola pista, la
        etiqueta, y arranca en su propia sangría. En un árbol mixto las hojas y las ramas dejan de
        compartir la misma x de etiqueta, que es lo honesto: una hoja ya no finge tener un control que
        no tiene.
    en:
      title: A leaf stops reserving the chevron column it never draws
      body: >-
        A leaf has no disclosure, so the empty column it used to carry existed only so its label
        started under the branch label above it. That alignment was paid for on every leaf, in every
        tree, whether or not the tree even had a branch beside it. A leaf's template is now a single
        track, the label, starting at its own indent. In a mixed tree the leaves and branches no
        longer share a label x, which is the honest read: a leaf no longer pretends to a control it
        does not have.
  - date: 2026-09-15
    kind: bugfix
    target: branchControl
    es:
      title: El área clicable de una rama ahora llega hasta el borde
      body: >-
        El control de una rama es el único <code>&lt;button&gt;</code> del árbol y su
        <code>&lt;li&gt;</code> es una caja de bloque, así que se encogía al ancho de su etiqueta
        mientras cada hoja, que sí es ítem de grilla, ocupaba toda su pista. Medido en un riel de
        207px: hojas de 155px contra ramas de 114px, o sea 40px de fila que se ven clicables y no
        lo son, con la capa de estado pintando un muñón en vez de la fila. La rama ahora ocupa el
        100% del ancho disponible: la pista de la etiqueta crece y nada más se mueve.
    en:
      title: A branch row is now clickable end to end
      body: >-
        A branch control is the tree's only <code>&lt;button&gt;</code> and its <code>&lt;li&gt;</code>
        is a block box, so it shrank to its own label while every leaf, which is a grid item, filled
        its track. Measured in a 207px rail: 155px leaves against 114px branches, which is 40px of row
        that looks clickable and is not, with the state layer washing a stub instead of the row. The
        branch now takes the full available width: its label track grows and nothing else moves.
  - date: 2026-09-16
    kind: bugfix
    es:
      title: Los ids de TreeView son únicos en todo el árbol y los eventos quedan publicados
      body: >-
        El validador rechaza un <code>id</code> repetido en otra profundidad: la máquina direcciona
        los nodos por id en todo el árbol, así que expandir uno abría el otro. El contrato publica
        <code>sk-selection-change</code> y <code>sk-expanded-change</code>, y React ahora también
        los despacha en la raíz. La guía de uso manda a Treegrid lo que tiene columnas.
    en:
      title: TreeView ids are unique across the whole tree, and the events are published
      body: >-
        The validator rejects an <code>id</code> reused at another depth: the machine addresses nodes
        by id across the whole tree, so expanding one opened the other. The contract publishes
        <code>sk-selection-change</code> and <code>sk-expanded-change</code>, and React now
        dispatches them on the root too. Usage guidance sends hierarchies with columns to Treegrid.
  - date: 2026-09-16
    kind: bugfix
    es:
      title: El validador comprueba que los valores iniciales nombren una entrada que existe
      body: >-
        <code>defaultExpandedValue</code> y <code>defaultSelectedValue</code> ahora declara que nombra entradas de <code>items</code> por su
        <code>id</code>. Un árbol que apunta a una entrada inexistente deja de validar
        (<code>unknown-key</code>) en vez de renderizar sin nada seleccionado ni decir por qué. El
        markup y los bindings no cambian.
    en:
      title: The validator checks that the initial values name entries that exist
      body: >-
        <code>defaultExpandedValue</code> and <code>defaultSelectedValue</code> now declares that it names entries of <code>items</code> by their
        <code>id</code>. A tree pointing at an entry that does not exist stops validating
        (<code>unknown-key</code>) instead of rendering with nothing selected and no reason given.
        Markup and bindings are unchanged.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Cada evento lleva el nombre de su familia
      body: >-
        <code>sk-selection-change</code> → <code>sk:treeviewselectionchange</code>, <code>sk-expanded-change</code> → <code>sk:treeviewexpandedchange</code>. Un mismo nombre ya no lo despachan varias familias: un listener sobre una raíz deja
        de recibir los eventos de un componente distinto anidado adentro.
    en:
      title: Every event carries its family in its name
      body: >-
        <code>sk-selection-change</code> → <code>sk:treeviewselectionchange</code>, <code>sk-expanded-change</code> → <code>sk:treeviewexpandedchange</code>. No two families dispatch the same name any more: a listener on a root stops receiving
        the events of a different component nested inside it.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Un nodo deshabilitado se escribe data-disabled
      body: >-
        El markup compuesto a mano marca un nodo deshabilitado con <code>data-disabled</code> y no con
        <code>disabled</code>, un atributo que HTML no define para un <code>&lt;li&gt;</code>. Es el
        mismo atributo que Zag ya escribía y que la hoja ya seleccionaba; el enhancer ahora lee ése.
    en:
      title: A disabled node is written data-disabled
      body: >-
        Authored markup marks a disabled node with <code>data-disabled</code> rather than
        <code>disabled</code>, an attribute HTML does not define for an <code>&lt;li&gt;</code>. It is
        the attribute Zag already wrote and the stylesheet already selected; the enhancer now reads it.
