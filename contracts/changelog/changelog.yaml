# What changed in changelog, in the words its users read. Only appended to, never rewritten.
#
# Each entry is a `title` and a `body` per language: the title is what someone scans to know whether
# they care, the body is why, and whoever is scanning should not have to read the body to work out
# whether it was for them. The title is plain text; the body accepts markup.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "a5b84e79bbf8d964"
entries:
  - date: 2026-10-07
    kind: feature
    target: layout
    es:
      title: Las entradas pueden ser compactas, con layout inline y el badge xs
      body: '<code>layout="inline"</code> pone el tipo, el target y el título en una sola fila y deja el texto debajo: una entrada de dos líneas en vez de tres, con las mismas palabras en el mismo orden.'
    en:
      title: Entries can be compact, with an inline layout and the xs badge
      body: '<code>layout="inline"</code> puts the kind, the target and the headline on one row and leaves the prose under them: a two-line entry instead of three, with the same words in the same order.'
  - date: 2026-10-06
    kind: feature
    target: size
    es:
      title: ChangelogEntry elige el tamaño del badge y el espaciado entre sus líneas
      body: <code>size</code> (<code>sm</code> o <code>md</code>, por defecto <code>md</code>) es el tamaño de la pastilla de <code>kind</code>.
    en:
      title: ChangelogEntry chooses the badge size and the spacing between its lines
      body: <code>size</code> (<code>sm</code> or <code>md</code>, <code>md</code> by default) is the size of the <code>kind</code> pill.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y una hoja de estilos para marcado simple."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a stylesheet for plain markup."
