# Qué cambió en changelog, en las palabras que lee quien lo usa. Sólo se agrega, nunca se reescribe.
#
# Cada entrada es un `title` y un `body` por idioma: el título es lo que alguien escanea para saber
# si le importa, el cuerpo es por qué, y quien escanea no debería tener que leer el cuerpo para
# averiguar si era para él. El título es texto plano; el cuerpo admite markup.
#
# `surface` es la forma del contrato la última vez que alguien la revisó. Si el compilador dice
# que no coincide, algo de lo que un consumidor depende se movió: escribí la entrada y pegá el
# hash nuevo.
surface: "06fed308b1128207"
entries:
  - date: 2026-08-05
    kind: breaking
    target: kind
    es:
      title: Los tipos de cambio se renombraron y ahora cada uno tiene su color
      body: >-
        <code>added</code>, <code>changed</code>, <code>fixed</code> y <code>removed</code> ya no
        validan. El vocabulario pasa a ser <code>breaking</code>, <code>feature</code>,
        <code>bugfix</code>, <code>rework</code> y <code>chore</code>: los anteriores nombraban lo
        que le pasó al ARCHIVO, éstos nombran lo que le pasa a quien consume el paquete, que es el
        único lector que tiene un changelog. <code>removed</code> se escribe
        <code>breaking</code>, porque una opción publicada que deja de existir es algo sobre lo que
        hay que actuar, y ése es el significado del badge rojo. Además cada tipo lleva ahora su
        propio tono —<code>danger</code>, <code>success</code>, <code>accent</code>,
        <code>warning</code>, <code>neutral</code>, en ese orden— derivado igual que antes desde la
        opción, así que la columna de badges contesta "¿algo de esto es para mí?" antes de que se
        lea una palabra. El default pasa de <code>changed</code> a <code>chore</code>: una entrada a
        la que se le olvidó el tipo debe leerse como que no es para vos, nunca como una novedad que
        nadie anunció.
    en:
      title: The change kinds were renamed, and each one now carries its own colour
      body: >-
        <code>added</code>, <code>changed</code>, <code>fixed</code> and <code>removed</code> no
        longer validate. The vocabulary is now <code>breaking</code>, <code>feature</code>,
        <code>bugfix</code>, <code>rework</code> and <code>chore</code>: the old words named what
        happened to the FILE, these name what happens to the consumer, which is the only reader a
        changelog has. <code>removed</code> is written as <code>breaking</code>, because a published
        option that stops existing is a thing someone has to act on, and that is what the red badge
        means. Every kind also wears its own tone now —<code>danger</code>, <code>success</code>,
        <code>accent</code>, <code>warning</code>, <code>neutral</code>, in that order— derived from
        the option exactly as before, so the badge column answers "is any of this for me" before a
        word of it is read. The default moves from <code>changed</code> to <code>chore</code>: an
        entry whose kind was forgotten should read as not being addressed to you, never as a feature
        nobody announced.
  - date: 2026-08-05
    kind: breaking
    target: title
    es:
      title: Una entrada es un titular y una explicación
      body: >-
        <code>ChangelogEntry</code> pide un slot <code>title</code> nuevo, y <code>children</code>
        pasa a ser la explicación. Quien escanea un release quiere la lista de lo que se movió; quien
        se detuvo en una línea quiere el razonamiento. En un solo bloque, el primero tenía que leer
        el párrafo del segundo para averiguar si era el primero. Del lado de los datos, los campos
        <code>es</code> y <code>en</code> de cada YAML pasan de ser un texto a
        <code>{title, body}</code>.
    en:
      title: An entry is a headline and an explanation
      body: >-
        <code>ChangelogEntry</code> takes a new <code>title</code> slot, and <code>children</code>
        becomes the explanation. A reader scanning a release wants the list of what moved; a reader
        who stopped on one line wants the reasoning. As one blob, the first had to read the second
        one's paragraph to find out which they were. On the data side, each YAML's <code>es</code>
        and <code>en</code> go from a string to <code>{title, body}</code>.
  - date: 2026-08-05
    kind: rework
    target: kind
    es:
      title: El tipo de cambio se dibuja como Badge
      body: >-
        La parte <code>kind</code> compone <code>sk-badge</code> en vez de volver a dibujar una
        píldora acá, igual que Avatar compone <code>sk-image-frame</code>. El tono se DERIVA de la
        opción <code>kind</code> con <code>attrsWhen</code>, nunca se pasa: no hay forma de archivar
        un cambio <code>breaking</code> bajo un badge tranquilo. Sigue siendo un tono solo,
        <code>danger</code> para <code>breaking</code> y <code>neutral</code> para todo lo demás,
        porque un color por tipo hace una página verde que se lee como reporte de logros.
    en:
      title: The kind is drawn as a Badge
      body: >-
        The <code>kind</code> part composes <code>sk-badge</code> instead of redrawing a pill here,
        the same way Avatar composes <code>sk-image-frame</code>. Its tone is DERIVED from the
        <code>kind</code> option through <code>attrsWhen</code>, never passed: there is no way to
        file a <code>breaking</code> change under a calm badge. It is still one tone,
        <code>danger</code> for <code>breaking</code> and <code>neutral</code> for everything else,
        because a colour per kind makes a page of green that reads as a success report.
  - date: 2026-08-05
    kind: rework
    es:
      title: Las entradas se indentan bajo su versión y la medida se corta en 85ch
      body: >-
        Los cambios se escalonan un paso bajo el release al que pertenecen, así que un historial se
        lee como grupos y no como una columna sola. El componente además se limita a
        <code>85ch</code> (<code>--sk-changelog-measure</code>) y declara
        <code>word-break: normal</code>, porque un sitio que corta URLs largas heredaba acá y partía
        palabras comunes a la mitad. Sólo el código puede partirse, que es lo único sin espacios
        donde cortar.
    en:
      title: Entries indent under their version, and the measure caps at 85ch
      body: >-
        Changes step in one level under the release they belong to, so a history reads as groups
        rather than one undifferentiated column. The component also caps itself at <code>85ch</code>
        (<code>--sk-changelog-measure</code>) and declares <code>word-break: normal</code>, because a
        site that breaks long URLs inherited into here and split ordinary words mid-letter. Only code
        may break, being the one thing with no spaces to break at.
  - date: 2026-08-05
    kind: breaking
    target: ChangelogRelease
    es:
      title: El historial se agrupa por versión
      body: >-
        Entre <code>Changelog</code> y sus entradas hay una firma nueva,
        <code>ChangelogRelease</code>, y las entradas ahora cuelgan de ella. Quien lee un changelog
        viene a saber si ya tiene el cambio que está leyendo, y eso lo contesta una versión, no una
        fecha. Un árbol que ponía <code>ChangelogEntry</code> directo bajo <code>Changelog</code> ya
        no valida: envolvelo en un release.
    en:
      title: The history groups by version
      body: >-
        There is a new signature between <code>Changelog</code> and its entries,
        <code>ChangelogRelease</code>, and entries now hang off it. Someone reading a changelog came
        to find out whether they already have the change they are reading about, and a version
        answers that where a date cannot. A tree that put <code>ChangelogEntry</code> straight under
        <code>Changelog</code> no longer validates: wrap it in a release.
  - date: 2026-08-05
    kind: breaking
    target: date
    es:
      title: La entrada ya no lleva fecha
      body: >-
        La opción <code>date</code> y su slot se mudaron al release, que es donde la fecha significa
        algo: el día en que se publicó esa versión. Repetirla en cada cambio era escribir la misma
        fecha cuatro veces al costado de una página.
    en:
      title: An entry no longer carries a date
      body: >-
        The <code>date</code> option and its slot moved up to the release, which is where a date
        means something: the day that version shipped. Repeating it on every change was writing the
        same date four times down the side of a page.
  - date: 2026-08-05
    kind: feature
    target: ChangelogRelease
    es:
      title: Una versión sin fecha es una que todavía no salió
      body: >-
        Eso es todo lo que el contrato dice del trabajo sin publicar: no hay opción
        <code>status</code> ni segundo vocabulario, así que no hay forma de escribir un release que
        declare fecha de salida y a la vez la niegue. La plantilla deriva
        <code>data-unreleased</code> de esa ausencia para que el punto del riel se dibuje hueco. Del
        lado de quien escribe, la convención es nombrar la versión <code>0.1.0-dev</code>: el número
        que va a llevar cuando salga, marcado como que no salió.
    en:
      title: A version with no date is one that has not shipped
      body: >-
        That is everything the contract says about unpublished work: no <code>status</code> option,
        no second vocabulary, so there is no way to write a release that claims a ship date and
        denies it. The template derives <code>data-unreleased</code> from the absence so the rail's
        dot draws hollow. On the authoring side the convention is to name the version
        <code>0.1.0-dev</code>: the number it will carry when it ships, marked as not having got
        there.
  - date: 2026-08-05
    kind: rework
    target: entry
    es:
      title: La entrada dejó de ser una grilla
      body: >-
        El punto del riel subió al release, así que adentro no queda nada que alinear. Se fue la
        parte <code>meta</code>, que existía sólo para que dos hijos compartieran una celda, y con
        ella las máscaras y el corrimiento óptico por entrada.
    en:
      title: The entry stopped being a grid
      body: >-
        The rail's dot moved up to the release, so there is nothing left inside to align. The
        <code>meta</code> part is gone, which existed only so two children could share one cell, and
        the per-entry masks and optical shift went with it.
  - date: 2026-08-04
    kind: breaking
    es:
      title: Se fue la parte body
      body: >-
        La ENTRADA era la grilla: el punto en la primera columna, la meta y la prosa apiladas en la
        segunda. El envoltorio existía sólo para que una grilla de dos columnas tuviera dos hijos, y
        con las dos filas puestas por nombre no hacía falta. Si lo estabas usando para estilar, el
        ancla es <code>sk-changelog__entry</code>.
    en:
      title: The body part is gone
      body: >-
        The ENTRY was the grid: the dot in the first column, the meta and the prose stacked in the
        second. The wrapper existed only so a two-column grid would have two children, and with both
        rows placed by name it did not. If you were styling against it, the hook is
        <code>sk-changelog__entry</code>.
  - date: 2026-08-04
    kind: feature
    target: kind
    es:
      title: El tipo de cambio son dos campos
      body: >-
        La opción es lo que la tabla de referencia puede marcar, y el slot es la PALABRA, así que el
        tipo nunca queda sólo en el color. Es el mismo corte que hace <code>Steps</code> entre su
        opción <code>status</code> y su slot <code>marker</code>, por la misma razón.
    en:
      title: The kind is two fields
      body: >-
        The option is what a reference table can badge, and the slot is the WORD, so the kind is
        never colour alone. It is the same split <code>Steps</code> makes between its
        <code>status</code> option and its <code>marker</code> slot, for the same reason.
  - date: 2026-08-04
    kind: feature
    target: date
    es:
      title: La fecha también son dos
      body: >-
        La opción <code>date</code> es el día legible por una máquina, <code>YYYY-MM-DD</code>, y
        aterriza en <code>&lt;time datetime&gt;</code>; el texto visible es un slot, porque una fecha
        formateada es copy en un idioma y Core no envía ninguno. El binding formatea con
        <code>Intl</code> y llena el slot.
    en:
      title: The date is two as well
      body: >-
        The <code>date</code> option is the machine-readable day, <code>YYYY-MM-DD</code>, and it
        lands on <code>&lt;time datetime&gt;</code>; the visible one is a slot, because a formatted
        date is copy in a language and Core ships none. A binding formats it with <code>Intl</code>
        and fills the slot.
  - date: 2026-08-04
    kind: feature
    es:
      title: Primera publicación del contrato
      body: >-
        <code>Changelog</code> y <code>ChangelogEntry</code>, un historial con riel. No es un
        <code>ProcessList</code> con otra pintura: ése numera sus marcadores con un
        <code>counter()</code> de CSS, así que una lista con lo más nuevo arriba se numeraría al
        revés del tiempo. Tampoco es un <code>Steps</code>, cuyo conector dice cuánto trabajo queda
        atrás, que de un cambio ya publicado no es una afirmación que nadie pueda hacer.
    en:
      title: First published contract
      body: >-
        <code>Changelog</code> and <code>ChangelogEntry</code>, a history on a rail. It is not a
        repainted <code>ProcessList</code>: that one numbers its markers with a CSS
        <code>counter()</code>, so a newest-first list would number itself backwards through time.
        Nor is it <code>Steps</code>, whose connector says how much work is behind the reader, which
        of a shipped change is not a claim anyone can make.
