# What changed in state-button, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "9d1cbd0dabf84fdc"
entries:
  - date: 2026-09-26
    kind: feature
    es:
      title: StateButton reenvía data-appearance, igual que variant y size
      body: "La hoja de Button ya pinta tactile, brutalist y frosted en el anfitrión; ahora data-appearance se reenvía igual que data-variant y data-size, sin declararse como option propia."
    en:
      title: StateButton forwards data-appearance, like variant and size
      body: "Button's own sheet already paints tactile, brutalist and frosted on the host; data-appearance now forwards the same way data-variant and data-size do, without being its own declared option."
  - date: 2026-10-02
    kind: feature
    es:
      title: Los nombres de icono incluyen el rol mask
      body: La lista de roles de icono que acepta <code>StateButton</code> crece con <code>mask</code> (el símbolo de un carácter oculto). No cambia nada de su comportamiento.
    en:
      title: Icon names include the mask role
      body: The list of icon roles <code>StateButton</code> accepts grows with <code>mask</code> (the symbol of a hidden character). Nothing about its behavior changes.
  - date: 2026-10-09
    kind: feature
    es:
      title: Los nombres de icono incluyen los roles de reproductor
      body: La lista de roles de icono que acepta <code>StateButton</code> crece con <code>play</code>, <code>pause</code>, <code>replay</code>, <code>volume</code>, <code>volume-muted</code>, <code>captions</code>, <code>fullscreen</code> y <code>fullscreen-exit</code>.
    en:
      title: Icon names include the player roles
      body: The list of icon roles <code>StateButton</code> accepts grows with <code>play</code>, <code>pause</code>, <code>replay</code>, <code>volume</code>, <code>volume-muted</code>, <code>captions</code>, <code>fullscreen</code> and <code>fullscreen-exit</code>.
  - date: 2026-10-09
    kind: feature
    es:
      title: Los nombres de icono incluyen la pista anterior y la siguiente
      body: La lista de roles de icono que acepta <code>StateButton</code> crece con <code>track-previous</code> y <code>track-next</code>. No cambia su comportamiento.
    en:
      title: Icon names include the previous and next track
      body: The list of icon roles <code>StateButton</code> accepts grows with <code>track-previous</code> and <code>track-next</code>. Nothing about its behavior changes.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y una hoja de estilos para marcado simple."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a stylesheet for plain markup."
