# What changed in state-button, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "4e0531a1258acc6f"
entries:
  - date: 2026-09-20
    kind: bugfix
    es:
      title: Hooks y parte raíz alineados con state-button
      body: >-
        La hoja usa <code>.sk-state-button</code> y hooks <code>--sk-state-button-*</code>, como
        el contrato publica; antes apuntaban al id antiguo <code>icon-state-button</code>.
    en:
      title: Hooks and root part aligned with state-button
      body: >-
        The stylesheet uses <code>.sk-state-button</code> and <code>--sk-state-button-*</code>
        hooks, matching the contract; it previously pointed at the old <code>icon-state-button</code> id.
  - date: 2026-09-17
    kind: feature
    es:
      title: IconStateButton declara compose de Button e Icon
      body: >-
        <code>compose</code> documenta el host vía <code>also: sk-button</code> y faces vía Icon (<code>systemOwned</code>).
    en:
      title: IconStateButton declares compose of Button and Icon
      body: >-
        <code>compose</code> documents the host via <code>also: sk-button</code> and faces via Icon (<code>systemOwned</code>).
  - date: 2026-09-17
    kind: feature
    es:
      title: IconStateButton declara forward para look de Button
      body: >-
        Publica <code>forward</code> con <code>data-variant</code>/<code>data-size</code> (attrs
        de Button vía <code>also</code>), más <code>id</code>/<code>name</code>/<code>form</code>
        y <code>aria-*</code>. Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: IconStateButton declares forward for Button look attrs
      body: >-
        Publishes <code>forward</code> with <code>data-variant</code>/<code>data-size</code>
        (Button attrs via <code>also</code>), plus <code>id</code>/<code>name</code>/<code>form</code>
        and <code>aria-*</code>. An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: bugfix
    es:
      title: IconStateButton siempre es icon-only y exige nombre accesible
      body: >-
        El template escribe <code>data-icon-only</code> de fábrica (antes el árbol emitía un
        <code>sk-button</code> con padding de botón con texto) y el contrato exige
        <code>aria-label</code> o <code>aria-labelledby</code>: las caras son glifos, nunca texto
        visible. React escribe el mismo atributo. <code>variant</code>/<code>size</code> siguen
        siendo los de Button vía attrs.
    en:
      title: IconStateButton is always icon-only and requires an accessible name
      body: >-
        The template now writes <code>data-icon-only</code> by construction (trees used to emit an
        <code>sk-button</code> with text-button padding) and the contract requires
        <code>aria-label</code> or <code>aria-labelledby</code>: faces are glyphs, never visible
        text. React writes the same attribute. <code>variant</code>/<code>size</code> stay Button's
        via attrs.
  - date: 2026-09-14
    kind: feature
    es:
      title: Alcanza el rol code, que el vocabulario acaba de sumar
      body: >-
        Este control nombra sus iconos con el vocabulario estable, así que un rol nuevo ahí llega aquí
        sin que este contrato cambie de forma: `code` ya se puede pedir. La superficie se movió porque
        el conjunto de nombres que acepta es parte de lo que un consumidor puede depender, no porque
        haya cambiado nada de cómo se usa.
    en:
      title: Reaches the code role the vocabulary just gained
      body: >-
        This control names its icons with the stable vocabulary, so a new role there arrives here
        without this contract changing shape: `code` can now be asked for. The surface moved because
        the set of names it accepts is part of what a consumer can depend on, not because anything
        about how it is used changed.
  - date: 2026-09-05
    kind: feature
    es:
      title: Alcanza los dos roles nuevos del vocabulario
      body: >-
        Sin cambios propios. Las caras de este control se tipan contra `StableIconName`, así que
        `vote-up` y `vote-down` (ver el changelog de `icon`) son dos valores más que una cara puede
        tomar. La superficie se movió porque el enum del que deriva creció.
    en:
      title: Reaches the vocabulary's two new roles
      body: >-
        No change of its own. This control's faces are typed against `StableIconName`, so `vote-up`
        and `vote-down` (see `icon`'s own changelog) are two more values a face can take. The surface
        moved because the enum it derives from grew.
  - date: 2026-09-02
    kind: feature
    target: icon
    es:
      title: IconStateButton acepta el rol language
      body: >-
        El enum de <code>icon</code> incluye <code>language</code>, el mismo rol que acaba de
        entrar al vocabulario estable.
    en:
      title: IconStateButton accepts the language role
      body: >-
        The <code>icon</code> enum includes <code>language</code>, the same role that just
        joined the stable vocabulary.
  - date: 2026-08-21
    kind: feature
    target: icon
    es:
      title: IconStateButton acepta el rol zoom-out
      body: >-
        El enum de <code>icon</code> incluye <code>zoom-out</code>, el mismo rol que acaba de
        entrar al vocabulario estable.
    en:
      title: IconStateButton accepts the zoom-out role
      body: >-
        The <code>icon</code> enum includes <code>zoom-out</code>, the same role that just
        joined the stable vocabulary.
  - date: 2026-08-19
    kind: feature
    es:
      title: IconStateButton se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>IconStateButton</code>: un botón ícono cuyos estados los declara
        quien lo usa (un <code>faces</code> por instancia, cada uno con su propio nombre e ícono), no
        el contrato. No decide cuándo cambia el estado activo. Quien lo compone escribe ese
        comportamiento (copiar al portapapeles, ciclar un modo de color, lo que sea) y lo aplica
        escribiendo <code>current</code>. Reemplaza a <code>CopyButton</code> y
        <code>ThemeToggle</code>, ambos retirados del catálogo.
    en:
      title: IconStateButton is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>IconStateButton</code>: an icon button whose states are
        declared by whoever uses it (one <code>faces</code> entry per instance, each with its own
        name and icon), not the contract. It does not decide when the active state changes. The
        consumer writes that behavior (copy to clipboard, cycle a color mode, whatever it needs) and
        applies it by writing <code>current</code>. Replaces <code>CopyButton</code> and
        <code>ThemeToggle</code>, both retired from the catalogue.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de state-button quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>8</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: state-button's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>8</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-16
    kind: bugfix
    es:
      title: El validador comprueba que el valor inicial nombre una entrada que existe
      body: >-
        <code>current</code> ahora declara que nombra entradas de <code>faces</code> por su
        <code>name</code>. Un árbol que apunta a una entrada inexistente deja de validar
        (<code>unknown-key</code>) en vez de renderizar sin nada seleccionado ni decir por qué. El
        markup y los bindings no cambian.
    en:
      title: The validator checks that the initial value names an entry that exist
      body: >-
        <code>current</code> now declares that it names entries of <code>faces</code> by their
        <code>name</code>. A tree pointing at an entry that does not exist stops validating
        (<code>unknown-key</code>) instead of rendering with nothing selected and no reason given.
        Markup and bindings are unchanged.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Al menos dos caras, y cada una con su ícono
      body: >-
        Una sola cara no es un botón de estados, y una cara sin <code>icon</code> no mostraba nada al volverse actual.
    en:
      title: At least two faces, each with its icon
      body: >-
        A single face is not a state button, and a face with no <code>icon</code> showed nothing when it became current.
