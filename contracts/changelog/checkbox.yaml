# What changed in checkbox, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "ad014f31de44d33e"
entries:
  - date: 2026-09-17
    kind: feature
    es:
      title: Firmas interactivas declaran forward
      body: >-
        Las firmas host interactivas o de formulario publican <code>forward</code>
        (<code>id</code>/<code>aria-*</code> y attrs de enlace o formulario cuando aplica).
        Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: Interactive signatures declare forward
      body: >-
        Interactive or form host signatures publish <code>forward</code>
        (<code>id</code>/<code>aria-*</code> and link or form attrs where relevant).
        An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: feature
    es:
      title: eventDetails nombra source y trigger
      body: >-
        <code>eventDetails</code> declara <code>source</code> (parte que despacha el CustomEvent) y, cuando es claro, <code>trigger</code> (parte que el usuario activa). Un agente sabe dónde escuchar y qué control provoca el evento.
    en:
      title: eventDetails names source and trigger
      body: >-
        <code>eventDetails</code> declares <code>source</code> (part that dispatches the CustomEvent) and, when clear, <code>trigger</code> (part the user activates). An agent knows where to listen and which control causes the event.
  - date: 2026-09-17
    kind: feature
    target: Checkbox
    es:
      title: Checkbox declara forward para form e id
      body: >-
        Publica <code>forward</code> con <code>id</code>/<code>form</code>/<code>aria-*</code> en el host nativo. Un attr fuera de la lista es <code>unknown-attr</code>.
    en:
      title: Checkbox declares forward for form and id
      body: >-
        Publishes <code>forward</code> with <code>id</code>/<code>form</code>/<code>aria-*</code> on the native host. An attr outside the list is <code>unknown-attr</code>.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-08-13
    kind: feature
    es:
      title: CheckboxGroup, el padre de tres estados, entra al contrato
      body: >-
        La segunda signature: un grupo con un padre que marca y desmarca a todos, y que muestra
        <code>indeterminate</code> cuando sus hijos no coinciden. Hasta ahora eso era un
        <code>&lt;script&gt;</code> copiado en cada página que lo necesitaba; ahora es
        <code>CheckboxGroup</code> con enhancer propio (<code>data-sk-checkbox-group</code>) y
        componente de React. El estado del padre es <strong>derivado</strong>: no acepta
        <code>checked</code>, y cuáles hijos arrancan marcados es dato de cada entrada
        (<code>defaultChecked</code>), no del grupo. Un hijo <code>disabled</code> no cuenta como
        voto, y un <code>reset</code> del formulario vuelve a derivar. Emite
        <code>sk:checkboxgroupvaluechange</code> con <code>{ value, checked }</code>. Opciones:
        <code>name</code> (obligatoria), <code>orientation</code>, <code>disabled</code>,
        <code>required</code>. Clases nuevas: <code>sk-checkbox-group</code> y
        <code>sk-checkbox-group__items</code>.
    en:
      title: CheckboxGroup, the tri-state parent, joins the contract
      body: >-
        The second signature: a group with a parent that checks and unchecks them all, and shows
        <code>indeterminate</code> when its children disagree. Until now that was a
        <code>&lt;script&gt;</code> copied into every page that needed it; it is now
        <code>CheckboxGroup</code>, with its own enhancer (<code>data-sk-checkbox-group</code>) and
        React component. The parent's state is <strong>derived</strong>: it takes no
        <code>checked</code>, and which children start checked is per-entry data
        (<code>defaultChecked</code>), not the group's. A <code>disabled</code> child is not a vote,
        and a form <code>reset</code> re-derives. It emits
        <code>sk:checkboxgroupvaluechange</code> with <code>{ value, checked }</code>. Options:
        <code>name</code> (required), <code>orientation</code>, <code>disabled</code>,
        <code>required</code>. New classes: <code>sk-checkbox-group</code> and
        <code>sk-checkbox-group__items</code>.
  - date: 2026-08-11
    kind: feature
    es:
      title: Checkbox se publica como contrato, con una signature
      body: >-
        Entra al catálogo con <code>Checkbox</code>: los dos bindings lo realizan, y la referencia de
        esta página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el
        markup está completo por sí solo, así que las dos bindings son el mismo markup dos veces.
        Opciones: <code>name</code>, <code>value</code>, <code>checked</code>,
        <code>defaultChecked</code>, <code>defaultIndeterminate</code>, <code>disabled</code>,
        <code>required</code>, <code>orientation</code>. La hoja es
        <code>components/checkbox.css</code>.
    en:
      title: Checkbox is published as a contract, with one signature
      body: >-
        It joins the catalogue with <code>Checkbox</code>: both bindings realize it, and this page's
        reference is rendered from the compiled contract rather than from prose written beside it. There
        is no enhancer: the markup is complete on its own, so both bindings are the same markup twice.
        Options: <code>name</code>, <code>value</code>, <code>checked</code>,
        <code>defaultChecked</code>, <code>defaultIndeterminate</code>, <code>disabled</code>,
        <code>required</code>, <code>orientation</code>. Its stylesheet is
        <code>components/checkbox.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de checkbox quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>17</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: checkbox's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>17</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-12
    kind: feature
    es:
      title: El contrato declara las otras hojas donde vive su estilo
      body: >-
        Este componente se pinta desde mas de una hoja, asi que el contrato ahora las nombra con
        <code>hookSheets</code> y su lista de <code>hooks</code> cubre todas. Antes solo se podia
        reconciliar contra la hoja de <code>css</code>, asi que los hooks de las otras eran
        superficie publica que nadie documentaba ni verificaba. No cambia ningun estilo: cambia que
        ahora estan declarados y el compilador los chequea.
    en:
      title: The contract declares the other stylesheets its styling lives in
      body: >-
        This component paints from more than one stylesheet, so the contract now names them with
        <code>hookSheets</code> and its <code>hooks</code> list covers all of them. Before, only the
        sheet <code>css</code> names could be reconciled, so the hooks in the others were public
        surface nobody documented and nothing checked. No styling changes: what changes is that they
        are declared now, and the compiler checks them.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Checkbox publica sus propios hooks y arranca con defaultChecked
      body: >-
        Publicaba las partes compartidas de selección y dieciséis hooks de Radio a través de las hojas de radio-group y switch; ahora publica sus partes y los <code>--sk-checkbox-*</code> de su hoja. La opción <code>checked</code> se va: en React es controlada y un árbol no tiene handler, así que una casilla marcada desde un árbol no se podía desmarcar. Queda <code>defaultChecked</code>.
    en:
      title: Checkbox publishes its own hooks and starts with defaultChecked
      body: >-
        It published the shared selection parts and sixteen Radio hooks through the radio-group and switch sheets; it now publishes its own parts and the <code>--sk-checkbox-*</code> hooks of its sheet. The <code>checked</code> option goes: React treats it as controlled and a tree has no handler, so a box checked from a tree could not be unchecked. <code>defaultChecked</code> remains.
