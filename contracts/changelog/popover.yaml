# What changed in popover, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "e729b1c3e7f8900d"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: Popover se publica como contrato, con 2 signatures
      body: >-
        Entra al catálogo con <code>Popover</code>, <code>Popover.bare</code>: los dos bindings lo
        realizan, y la referencia de esta página sale del contrato compilado en vez de prosa escrita al
        lado. No tiene enhancer: el markup está completo por sí solo, así que las dos bindings son el
        mismo markup dos veces. Opciones: <code>panelId</code>, <code>placement</code>,
        <code>arrow</code>, <code>bare</code>, <code>closeLabel</code>. La hoja es
        <code>components/popover.css</code>.
    en:
      title: Popover is published as a contract, with 2 signatures
      body: >-
        It joins the catalogue with <code>Popover</code>, <code>Popover.bare</code>: both bindings
        realize it, and this page's reference is rendered from the compiled contract rather than from
        prose written beside it. There is no enhancer: the markup is complete on its own, so both
        bindings are the same markup twice. Options: <code>panelId</code>, <code>placement</code>,
        <code>arrow</code>, <code>bare</code>, <code>closeLabel</code>. Its stylesheet is
        <code>components/popover.css</code>.
  - date: 2026-09-04
    kind: feature
    es:
      title: El trigger de Popover acepta variante, tamaño y forma de icono
      body: >-
        Se suman <code>triggerVariant</code>, <code>triggerSize</code> y
        <code>triggerIconOnly</code>, las mismas tres opciones que <code>Menu</code> ya publica para
        su propio trigger y que escriben los mismos atributos que <code>variant</code>,
        <code>size</code> e <code>iconOnly</code> de <code>Button</code>. Sirven para un Popover
        compuesto dentro de la fila de otro control: sin ellas el trigger salía con la variante y el
        alto por defecto de Button, y al lado de una barra de botones de icono chicos se leía como
        una caja suelta. El binding de React agrega además <code>triggerClassName</code>, igual que
        <code>Menu</code>.
    en:
      title: Popover's trigger takes a variant, a size and the icon-only shape
      body: >-
        Adds <code>triggerVariant</code>, <code>triggerSize</code> and
        <code>triggerIconOnly</code> - the same three options <code>Menu</code> already publishes
        for its own trigger, writing the same attributes <code>Button</code>'s own
        <code>variant</code>, <code>size</code> and <code>iconOnly</code> do. They are for a Popover
        composed into another control's row: without them the trigger drew at Button's default
        variant and control height, and next to a bar of small icon buttons it read as a stray box.
        The React binding also takes <code>triggerClassName</code>, the same as <code>Menu</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de popover quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>10</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: popover's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>10</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
