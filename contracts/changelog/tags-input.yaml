# What changed in tags-input, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "8779fcf59471c0ec"
entries:
  - date: 2026-10-25
    kind: breaking
    target: appearance
    es:
      title: "Cada apariencia tiene su propia hoja"
      body: "Las reglas de `brutalist`, `frosted` pasan de tags-input.css a tags-input.brutalist.css, tags-input.frosted.css. Importa la hoja del valor que uses; sin ella, ese valor no recibe su pintura. Los hooks siguen declarados en tags-input.css."
    en:
      title: "Each appearance has its own stylesheet"
      body: "The rules for `brutalist`, `frosted` move from tags-input.css to tags-input.brutalist.css, tags-input.frosted.css. Import the sheet for the value you use; without it, that value does not get its paint. The hooks are still declared in tags-input.css."
  - date: 2026-10-19
    kind: feature
    es:
      title: Un botón para borrar todos los tags de una vez
      body: "El mismo botón, en el mismo lugar y con la misma marca que el de Combobox: aparece solo cuando hay algo que borrar y queda fuera del área que envuelve a los tags y la entrada, para no empujarse a su propia línea cuando esa área crece."
    en:
      title: A button that clears every tag at once
      body: "The same button, in the same spot and with the same markup Combobox's own clear is: it shows only when there is something to clear, and sits outside the area the tags and the entry wrap inside, so it never gets pushed onto its own line as that area grows."
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: "Se publica por primera vez, con su contrato, un binding de React y un montaje en Vanilla."
    en:
      title: First release
      body: "Published for the first time, with its contract, a React binding and a Vanilla mount."
