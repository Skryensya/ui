surface: "eba257019376cb6c"
entries:
  - date: 2026-10-06
    kind: bugfix
    target: ListItem
    es:
      title: Las filas con varios datos al final ya no aplastan el título
      body: El contenido de la fila parte de base 0 con un piso de <code>min(8rem, 40%)</code> y el slot <code>trailing</code> toma su ancho natural y envuelve alineado a la derecha, en vez de montarse sobre el título.
    en:
      title: Rows with several things at the end no longer crush the title
      body: The row's content starts from basis 0 with a floor of <code>min(8rem, 40%)</code> and the <code>trailing</code> slot takes its natural width and wraps right-aligned, instead of running over the title.
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: Organiza elementos relacionados en filas claras y escaneables.
    en:
      title: First release
      body: Organizes related items into clear, scannable rows.
