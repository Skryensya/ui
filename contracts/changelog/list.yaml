# What changed in list, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "d13fb015e68f07e2"
entries:
  - date: 2026-08-11
    kind: feature
    es:
      title: List se publica como contrato, con 5 signatures
      body: >-
        Entra al catálogo con <code>List</code>, <code>OrderedList</code>, <code>ListItemPlain</code>,
        <code>ListItem</code>, <code>ListItemLink</code>: los dos bindings lo realizan, y la referencia
        de esta página sale del contrato compilado en vez de prosa escrita al lado. No tiene enhancer:
        el markup está completo por sí solo, así que las dos bindings son el mismo markup dos veces.
        Opciones: <code>density</code>, <code>dividers</code>, <code>href</code>, <code>disabled</code>.
        La hoja es <code>components/list.css</code>.
    en:
      title: List is published as a contract, with 5 signatures
      body: >-
        It joins the catalogue with <code>List</code>, <code>OrderedList</code>,
        <code>ListItemPlain</code>, <code>ListItem</code>, <code>ListItemLink</code>: both bindings
        realize it, and this page's reference is rendered from the compiled contract rather than from
        prose written beside it. There is no enhancer: the markup is complete on its own, so both
        bindings are the same markup twice. Options: <code>density</code>, <code>dividers</code>,
        <code>href</code>, <code>disabled</code>. Its stylesheet is <code>components/list.css</code>.

  - date: 2026-09-09
    kind: feature
    es:
      title: dividers deja de ser inalcanzable desde un usage tree
      body: >-
        <code>dividers</code> estaba declarada en el contrato, la hoja la leía y el binding React ya
        la tomaba como prop, pero ninguna signature la exponía y no tenía <code>falseValue</code>:
        un árbol podía pedir <code>dividers: false</code> y el emisor no escribía nada, así que las
        líneas seguían ahí. Ahora <code>List</code> y <code>OrderedList</code> la declaran y
        <code>false</code> emite <code>data-dividers="none"</code>, que es lo que la hoja siempre
        esperó. Nada nuevo se publica: la opción deja de estar escondida.
    en:
      title: dividers stops being unreachable from a usage tree
      body: >-
        <code>dividers</code> was declared on the contract, read by the stylesheet and already taken
        as a prop by the React binding, but no signature exposed it and it had no
        <code>falseValue</code>: a tree could ask for <code>dividers: false</code> and the emitter
        wrote nothing, so the rules stayed on. <code>List</code> and <code>OrderedList</code> declare
        it now, and <code>false</code> emits <code>data-dividers="none"</code>, which is what the
        stylesheet always expected. Nothing new is published; the option stops being hidden.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de list quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>15</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: list's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>15</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
