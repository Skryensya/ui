      body: >-
        <code>Questionnaire</code> and <code>QuestionnaireItem</code> join the catalogue. The machine
        lives in core (<code>createQuestionnaireStore</code>): answers, the active question, skips and
        errors change only through events, and neither binding reads them from the DOM. It reuses
        <code>TileRadioGroup</code>, <code>TileCheckbox</code>, <code>FormField</code> +
