# What changed in questionnaire, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "a70dff49b9ae2b5d"
entries:
  - date: 2026-10-02
    kind: feature
    target: text
    es:
      title: Una pregunta que solo pide texto libre es un textarea
      body: "Si el texto libre es lo único que pide una pregunta (sin <code>choices</code>, sin <code>control</code> y sin <code>textType</code>), ahora es un textarea de tres filas en vez de una línea: una pregunta abierta necesita espacio."
    en:
      title: A question that only asks for free text is a textarea
      body: "When free text is all a question asks for (no <code>choices</code>, no <code>control</code> and no <code>textType</code>), it is now a three-row textarea instead of one line: an open question needs room."
  - date: 2026-10-01
    kind: feature
    es:
      title: Primera versión
      body: Pregunta de a una, valida antes de avanzar y muestra el progreso.
    en:
      title: First release
      body: Asks one question at a time, validates before moving on and shows progress.
