# What changed in password-input, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "26129355d8452478"
entries:
  - date: 2026-09-25
    kind: feature
    es:
      title: PasswordInput, un campo de contraseña con botón para mostrarla
      body: >-
        Nuevo contrato <code>password-input</code> sobre <code>@zag-js/password-input</code>, la misma
        máquina en las dos capas. El botón alterna entre ocultar y mostrar, cambia su nombre accesible
        (<code>showLabel</code>/<code>hideLabel</code>) y la contraseña vuelve a ocultarse al enviar o
        reiniciar el formulario. <code>autoComplete</code> distingue entre entrar
        (<code>current-password</code>) y crear una (<code>new-password</code>). A diferencia de Zag, el
        botón se alcanza con Tab y se activa con Enter o Espacio.
    en:
      title: PasswordInput, a password field with a button to show it
      body: >-
        New <code>password-input</code> contract on <code>@zag-js/password-input</code>, the same machine
        in both bindings. The button toggles between hiding and showing, renames itself
        (<code>showLabel</code>/<code>hideLabel</code>), and the password hides again when the form is
        submitted or reset. <code>autoComplete</code> tells signing in (<code>current-password</code>) from
        creating one (<code>new-password</code>). Unlike Zag's, the button is reachable with Tab and
        activates with Enter or Space.
