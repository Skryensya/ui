# What changed in editor, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "dff2ebacf45b078f"
entries:
  - date: 2026-09-17
    kind: feature
    es:
      title: eventDetails nombra source y trigger
      body: >-
        <code>eventDetails</code> declara <code>source</code> (parte que despacha el CustomEvent) y, cuando es claro, <code>trigger</code> (parte que el usuario activa). Un agente sabe dónde escuchar y qué control provoca el evento.
    en:
      title: eventDetails names source and trigger
      body: >-
        <code>eventDetails</code> declares <code>source</code> (part that dispatches the CustomEvent) and, when clear, <code>trigger</code> (part the user activates). An agent knows where to listen and which control causes the event.
  - date: 2026-09-17
    kind: chore
    es:
      title: El hash de superficie mide la promesa pública
      body: >-
        El hash de superficie ahora proyecta opciones por lista blanca (sin <code>machineInput</code>), incluye <code>eventDetails</code>, y sigue excluyendo la plantilla (<code>also</code>, attrs efímeros). Este contrato no cambió su API; sólo cambió lo que el hash mide.
    en:
      title: Surface hash measures the public promise
      body: >-
        The surface hash now projects options through a whitelist (no <code>machineInput</code>), includes <code>eventDetails</code>, and still excludes the template (<code>also</code>, ephemeral attrs). This contract's API did not change; only what the hash measures did.
  - date: 2026-09-17
    kind: feature
    es:
      title: Editor declara compose y toolbar systemOwned
      body: >-
        <code>compose</code> Button/Icon/Toolbar/Popover/Input; <code>systemOwned</code> lista toolbarButton.
    en:
      title: Editor declares compose and toolbar systemOwned
      body: >-
        <code>compose</code> Button/Icon/Toolbar/Popover/Input; <code>systemOwned</code> lists toolbarButton.
  - date: 2026-09-04
    kind: feature
    es:
      title: Editor se publica como contrato
      body: >-
        Entra al catálogo como <code>Editor</code> (superficie + barra, siempre juntas - no hay
        una versión sin barra). El motor es ProseMirror, empaquetado aparte en
        <code>@skryensya/editor</code> (peer dependency opcional): negrita, cursiva, subrayado,
        enlaces, títulos H1–H3, listas, citas y bloques de código, con deshacer/rehacer. Cada
        cambio entrega <code>html</code>, <code>markdown</code> y el <code>doc</code> nativo de
        ProseMirror a la vez. La barra reusa
        <code>Toolbar</code>/<code>ToolbarGroup</code>/<code>ToolbarSeparator</code> sin cambios;
        la superficie reusa la caja de <code>Input</code>/<code>Textarea</code>
        (<code>sk-input</code>). Opciones: <code>name</code>, <code>defaultValue</code>,
        <code>placeholder</code>, <code>readOnly</code>, <code>disabled</code>,
        <code>autofocus</code>, <code>label</code>, <code>toolbarLabel</code>,
        <code>toolbarCompact</code>. La hoja es <code>components/editor.css</code>.
    en:
      title: Editor is published as a contract
      body: >-
        It joins the catalogue as <code>Editor</code> (bar + surface, always together - there is
        no toolbar-less version). The engine is ProseMirror, packaged separately as
        <code>@skryensya/editor</code> (an optional peer dependency): bold, italic, underline,
        links, H1–H3 headings, lists, blockquotes and code blocks, with undo/redo. Every change
        reports <code>html</code>, <code>markdown</code> and the raw ProseMirror <code>doc</code>
        at once. The bar reuses
        <code>Toolbar</code>/<code>ToolbarGroup</code>/<code>ToolbarSeparator</code> unchanged;
        the surface reuses <code>Input</code>/<code>Textarea</code>'s own box
        (<code>sk-input</code>). Options: <code>name</code>, <code>defaultValue</code>,
        <code>placeholder</code>, <code>readOnly</code>, <code>disabled</code>,
        <code>autofocus</code>, <code>label</code>, <code>toolbarLabel</code>,
        <code>toolbarCompact</code>. Its stylesheet is <code>components/editor.css</code>.
  - date: 2026-09-07
    kind: bugfix
    es:
      title: React acepta toolbarLabel, y el contenido recibe un id en las dos bindings
      body: >-
        <code>toolbarLabel</code> estaba publicado en el contrato desde siempre y el binding de React
        lo ignoraba: escribía "Formato de texto" a mano, así que quien lo configuraba lo obtenía en
        markup escrito a mano y silenciosamente no en React. Ahora es una prop, y su valor por defecto se
        lee del contrato en vez de escribirse dos veces.
        El div de contenido recibe un id también desde el enhancer. Ese id es el que apunta el
        <code>for</code> de una etiqueta de <code>FormField</code>, y es exactamente el que
        <code>useFormFieldControl</code> genera del lado de React; nadie lo generaba cuando el
        enhancer construía el control. A cambio, la raíz dejó de recibir un id que no leía nadie.
    en:
      title: React accepts toolbarLabel, and the content gets an id in both bindings
      body: >-
        <code>toolbarLabel</code> had been published by the contract all along and the React binding
        ignored it, hardcoding "Formato de texto" instead, so a consumer who set it got it in
        authored markup and silently did not in React. It is a prop now, and its default is read from
        the contract rather than written twice.
        The content div also gets an id from the enhancer. That id is what a <code>FormField</code>
        label points its <code>for</code> at, and is exactly what <code>useFormFieldControl</code>
        mints on the React side; nothing was minting it when the enhancer built the control instead.
        In exchange, the root stopped getting an id that nothing ever read.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de editor quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>11</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: editor's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>11</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Cada evento lleva el nombre de su familia
      body: >-
        <code>sk-editor-change</code> → <code>sk:editorchange</code>, <code>sk-editor-ready</code> → <code>sk:editorready</code>. Un mismo nombre ya no lo despachan varias familias: un listener sobre una raíz deja
        de recibir los eventos de un componente distinto anidado adentro. El contrato ahora los declara en <code>events</code>, así que el compilador los publica.
    en:
      title: Every event carries its family in its name
      body: >-
        <code>sk-editor-change</code> → <code>sk:editorchange</code>, <code>sk-editor-ready</code> → <code>sk:editorready</code>. No two families dispatch the same name any more: a listener on a root stops receiving
        the events of a different component nested inside it. The contract now declares them in <code>events</code>, so the compiler publishes them.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Editor declara popover/anchored y el prop autoFocus
      body: >-
        La plantilla ya no inventa un <code>part: toolbar</code> que no existía en
        <code>parts</code> (el contenedor es sólo <code>sk-toolbar</code>).
        <code>hookSheets</code> nombra <code>popover.css</code> y <code>anchored.css</code>
        para el control de enlace; <code>autofocus</code> publica <code>prop: autoFocus</code>.
        React despacha <code>sk:editorchange</code> y <code>sk:editorready</code> como Vanilla.
    en:
      title: Editor declares popover/anchored and the autoFocus prop
      body: >-
        The template no longer invents a <code>part: toolbar</code> that was missing from
        <code>parts</code> (the container is only <code>sk-toolbar</code>).
        <code>hookSheets</code> names <code>popover.css</code> and <code>anchored.css</code>
        for the link control; <code>autofocus</code> publishes <code>prop: autoFocus</code>.
        React dispatches <code>sk:editorchange</code> and <code>sk:editorready</code> like Vanilla.
  - date: 2026-09-17
    kind: breaking
    es:
      title: Los textos por defecto pasan a inglés
      body: >-
        El kit es una librería en inglés y sus defaults estaban en español: <code>toolbarLabel</code> Text formatting. Una interfaz en
        otro idioma pasa sus propios textos, y el <code>locale</code> que corresponda.
    en:
      title: Default texts move to English
      body: >-
        The kit is an English library and its defaults were Spanish: <code>toolbarLabel</code> Text formatting. An interface in another
        language passes its own texts, and the <code>locale</code> it needs.
