# What changed in avatar, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "7062e2983ee5da11"
entries:
  - date: 2026-09-17
    kind: feature
    target: Avatar.image
    es:
      title: Avatar.image declara compose de ImageFrame
      body: >-
        <code>compose</code> documenta el marco vía <code>also</code> (<code>systemOwned</code>); las hojas ya se resolvían.
    en:
      title: Avatar.image declares compose of ImageFrame
      body: >-
        <code>compose</code> documents the frame via <code>also</code> (<code>systemOwned</code>); sheets already resolved.
  - date: 2026-09-16
    kind: bugfix
    target: name
    es:
      title: React exige name en Avatar, como el contrato
      body: >-
        <code>name</code> es obligatorio en el binding React (iniciales y foto): el contrato ya
        lo pedía vía <code>name</code>/<code>imageName</code>, y sin él el <code>alt</code> vacío
        o un disco sin nombre accesible pasaban TypeScript.
    en:
      title: React requires Avatar name, matching the contract
      body: >-
        <code>name</code> is required on the React binding (initials and photo): the contract
        already required it via <code>name</code>/<code>imageName</code>, and without it an empty
        <code>alt</code> or an unnamed disc still type-checked.
  - date: 2026-09-08
    kind: feature
    target: size
    es:
      title: Avatar suma el tamaño xl, para retratos
      body: >-
        <code>size</code> acepta un cuarto valor, <code>xl</code>, pensado para el retrato de una
        ficha de perfil y no para una fila de interfaz. Es el único tamaño que cae fuera de la rampa
        de controles: la rampa termina en <code>lg</code> a propósito y no hay ningún control de más
        de 48px que justifique inventar <code>--size-control-xl</code>, así que el disco se mide en
        <code>components/avatar.css</code> como <code>calc(var(--size-control-lg) * 4 / 3)</code>, y
        sigue respondiendo a la densidad igual que los otros tres. Las iniciales suben a
        <code>--font-size-heading-h3</code> para conservar la proporción que <code>lg</code> ya tiene.
    en:
      title: Avatar gains an xl size, for portraits
      body: >-
        <code>size</code> takes a fourth value, <code>xl</code>, meant for the portrait on a profile
        card rather than for a row of UI. It is the one size that falls off the control ramp: the
        ramp stops at <code>lg</code> on purpose and there is no control past 48px to justify
        minting <code>--size-control-xl</code>, so the disc measures itself in
        <code>components/avatar.css</code> as <code>calc(var(--size-control-lg) * 4 / 3)</code>,
        which still answers density the way the other three do. The initials step up to
        <code>--font-size-heading-h3</code> so they keep the proportion <code>lg</code> already has.
  - date: 2026-08-17
    kind: bugfix
    es:
      title: AvatarGroup se expone como grupo accesible
      body: >-
        <code>AvatarGroup</code> ahora autoría <code>role="group"</code> y suma la opción
        <code>label</code> (→ <code>aria-label</code>), el mismo par que <code>SplitButton</code> ya
        usa para nombrar un contenedor de controles relacionados. Antes el nombre solo llegaba si
        quien componía la pieza pasaba <code>aria-label</code> por fuera del contrato, y sin
        <code>role="group"</code> un <code>&lt;div&gt;</code> genérico con nombre no garantiza
        anunciarse como una unidad para tecnología de asistencia.
    en:
      title: AvatarGroup exposes itself as an accessible group
      body: >-
        <code>AvatarGroup</code> now authors <code>role="group"</code> and gains a <code>label</code>
        option (→ <code>aria-label</code>), the same pair <code>SplitButton</code> already uses to
        name a container of related controls. Before, the name only arrived if whoever composed the
        piece passed <code>aria-label</code> outside the contract, and without <code>role="group"</code>
        a generic named <code>&lt;div&gt;</code> is not guaranteed to announce itself as one unit to
        assistive technology.
  - date: 2026-08-11
    kind: feature
    es:
      title: Avatar se publica como contrato, con 3 signatures
      body: >-
        Entra al catálogo con <code>Avatar.initials</code>, <code>Avatar.image</code>,
        <code>AvatarGroup</code>: los dos bindings lo realizan, y la referencia de esta página sale del
        contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el markup está completo
        por sí solo, así que las dos bindings son el mismo markup dos veces. Opciones:
        <code>size</code>, <code>name</code>, <code>imageName</code>, <code>src</code>. La hoja es
        <code>components/avatar.css</code>.
    en:
      title: Avatar is published as a contract, with 3 signatures
      body: >-
        It joins the catalogue with <code>Avatar.initials</code>, <code>Avatar.image</code>,
        <code>AvatarGroup</code>: both bindings realize it, and this page's reference is rendered from
        the compiled contract rather than from prose written beside it. There is no enhancer: the markup
        is complete on its own, so both bindings are the same markup twice. Options: <code>size</code>,
        <code>name</code>, <code>imageName</code>, <code>src</code>. Its stylesheet is
        <code>components/avatar.css</code>.
  - date: 2026-09-12
    kind: feature
    es:
      title: Los styling hooks de avatar quedan declarados en el contrato
      body: >-
        El contrato ahora publica los <code>3</code> styling hooks de este componente. Nada
        de lo que hayas escrito cambia: son los mismos hooks, con los mismos nombres, y la hoja de
        estilos no se tocó. Lo nuevo es que el contrato los declara, así que el compilador falla si
        la hoja declara uno que el contrato no publica, o si el contrato promete uno que la hoja no
        declara. Esa segunda mitad es la que importa: hasta ahora, redeclarar un hook que ya no
        existía no daba error, daba silencio.
    en:
      title: avatar's styling hooks are now declared in the contract
      body: >-
        The contract now publishes this component's <code>3</code> styling hooks. Nothing you
        wrote changes: the same hooks, under the same names, and the stylesheet was not touched.
        What is new is that the contract declares them, so the compiler fails when the stylesheet
        declares one the contract does not publish, or the contract promises one the stylesheet
        never declares. That second half is the one that matters: until now, re-declaring a hook
        that no longer existed was not an error, it was silence.
