# What changed in avatar, in the words its users read. Only appended to, never rewritten.
#
# `surface` is the shape of the contract the last time somebody reviewed it. If the compiler says it
# does not match, something a consumer depends on has moved: write the entry and paste in the new
# hash.
surface: "182d3f2ac51d9034"
entries:
  - date: 2026-08-17
    kind: bugfix
    es:
      title: AvatarGroup se expone como grupo accesible
      body: >-
        <code>AvatarGroup</code> ahora autoría <code>role="group"</code> y suma la opción
        <code>label</code> (→ <code>aria-label</code>), el mismo par que <code>SplitButton</code> ya
        usa para nombrar un contenedor de controles relacionados. Antes el nombre solo llegaba si
        quien componía la pieza pasaba <code>aria-label</code> por fuera del contrato, y sin
        <code>role="group"</code> un <code>&lt;div&gt;</code> genérico con nombre no garantiza
        anunciarse como una unidad para tecnología de asistencia.
    en:
      title: AvatarGroup exposes itself as an accessible group
      body: >-
        <code>AvatarGroup</code> now authors <code>role="group"</code> and gains a <code>label</code>
        option (→ <code>aria-label</code>), the same pair <code>SplitButton</code> already uses to
        name a container of related controls. Before, the name only arrived if whoever composed the
        piece passed <code>aria-label</code> outside the contract, and without <code>role="group"</code>
        a generic named <code>&lt;div&gt;</code> is not guaranteed to announce itself as one unit to
        assistive technology.
  - date: 2026-08-11
    kind: feature
    es:
      title: Avatar se publica como contrato, con 3 signatures
      body: >-
        Entra al catálogo con <code>Avatar.initials</code>, <code>Avatar.image</code>,
        <code>AvatarGroup</code>: los dos bindings lo realizan, y la referencia de esta página sale del
        contrato compilado en vez de prosa escrita al lado. No tiene enhancer: el markup está completo
        por sí solo, así que las dos bindings son el mismo markup dos veces. Opciones:
        <code>size</code>, <code>name</code>, <code>imageName</code>, <code>src</code>. La hoja es
        <code>components/avatar.css</code>.
    en:
      title: Avatar is published as a contract, with 3 signatures
      body: >-
        It joins the catalogue with <code>Avatar.initials</code>, <code>Avatar.image</code>,
        <code>AvatarGroup</code>: both bindings realize it, and this page's reference is rendered from
        the compiled contract rather than from prose written beside it. There is no enhancer: the markup
        is complete on its own, so both bindings are the same markup twice. Options: <code>size</code>,
        <code>name</code>, <code>imageName</code>, <code>src</code>. Its stylesheet is
        <code>components/avatar.css</code>.