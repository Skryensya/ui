# THE RELEASE LEDGER. One file, for every contract.
#
# Every entry of every changelog falls into a version, and this is the only thing that decides which:
# an entry belongs to the oldest release whose date reaches it. Whatever is left after the last release
# has not shipped yet, and is grouped under the working version.
#
# CUTTING A VERSION IS ONE LINE HERE, and that is the whole reason the ledger exists instead of a
# `version:` field on each entry. With the field, publishing would mean opening all 64 changelogs and
# stamping every loose entry by hand, which is work nobody does twice and no gate can demand: there is
# no way for the compiler to know you forgot one. With the ledger there is nothing to forget, because
# there is nothing to repeat.
#
# THE VERSIONS BELONG TO THE CONTRACTS, not to a package. A contract is realized by Core, React and
# Vanilla at once, so `@skryensya/core`'s version is not the answer to "since when can I count on
# this?" for anyone using the kit. This is.
#
# The packages start at `0.0.1-dev` and this ledger starts at the same number, on purpose: two
# numerators that disagree on day one are a question nobody can answer later. They are free to drift
# afterwards, because they measure different things, and when they do it is this number that a
# changelog entry means.

# The version being written right now, still unpublished. Whatever did not make it into any release is
# shown as `<working>-dev`, which is what it is: the number it will carry when it ships, marked as not
# shipped. When a release is cut it is added below and this number goes up.
working: "0.0.2"

# Empty on purpose: none of this has been published yet. When the first release is cut this becomes
#
#   releases:
#     - version: "0.0.2"
#       date: 2026-10-05
#
# and every entry dated up to that day groups itself under `0.0.2`, without touching a changelog.
releases: []
