# The structure lives in packages/core/src/chart.ts. Here, only why it is chosen.

Chart:
  useWhen:
    - "hay una SERIE de valores con nombre y hace falta ver su forma: un total por mes, por hora, por versión"
    - "el número de una métrica ya está dicho en texto y el gráfico agrega la tendencia, no la reemplaza"
  avoidWhen:
    - "es UNA medición dentro de un rango conocido, no una serie; eso es Meter"
    - "es el avance de una tarea; eso es Progress"
    - "los valores hay que poder leerlos con precisión, compararlos fila por fila u ordenarlos; eso es una Table, y un gráfico de cinco barras es una tabla peor"
    - "la serie tiene decenas de entradas: las barras se vuelven líneas de un pixel y las etiquetas se pisan; agrupá los datos antes de dibujarlos"
  alternatives:
    - Meter
    - Progress
    - Table
    - Stat
