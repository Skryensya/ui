# The structure lives in packages/core/src/badge.ts. Here, only why it is chosen.

Badge:
  useWhen:
    - "un conteo o un estado corto pegado a otra cosa: no leídos, cantidad, etiqueta de estado"
    - "el tono comunica un rol del sistema: success, warning, danger"
  avoidWhen:
    - "el usuario puede quitarlo o actuar sobre él; eso es un Tag"
    - "es texto de párrafo con color; un badge es una cápsula, no énfasis"
    - "no hay texto visible, sólo un punto; eso es BadgeDot"
  alternatives:
    - Tag
    - BadgeDot
BadgeDot:
  useWhen:
    - "un punto compacto comunica presencia, novedad o estado junto a otro control"
  avoidWhen:
    - "hay texto o un conteo visible; eso es un Badge"
  alternatives:
    - Badge
BadgeHolder:
  useWhen:
    - "un Badge o BadgeDot se ancla a la esquina de un botón o avatar"
  avoidWhen:
    - "el badge participa del flujo normal; no necesita un ancla"
  alternatives:
    - Badge
    - BadgeDot
