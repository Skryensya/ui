# The structure lives in packages/core/src/split-button.ts. Here, only why it is chosen.

SplitButton:
  useWhen:
    - "there is one action almost everyone wants and a few variants of the same action"
    - "the main one should be one click away and the others should take no room"
    - "the action carries weldEnd and the menu trigger triggerWeldStart, with the same variant and size on both halves"
  avoidWhen:
    - "the actions are not variants of the same thing; that is a Menu alone"
    - "there is a single action: that is a Button"
  alternatives:
    - Menu
    - Button.action

SplitButtonVertical:
  useWhen:
    - "two icon-only actions are a pair, one above the other, and should read as one control: zoom in and out, previous and next, raise and lower"
    - "there is no menu and nothing to choose: both halves are plain actions of the same weight"
  avoidWhen:
    - "there is one main action with variants of it behind a menu; that is SplitButton, which is horizontal and carries the menu"
    - "the two actions are unrelated, or one is clearly the primary one; two separate Buttons say that better"
    - "the buttons need labels; the halves are icon-only and a labelled pair is two Buttons in an Inline"
  alternatives:
    - SplitButton
    - Button.action
