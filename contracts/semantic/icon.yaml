# The structure lives in packages/core/src/icon.ts. Here, only why it is chosen.

Icon:
  useWhen:
    - "refuerza una acción que ya tiene texto; sin label, decorativo"
    - "es el único contenido de un control cuadrado, y entonces el CONTROL lleva el nombre accesible, no el icono"
    - "el nombre es un rol que el sistema nombra: delete, visibility, chevron-down"
  avoidWhen:
    - "es un concepto de producto (una factura, un avión): eso se pasa como icon data en el binding React, no como nombre estable"
    - "se le pondría label dentro de un botón que ya tiene texto; el nombre accesible quedaría duplicado"
    - "hace falta un control con forma de botón: eso es Button (iconOnly) o StateButton, no un Icon solo"
  alternatives:
    - Button.action
    - StateButton
