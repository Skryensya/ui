# La estructura vive en packages/core/src/editor.ts. Acá sólo por qué se elige.

Editor:
  useWhen:
    - "se necesita texto con estilos - negrita, listas, títulos, citas - no sólo texto plano"
    - "la barra de formato debe venir resuelta, sin componerla a mano"
  avoidWhen:
    - "el campo es de una sola línea, o no necesita ningún formato: ahí alcanza Input/Textarea"
  alternatives:
    - Textarea
