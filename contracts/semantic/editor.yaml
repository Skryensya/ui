# The structure lives in packages/core/src/editor.ts. Here, only why it is chosen.

Editor:
  useWhen:
    - "styled text is needed - bold, lists, headings, quotes - not only plain text"
    - "the formatting toolbar should come ready, without composing it by hand"
  avoidWhen:
    - "the field is a single line, or needs no formatting at all: Input/Textarea is enough there"
  alternatives:
    - Textarea
