# The structure lives in packages/core/src/loader.ts. Here, only why it is chosen.

Loader:
  useWhen:
    - "hay una espera de duración desconocida"
    - "con label, ES el estado que se anuncia; sin label, acompaña a un texto que ya lo dice"
  avoidWhen:
    - "se conoce el progreso; eso es un Progress con su valor"
    - "el contenido tiene forma y se puede prefigurar; eso es un Placeholder"
  alternatives:
    - Placeholder

Loader.status:
  useWhen:
    - "la espera ya se ve (hay esqueletos, o una barra) y falta que además se anuncie"
    - "el estado de carga tiene que existir para un lector de pantalla sin dibujar nada"
  avoidWhen:
    - "no hay nada más que indique la espera; entonces se necesita un Loader visible"
    - "el progreso es medible; eso es un Progress, que ya se anuncia solo"
  alternatives:
    - Loader
    - Progress
