# La estructura vive en packages/core/src/form-field.ts. Acá sólo por qué se elige.

FormField:
  useWhen:
    - "un control necesita rótulo, y casi siempre lo necesita"
    - "hay que mostrar un mensaje de validación junto al control"
    - "hace falta una ayuda breve antes de que el usuario escriba"
  avoidWhen:
    - "el control no lleva rótulo visible; entonces el control mismo lleva aria-label y no hay FormField"
    - "se quiere marcar inválido sin decir por qué; la presencia del error es lo que invalida, el color nunca es la única señal"
    - "el control ya trae su propio rótulo cableado por su máquina, como NumberField o Combobox; envolverlo agregaría un segundo `for` que compite con el primero"
