# The structure lives in packages/core/src/layout.ts. Here, only why it is chosen.

Wrapper:
  useWhen:
    - "la página necesita una medida centrada para que el texto no se estire de borde a borde"
    - "un header, un cuerpo y un footer deben compartir el mismo techo de ancho: los tres usan el mismo wrapperSize"
    - "el contenido necesita gutters laterales pero ningún techo; eso es wrapperSize full, que conserva el padding inline y solo quita el máximo"
  avoidWhen:
    - "el contenido debe tocar los bordes (una imagen o una banda a sangre); full igual deja gutters, así que ahí no hay wrapper, o se usa LayoutGrid con data-width=\"full-width\""
    - "algunos hijos deben ser más angostos o abrirse más que el resto; eso es LayoutGrid, no Wrappers anidados"
    - "ya está dentro de otro Wrapper; anidarlos suma los dos padding inline y el techo de afuera manda igual"
    - "la región necesita fondo, borde o padding propio; Wrapper solo mide y centra, eso es un Box (adentro o afuera del Wrapper)"
  alternatives:
    - LayoutGrid
    - Box
