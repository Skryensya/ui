# La estructura vive en packages/core/src/selection.ts. Acá sólo por qué se elige.

Checkbox:
  useWhen:
    - "una decisión de sí o no que se envía con el formulario"
    - "varias opciones independientes donde cada una se marca por su cuenta"
    - "aceptar términos, suscribirse, activar una preferencia que se guarda al enviar"
  avoidWhen:
    - "el cambio surte efecto de inmediato, sin enviar nada; eso es un Switch"
    - "se elige UNA opción de un conjunto; eso es un RadioGroup"
  alternatives:
    - Switch
    - CheckboxGroup

CheckboxGroup:
  useWhen:
    - "un conjunto de opciones que además se marca o desmarca entero"
    - "hace falta mostrar que la selección es parcial: algunos sí, otros no"
    - "seleccionar todo en una tabla, permisos, filtros con un maestro arriba"
  avoidWhen:
    - "las opciones no tienen nada en común; ahí son Checkbox sueltos"
    - "se elige UNA; eso es un RadioGroup"
    - "el padre debería poder quedarse en indeterminate por su cuenta: ese estado se DERIVA de los hijos, no se elige"
  alternatives:
    - Checkbox
    - RadioGroup
