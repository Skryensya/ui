# The structure lives in packages/core/src/state-button.ts. Here, only why it is chosen.
#
# Unlike the rest of the signatures here, this one has no opinion about behavior: it does not say when
# the state changes or what a click does. useWhen/avoidWhen talk about the ANATOMY (an icon button with
# N named states), not about a finished use case.

StateButton:
  useWhen:
    - "el control necesita mostrar uno de N estados con nombre, cada uno con su propio ícono, y quien lo usa va a escribir el comportamiento que decide cuál está activo (copiar, ciclar un modo, lo que sea)"
    - "los estados varían según el uso: no hay un set fijo que un contrato pueda declarar de antemano"
    - "es siempre icon-only: las caras son glifos, el host lleva data-icon-only de fábrica, y el nombre accesible es aria-label o aria-labelledby en el botón (nunca texto visible)"
    - "variant y size son los de Button (data-variant / data-size), no opciones de este contrato: ghost + sm es la forma de toolbar más común"
  avoidWhen:
    - "el comportamiento ya existe hecho: un ciclo de modo de color usa las funciones de @skryensya/core/theme-toggle, un copy-to-clipboard usa writeClipboard de @skryensya/core/copy-button, sobre este mismo primitivo: no hay que reinventar esa parte"
    - "hay un solo estado, o dos que se leen como on/off: eso es un Switch o un Toggle simple, no vale la pena declarar una colección de caras para dos valores"
    - "el ícono es puramente decorativo y no cambia: eso es Icon, sin la anatomía de estados"
    - "hace falta un botón con etiqueta visible además del ícono: eso es Button.action, no esta anatomía de caras apiladas"
  alternatives:
    - Switch
    - Icon
    - Button.action
