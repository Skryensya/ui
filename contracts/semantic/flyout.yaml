# La estructura vive en packages/core/src/flyout.ts. Acá sólo por qué se elige.

Flyout:
  useWhen:
    - "se elige un valor de una lista y el panel tiene que abrirse al lado, no ocupar la página"
    - "son más opciones de las que conviene mostrar siempre, pero pocas para buscar"
    - "hace falta que el panel escape del recorte de un contenedor con overflow"
  avoidWhen:
    - "son tres opciones o menos y caben a la vista; eso es un Segmented o un RadioGroup"
    - "hay que escribir para filtrar; eso es un Combobox"
    - "el panel lleva acciones, no valores; eso es un Menu"
  alternatives:
    - Segmented
    - RadioGroup
