# The structure lives in packages/core/src/tag.ts. Here, only why it is chosen.

Tag:
  useWhen:
    - "una etiqueta que el usuario puede quitar: un filtro aplicado, una palabra clave"
  avoidWhen:
    - "es sólo un conteo o un estado que nadie puede tocar; eso es un Badge"
  alternatives:
    - Badge

Tag.link:
  useWhen:
    - "una etiqueta que navega a una faceta, tema o palabra clave"
  avoidWhen:
    - "también debe poder quitarse; un tag enlace no es dismissible porque no puede contener otro botón"
    - "es un enlace dentro de una frase; eso es Link"
  alternatives:
    - Link
    - Button.navigation
