# The structure lives in packages/core/src/password-input.ts. Here, only why it is chosen.

PasswordInput:
  useWhen:
    - "el campo pide una contraseña, para entrar o para crear una nueva"
    - "quien escribe tiene que poder revisar lo que tipeó antes de enviarlo, sobre todo en un teléfono"
  avoidWhen:
    - "es un código de un solo uso de pocos dígitos; eso es un OtpInput"
    - "el secreto se muestra para copiarlo, no se escribe (una clave de API ya generada); eso es un Clipboard"
    - "es un texto cualquiera que no hace falta ocultar; eso es un Input"
  alternatives:
    - OtpInput
    - Clipboard
    - Input
