# La estructura vive en packages/core/src/code-preview.ts. Acá sólo por qué se elige.

CodePreview:
  useWhen:
    - "hay que mostrar código y conviene que se lea como código: resaltado, con su etiqueta"
    - "el bloque es largo y mostrarlo entero empuja el resto de la página fuera de la vista"
  avoidWhen:
    - "es un literal dentro de una frase: eso es Code"
    - "lo que importa es copiarlo, no leerlo: eso es un CopyButton sobre el valor"
  alternatives:
    - Code
    - CopyButton

CodePreview.density:
  useWhen:
    - "el mismo código tiene una versión corta para entenderlo y una completa para copiarlo"
    - "mostrar sólo la completa hace que nadie la lea, y sólo la corta deja afuera lo que hace falta"
  avoidWhen:
    - "hay una sola versión del código: eso es CodePreview y no necesita el switch"
    - "las dos versiones son código distinto, no dos niveles de detalle del mismo"
  alternatives:
    - CodePreview
