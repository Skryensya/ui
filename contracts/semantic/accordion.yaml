# The structure lives in packages/core/src/accordion.ts. Here, only why it is chosen.

Accordion:
  useWhen:
    - "hay varias secciones largas y conviene coordinar cuáles quedan abiertas: FAQ, términos"
    - "type=single: abrir una cierra la anterior para que la página no crezca sin fin"
    - "type=multiple: varias pueden quedar abiertas a la vez, pero siguen siendo un solo acordeón"
  avoidWhen:
    - "son pocas secciones cortas; mostrarlas todas se lee más rápido que plegarlas"
    - "el contenido se compara entre secciones; plegar obliga a recordar en vez de mirar"
    - "las secciones son vistas alternativas del mismo espacio; eso es Tabs"
    - "es una sola superficie plegable, sin coordinación entre hermanas; eso es ExpandableTile"
    - "nada necesita controlarse ni escucharse desde afuera: DetailsGroup lo hace sin JavaScript"
  alternatives:
    - Tabs
    - ExpandableTile
    - DetailsGroup

Accordion.Item:
  useWhen:
    - "es una sección del acordeón; su `value` es cómo el acordeón la nombra"
  avoidWhen:
    - "está sola, fuera de un acordeón; eso es un ExpandableTile"
  alternatives:
    - ExpandableTile

Accordion.Trigger:
  useWhen:
    - "es el encabezado que abre y cierra su sección"
  avoidWhen:
    - "está fuera de un Accordion.Item; no tiene qué abrir"
  alternatives: []

Accordion.Content:
  useWhen:
    - "es el cuerpo que se pliega dentro de su sección"
  avoidWhen:
    - "está fuera de un Accordion.Item; no tiene quién lo abra"
  alternatives: []

DetailsGroup:
  useWhen:
    - "varias secciones se abren y cierran, y alcanza con que el navegador se encargue"
    - "conviene que sólo una quede abierta: los hermanos con el mismo name ya lo hacen solos"
  avoidWhen:
    - "hay que controlar desde afuera qué queda abierto, o escuchar cuándo cambia: eso pide Accordion"
  alternatives:
    - Accordion

Details:
  useWhen:
    - "una sección que se despliega y no necesita nada de JavaScript"
    - "importa que funcione antes de que cargue cualquier script"
  avoidWhen:
    - "hay que saber desde afuera si está abierto, o poder deshabilitar la sección: eso es Accordion.Item"
  alternatives:
    - Accordion.Item

Details.Summary:
  useWhen:
    - "es lo que el estado cerrado muestra y lo que abre la sección"
  avoidWhen:
    - "está fuera de un Details; no tiene qué abrir"
  alternatives: []

Details.Content:
  useWhen:
    - "es lo que la apertura revela"
  avoidWhen:
    - "está fuera de un Details; no tiene quién lo abra"
  alternatives: []
