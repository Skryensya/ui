# The structure lives in packages/core/src/layout.ts. Here, only why it is chosen.

Stack:
  useWhen:
    - "las cosas van una debajo de otra con un ritmo constante"
    - "es la disposición por defecto de un formulario"

Inline:
  useWhen:
    - "las cosas van una al lado de otra: una fila de botones, un rótulo con su valor"
    - "una fila de acciones es lo último de una card y debe sentarse en el piso cuando las cards vecinas crecen; eso es blockStart auto, no un segundo componente llamado button-wrapper"
  avoidWhen:
    - "son columnas de igual ancho; eso es un Grid"
    - "el empty state, el dialog o el toolbar ya tienen su propia parte de acciones; no sustituyas esa anatomía por un Inline"
  alternatives:
    - Grid

Grid:
  useWhen:
    - "columnas de igual ancho: una grilla de tarjetas"
  avoidWhen:
    - "los anchos son distintos entre sí; eso es un Inline"
  alternatives:
    - Inline

LayoutGrid:
  useWhen:
    - "una página necesita una medida de lectura y algunos hijos deben ser angostos, abrirse o sangrar de borde a borde"
    - "una sección full-width debe conservar su contenido centrado sin un wrapper adicional"
    - "la página lleva un rail de apoyo (TOC, navegación contextual): es un hijo directo con data-width=\"rail\" (después del contenido) o data-width=\"rail-start\" (antes), o ambos: no un span de contenido como narrow/breakout, sino una columna aparte que la misma grilla reserva junto al flujo, separada de él solo por --sk-layout-rail-gap"
  avoidWhen:
    - "todos los hijos comparten un único techo de ancho; Wrapper es más simple"
    - "se distribuyen tarjetas en columnas iguales; eso es Grid"
  alternatives:
    - Wrapper
    - Grid
Main:
  useWhen:
    - "la región es el landmark <main> de la página: el área de trabajo de una aplicación o de una plantilla"
  avoidWhen:
    - "es una sección dentro de la página, no el landmark principal; usa Box, Stack o LayoutGrid según corresponda"
