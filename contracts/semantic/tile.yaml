# La estructura vive en packages/core/src/tile.ts. Acá sólo por qué se elige.

TileLink:
  useWhen:
    - "toda la tarjeta lleva al mismo lado y conviene que el área clickeable sea toda"
    - "una grilla de destinos: proyectos, artículos, secciones"
  avoidWhen:
    - "adentro hay más de una acción; dos targets anidados es una trampa, no una tarjeta"
    - "no navega a ningún lado; eso es un TileButton"
  alternatives:
    - TileButton

TileButton:
  useWhen:
    - "la tarjeta entera dispara una acción: elegir un plan, empezar un flujo"
  avoidWhen:
    - "la acción es elegir entre varias y la elección se ve; eso es TileCheckbox o un RadioGroup"
    - "navega; eso es un TileLink"
  alternatives:
    - TileLink
    - Button.action

ExpandableTile:
  useWhen:
    - "hay detalle que no todos necesitan y esconderlo baja el ruido de la página"
    - "son varias secciones y sólo importa una a la vez; ahí se arma un Accordion con éstas"
  avoidWhen:
    - "el contenido es lo que la persona vino a leer; esconderlo agrega un clic y nada más"
    - "flota sobre la página; eso es un Popover o un Dialog"
  alternatives:
    - Accordion

ExpandableTileTrigger:
  useWhen:
    - "es el encabezado que abre y cierra su ExpandableTile"
  avoidWhen:
    - "está fuera de un ExpandableTile; no tiene a qué apuntar"
  alternatives: []

ExpandableTileContent:
  useWhen:
    - "es el cuerpo que se pliega dentro de su ExpandableTile"
  avoidWhen:
    - "está fuera de un ExpandableTile; no tiene quién lo abra"
  alternatives: []

TileCheckbox:
  useWhen:
    - "se eligen varias opciones y cada una es una tarjeta con su propio contenido"
    - "conviene que toda la tarjeta sea el área de click, no sólo el cuadradito"
  avoidWhen:
    - "es una sola opción en una lista de texto; eso es un Checkbox"
    - "sólo se puede elegir una; eso es un TileRadioGroup"
  alternatives:
    - Checkbox
    - TileRadioGroup

TileSwitch:
  useWhen:
    - "la tarjeta prende o apaga algo y el efecto es inmediato: una preferencia, una integración"
  avoidWhen:
    - "el cambio recién se aplica al enviar el formulario; ahí un Checkbox dice la verdad"
    - "es una opción entre varias; eso es un TileRadioGroup"
  alternatives:
    - Switch
    - TileCheckbox

TileRadioGroup:
  useWhen:
    - "se elige una sola opción y cada una necesita explicarse: planes, métodos de envío"
    - "conviene comparar las opciones lado a lado antes de decidir"
  avoidWhen:
    - "las opciones son una palabra cada una; eso es un RadioGroup o un Segmented"
    - "se pueden elegir varias; eso es TileCheckbox"
  alternatives:
    - RadioGroup
    - Segmented
TileContent:
  useWhen:
    - "un Tile necesita la anatomía compartida de título y descripción"
  avoidWhen:
    - "está fuera de un Tile; no es contenido autónomo"
  alternatives: []

TileChevron:
  useWhen:
    - "un tile expandible o una sección de accordion necesita mostrar que se abre y se cierra"
  avoidWhen:
    - "está fuera de un trigger expandible: no es un icono de propósito general"
    - "hace falta que el estado se anuncie; eso ya lo dice el aria-expanded del trigger"
  alternatives: []
