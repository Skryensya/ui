# La estructura vive en packages/core/src/menubar.ts. Acá sólo por qué se elige.

Menubar:
  useWhen:
    - "una barra persistente de comandos de aplicación, algunos con submenú desplegable — un editor (Archivo/Editar/Ver)"
    - "navegación de sitio con secciones que despliegan sub-destinos"
  avoidWhen:
    - "es un solo botón que abre un menú de comandos; eso es Menu"
    - "son destinos de navegación sin desplegables ni comandos; eso es NavList"
  alternatives:
    - Menu
    - NavList

MenubarItem:
  useWhen:
    - "un ítem de la barra — con `items` (el mismo shape de Menu: comandos, checkbox/radio, separadores, submenús anidados) es un desplegable, sin `items` es un comando directo"
