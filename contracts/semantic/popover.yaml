# The structure lives in packages/core/src/popover.ts. Here, only why it is chosen.

Popover:
  useWhen:
    - "hace falta un panel con contenido propio colgado de un control: un formulario corto, una explicación con formato"
    - "conviene que el navegador se encargue de cerrar al hacer clic afuera y con Escape"
  avoidWhen:
    - "es una descripción de una línea; eso es un Tooltip y no roba el foco"
    - "es una lista de acciones; eso es un Menu, que ya trae la navegación por teclado"
    - "bloquea la pantalla hasta decidir; eso es un Dialog"
  alternatives:
    - Tooltip
    - Menu
    - Dialog

Popover.bare:
  useWhen:
    - "hace falta una superficie flotante y nada más: la composición trae su propia semántica"
    - "el patrón no tiene título ni acciones de cierre que justifiquen el chrome de Popover"
  avoidWhen:
    - "hay un título o algo que cerrar: eso es Popover y ya trae esa anatomía"
    - "es una descripción de una línea; eso es un Tooltip"
  alternatives:
    - Popover
    - Tooltip
