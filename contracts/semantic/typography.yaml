# The structure lives in packages/core/src/typography.ts. Here, only why it is chosen.

Text:
  useWhen:
    - "un párrafo, una bajada, una nota al pie"
    - "el tono dice jerarquía: secondary para lo accesorio, danger para un error en prosa (acompañado de texto que lo diga, no sólo del color)"
    - "la línea chica sobre un título es textRole eyebrow; la bajada bajo el título es textRole subtitle"
  avoidWhen:
    - "titula una sección; eso es un Heading, aunque se vea chico"
    - "va dentro de otra línea de texto, un botón o un label como <p>: ahí es textElement span"

Heading:
  useWhen:
    - "abre una sección y hay que decir a qué nivel del documento pertenece: headingElement (h1–h6) es el nivel, headingSize sólo el aspecto"
    - "el tamaño se elige por escalón (h1–h6, display-sm/md/lg); sm, md, lg y display son alias heredados"
  avoidWhen:
    - "sólo se busca texto grande; el nivel es estructura, no tamaño"
    - "el título es la etiqueta chica de un grupo (un kicker); eso es Text con textRole eyebrow"
  alternatives:
    - Text

Link:
  useWhen:
    - "un enlace dentro de una frase, subrayado y en el flujo del texto"
  avoidWhen:
    - "se ve y se usa como botón; eso es Button.navigation"
  alternatives:
    - Button.navigation
Strong:
  useWhen:
    - "una frase dentro de texto tiene importancia fuerte, no sólo un peso visual distinto"
  avoidWhen:
    - "titula una sección; eso es un Heading"
    - "sólo se quiere un peso distinto para toda la línea sin decir que importa más; eso es Text con weight"
  alternatives:
    - Heading

Output:
  useWhen:
    - "muestra el resultado calculado de una entrada o interacción; outputFor nombra los ids de esas entradas"
  avoidWhen:
    - "es texto estático sin relación con un cálculo; eso es Text"
  alternatives:
    - Text

Code:
  useWhen:
    - "hay un literal dentro de una frase: una ruta, un flag, el nombre de una propiedad"
    - "conviene que se lea distinto del texto que lo rodea para no confundirlo con prosa"
  avoidWhen:
    - "es un bloque de código entero: eso es CodePreview, con su scroll y su botón de copiar"
    - "sólo se busca énfasis; eso es Strong y es otra afirmación"
  alternatives:
    - Strong
