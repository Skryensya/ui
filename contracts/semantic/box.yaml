# The structure lives in packages/core/src/layout.ts. Here, only why it is chosen.

Box:
  useWhen:
    - "hace falta relleno, una superficie o un borde alrededor de un grupo"
  avoidWhen:
    - "sólo hace falta separar cosas; eso es un Stack, Inline o Grid sin caja"
    - "hace falta centrar una columna de página; eso es Wrapper"
  alternatives:
    - Stack
    - Inline
    - Grid
    - Wrapper
