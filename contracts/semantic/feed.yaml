# The structure lives in packages/core/src/feed.ts. Here, only why it is chosen.

Feed:
  useWhen:
    - "un stream de unidades de contenido independientes que se puede cargar en tandas. Posts, comentarios, actividad"
  avoidWhen:
    - "es una lista de opciones para elegir; eso es un Listbox o un List"
    - "el orden importa por posición fija, no por publicación; eso es una Table o un List simple"
    - "la conversación tiene respuestas anidadas y acciones (votar, responder); eso es un CommentThread"
    - "aún no hay posts y el mensaje es la ausencia misma; eso es un EmptyState"
  alternatives:
    - List
    - CommentThread
    - EmptyState

FeedArticle:
  useWhen:
    - "una unidad de contenido dentro del feed. Un post, un comentario"
  avoidWhen:
    - "el comentario admite respuestas anidadas o acciones; eso es un Comment dentro de un CommentThread"
  alternatives:
    - Comment
