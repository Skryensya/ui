# The structure lives in packages/core/src/data-grid.ts. Here, only why it is chosen.

DataGrid:
  useWhen:
    - "a set of cells needs 2D keyboard navigation. Arrow keys move between rows and columns"
    - "it is a grid of widgets (chips, cards, links) and ONE tab stop is wanted instead of one per widget. WAI's 'layout grid' case"
    - "it is an interactive data grid (editable, with cells that take focus). WAI's 'data grid' case"
  avoidWhen:
    - "the data is tabular but STATIC, with no need for arrow-key navigation; that is Table"
    - "there is hierarchy on top of the columns; that is Treegrid"
    - "it is a purely visual grid (CSS Grid) with no keyboard navigation; that is Grid/LayoutGrid in layout.ts"
  alternatives:
    - Table
    - Treegrid

DataGridRow:
  useWhen:
    - "a logical row of cells: not necessarily a visual row; it may wrap several physical lines"

DataGridCell:
  useWhen:
    - "a value or a widget inside a row of the grid; the interactive role of the content (button, link) is preserved, never reinterpreted"
