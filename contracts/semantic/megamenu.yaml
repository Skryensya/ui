# The structure lives in packages/core/src/megamenu.ts. Here, only why it is chosen.

Megamenu:
  useWhen:
    - "navegación de sitio/marketing con categorías que despliegan un panel de varias columnas de enlaces, borde a borde bajo la barra"
  avoidWhen:
    - "el desplegable es una lista de comandos de aplicación, no destinos; eso es Menu"
    - "la barra es de comandos de aplicación (Archivo/Editar/Ver), algunos con desplegable; eso es Menubar"
    - "son destinos simples sin panel de varias columnas; eso es NavList"
    - "solo hace falta la barra de marca/acciones sin panel de categorías; eso es Navbar"
  alternatives:
    - Menu
    - Menubar
    - NavList
    - Navbar

MegamenuTrigger:
  useWhen:
    - "una categoría de la barra. Su panel (`columns`) son 2-4 NavListGroup, no comandos ni un solo enlace"
