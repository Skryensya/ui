# The structure lives in packages/core/src/nav-list.ts. Here, only why each signature is chosen.

NavList:
  useWhen:
    - la lista de destinos de un sidebar, un navbar o un drawer
    - navegación principal o secundaria de una página
  avoidWhen:
    - son acciones de una aplicación, no destinos: eso es un menú, con role="menu"
    - es una ruta jerárquica hasta la página actual: eso es un Breadcrumb

NavListGroup:
  useWhen:
    - agrupa destinos bajo un rótulo
    - hace falta el <ul> aunque el grupo no lleve rótulo visible
    - "con collapsible: la sección se puede ocultar/mostrar. El patrón WAI 'Disclosure (Navigation)'"
  avoidWhen:
    - hay un solo destino y ningún rótulo: el grupo sigue siendo obligatorio, no es opcional
    - "collapsible sin label: el botón necesita el texto del rótulo para tener algo que mostrar"

NavListLink:
  useWhen:
    - un destino de la lista
    - marca la página actual con current
    - "tiene sus propios sub-destinos: un NavListGroup en el slot nested, adentro del mismo <li>"
  avoidWhen:
    - dispara una acción en vez de navegar: eso es Button.action
  alternatives:
    - Button.navigation

# `nested` (NavListLink's slot) is the ONLY supported way to nest: a NavListGroup put directly into
# another group's `children` is not valid HTML (a `<div>` is not a legal child of a `<ul>`, only `<li>`
# is), which is why the slot lives on the LINK and not on the group.

