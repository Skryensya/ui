# La estructura vive en packages/core/src/theme-toggle.ts. Acá sólo por qué se elige.

ThemeToggle:
  useWhen:
    - "la persona tiene que poder elegir claro, oscuro o seguir al sistema"
    - "va en el header o en un menú de preferencias, donde se busca una sola vez"
  avoidWhen:
    - "sólo hay dos modos y ninguno es 'seguir al sistema'; ahí un Switch dice más"
    - "es una preferencia cualquiera dentro de un formulario; eso es un Switch o un Segmented"
  alternatives:
    - Switch
    - Segmented
