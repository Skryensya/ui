# The structure lives in packages/core/src/date-picker.ts. Here, only why it is chosen.

DatePicker:
  useWhen:
    - "la fecha es un campo de un formulario, junto a otros campos"
    - "conviene poder escribirla y también buscarla en el calendario"
  avoidWhen:
    - "elegir la fecha ES la pantalla: ahí la grilla va siempre visible"
    - "sólo importa el mes o el año, no el día"
  alternatives:
    - Calendar

DatePicker.native:
  useWhen:
    - "una fecha común dentro de un formulario, sin selección de rango"
    - "el teclado, el formato local y el envío deben pertenecer al navegador"
  avoidWhen:
    - "hace falta un rango (inicio y fin): eso es DatePicker con selectionMode range"
    - "el calendario tiene que verse siempre: eso es Calendar"
  alternatives:
    - DatePicker
    - Calendar
