# The structure lives in packages/core/src/time-field.ts. Here, only why it is chosen.

TimeField:
  useWhen:
    - "hay que escribir una hora y el formato importa: la reserva, el turno, el horario de atención"
    - "conviene que cada segmento se pueda corregir por separado sin volver a escribir todo"
    - "el formato tiene que seguir al locale (12 o 24 horas, AM/PM adelante o atrás)"
  avoidWhen:
    - "también hace falta el día; eso es un DatePicker, o los dos juntos"
    - "es una duración, no una hora del día; eso es un NumberField con su unidad"
  alternatives:
    - NumberField
