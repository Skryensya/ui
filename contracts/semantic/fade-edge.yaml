# The structure lives in packages/core/src/fade-edge.ts. Here, only why it is chosen.

FadeEdge:
  useWhen:
    - "un borde recortado necesita indicar visualmente que el contenido continúa o entra y sale de la superficie"
    - "el efecto debe envolver otro componente sin cambiar su semántica, foco ni comportamiento"
  avoidWhen:
    - "el contenido no está recortado; desvanecerlo sólo baja contraste"
    - "el gradiente protege texto sobre una foto; eso es MediaGradient dentro de MediaCaption"
    - "el desvanecido escondería un control o información necesaria en reposo"
    - "el borde que se recorta es el viewport de un Marquee; Marquee ya tiene su propio fade interno, y un FadeEdge alrededor también lava el Play/Pause"
  alternatives:
    - MediaGradient
    - Marquee
