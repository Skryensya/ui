# The structure lives in packages/core/src/empty-state.ts. Here, only why it is chosen.

EmptyState:
  useWhen:
    - "una lista o una región no tiene nada que mostrar, y hay que decir por qué"
    - "es la primera vez y conviene ofrecer la acción que la llena"
  avoidWhen:
    - "los datos están cargando; eso es un Loader o Placeholder"
    - "hubo un error; ahí el mensaje es un Callout, no un vacío"
  alternatives:
    - Callout
