# The structure lives in packages/core/src/folder.ts. Here, only why it is chosen.

Folder:
  useWhen:
    - "a block of content needs to say what it is about BEFORE it is read: the tab is a label, not one more heading"
    - "there is a collection of things of the same kind and each should read as a separate object"
    - "at rest it should read as clean text: a folder is never seen until it is touched"
  avoidWhen:
    - "it is a surface with no label of its own; that is a Box, which draws nothing"
    - "the whole surface is a control; that is a TileLink or a TileButton, which already bring a control's state and focus"
    - "the content opens and closes; that is an Accordion or a Details"
  alternatives:
    - Box
    - TileLink
    - Accordion

FolderLink:
  useWhen:
    - "the whole folder goes somewhere: the complete rectangle is the destination"
    - "the reveal has to respond to the keyboard without depending on what is inside"
  avoidWhen:
    - "the folder does something on the page instead of navigating; that is a TileButton"
    - "there is more than one destination inside; nested links do not exist, put the links in the body of a Folder"
  alternatives:
    - Folder
    - TileLink

FolderPreview:
  useWhen:
    - "it goes in the previews slot of a Folder or a FolderLink: it is the box of ONE image of the fan"
    - "the image needs its own mat and shadow, which the image alone cannot carry"
  avoidWhen:
    - "the image is the folder's content and not a preview; that goes in the body, where it can be reached"
    - "it is outside a Folder: alone it means nothing"
  alternatives:
    - ImageFrame
    - Folder

FolderStack:
  useWhen:
    - "the folders read as a stack: each shows its tab and a strip of body"
    - "the overlap itself is the information, that there is more below and there is an order"
  avoidWhen:
    - "each folder needs to be seen whole; that is a Grid or an Inline of Folders"
    - "the set is a list with semantics of its own (results, steps); whoever contains it names that, not this"
  alternatives:
    - Grid
    - Folder
