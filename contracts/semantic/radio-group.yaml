# The structure lives in packages/core/src/selection.ts. Here, only why it is chosen.

RadioGroup:
  useWhen:
    - "se elige UNA opción de un conjunto pequeño y todas las opciones valen la pena mostrarlas"
    - "las opciones son excluyentes entre sí"
    - "el valor se envía con el formulario (name compartido en cada input)"
  avoidWhen:
    - "las opciones son más de siete u ocho; ahí conviene un Select"
    - "son dos o tres y cambian una vista, no un dato; eso es un Segmented"
    - "se pueden marcar varias a la vez; eso son Checkbox independientes"
    - "hay una sola opción; una elección de uno no es una elección"
  alternatives:
    - Checkbox
    - Segmented
    - Select

Radio:
  useWhen:
    - "una matriz: cada fila es una pregunta y cada celda lleva un radio de esa fila"
    - "un radio suelto cuyo grupo lo forma el `name` compartido, no un contenedor"
  avoidWhen:
    - "es una lista de opciones una debajo de otra; eso es RadioGroup, que además anuncia el grupo"
    - "las opciones no son excluyentes; eso es Checkbox"
  alternatives:
    - RadioGroup
    - Checkbox
