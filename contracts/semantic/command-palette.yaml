# The structure lives in packages/core/src/command-palette.ts. Here, only why it is chosen.

CommandPalette:
  useWhen:
    - "hay muchos destinos o acciones y escribir el nombre llega antes que recorrerlos"
    - "quien usa el producto seguido quiere llegar sin navegar"
  avoidWhen:
    - "las opciones son pocas y caben a la vista: eso es un Menu"
    - "es el único camino a algo: una paleta complementa la navegación, no la reemplaza"
  alternatives:
    - Menu
    - Combobox
