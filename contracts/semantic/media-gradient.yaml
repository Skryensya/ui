# La estructura vive en packages/core/src/media-gradient.ts. Acá sólo por qué se elige.

MediaCaption:
  useWhen:
    - "el texto va encima de la foto y no debajo: un título sobre la imagen de portada"
    - "hace falta que el lavado tenga el alto del texto y no un porcentaje de la imagen"
  avoidWhen:
    - "el texto puede ir debajo de la imagen; ahí se lee mejor y no necesita lavado"
    - "es un pie de foto descriptivo; eso es un `<figcaption>` fuera del marco"
  alternatives:
    - ImageFrame

MediaGradient:
  useWhen:
    - "hay texto encima de una foto y necesita contraste para leerse"
  avoidWhen:
    - "está fuera de un MediaCaption; no tiene caja que llenar y no pinta nada"
    - "oscurece un diálogo sobre la página; eso es un Backdrop"
  alternatives:
    - MediaCaption
