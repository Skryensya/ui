# The structure lives in packages/core/src/component-preview.ts. Here, only why it is chosen.

ComponentPreview.bare:
  useWhen:
    - "something has to be shown next to its source code: an example, a demo, a use case"
    - "the docs surface does not need to compare two bindings or screen presets"
  avoidWhen:
    - "Vanilla and React of the SAME component have to be compared: that is this site's machinery, not a published contract"
    - "the block is only code, with nothing to show above it: that is CodePreview alone"
  alternatives:
    - CodePreview
