# The structure lives in packages/core/src/segmented.ts. Here, only why it is chosen.

Segmented:
  useWhen:
    - "dos o tres opciones excluyentes que conviene ver todas a la vez"
    - "cambia una vista, no un dato del formulario"
  avoidWhen:
    - "son más de tres o cuatro; ahí conviene un RadioGroup o un Select"
    - "el valor se envía con el formulario; eso es un RadioGroup"
  alternatives:
    - RadioGroup
